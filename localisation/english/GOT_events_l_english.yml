GOT_Location_News.90.t:0 "The Fall of Volantis"
GOT_Location_News.90.d:0 "At dawn today, [FROM.GetAdjective] forces swept into the ancient, sweltering streets of Volantis. Vanguard assault troops pushed past the towering Black Walls and colossal fused-stone fortifications as heavy river mists and stifling heat swept up from the mouth of the Rhoyne.\n\nSavage fighting raged across the Long Bridge and around the monumental temples of R'hllor, where desperate defenders made a frantic final stand against the overwhelming onslaught. The doomed First Daughter of Valyria is now under [FROM.GetAdjective] control, its proud defenses overrun and its ancient slave markets beaten down to ash.\n\nUnconfirmed reports indicate that many Triarchs and wealthy citizens attempted to flee on massive warships or into the southern bay, though few are expected to escape the relentless pursuers."
GOT_Location_News.90.a:0 "A dark fate for the First Daughter..."
GOT_Location_News.90.b:0 "Volantis is ours at last!"
GOT_Location_News.90.c:0 "The invaders must be driven from Volantis!"

GOT_Location_News.91.t:0 "The Fall of White Harbor"
GOT_Location_News.91.d:0 "At dawn today, [FROM.GetAdjective] forces swept into the snowy streets of White Harbor. Vanguard assault troops pushed past the heavy stone harbor walls and the formidable battlements of the Seal Rock as biting sea winds and thick ocean fogs swept in from the White Knife.\n\nSavage fighting raged through the bustling harbor markets and around the courtrooms of the New Castle, where desperate defenders made a frantic final stand against the overwhelming onslaught. The doomed northern port is now under [FROM.GetAdjective] control, its proud defenses overrun and its ancient trade halls beaten down to ash.\n\nUnconfirmed reports indicate that many citizens attempted to flee on warships or river barges heading inland, though few are expected to escape the relentless pursuers."
GOT_Location_News.91.a:0 "A dark fate for the City of the Merman..."
GOT_Location_News.91.b:0 "White Harbor is ours at last!"
GOT_Location_News.91.c:0 "The invaders must be driven from White Harbor!"

GOT_Location_News.92.t:0 "The Fall of Yunkai"
GOT_Location_News.92.d:0 "At dawn today, [FROM.GetAdjective] forces swept into the winding yellow streets of Yunkai. Vanguard assault troops pushed past the crumbling, yellow-brick walls and monumental pyramids as baking desert winds and thick dust swept in from the surrounding red wastes.\n\nSavage fighting raged through the pleasure-house plazas and around the ruined battlements, where desperate defenders made a frantic final stand against the overwhelming onslaught. The doomed Yellow City is now under [FROM.GetAdjective] control, its proud defenses overrun and its ancient palaces beaten down to ash.\n\nUnconfirmed reports indicate that many Wise Masters and citizens attempted to flee along the coast toward Meereen or Astapor, though few are expected to survive the treacherous journey."
GOT_Location_News.92.a:0 "A dark fate for the Yellow City..."
GOT_Location_News.92.b:0 "Yunkai is ours at last!"
GOT_Location_News.92.c:0 "The invaders must be driven from Yunkai!"

 GOT_Faction_Country.1.t:0 "The League of Free Cities"
 GOT_Faction_Country.1.d:0 "Dark clouds gather across the Narrow Sea. With global instability mounting and aggressive foreign powers expanding their reach, the ancient independence of the Free Cities hangs in a precarious balance.\n\nIn response to these existential threats, diplomats from across Essos have gathered to formalize a historic alliance. Putting aside centuries of commercial rivalry and petty border disputes, a unified pact has been signed in the spirit of collective defense. Together, we shall stand as a bulwark against tyranny."
 GOT_Faction_Country.1.a:0 "A new era of Essosi unity begins!"
 
 GOT_Faction_Country.2.t:0 "An Invitation to the League of Free Cities"
 GOT_Faction_Country.2.d:0 "An envoy from [FROM.GetName] has arrived in our city bearing a sealed scroll of strategic importance. Recognizing the threat posed by expanding foreign empires and aggressive grand factions, [FROM.GetName] has formally requested that we join them in establishing the League of Free Cities.\n\nWhile joining the coalition will bind our foreign defense policy to our neighbors and require us to honor mutual pacts, it promises unprecedented protection against overseas conquerors. The choice before us will shape the future of our sovereign republic."
 GOT_Faction_Country.2.a:0 "We accept!"
 GOT_Faction_Country.2.b:0 "Politely decline."
 
 GOT_Faction_Country.3.t:0 "[FROM.GetName] Joins the League"
 GOT_Faction_Country.3:0 "Excellent news from the diplomats in [FROM.GetName]. Recognizing the clear wisdom of our collective defense pact, their ruling council has officially ratified the charter. \n\nWith [FROM.GetName] now standing firmly alongside us in the League of Free Cities, our combined military strength and economic leverage across the Narrow Sea grow formidable. Foreign conquerors will think twice before encroaching upon Essosi soil."
 GOT_Faction_Country.3.a:0 "Together we stand invincible."

 GOT_Faction_Country.4.t:0 "[FROM.GetName] Declines the League"
 GOT_Faction_Country.4.d:0 "Disappointing news has arrived from our envoys in [FROM.GetName]. Despite our warnings regarding foreign expansion and the necessity of regional solidarity, their leadership has chosen to reject our proposal.\n\nThey insist on maintaining their absolute neutrality and handling their own defense. While we must respect their decision for now, their shortsighted isolation may well leave them vulnerable when the storm finally breaks."
 GOT_Faction_Country.4.a:0 "A foolish gamble on their part."
 
GOT_Faction_Country.5.t:0 "The Flayed Men"
GOT_Faction_Country.5.d:0 "The North has been torn apart by war. The Stark dynasty has been broken, yet their remaining loyalists still cling to the hope of restoring the old order. House Bolton has therefore called upon those Northern houses who have chosen to stand with the new regime.\n\nUnder the flayed banner, the Umber, Karstark and other loyal houses shall unite their strength. Together, we will defend the North from rebellion and destroy any who seek to return the Starks to power."
GOT_Faction_Country.5.a:0 "Let the North fear the flayed man."
GOT_Faction_Country.5.b:0 "We will remain with the crown."

GOT_Faction_Country.6.t:0 "An Invitation to the Flayed Men"
GOT_Faction_Country.6.d:0 "An envoy from [FROM.GetName] has arrived bearing a sealed message from House Bolton. With the North divided by war and Stark loyalists gathering their strength, [FROM.GetName] has formally invited us to join the Flayed Men.\n\nBy joining this alliance, we shall bind our swords to the other Northern houses under Bolton leadership. In return, we will gain their protection and stand together against any who would challenge the new order in the North."
GOT_Faction_Country.6.a:0 "We shall stand with the Boltons."
GOT_Faction_Country.6.b:0 "We will not bend the knee."

GOT_Faction_Country.7.t:0 "[FROM.GetName] Joins the Flayed Men"
GOT_Faction_Country.7.d:0 "Our envoys have returned with excellent news from [FROM.GetName]. Their lord has accepted our invitation and pledged their swords to the Flayed Men.\n\nWith [FROM.GetName] now standing alongside House Bolton and the other loyal Northern houses, our alliance grows stronger. The banners of the North are gathering beneath the flayed man, and those who would restore the Starks will find an increasingly formidable enemy awaiting them."
GOT_Faction_Country.7.a:0 "Another banner joins the flayed man."

GOT_Faction_Country.8.t:0 "[FROM.GetName] Declines the Flayed Men"
GOT_Faction_Country.8.d:0 "Disappointing news has arrived from [FROM.GetName]. Despite our offer of protection and alliance, their lord has chosen to reject our invitation and remain apart from the Flayed Men.\n\nTheir decision is their own, for now. But the North is entering another age of war, and those who refuse to stand with us may soon discover that there is little safety to be found alone."
GOT_Faction_Country.8.a:0 "They will regret their choice."
 
 GOT_Faction_News.1.t:0 "The League of Free Cities Established"
 GOT_Faction_News.1.d:0 "Reports from across the Narrow Sea confirm that the sovereign city-states of Essos have taken an unprecedented step toward unified defense. Long divided by bitter commercial feuds, trade blockades, and territorial disputes in the Disputed Lands, the merchant lords have finally set aside their squabbles in the face of rising global tensions.\n\nIn a landmark summit, a formal diplomatic charter was ratified, uniting these maritime powers under a single banner: the League of Free Cities. With vast wealth, powerful mercenary charters, and formidable naval fleets now aligned under a shared pact, any foreign empire seeking expansion in Essos will face a formidable collective force."
 GOT_Faction_News.1.a:0 "An intriguing development."
 
 GOT_Faction_News.2.t:0 "[FROM.GetName] Joins the League of Free Cities"
 GOT_Faction_News.2.d:0 "Reports from across the Narrow Sea confirm that [FROM.GetName] has officially ratified the League Charter, aligning its foreign policy and military assets with the League of Free Cities.\n\nAs global tensions mount and aggressive foreign powers cast their gaze toward Essos, the merchant lords in [FROM.GetName] have chosen collective security over isolated sovereignty. With another key republic joining the defensive coalition, the alliance tightens its grip on maritime trade routes and further solidifies the military balance across the Narrow Sea."
 GOT_Faction_News.2.a:0 "The coalition grows stronger."
 
 GOT_Faction_News.3.t:0 "The Flayed Men Are Formed"
GOT_Faction_News.3.d:0 "Reports from the North confirm that House Bolton has formally united several of the region's most powerful houses beneath its banner. With the Stark dynasty broken and Northern lands still divided by war, the Boltons have gathered their loyal bannermen into a new military alliance: the Flayed Men.\n\nThe Umber, Karstark and other houses have pledged their swords to the Bolton cause. With their combined strength, the Flayed Men now stand as a formidable force in the North, determined to crush the remaining Stark loyalists and preserve Bolton rule."
GOT_Faction_News.3.a:0 "The North has a new master."

GOT_Faction_News.4.t:0 "[FROM.GetName] Joins the Flayed Men"
GOT_Faction_News.4.d:0 "Reports from the North confirm that [FROM.GetName] has pledged its allegiance to House Bolton and formally joined the Flayed Men.\n\nWith the North still divided by bitter civil conflict, [FROM.GetName] has chosen to cast its lot with the Boltons rather than risk standing alone. Their banners will now march alongside the other members of the alliance, strengthening Bolton control over the North and further isolating those who remain loyal to the old Stark dynasty."
GOT_Faction_News.4.a:0 "The flayed banner grows."

GOT_Blackfyre_Country.2.t:0 "The Golden Company at the Gates"
 GOT_Blackfyre_Country.2.d:0 "Alarming news sweeps through the Old Volantis. Young Griff, the pretender who commands the legendary Golden Company, has cast aside his cloak of anonymity. Before the walls of our ancient city, he has declared himself the rightful heir of House Blackfyre and proclaimed his royal title.\n\nWith thousands of sellswords, heavy cavalry, and war elephants assembled outside our gates, Young Griff presents us with an ultimatum: submit to the Black Dragon and swear fealty to his cause, or face total ruin as the Golden Company breach the defenses of the First Daughter of Valyria."
 GOT_Blackfyre_Country.2.a:0 "Bend the knee. The Black Dragon rises!"
 GOT_Blackfyre_Country.2.b:0 "Volantis will never bow to a sellsword king!"
 
 GOT_Blackfyre_News.2.t:0 "The Black Dragon at the Gates of Volantis"
 GOT_Blackfyre_News.2.d:0 "Shockwaves have reverberated across Essos and Westeros following reports from the Free City of Volantis. A young pretender known as 'Young Griff' has openly declared himself the true heir to House Blackfyre and laid claim to the title of King.\n\nFlanked by the hardened sellswords, heavy cavalry, and war elephants of the Golden Company, the pretender's forces have encamped directly outside the ancient Black Walls of Volantis. An ultimatum has been delivered to the Triarchs: recognize the Black Dragon and surrender the city, or prepare for bloodshed. Merchants and scholars across the world watch anxiously to see whether Volantis will bow to the restored dragon or take up arms against the invaders."
 GOT_Blackfyre_News.2.a:0 "A storm is gathering in the East."
 
 GOT_Blackfyre_Country.3.t:0 "The Golden Company at Tyrosh"
 GOT_Blackfyre_Country.3.d:0 "Tension fills the grand halls of the High Archon as dire reports reach our council. Young Griff, commanding the full might of the Golden Company, has assembled his forces directly outside our storied green walls and bustling harbor. Stripping away his guise, he has proclaimed himself the legitimate heir of House Blackfyre and sovereign King.\n\nFlanked by veterans of a hundred campaigns, war elephants, and formidable siege engines, Young Griff has dispatched an envoy to the Merchant Council. His terms are absolute: acknowledge the Black Dragon and yield Tyrosh to his army, or prepare for a bloody siege that will stain our waters red."
 GOT_Blackfyre_Country.3.a:0 "Bend the knee. The Black Dragon rises!"
 GOT_Blackfyre_Country.3.b:0 "Tyrosh will never bow to a sellsword king!"
 
 GOT_Blackfyre_News.3.t:0 "The Black Dragon at the Gates of Tyrosh"
 GOT_Blackfyre_News.3.d:0 "News spreads rapidly across the Stepstones and the narrow sea as the Golden Company turns its gaze upon the wealthy Free City of Tyrosh. The pretender known as 'Young Griff' has staked his claim as the true heir of House Blackfyre, encamping his army before the city's green stone fortifications.\n\nWith armored cavalry, sellswords, and battle-tested war elephants lining the approaches, Young Griff has delivered an ultimatum to the High Archon: pledge fealty to House Blackfyre or face total annihilation. Rulers across the known world await word on whether Tyrosh will yield its treasures to the Black Dragon or defy the Golden Company in open battle."
 GOT_Blackfyre_News.3.a:0 "A storm is gathering in the East."
 
 GOT_Blackfyre_Country.4.t:0 "The Golden Company at Lys"
 GOT_Blackfyre_Country.4.d:0 "Panic ripples through the grand mansions and pleasure gardens of the Lysene Magisters as war looms over our island paradise. Young Griff, commanding the formidable strength of the Golden Company, has assembled his host outside our towering white walls and blockaded our harbors. Unveiling his true identity, he has proclaimed himself the legitimate heir of House Blackfyre and rightful King.\n\nFlanked by armored horsemen, seasoned sellswords, and towering war elephants, Young Griff has delivered an unyielding ultimatum to the conclave of Magisters: bow to the Black Dragon and surrender Lys, or watch our fair city burn in a siege of iron and blood."
 GOT_Blackfyre_Country.4.a:0 "Bend the knee. The Black Dragon rises!"
 GOT_Blackfyre_Country.4.b:0 "Lys will never bow to a sellsword king!"
 
 GOT_Blackfyre_News.4.t:0 "The Black Dragon at the Gates of Lys"
 GOT_Blackfyre_News.4.d:0 "Whispings of war fly across the Summer Sea as the Golden Company descends upon the island city of Lys. The pretender known as 'Young Griff' has openly declared himself the true heir to House Blackfyre and laid claim to the royal throne, surrounding the pearl of the Summer Sea with his mercenary host.\n\nWith company veterans, heavy cavalry, and war elephants deployed along the shores, Young Griff has presented the Magisters of Lys with a brutal choice: submit to House Blackfyre or face the total destruction of their city. Lords and merchants across the known world eagerly wait to see if Lys will yield its riches or draw its blades."
 GOT_Blackfyre_News.4.a:0 "A storm is gathering in the East."
 
 GOT_Blackfyre_Country.5.t:0 "The Golden Company at Myr"
 GOT_Blackfyre_Country.5.d:0 "Constellation-gazers, lens crafters, and merchant princes alike hold their breath in the conclave halls of Myr as a dark tide settles around our city. Young Griff, leading the full force of the Golden Company, has drawn up his army before our grand walls and artisan districts. Casting away his disguise, he has proclaimed himself the true heir of House Blackfyre and sovereign King.\n\nFlanked by steel-clad knights, company veterans, and towering war elephants, Young Griff has presented the Magisters with an absolute ultimatum: bend the knee to the Black Dragon and surrender Myr to his host, or watch our ancient city of crafts and trade be put to the sword."
 GOT_Blackfyre_Country.5.a:0 "Bend the knee. The Black Dragon rises!"
 GOT_Blackfyre_Country.5.b:0 "Myr will never bow to a sellsword king!"
 
 
 GOT_Blackfyre_News.5.t:0 "The Black Dragon at the Gates of Myr"
 GOT_Blackfyre_News.5.d:0 "Anxious messages fly across the narrow sea following reports from the Free City of Myr. The pretender known as 'Young Griff' has shed his disguise and declared himself the rightful heir to House Blackfyre, encamping the Golden Company directly outside the city's walls.\n\nWith heavy cavalry, battle-hardened mercenaries, and war elephants taking position across the Myrish countryside, Young Griff has issued a harsh demand to the ruling Magisters: recognize the Black Dragon or prepare for a devastating war. Monarchs and traders across the known world wait anxiously to see whether Myr will submit to the pretender or resist the Golden Company."
 GOT_Blackfyre_News.5.a:0 "A storm is gathering in the East."

 # ==========================================
 # HOUSE BLACKFYRE - EVENT 6 LOCALIZATION (Page 1)
 # ==========================================
 
 GOT_Blackfyre_Country.6.t:0 "The First Iron Step"
 GOT_Blackfyre_Country.6.d:0 "The Golden Company sits upon the razor-edge of destiny. Beneath the gilded banners of the dragon, young Aegon VI stands ready to reclaim what was stolen from his bloodline. But a dragon cannot soar without a lair, and an army cannot march on Westeros without a foothold in Essos.\n\nOur commanders have drawn up an audacious strategy: we shall march directly to the gates of one of the Free Cities, seize the surrounding countryside in a single decisive strike, and present the Magisters with an ultimatum—acknowledge Aegon as sovereign, or watch their cities burn.\n\nSuch brazen audacity is not without peril. The Golden Company’s fierce reputation precedes us, and the merchant princes may collapse under the weight of terror. Yet, should they choose to defy us, we shall be plunged into an immediate, ruthless war.\n\nWhere shall the Black Dragon strike first?"

 # --- Options for Event 6 ---
 
 # Option A: Volantis
 GOT_Blackfyre_Country.6.a:0 "Strike at the First Daughter: Demand the submission of Volantis."
 GOT_Blackfyre_Country.6.a.tt:0 "§RWARNING: Volantis possesses an army roughly FOUR TIMES the size of the Golden Company. Defeat means total ruin, but victory yields the realm of the Old Blood.§!"

 # Option B: Pentos
 GOT_Blackfyre_Country.6.b:0 "March on the Merchant Realm: Encircle and demand Pentos."
 GOT_Blackfyre_Country.6.b.tt:0 "§RWARNING: The Magisters of Pentos command forces roughly FOUR TIMES our current strength. A high-risk gamble against vast mercenary wealth.§!"

 # Option C: Lys
 GOT_Blackfyre_Country.6.c:0 "Cross the Sea of Myrth: Seize the island-city of Lys."
 GOT_Blackfyre_Country.6.c.tt:0 "§YNOTE: The garrison of Lys is estimated at roughly 15 divisions. Their naval isolation offers strategic defense if captured.§!"

 # Option D: Next Page
 GOT_Blackfyre_Country.6.e:0 "Next Page."
 GOT_Blackfyre_Country.6.e.tt:0 "§GExamine additional target cities across Essos.§!"
 
 GOT_Blackfyre_Country.6.f:0 "The time is not yet right. Bide our strength."
 GOT_Blackfyre_Country.6.f.tt:0 "§GWe shall postpone our expansion until our forces are bet


 # ==========================================
 # HOUSE BLACKFYRE - EVENT 7 LOCALIZATION (Page 2)
 # ==========================================
 
 GOT_Blackfyre_Country.7.t:0 "The First Iron Step: Alternate Targets"
 GOT_Blackfyre_Country.7.d:0 "Should we turn our gaze toward Myr or Tyrosh, we enter a far more delicate diplomatic and military game. Neither city shares a direct land connection with our present staging grounds, making any full-scale invasion logistically precarious.\n\nHowever, their standing forces are considerably weaker than those of Volantis or Pentos. Their Magisters are far more susceptible to our bluff—if our reputation holds, they may fold instantly without a fight. Yet the danger remains acute: should they call our bluff and decide to resist, we lack the force projection and naval strength to compel their submission by force."

 # --- Options for Event 7 ---
 
 # Option A: Myr
 GOT_Blackfyre_Country.7.a:0 "Send the ultimatum to the Master Artificers of Myr."
 GOT_Blackfyre_Country.7.a.tt:0 "§YRISKY: Myr commands fewer divisions and is prone to submission, but without a land border, failure to intimidate them leaves us stranded.§!"

 # Option B: Tyrosh
 GOT_Blackfyre_Country.7.b:0 "Demand the immediate capitulation of Tyrosh."
 GOT_Blackfyre_Country.7.b.tt:0 "§YRISKY: Tyrosh possesses a smaller garrison that may yield to our bluff, but we lack the naval power to force a siege if they refuse.§!"
 
  # Option C: Back Down
 GOT_Blackfyre_Country.7.c:0 "The time is not yet right. Bide our strength."
 GOT_Blackfyre_Country.7.c.tt:0 "§GWe shall postpone our expansion until our forces are bet

 # Option E: Previous Page
 GOT_Blackfyre_Country.7.e:0 "Previous Page."
 GOT_Blackfyre_Country.7.e.tt:0 "§GReturn to Volantis, Pentos, and Lys.§!"

 GOT_Blackfyre_Country.8.t:0 "The Golden Company at Pentos"
  GOT_Blackfyre_Country.8.d:0 "Within the gilded towers and fragrant gardens of Pentos, the Magisters gather in panicked council as the horizon turns to dust and steel. Young Griff, commanding the formidable ranks of the Golden Company, has assembled his host directly outside our city walls. Casting aside his blue dye and humble pretense, he has revealed himself as the rightful heir of House Blackfyre and sovereign King.\n\nFlanked by veteran sellswords, heavy cavalry, and terrifying war elephants, Young Griff has issued an unyielding demand: the Magisters must immediately yield the city, unlock the gates, and swear allegiance to the Black Dragon, or watch Pentos be sacked and reduced to ash."
  GOT_Blackfyre_Country.8.a:0 "Bend the knee. The Black Dragon rises!"
  GOT_Blackfyre_Country.8.b:0 "Pentos will never bow to a sellsword king!"
  
 GOT_Blackfyre_News.8.t:0 "The Black Dragon at the Sunrise Gate"
 GOT_Blackfyre_News.8.d:0 "The calm of the Pentoshi coast has been shattered following shocking declarations from the southern roads. The pretender known as 'Young Griff' has cast off his disguise, revealing himself as the true heir to House Blackfyre, and has encamped the full might of the Golden Company directly outside the Sunrise Gate of Pentos.\n\nWith armored knights, seasoned sellswords, and war elephants deployed across the velvet hills, Young Griff has delivered an ultimatum to the Prince and the Magisters: recognize the Black Dragon and provision his conquest, or face a bloody siege. Panic sweeps through the merchant quarter as the city elite weigh whether to pay off the pretender or risk the wrath of the Golden Company."
 GOT_Blackfyre_News.8.a:0 "The Free City trembles before the dragon."