 # 726 — Gendry Legitimized as Lord of Storm's End
 GOT_Story_Country.726.t:0 "A Baratheon Reborn"
 GOT_Story_Country.726.d:0 "The Baratheons were once the ruin of House Targaryen, usurping the Iron Throne and driving our bloodline into exile. Yet the last son of Robert Baratheon sits not on a throne, but at a blacksmith's forge, having fought valiantly alongside our forces in the Great War. By raising Gendry from bastardy to the Lordship of Storm's End, we do more than reward loyalty—we break the old wheel of hatred. In a single royal decree, the historic seat of the Stormlands is bound to our crown, transforming the legacy of the Usurper into a cornerstone of House Targaryen's new order."
 GOT_Story_Country.726.a:0 "The Stormlands are ours."

 GOT_Story_News.726.t:0 "A Bastard Raised: The Lord of Storm's End"
 GOT_Story_News.726.d:0 "Astonishing word spreads from the Targaryen camp: Queen Daenerys Targaryen has issued a royal decree legitimizing Gendry, the last surviving bastard son of King Robert Baratheon. Raised as an unregarded blacksmith’s apprentice in Flea Bottom, Gendry has been formally bestowed the Baratheon name and elevated to Lord of Storm's End. Across the Seven Kingdoms, lords and ladies digest the political shockwave: the historic seat of House Baratheon, left vacant by years of war and bloodshed, now belongs to a fiercely loyal vassal of the Dragon Queen. The old rivalry between Dragon and Stag has ended not in blood, but in a binding oath of fealty."
 GOT_Story_News.726.a:0 "A Stag reborn to serve the Dragon."

