 GOT_Story_Country.735.d: "Jon Snow leads troops into the city but is horrified by Daenerys’s ruthless destruction, struggling to stop the carnage."
 GOT_Story_Country.735.a: "Conflict with Daenerys."
 GOT_Story_Country.735.b: "Moral crisis for Jon."

 GOT_Story_News.735.t: "The Dragon’s Wrath Observed"
 GOT_Story_News.735.d: "Witnessing the devastation, Jon questions the future under Daenerys’s rule."
 GOT_Story_News.735.a: "Seeds of dissent are sown."

 # 736 — Jon Snow Kills Daenerys Targaryen
 GOT_Story_Country.736.t:0 "A Heartbreaking Choice"
 GOT_Story_Country.736.d:0 "The ashes of King's Landing still choke the sky, but Queen Daenerys Targaryen looks toward the horizon, proclaiming a world-spanning war to 'liberate' every corner of the Known World. In the quiet halls of the Red Keep, Jon Snow stands at an unbearable crossroads. Tyrion languishes in chains, Sansa's warnings ring in his ears, and the Northern lords demand protection before dragonfire turns toward Winterfell. To embrace his duty to the realm and save his people from a new tyrant, Jon must commit the ultimate betrayal—stabbing the woman he loves before her conquest consumes the earth."
 GOT_Story_Country.736.a:0 "Strike down the Dragon Queen."
 GOT_Story_Country.736.b:0 "We cannot murder our Queen."

 GOT_Story_News.736.t:0 "A Blade in the Shadow of Dragons"
 GOT_Story_News.736.d:0 "Confused dispatches and frantic rumors pour out from the smoldering ruins of King's Landing: an attempt has been made on the life of Queen Daenerys Targaryen. Eyewitnesses report a bloody confrontation in the scorched Great Hall of the Red Keep between the Dragon Queen and Jon Snow, the King in the North. As shouting echoed through the ashes, Drogon let out a deafening roar and descended upon the throne room before taking flight into a cloud of smoke and fire. With Unsullied guards locking down the ruined city gates and Northern cohorts drawing steel, no one can confirm whether the Queen survived the blade or if the White Wolf was slain on the spot. Westeros holds its breath as the realm balances on the razor's edge between a sudden peace and total annihilation."
 GOT_Story_News.736.a:0 "The realm holds its breath for word from the Red Keep."

 # 737 — Drogon Destroys the Iron Throne
 GOT_Story_Country.737.t:0 "Fire Upon the Throne"
 GOT_Story_Country.737.d:0 "The silence after the strike is shattered by a shadow blocking out the ruined roof—Drogon has descended. The great beast nudges the lifeless body of his mother, letting out a roar of terrible, grief-stricken rage that shakes the foundations of King's Landing. Jon Snow stands ready to die in dragonfire, but Drogon's fury does not turn upon him. Instead, the dragon unleashes a torrent of white-hot flame directly onto the Iron Throne itself—the jagged seat of conquerors and tyrants that cost Daenerys her life. As the ancient steel twists, melts, and flows like slag across the stone floor, Drogon gently gathers the Queen in his talons and takes flight toward the eastern sea, leaving the North and the shattered realm standing in the ashes of an unknown world."
 GOT_Story_Country.737.a:0 "The seat of tyrants is reduced to ash and slag."
 GOT_Story_Country.737.b:0 "The dragon is gone... but what becomes of the realm?"

 GOT_Story_News.737.t:0 "The Iron Throne Reduced to Molten Metal"
 GOT_Story_News.737.d:0 "Word spreads like wildfire across the Seven Kingdoms: the Iron Throne—the sharp, towering seat forged three centuries ago by Aegon the Conqueror from the blades of his fallen enemies—is no more. Eyewitnesses among the surviving guards in King's Landing report that following the death of Queen Daenerys, her last dragon unleashed a searing, grieving inferno upon the throne room itself. The legendary chair was reduced to a glowing pool of slumping steel before the beast took flight toward the sunrise. For three hundred years, thousand swords bound by dragonfire dictated the fate of millions; today, only a cold, blackened scar remains upon the stone. Without a throne to claim or a dragon to enforce it, the old order has crumbled entirely, leaving the lords paramount and the common folk alike to face a brave, uncertain new world."
 GOT_Story_News.737.a:0 "A new era dawns over the ashes of the old."

 # 738 — Bran Stark is Elected King
 GOT_Story_Country.738.t:0 "The Verdict of the Dragonpit"
 GOT_Story_Country.738.d:0 "In the stone amphitheater of the Dragonpit, the remaining lords paramount and great houses of Westeros have reached a historic consensus. To break the cycle of conquerors and hereditary tyrants, the Great Council has elected Bran Stark as King of the Six Kingdoms, granting Northern independence to Sansa Stark. For Jon Snow and House Targaryen, the terms of this new order are absolute: Jon must renounce his claim to the Iron Throne, yield the Crownlands, and step down as Lord of Winterfell into self-imposed exile beyond the Wall to appease the Unsullied and preserve a fragile peace. Yet, the choice remains his—accept the dissolution of the Targaryen empire for the sake of the realm, or defy the council's decree and risk an explosive double uprising from Grey Worm's legion and Bran's royalist Coalition."
 GOT_Story_Country.738.a:0 "Accept exile."
 GOT_Story_Country.738.b:0 "Refuse their decree!."

 GOT_Story_News.738.t:0 "Bran the Broken Ascends"
 GOT_Story_News.738.d:0 "In a historic gathering within the blackened stone of the Dragonpit, the surviving great houses of Westeros have shattered centuries of unbroken tradition. Rejecting the bloody inheritance of conquest and hereditary lineage, the council has formally elected Bran Stark of Winterfell as King of the Six Kingdoms, granting total independence to the realm of the North under Queen Sansa Stark. With Jon Snow accepting exile beyond the Wall to appease the foreign Unsullied host, the Iron Throne has been formally retired, replaced by an elective crown rooted in collective counsel rather than fire and blood. Across the realm, raven wings carry the declaration: a new chapter begins, forged not by dragons, but by the lords of Westeros."
 GOT_Story_News.738.a:0 "A new chapter begins."

 # 739 — Sansa Stark Becomes Queen in the North
 GOT_Story_Country.739.t:0 "Northern Sovereignty"
 GOT_Story_Country.739.d:0 "For thousands of years, the North stood as a free and sovereign kingdom until Torrhen Stark knelt before the dragons. Now, with the Dragon Queen dead and a son of Winterfell seated on the throne in King's Landing, the Northern lords gathered in the Great Hall of Winterfell demand a final accounting. Though Bran Stark wears the crown of the Six Kingdoms, the blood spilled at the Red Wedding, the Long Night, and the slaughter in the south was paid by Northern lives. Lady Sansa Stark stands at a historic crossroads: she can honor the centuries-old dream of her ancestors and crown herself Queen in the North, or she can kneel to her brother in King's Landing, anchoring the realm in unified Stark brotherhood at the expense of Northern independence."
 GOT_Story_Country.739.a:0 "Crown Sansa Queen in the North."
 GOT_Story_Country.739.b:0 "Stand united under King Bran."

 GOT_Story_News.739.t:0 "The North Breaks the Chains"
 GOT_Story_News.739.d:0 "Ravens fly south from Winterfell bearing news that has reshaped the political map of Westeros: Lady Sansa Stark has been crowned Queen in the North, formally declaring the realm above the Neck a free and independent nation. Three centuries after King Torrhen Stark yielded his crown to Aegon the Conqueror, the lords of the North have reclaimed their ancient sovereignty with the full assent of King Bran the Broken in King's Landing. Though some in the south view the departure with apprehension, the common folk and noble houses alike recognize that the historic bond binding the Seven Kingdoms is no more. As Queen Sansa takes her seat upon the wooden throne of Winterfell, the North stands alone once again, sovereign and unbowed."
 GOT_Story_News.739.a:0 "A proud, uncharted era begins above the Neck."

 # 740 — Jon Snow is Exiled to the Night's Watch
 # Country Event — Night's Watch Perspective
 GOT_Story_Country.740.t:0 "A Brother Returned"
 GOT_Story_Country.740.d:0 "The horn has sounded from the top of the Wall: Jon Snow has returned to Castle Black. Sentenced to the black dress once more as the blood price to prevent Grey Worm’s army from razing King's Landing, the former Lord Commander arrives not as a conqueror or a king, but as a banished man seeking peace. The remaining sworn brothers, battered and few after the Long Night, look upon the son of Rhaegar Targaryen with mixed awe and solemnity. Though the Crown demands he take no wife and hold no lands, Jon’s gaze turns beyond the breached ice—toward Tormund Giantsbane and the Free Folk waiting in the haunted forest. For the Watch, his return marks both a living legend rejoining their diminished ranks and a final, bittersweet closing of the Great War."
 GOT_Story_Country.740.a:0 "Reopen the ledgers and welcome our brother home."
 GOT_Story_Country.740.b:0 "He belongs to the True North now."

 # News Event — Realm Perspective
 GOT_Story_News.740.t:0 "The White Wolf Sentenced to the Wall"
 GOT_Story_News.740.d:0 "In a final, somber compromise to appease the grieving Targaryen loyalists and avert another catastrophic civil war, King Bran the Broken has handed down the sentence for the killer of Daenerys Targaryen. Jon Snow—the King in the North who united living men against the dead—has been stripped of all titles, claims, and honors, and banished to the Night's Watch for the remainder of his days. Reports from the North confirm that after taking the black at Castle Black, the former heir to the Iron Throne rode beyond the Wall alongside the Free Folk, disappearing into the vast, snowy wilderness of the uncharted north. With his departure, the last dragonlord disappears into legend, leaving behind a tranquil but deeply altered realm."
 GOT_Story_News.740.a:0 "The song of ice and fire reaches its end."

 # 741 — Arya Stark Sets Sail to Explore West of Westeros
 GOT_Story_Country.741.t: "Into the Unknown"
 GOT_Story_Country.741.d: "Arya Stark departs to explore lands west of Westeros, embarking on a journey into uncharted waters."
 GOT_Story_Country.741.a: "A quest for discovery."
 GOT_Story_Country.741.b: "The spirit of adventure."

 GOT_Story_News.741.t: "Arya’s Voyage Begins"
 GOT_Story_News.741.d: "The young Stark sets sail, leaving the known world behind."
 GOT_Story_News.741.a: "A new horizon beckons."

 # 742 — Tyrion Lannister Appointed as Hand of the King
 GOT_Story_Country.742.t: "A New Hand for a New King"
 GOT_Story_Country.742.d: "Bran appoints Tyrion as Hand, tasking him with rebuilding the realm alongside a reformed Small Council."
 GOT_Story_Country.742.a: "Reconstruction and governance."
 GOT_Story_Country.742.b: "Hope for lasting peace."

 GOT_Story_News.742.t: "Tyrion’s Return to Power"
 GOT_Story_News.742.d: "The former prisoner rises again as Bran’s chief advisor."
 GOT_Story_News.742.a: "A realm rebuilding from ashes."

 # 743 — The Ironborn Civil War
 GOT_Story_Country.743.t: "The Seastone Chair Stands Empty"
 GOT_Story_Country.743.d: "The captains of the Iron Islands have failed to reach a common accord. Supporters of House Greyjoy's rightful heirs have rallied behind Yara and Theon, while others have declared for Euron Greyjoy and his promise of conquest and glory. The Kingsmoot has dissolved into bloodshed, and the Iron Islands now stand divided. Brother raises axe against brother as the fate of the Seastone Chair will be decided not by words, but by war."
 GOT_Story_Country.743.a: "The Ironborn shall decide their future in blood."

 # 743 — News
 GOT_Story_News.743.t: "Civil War Erupts on the Iron Islands"
 GOT_Story_News.743.d: "Reports from the Sunset Sea tell of open conflict across the Iron Islands. What began as a dispute over Balon Greyjoy's successor has descended into civil war, with rival claimants gathering fleets and warriors beneath competing banners. As longships prepare for battle, the outcome of the struggle—and the future of the Ironborn—remains uncertain."
 GOT_Story_News.743.a: "The Drowned God will judge the victor."

 # 744 — The Reach Civil War
 GOT_Story_Country.744.t: "The Reach Divided"
 GOT_Story_Country.744.d: "The deaths of Lord Mace Tyrell, Queen Margaery, and Ser Loras Tyrell have left the Reach without clear leadership. While many lords have declared for Lady Olenna Tyrell, believing the ancient line of Highgarden must endure, others have rallied behind Lord Randyll Tarly, whose military reputation and unwavering resolve have won him the loyalty of those seeking strength in uncertain times. With neither claimant willing to yield, banners are raised across the fertile plains of the Reach. The question of who shall rule Highgarden will now be settled upon the battlefield."
 GOT_Story_Country.744.a: "The Reach shall choose its lord through war."
 GOT_Story_Country.744.b: "The Reach shall choose its lord through war."

 # 744 — News
 GOT_Story_News.744.t: "Civil War Erupts in the Reach"
 GOT_Story_News.744.d: "The Reach has descended into civil war following the destruction of the Great Sept of Baelor. With House Tyrell's leadership shattered, rival factions have proclaimed Lady Olenna Tyrell and Lord Randyll Tarly as the rightful rulers of Highgarden. Armies now march beneath competing banners as one of Westeros' richest and most powerful kingdoms tears itself apart. The outcome of the conflict will determine not only the fate of Highgarden, but the balance of power throughout the Seven Kingdoms."
 GOT_Story_News.744.a: "The fields of the Reach shall run red."

 # 745 — Battle of the Bastards
 GOT_Story_Country.745.t:0 "The Battle of the Bastards"
 GOT_Story_Country.745.d:0 "The white direwolf banner flies once more above the snows of the North. Spearheaded by Jon Snow, Sansa Stark, and the wildling host that crossed the Wall, the surviving Stark loyalists have gathered outside Winterfell to challenge House Bolton's bloody grip on the realm. Occupying the high ground, Ramsay Bolton has assembled his own fearsome force of heavy flayed infantry and cavalry, determined to crush the uprising once and for all. As both armies draw their lines across the frozen fields, the commanders assemble their battle plans. The fate of Winterfell—and the entire North—hangs in the balance of the coming clash."
 GOT_Story_Country.745.a:0 "Let the North decide its own fate."
 GOT_Story_Country.745.b:0 "Lead the Northern campaign directly."

 # 745 — Battle of the Bastards
 GOT_Story_News.745.t:0 "The Battle of the Bastards"
 GOT_Story_News.745.d:0 "Ravens fly south carrying ominous dispatches from beyond the Neck: war has erupted across the snow-covered plains of Winterfell. Beneath the ancient direwolf banner, Jon Snow and Sansa Stark have gathered a desperate coalition of northern loyalists and wildling warriors to reclaim their ancestral seat. Arrayed against them stands Lord Ramsay Bolton, commanding a formidable host of heavy flayed infantry and armored horsemen. As both armies line up on the icy battlefield, the entire realm holds its breath, waiting to see if House Stark will rise from the ashes or if House Bolton's bloody reign over the North will be cemented forever."
 GOT_Story_News.745.a:0 "The realm holds its breath."

 GOT_Story_Country.746.t: "A Debt Paid in Blood"
 GOT_Story_Country.746.d: "Jon Snow died so that our people could live, stabbed in the dark for letting us past the Wall. Now his kin march south to bleed against the Dreadfort's hounds, and the North hangs in the balance. We do not kneel to southron kings, but Tormund and the chiefs argue that we owe the crow our lives. Ramsay Bolton will hunt us down the moment the Starks fall—our choice is whether we fight as one under their banners, lend half our spears while keeping our own host, or stand separate as Free Folk and command our own war."
 GOT_Story_Country.746.a: "He died for us. Give the Starks every spear we have!"
 GOT_Story_Country.746.b: "Send half our warriors south. The rest will guard the Wall."
 GOT_Story_Country.746.c: "We kneel to no man! We march, but under our own chiefs."

 GOT_Story_News.746.t:0 "Savage Banners in the North"
 GOT_Story_News.746.d:0 "Disturbing news spreads from Castle Black and the frozen expanses of the North. Reports confirm that Jon Snow, the Lord Commander of the Night's Watch, was murdered by his own sworn brothers for granting passage to the Free Folk. Yet his murder has not turned the wildlings back. Bound by a grim honor to the slain Lord Commander, Tormund Giantsbane and the clan chieftains have pledged their axes to the Stark cause.\n\nTo the southron lords, the sight of wildling warbands marching alongside northern levies against the Dreadfort is an abomination. For thousands of years, the Wall kept the savages at bay; now, thousands of spearwives and raiders march under direwolf banners, threatening to wash the North in blood. Whether this wild host fights as one under Stark command or strikes out under its own chiefs, the realm watches in terror as ancient rivalries bleed into open war."
 GOT_Story_News.746.a:0 "An unnatural alliance, born of desperate times."
 
 GOT_Story_Country.747.t:0 "Betrayal at Castle Black"
 GOT_Story_Country.747.d:0 "Shouts and the clash of steel echo from inside Castle Black. Word has reached our camp that the crows have turned on their own Lord Commander. The black brothers—blinded by ancient hatred—have drawn their daggers against Jon Snow, the man who brought us past the Wall and gave our women and children a chance to survive.\n\nWithout Snow, these traitorous crows will lock the gates against us or leave us to freeze when the true enemy arrives. Tormund Giantbane already has his battleaxe in hand, calling on every warrior who can swing a blade. We do not owe allegiance to the Night's Watch, but we owe our lives to Jon Snow. We must storm the castle gates before it is too late."
 GOT_Story_Country.747.a:0 "For the Lord Crow! Tear down the gates!"
 GOT_Story_Country.747.b:0 "Let the crows bleed each other out."
 
 GOT_Story_News.747.t:0 "Savage Horde: The Wildlings Join the Fray"
 GOT_Story_News.747.d:0 "Unthinkable news has swept across the Seven Kingdoms. Following the bloody mutiny at Castle Black, the wildling host—once thought confined to the frozen wastes beyond the Wall—has officially drawn its weapons and entered the war for the North.\n\nLed by seasoned chieftains and bound by a blood debt to Jon Snow's loyalists, thousands of freefolk warriors have poured through the gates into the Gift. Clad in crude fur, bone, and stolen steel, these fierce wildlings care nothing for southern politics or feudal oaths. With an unpredictable, bloodthirsty army now marching through northern lands, every lord from the Last Hearth to the Neck must prepare for total chaos."
 GOT_Story_News.747.a:0 "An army of savages marching south... Gods help us."
 
 GOT_Story_Country.748.t:0 "The Lion of Casterly Rock"
 GOT_Story_Country.748.d:0 "For decades, Tywin Lannister swore that his dwarf son would never inherit the ancestral golden seat of Casterly Rock. Yet with the fall of the Westerlands and the collapse of Cersei's reign, the wheel of destiny turns. Tyrion Lannister has served our cause faithfully as Hand of the Queen, matching his sharp mind and political counsel against our deadliest foes. By formal royal decree, Queen Daenerys Targaryen reinstates Lord Tyrion as the rightful ruler of Casterly Rock and Warden of the West. Where his father saw a shameful disappointment, House Targaryen gains an invaluable administrator—and binds the proud, golden lion of the West to the Dragon Queen's throne."
 GOT_Story_Country.748.a:0 "The West serves the Dragon."

 GOT_Story_News.748.t:0 "The Imp Claims the Rock"
 GOT_Story_News.748.d:0 "Shockwaves ripple across the Seven Kingdoms as Queen Daenerys Targaryen formalizes her victory in the West by installing Tyrion Lannister as Lord of Casterly Rock and Warden of the West. Condemned to death by his own kin and exiled across the Narrow Sea, the outcast son of Tywin Lannister has returned at the head of a dragon's host to claim the ancestral halls long denied to him. Across Westeros, great lords and common folk alike ponder the unprecedented shift: the formidable gold reserves and proud bannermen of Casterly Rock now stand beneath the banner of the Hand of the Dragon Queen."
 GOT_Story_News.748.a:0 "The dwarf Tywin rejected now sits upon the Golden Throne."
 
 GOT_Story_Country.749.t:0 "The Wall is Under Attack!"
 GOT_Story_Country.749.d:0 "The dead have come.\n\nFrom the battlements of the Wall, the brothers of the Night's Watch can see an army unlike any they have ever faced gathering beyond the Haunted Forest. Wights march beneath the pale banners of the White Walkers, their numbers seemingly without end. The dead do not tire, do not fear, and do not retreat.\n\nThe Wall has stood for thousands of years, guarding the realms of men from the horrors beyond. Now, for the first time in living memory, the enemy stands before its gates.\n\nThe Long Night may have begun."
 GOT_Story_Country.749.a:0 "Sound the horns. Man the Wall."

 GOT_Story_News.749.t:0 "The Wall is Under Attack!"
 GOT_Story_News.749.d:0 "Terrifying reports have emerged from the far North. The Night's Watch has sent urgent word that an immense army of the dead has gathered beyond the Wall and launched an assault upon its ancient fortifications.\n\nFor generations, the White Walkers were dismissed by many as legends and campfire stories. Now their armies march openly against the realms of men. Wights have been sighted in vast numbers, advancing beneath the banners of beings that should have remained buried in the oldest tales.\n\nThe Wall has stood for thousands of years. Whether it can withstand what is coming remains to be seen."
 GOT_Story_News.749.a:0 "The dead have come."

 GOT_Story_Country.750.t:0 "The Future of the Iron Tide"
 GOT_Story_Country.750.d:0 "With the conflict among our own brethren brought to a decisive end, the Iron Islands stand under our unified control once more. However, as faction leader of the Iron Tide, we face a strategic crossroads. We can choose to maintain our independent alliance and force the greenlanders to bow before our collective might, or disband the Iron Tide to clear the way for broader, opportunistic alliances across Westeros."
 GOT_Story_Country.750.a:0 "The Iron Tide stands strong! We keep our faction."
 GOT_Story_Country.750.b:0 "Disband the Iron Tide. We look to other alliances."
 
 GOT_Story_News.750.t:0 "The Dissolution of the Iron Tide"
 GOT_Story_News.750.d:0 "Reports from Pyke confirm that following the end of internal strife among the Ironborn, the leaders of the Iron Islands have officially disbanded the 'Iron Tide' alliance. With their regional bloc dismantled, the lords of the Ironborn appear ready to abandon their isolation and cast their eyes toward the political shifts of mainland Westeros."
 GOT_Story_News.750.a:0 "A new game begins in the Sunset Sea."
 
 GOT_Story_Country.751.t: "The Harvesting of Hardhome"
 GOT_Story_Country.751.d: "The living flock like cattle to the frozen edge of the sea, huddled together in fear of the creeping frost. Their breath blossoms into mist, their blood runs hot—a brief, vibrant fire that we shall extinguish. As they fall beneath our vanguard, the cold claims them. We raise our hands, and the silent winter fills their lungs. What was once flesh to be slaughtered rises now as our legion. Hardhome is silent, and our march grows endless."
 GOT_Story_Country.751.a: "Dead men serve the Great Other."

 GOT_Story_News.751.t: "The Massacre at Hardhome"
 GOT_Story_News.751.desc: "Grave, nightmare-born rumors blow in from the beyond the Wall: Hardhome has fallen. Tens of thousands of wildling refugees, huddled on the frozen shores waiting for salvation, were set upon by the nightmare of the Long Night. Ships returning from the shuddering bay speak of a silent, sudden freeze that choked out all life—and of fallen free folk standing once more, eyes burning with a terrible blue light, marching under the command of the pale demons. The living have lost a army, and the dead have gained one."
 GOT_Story_News.751.a: "Gods protect us all..."

 GOT_Story_Country.752.t: "The Extinguishing of the Black Shield"
 GOT_Story_Country.752.d: "The ancient stone and ice of Castle Black could not hold against the true frost. The crows who swore to guard the realms of men lie butchered in their courtyards, their oaths broken by mortality. Their warm blood seeps into the snow, but their watch does not end—it merely changes master. With a motion of our cold hands, the black-clad corpses stir once more. The barrier of ice has lost its sentinels, and they shall lead our advance into the lands of the living."
 GOT_Story_Country.752.a: "Their watch begins anew in darkness."

 GOT_Story_News.752.t: "The Fall of Castle Black"
 GOT_Story_News.752.desc: "A chill wave of horror ripples across Westeros as frantic ravens bring dire news: Castle Black has fallen. The ancient brotherhood of the Night's Watch has been slaughtered, their legendary stronghold overrun by the nightmare from beyond the Wall. Worse still, reports claim the slain brothers do not lie peaceful in death; they have risen with burning blue eyes, bearing the black garb of their order to march alongside the pale devils. The shield that guarded the realms of men is broken, and its fallen protectors now serve the enemy."
 GOT_Story_News.752.a: "The Wall has failed..."

 #Country Event, the Crownlands Gets
GOT_Diplomatic_Country.1.t: "Lord Stark Accepts the King's Request"
GOT_Diplomatic_Country.1.d: "Lord Eddard Stark has accepted the King's request to become the new Hand of the King. His departure from Winterfell marks a significant moment for both the North and the Crownlands, as his honor and loyalty to Robert Baratheon will shape the political landscape of Westeros."
GOT_Diplomatic_Country.1.a: "We shall welcome his service, for the good of the realm."

 #The Previous Event Spawns this one for all the other countries
GOT_Diplomatic_News.1.t: "A Stark to Serve the King"
GOT_Diplomatic_News.1.d: "Lord Eddard Stark of Winterfell has accepted King Robert Baratheon's request to become Hand of the King, leaving the North to take up his duties in King's Landing."
GOT_Diplomatic_News.1.a: "A new Hand of the King has been chosen."

 #Country Event, the Crownlands Gets
GOT_Diplomatic_Country.2.t: "Lord Stark Declines the King's Request"
GOT_Diplomatic_Country.2.d: "Lord Eddard Stark has declined King Robert Baratheon's request to become the new Hand of the King. This refusal is a blow to the Crown’s plans, as the King’s old friend and trusted ally will not join him in King's Landing. The political ramifications of this decision are yet to be seen."
GOT_Diplomatic_Country.2.a: "His decision must be respected, though it leaves the realm in an uncertain state."

GOT_Diplomatic_Country.3.t: "The Targaryen Offer"
GOT_Diplomatic_Country.3.d: "Viserys Targaryen has come to Khal Drogo, offering his sister Daenerys in marriage in exchange for an alliance. The Targaryens seek the might of the Dothraki to help them reclaim the Iron Throne, and this marriage would secure their pact."
GOT_Diplomatic_Country.3.a: "Accept the marriage proposal and form the alliance"
GOT_Diplomatic_Country.3.b: "Decline the offer and remain independent"

GOT_Diplomatic_Country.4.t: "Khal Drogo Accepts"
GOT_Diplomatic_Country.4.d: "Khal Drogo, the fearsome leader of the Dothraki, has agreed to the marriage proposal, pledging his loyalty to House Targaryen. The alliance is sealed, and Daenerys is now to marry Drogo."
GOT_Diplomatic_Country.4.a: "The alliance is sealed, and Daenerys will marry Khal Drogo."

GOT_Diplomatic_Country.5.t: "Khal Drogo Declines"
GOT_Diplomatic_Country.5.d: "Khal Drogo has rejected Viserys’s offer, refusing to marry Daenerys in exchange for an alliance. The Dothraki will remain independent, and the Targaryens must find another path to power."
GOT_Diplomatic_Country.5.a: "The Dothraki have refused the proposal, and the alliance is off."

GOT_Diplomatic_Country.6.t: "They Have My Son"
GOT_Diplomatic_Country.6.d: "News has reached us from the Vale — or more precisely, from Catelyn Stark. She has taken Tyrion captive and accuses him of attempting to murder her son. This is an affront to our House. Tyrion’s safety is not assured, and House Lannister does not sit idle when wronged. The time has come to decide whether we let this insult go unanswered, or make the North pay for laying hands on a lion."
GOT_Diplomatic_Country.6.a: "Summon the banners! We ride for war!"
GOT_Diplomatic_Country.6.b: "He is cunning. He will find a way to survive."

GOT_Diplomatic_Country.7.t: "The Death of Eddard Stark"
GOT_Diplomatic_Country.7.d: "A raven from King's Landing has brought terrible news. Lord Eddard Stark has been executed on the orders of King Joffrey Baratheon. The North is in shock — their lord, Warden of the North, butchered like a common traitor in the capital he served loyally. Robb Stark must decide how the North shall respond to this unforgivable act."
GOT_Diplomatic_Country.7.a: "This is war. We ride south at once."
GOT_Diplomatic_Country.7.b: "We will mourn him... for now."
GOT_Diplomatic_Country.7.c: "He will be avenged."

GOT_Diplomatic_Country.8.t: "Who Shall Wear the Crown?"
GOT_Diplomatic_Country.8.d: "With King Robert’s death, the fate of the realm rests heavy upon me. As Lord Regent, I must choose who will succeed him. Joffrey is named in Robert’s will, but doubts gnaw at my conscience. Stannis holds the lawful claim. Renly has support, though little right. And some whisper that I should claim the crown myself — but I am no king. Perhaps the realm needs not a monarch, but a steady hand to guide it through the storm."
GOT_Diplomatic_Country.8.a: "Joffrey Baratheon shall be king."
GOT_Diplomatic_Country.8.b: "The crown rightfully belongs to Stannis."
GOT_Diplomatic_Country.8.c: "Renly has the backing to rule."
GOT_Diplomatic_Country.8.e: "The realm needs no king — only a regent."


GOT_Diplomatic_Country.9.t: "The Lioness Roars"
GOT_Diplomatic_Country.9.d: "With Eddard Stark defeated and Robert dead, the path to the Iron Throne lies clear. I can maintain control as Regent, letting the realm believe power rests in their king’s hands — whoever he or she may be. Joffrey is the rightful heir, though his temper worries even me. Tommen is kind and easily guided. Myrcella, though a girl, has a mind sharper than her brothers’. Or perhaps it's best I simply hold the reins myself, without the formality of a crown. The choice is mine. And I will not be questioned."
GOT_Diplomatic_Country.9.a: "Remain Queen Regent — let the child rule in name only."
GOT_Diplomatic_Country.9.b: "Crown Joffrey Baratheon as King."
GOT_Diplomatic_Country.9.c: "Crown Tommen Baratheon as King."
GOT_Diplomatic_Country.9.e: "Crown Myrcella Baratheon as Queen."

GOT_Diplomatic_Country.10.t: "Lord Stark's Betrayal"
GOT_Diplomatic_Country.10.d: "Word has reached us that Lord Eddard Stark, acting as Regent, has spurned the clear line of succession. Instead of honoring Prince Joffrey’s claim, he has moved to crown another — Stannis, Renly, or even rule in Robert’s stead. This is nothing short of treason. The time has come to decide our response. Shall we strike swiftly and secure the capital, or wait for the opportune moment?"
GOT_Diplomatic_Country.10.a: "Summon our banners. We march on King’s Landing!"
GOT_Diplomatic_Country.10.b: "Patience. Our time will come."

GOT_Diplomatic_Country.11.t: "The Last Dragon Falls"
GOT_Diplomatic_Country.11.d: "Viserys Targaryen is dead. The self-proclaimed king who once shouted of dragons and thrones now lies cold and forgotten. His death marks the end of his madness — and the rise of another. Daenerys, once the timid sister, now stands as the last known heir of House Targaryen. In the eyes of the faithful, she is the rightful Queen — the Mother of Dragons yet to come."
GOT_Diplomatic_Country.11.a: "I will not be weak. I am the blood of the dragon."

GOT_Diplomatic_Country.12.t: "The Dragon Mocked"
GOT_Diplomatic_Country.12.d: "They laughed at me. The blood of the dragon — laughed at like a jester in a savage court. I demanded my crown, as is my right, and they dared to lay hands on me. The khal treats me like a beggar, my sister forgets her place, and the Dothraki mutter in their barbarous tongue. But I will not be broken. I am the dragon. And they will learn that fire does not bend — it burns."
GOT_Diplomatic_Country.12.a: "They will all pay. One day, I will show them."
GOT_Diplomatic_Country.12.b: "No... not yet. I must be patient. I must endure."

GOT_Diplomatic_Country.13.t:0 "The Khal Lives!"
GOT_Diplomatic_Country.13.d:0 "Drogo breathes! Though the wound was deep and the night long, the blood of the Great Stallion flows strong in his veins. Our Khal has risen from his mat, his gaze fierce, his grip firm. The witch’s magic may have played a part, but it was Drogo’s spirit that defeated death itself. The khalasar rejoices — their leader has returned."
GOT_Diplomatic_Country.13.a:0 "He rides again!"

GOT_Diplomatic_Country.14.t:0 "The Khal Is Dead"
GOT_Diplomatic_Country.14.d:0 "Khal Drogo, the Great Khal, has fallen. His blood spills no more, his strength is gone. Songs will be sung of his conquests and the fear he struck across the lands. But now, the khalasar stands at a crossroads — bloodriders murmur, and the mares whinny nervously. The Great Khal is no more. Who shall lead us now?"
GOT_Diplomatic_Country.14.a:0 "We shall follow the Khaleesi, the Mother of Dragons!"
GOT_Diplomatic_Country.14.b:0 "Khal Moro should lead us, his strength is undeniable!"
GOT_Diplomatic_Country.14.c:0 "We do not need a single ruler. We are free to lead ourselves!"

 GOT_Diplomatic_Country.15.t: "The Matter of the Tournament"
 GOT_Diplomatic_Country.15.d: "King Renly has declared his rightful claim to the Iron Throne, and our banners rally in strength unmatched. Lords across Westeros cast their gaze south, wondering if we will march upon the capital and end the Lannister usurpation at once.\n\nYet, some counsel patience. A grand tourney, they say, would buy us time to gather allies and show the realm that King Renly's court is one of peace, prosperity, and strength. Others demand action now, before the enemy can prepare.\n\nThe eyes of the Seven Kingdoms are upon us. Will we answer with war—or with pageantry?"
 GOT_Diplomatic_Country.15.a: "We ride to war. The Iron Throne will be ours by right."
 GOT_Diplomatic_Country.15.b: "Let the banners rest for now. We will host a grand tournament."

GOT_Diplomatic_Country.16.t: "Theon's Offer"
GOT_Diplomatic_Country.16.d: "The boy returns, cloaked in the wolf’s banners and burdened with Stark terms. He dares speak of peace and promises—offering Casterly Rock in exchange for our blades. Robb Stark would have us bind our fate to his, claiming it is the surest path to power. But we are Ironborn. We do not make deals—we take. Theon's loyalty is uncertain, his presence a reminder of our past defeat. Still, the offer is tempting. The time has come to choose: ally with the wolves, strike while they are distracted, or wait until the sea favors our strength."
GOT_Diplomatic_Country.16.a: "We shall sail with the Starks—for now."
GOT_Diplomatic_Country.16.b: "The North is weak. We take what is ours!"
GOT_Diplomatic_Country.16.c: "Now is not the time for war."

GOT_Diplomatic_Country.17.t: "The Ironborn Path"
GOT_Diplomatic_Country.17.d: "No envoy has come. No raven bears an offer. The North wages its war alone, leaving the Iron Islands to plot their own course. Balon Greyjoy sees weakness on all shores—chaos in the Westerlands, division in the North. Our fleets are ready. The men hunger for salt and plunder. The question now is not if we strike, but where: shall we raid the Westerlands while their golden lion sleeps, strike the North as vengeance for the old rebellion, or bide our time and await a more favorable tide?"
GOT_Diplomatic_Country.17.a: "We raid the Westerlands—they are ripe for plunder!"
GOT_Diplomatic_Country.17.b: "The North never broke us—we will remind them of that."
GOT_Diplomatic_Country.17.c: "Let the storm pass. Our time will come."

GOT_Diplomatic_Country.18.t: "A New Recruit from King's Landing"
GOT_Diplomatic_Country.18.d: "A black carriage rolls through the gates of Castle Black, bearing a man dressed more for court than for the cold. Janos Slynt, former Commander of the City Watch in King's Landing, arrives under royal command to take the black. Though he comes with titles and boasts of past glories, few here trust a man who served coin before honor."
GOT_Diplomatic_Country.18.a: "He will learn humility like the rest."

GOT_Diplomatic_Country.19.t: "King Renly Survives"
GOT_Diplomatic_Country.19.d: "Despite being grievously injured by the shadow birthed by Melisandre, I have survived. The pain is unbearable, but my ambition remains undeterred. Now, I must decide whether to seek vengeance against my brother Stannis for his treachery, or focus on securing the Crownlands for my claim to the throne."
GOT_Diplomatic_Country.19.a: "It is time for retribution!"
GOT_Diplomatic_Country.19.b: "The Crownlands are more important now"

GOT_Diplomatic_Country.20.t: "Renly Baratheon Assassinated!"
GOT_Diplomatic_Country.20.d: "Renly Baratheon, the favored claimant of House Tyrell in the War of the Five Kings, has been slain by sorcery—cut down by a shadow birthed by Melisandre, priestess of R'hllor and ally of Stannis Baratheon. With their political betrothal shattered and their chosen king gone, House Tyrell must now decide its course: side with Stannis, align with the Iron Throne, or return to the Reach and stand aloof from this chaos."
GOT_Diplomatic_Country.20.a: "Pledge ourselves to Stannis."
GOT_Diplomatic_Country.20.b: "Side with the Crown—marry Margaery to Joffrey."
GOT_Diplomatic_Country.20.c: "Return to the Reach. Let them all kill each other."

GOT_Diplomatic_Country.21.t: "The Fall of Winterfell"
GOT_Diplomatic_Country.21.d: "A raven has arrived with grim news: Theon Greyjoy has betrayed House Stark and seized Winterfell. Our ancestral home is in enemy hands, and Bran and Rickon are missing. Lords loyal to us are furious, and many demand vengeance. We must decide how to respond to this outrage."
GOT_Diplomatic_Country.21.a: "I will take back Winterfell and hang Theon myself!"
GOT_Diplomatic_Country.21.b: "Winterfell is lost, but we must stay the course in the war."

GOT_Diplomatic_Country.21.tt1: "§RWinterfell has fallen. House Stark vows vengeance.§!"
GOT_Diplomatic_Country.21.tt2: "§YWe stay focused on the southern war.§!"

 # GOT_Diplomatic_Country.22 – Tyrion Requests Casterly Rock
GOT_Diplomatic_Country.22.t: "A Request from Tyrion"
GOT_Diplomatic_Country.22.d: "Tyrion, ever hungry for recognition, has approached me with a bold request: he wishes to be named Lord of Casterly Rock. Despite his cunning and recent service, the idea of placing my legacy in his hands is almost laughable. Yet, for all his flaws, he is still a Lannister by blood. Do I grant him what he desires—or remind him, once again, of his place?"
GOT_Diplomatic_Country.22.a: "Very well. He shall be Lord of Casterly Rock."
GOT_Diplomatic_Country.22.b: "I would rather let myself be consumed by maggots."

 # GOT_Diplomatic_Country.23 – Tywin Grants Casterly Rock
GOT_Diplomatic_Country.23.t: "Granted Casterly Rock"
GOT_Diplomatic_Country.23.d: "I half-expected mockery. A scornful laugh. A reminder of every insult I’ve ever suffered. But instead, he agreed. Tywin Lannister—my father—has granted me Casterly Rock. The seat of our house. The legacy I was never meant to hold. Perhaps this is a ploy, or a test. Perhaps he’s finally seen my worth. Either way, I’ve claimed what I was always denied."
GOT_Diplomatic_Country.23.a: "So it’s finally mine…"

 # GOT_Diplomatic_Country.24 – Tywin Rejects the Request
GOT_Diplomatic_Country.24.t: "Rejected by My Father"
GOT_Diplomatic_Country.24.d: "I dared to ask. To claim what any other son would consider his birthright. But Tywin, in all his contempt, dismissed me without hesitation. No explanation. No pretense. Just cold, measured disdain. He said he would rather let himself be consumed by maggots. I should have expected nothing else—but still, it burns."
GOT_Diplomatic_Country.24.a: "One day, he’ll regret this."

 GOT_Diplomatic_Country.25.t: "The Dragon Queen’s Offer"
 GOT_Diplomatic_Country.25.d: "Daenerys Targaryen has offered us a deal: one of her dragons in exchange for our Unsullied — 8,000 fully trained soldiers and 5,000 more still in training. With such a creature, we could unlock the secrets of dragonkind and begin studying their power for ourselves. But without the Unsullied, Astapor would be left nearly defenseless. Accepting could bring us knowledge beyond imagining—or doom at the hands of the Targaryens if they choose to take what we refuse to sell."
 GOT_Diplomatic_Country.25.a: "Accept the deal. The dragon will be ours."
 GOT_Diplomatic_Country.25.b: "Refuse. We cannot leave ourselves exposed."
 
  GOT_Diplomatic_Country.26.t: "The Unsullied Are Ours"
 GOT_Diplomatic_Country.26.d: "The slavers of Astapor have agreed to the deal. One of our dragons now rests in their hands, and in return, the Unsullied—13,000 strong—stand ready to march under our banner. Missandei, once their translator, now joins us as well. Yet the city is vulnerable. Stripped of its elite troops and gorging on the promise of dragon power, Astapor lies wide open. Should we keep our word… or strike while their defenses are down?"
 GOT_Diplomatic_Country.26.a: "They are slavers. We strike now and burn them to the ground."
 GOT_Diplomatic_Country.26.b: "We've made our deal. Sail for Pentos with the Unsullied."
 
 GOT_Diplomatic_Country.27.t: "A Foolish Refusal"
 GOT_Diplomatic_Country.27.d: "Astapor has rejected our offer. They refuse to part with the Unsullied, fearing vulnerability. They would rather hold on to their slave army than embrace the gift of a dragon. It is a bold insult. We could sail away and bide our time—or we could unleash fire and blood upon them now."
 GOT_Diplomatic_Country.27.a: "They will regret this. Prepare to attack Astapor."
 GOT_Diplomatic_Country.27.b: "Very well. Let them have their slaves… for now."
 
GOT_Diplomatic_Country.28.t:0 "An Offer from Yunkai"
GOT_Diplomatic_Country.28.d:0 "An emissary from Yunkai has arrived under a banner of peace. Bearing word from the Wise Masters, he offers one hundred ships and promises of non-aggression in exchange for our departure. They claim they wish to avoid bloodshed, though their chains still rattle in the streets. Shall we accept their offer of ships and stand down—for now—or continue our march and bring fire and blood to the city?"
GOT_Diplomatic_Country.28.a:0 "Accept the ships and their pact—for now."
GOT_Diplomatic_Country.28.b:0 "I will not make pacts with slavers. Prepare for war."

GOT_Diplomatic_Country.29.t:0 "The Dragon Queen Accepts"
GOT_Diplomatic_Country.29.d:0 "Our emissary has returned with unexpected news: Daenerys Targaryen has agreed to our terms. She will leave Yunkai unharmed in exchange for one hundred ships and a promise of non-aggression. Though her dragons remain at her side, it seems—for now—that fire and blood have been stayed by gold and diplomacy."
GOT_Diplomatic_Country.29.a:0 "A wise outcome. Let us hope it lasts."

GOT_Diplomatic_Country.30.t:0 "The Dragon Queen Refuses"
GOT_Diplomatic_Country.30.d:0 "Our emissary has failed. Daenerys Targaryen rejected our offer of gold and ships without hesitation. She means to bring war upon us, and soon the hammer of her Unsullied and the fire of her dragons may fall upon our gates. The Masters grow restless—some urge a preemptive strike, while others argue we should wait and fortify the city."
GOT_Diplomatic_Country.30.a:0 "Strike first before she gathers her full strength."
GOT_Diplomatic_Country.30.b:0 "Do nothing—let her make the first move."

GOT_Diplomatic_Country.31.t:0 "The Fall of the Red Viper"
GOT_Diplomatic_Country.31.d:0 "Our beloved Prince Oberyn has fallen in King’s Landing. Though he fought valiantly as Tyrion Lannister’s champion, he was slain by Ser Gregor Clegane in the trial by combat. His quest for vengeance ended in tragedy, and with his death, Dorne has lost a fierce defender and proud son. The people cry out for justice."
GOT_Diplomatic_Country.31.a:0 "We shall not forget this injustice."

GOT_Diplomatic_Country.32.t:0 "Victory for the Red Viper"
GOT_Diplomatic_Country.32.d:0 "Prince Oberyn has emerged victorious in the trial by combat in King’s Landing, slaying Ser Gregor Clegane and avenging the murder of his sister. His triumph has not only saved Tyrion Lannister from execution but also sent a powerful message across Westeros—Dorne is not to be underestimated."
GOT_Diplomatic_Country.32.a:0 "Dorne stands proud today."

GOT_Diplomatic_Country.33.t: "Tormund Captured"
GOT_Diplomatic_Country.33.d: "Tormund Giantsbane, the legendary leader of the Free Folk, has been captured by our enemies. This loss sends a wave of despair through the Wildling ranks, for he was a symbol of our strength and hope. As the prisoner's fate is sealed, we must decide how to proceed: rally behind another leader or fall into disarray."
GOT_Diplomatic_Country.33.a: "We will fight on—Tormund’s spirit lives within us."

GOT_Diplomatic_Country.34.t:0 "The Great Betrayal"
GOT_Diplomatic_Country.34.d:0 "We have not yet triumphed over the Lannisters, but now the wolves have begun to turn on one another.\n\nThe Freys, who we once considered allies, have kept their distance since our refusal to cross at the Twins. Yet now, the Freys have betrayed us, revealing their true loyalties. Even worse, our own bannermen, the Boltons, have cast aside their loyalty to the North. Lord Roose Bolton has turned his back on his vows, and now marches with our enemies.\n\nWhile we continue to fight for the realm, our enemies have turned against us from within."
GOT_Diplomatic_Country.34.a:0 "Treachery in our midst!"

GOT_Diplomatic_Country.35.t:0 "The Great Betrayal"
GOT_Diplomatic_Country.35.d:0 "We have not yet triumphed over the Lannisters, but now the wolves have begun to turn on one another.\n\nThe Freys, who we once considered allies, have waited in vain for the marriage we promised. Yet, when Lord Walder Frey presented his terms for forgiveness, we spurned him, rejecting his demands outright. Now, the Freys have revealed their true loyalties, and our former bannermen, the Boltons, have followed suit. Lord Roose Bolton has betrayed us, casting aside his loyalty and marching with our enemies.\n\nWhile we fight on for the realm, our enemies, once within our own ranks, now rise in revolt against us."
GOT_Diplomatic_Country.35.a:0 "Treachery from within!"

GOT_Diplomatic_Country.36.t:0 "A Bond of Steel and Blood"
GOT_Diplomatic_Country.36.d:0 "In a rare moment of peace, Robb Stark has honored his pact with House Frey. The marriage to Roslin Frey is now sealed, strengthening the ties between the North and the Riverlands.\n\nThough the war against the Lannisters rages on, this union offers a glimpse of hope and stability in the North. It is a reminder that alliances, once forged, hold the power to outlast the storm of battle."
GOT_Diplomatic_Country.36.a:0 "The North stands united."

GOT_Diplomatic_Country.37.t:0 "The Red Wedding"
GOT_Diplomatic_Country.37.d:0 "What was meant to be a union of peace and strength has turned into a massacre. As Robb Stark and Roslin Frey exchanged vows, the Freys turned on us with ruthless violence. House Frey, long discontent with the terms of their alliance, has betrayed us in the most horrific fashion. Our banners fall as traitors strike from within.\n\nThe North is now in mourning. The blood spilled at the Twins will never be washed clean, and the price of betrayal will echo across the realms."
GOT_Diplomatic_Country.37.a:0 "A betrayal of blood."

GOT_Diplomatic_Country.38.t:0 "A Union of the Riverlands"
GOT_Diplomatic_Country.38.d:0 "Edmure Tully has taken Roslin Frey as his bride, securing the bond between House Tully and House Frey. With this marriage, the Riverlands hope to regain some stability amidst the growing storm that threatens the realm.\n\nThough the war with the Lannisters rages on, and the scars of betrayal linger, this union marks a new chapter for the Riverlands. We must now face our future together, hoping that this alliance will bring the peace we desperately need."
GOT_Diplomatic_Country.38.a:0 "A future united."

GOT_Diplomatic_Country.39.t:0 "The Red Wedding"
GOT_Diplomatic_Country.39.d:0 "What was meant to be a union of peace and strength has turned into a massacre. As Edmure Tully and Roslin Frey exchanged vows, the Freys turned on us with ruthless violence. House Frey, long discontent with the terms of their alliance, has betrayed us in the most horrific fashion. Our banners fall as traitors strike from within.\n\nThe North is now in mourning. The blood spilled at the Twins will never be washed clean, and the price of betrayal will echo across the realms."
GOT_Diplomatic_Country.39.a:0 "A betrayal of blood."

GOT_Diplomatic_Country.40.t: "Daenerys Gains a New Ally in Daario Naharis"
GOT_Diplomatic_Country.40.d: "Outside Yunkai, I sought the allegiance of the Second Sons, a mercenary company. Their leader, Mero, dismissed me, but his lieutenant, Daario Naharis, killed Mero and another commander, presenting their heads to me. He pledged the loyalty of the Second Sons to my cause, adding another valuable ally to my army."
GOT_Diplomatic_Country.40.a: "Daario’s loyalty gives me a powerful mercenary force, one that could turn the tide."

GOT_Diplomatic_Country.41.t:0 "Daario Remains Loyal"
GOT_Diplomatic_Country.41.d:0 "Despite Daenerys Targaryen's overtures and her growing power in Slaver’s Bay, Daario Naharis and the Second Sons have chosen to honor their original contract and remain in service to Yunkai. Whether out of greed, pragmatism, or deeper loyalty, Daario’s decision is a significant victory for our cause. The Second Sons will continue to serve as a sword for our interests, and the Mother of Dragons will have to face us without their steel."
GOT_Diplomatic_Country.41.a:0 "Good. Let her come."

GOT_Diplomatic_Country.42.t: "Our Father, Fallen"
GOT_Diplomatic_Country.42.d: "Lord Tywin Lannister is dead—cut down by the very son he once disinherited. His murder has left a void at the heart of House Lannister, and with it, a dangerous question: who shall inherit the Rock?\n\nKevan Lannister stands as a loyal and steady hand. Jaime, the Kingslayer, is still a son of the Rock—but bound to the Kingsguard. Cersei, ever proud, may claim the mantle herself, or through her surviving children. And in the capital, some whisper that the Crown should take direct control of the Westerlands until the chaos subsides.\n\nThe Lion's roar has quieted. Now comes the struggle for its echo."
GOT_Diplomatic_Country.42.a: "Kevan Lannister shall lead the West."
GOT_Diplomatic_Country.42.b: "Jaime will return to Casterly Rock."
GOT_Diplomatic_Country.42.c: "Cersei will rule in her own name—or her child's."
GOT_Diplomatic_Country.42.e: "Let the Crown assume control of the Rock."

GOT_Diplomatic_Country.43.t:0 "A Request from Pentos"
GOT_Diplomatic_Country.43.d:0 "A diplomatic raven arrives from the Magisters of Pentos. With great courtesy and acknowledgment of past hospitality, they note that House Targaryen has now secured lands of its own, and respectfully request the return of Illyrio Mopatis' mansion. They emphasize that this request comes not from malice, but from the understanding that their generous gesture of asylum is no longer necessary now that the Targaryens are no longer destitute wanderers."
GOT_Diplomatic_Country.43.a:0 "They sheltered us in our time of need. We shall withdraw peacefully."
GOT_Diplomatic_Country.43.b:0 "This mansion is ours now. Tell them to come and take it."
GOT_Diplomatic_Country.43.c:0 "An insult! We will strike first and teach them their place."

GOT_Diplomatic_Country.44.t:0 "Illyrio's Mansion Reclaimed"
GOT_Diplomatic_Country.44.d:0 "Word has arrived that House Targaryen has departed Illyrio’s Mansion in good faith. With their own lands secured, they have relinquished their former refuge without dispute. The estate has now returned to Pentoshi administration. Though simple in nature, this gesture marks a symbolic end to the era of their dependency — and a quiet relief for our court."
GOT_Diplomatic_Country.44.a:0 "Let the mansion be restored to its old purpose."

GOT_Diplomatic_Country.45.t:0 "Targaryens Refuse to Vacate Illyrio’s Mansion"
GOT_Diplomatic_Country.45.d:0 "Our request was met not with understanding, but with defiance. House Targaryen has refused to leave Illyrio’s Mansion, insisting on remaining despite their newfound holdings. This disregard for our sovereignty is a troubling sign. Some urge immediate action, while others counsel patience — for now."
GOT_Diplomatic_Country.45.a:0 "They leave us no choice. We’ll take it by force."
GOT_Diplomatic_Country.45.b:0 "We’ll let it slide — for now."

 # Stark Offers Alliance
GOT_Diplomatic_Country.46.t: "An Offer from the North"
GOT_Diplomatic_Country.46.d: "Catelyn Stark has arrived in our camp, bearing an offer from her son, Robb Stark. He proposes an alliance between the North and the Stormlands—he will recognize me as king, if I in turn recognize Northern independence. Such a pact would strengthen our position in the coming war, but to acknowledge the North's secession would set a precedent that may weaken the realm's unity."
GOT_Diplomatic_Country.46.a: "Let us stand together—an alliance it shall be."
GOT_Diplomatic_Country.46.b: "I cannot divide the realm further. The answer is no."

 # Renly Accepts Stark Alliance
GOT_Diplomatic_Country.47.t: "Renly Accepts Our Offer"
GOT_Diplomatic_Country.47.d: "Renly Baratheon has agreed to our proposal. In accepting our alliance, he recognizes the North's independence and commits to a shared cause against our common enemies. Though he may seek the Iron Throne, for now our interests align—and with this pact, our strength multiplies."
GOT_Diplomatic_Country.47.a: "Let us hope this alliance holds."

 # Renly Rejects Stark Alliance
GOT_Diplomatic_Country.48.t: "Renly Rejects Our Offer"
GOT_Diplomatic_Country.48.d: "Our envoys have returned with ill news—Renly Baratheon has refused our offer of alliance. Despite our willingness to support his claim, he does not recognize the North's right to independence. His ambitions outweigh diplomacy, and we must now consider him a potential foe rather than a friend."
GOT_Diplomatic_Country.48.a: "Then we shall stand alone."

 # Time to Join Renly's Campaign
GOT_Diplomatic_Country.49.t: "Renly Marches on King's Landing"
GOT_Diplomatic_Country.49.d: "Renly Baratheon has at last begun his campaign toward King's Landing, declaring open war against the Lannisters and all who would deny him the Iron Throne. The time has come to decide: do we ride south in support of our ally and strike a blow against the common enemy, or do we remain focused on the North’s cause alone?"
GOT_Diplomatic_Country.49.a: "We ride with Renly—Lannister blood will spill."
GOT_Diplomatic_Country.49.b: "Our war is in the North. Let the South burn without us."

 # Robb Refuses to Honor Pact
GOT_Diplomatic_Country.50.t: "Robb Stark Betrays the Pact"
GOT_Diplomatic_Country.50.d: "Robb Stark has refused to honor the alliance he forged with us. As our banners march toward King's Landing, he chooses to remain in the North, abandoning the cause we once agreed to. This betrayal cannot be ignored. The question now is whether to strike back at this treachery—or focus on the Lannisters, and deal with the North later."
GOT_Diplomatic_Country.50.a: "The North will answer for this insult. We march on Winterfell."
GOT_Diplomatic_Country.50.b: "We cannot afford another enemy. King's Landing remains our target."

 # The Riverlands Respond to Robb's Coronation
GOT_Diplomatic_Country.51.t: "Robb Stark Crowned King in the North"
GOT_Diplomatic_Country.51.d: "Robb Stark has been declared King in the North by his bannermen, and now stands as more than just a military commander. As lords of the Riverlands, we must decide our place in this new order. Shall we pledge our loyalty and name him King of the Trident, binding our fates together beyond mere alliance? Or do we remain allies—strong and united, but sovereign?"
GOT_Diplomatic_Country.51.a: "Robb shall be King of the Trident as well."
GOT_Diplomatic_Country.51.b: "We will fight beside him, but we remain our own."

GOT_Diplomatic_Country.52.t: "King of the Trident"
GOT_Diplomatic_Country.52.d: "The lords of the Riverlands have pledged more than just swords. They have crowned me not only King in the North, but King of the Trident as well. The old ties of blood and shared suffering bind our peoples, and now our banners fly as one. Though we remain distinct realms for now, the Riverlands shall be fully brought into the Northern kingdom after our victory—by law, not just alliance."
GOT_Diplomatic_Country.52.a: "The North and Trident rise united."

GOT_Diplomatic_Country.53.t: "Allies Still, But Apart"
GOT_Diplomatic_Country.53.d: "Though the Riverlords have chosen not to crown me King of the Trident, they remain our steadfast allies. Their loyalty to our cause is clear, even if their sovereignty remains intact. We will ride together into battle, brothers in arms if not in crown. Let us honor their choice—and ensure our enemies regret challenging this alliance."
GOT_Diplomatic_Country.53.a: "Let the River run with Lannister blood."

GOT_Diplomatic_Country.54.t: "Justice for Renly?"
GOT_Diplomatic_Country.54.d: "Though Renly Baratheon now lies dead, his shadow still haunts the Reach. It was no sword or spear that felled him, but sorcery—dark magic wielded by Melisandre of Asshai in service of Stannis Baratheon. Now, with Margaery betrothed to King Joffrey and our banners sworn to the Iron Throne, a question lingers: Should House Tyrell avenge Renly's murder with fire and steel, or entrust justice to the realm we now serve?"
GOT_Diplomatic_Country.54.a: "Renly must be avenged—declare war on Stannis!"
GOT_Diplomatic_Country.54.b: "We serve the Crown. Let Joffrey dispense justice."

 # # # Reaction to the Bolton Rebellion # # #
GOT_Diplomatic_Country.55.t:0 "A Raven from the Dreadfort"
GOT_Diplomatic_Country.55.d:0 "A black‑winged messenger alights in our yard bearing grim tidings.\n\n“Roose Bolton has risen in open defiance of Winterfell, naming Stark rule broken and false. The Flayed Man marches under bloody banners.”\n\nThe North is tearing itself apart, and the eyes of every lord now turn to us. Will we:\n\n**Stand with the Boltons** and strike at the direwolves while they stagger?\n**Rally to House Stark** to uphold the old order?\n**Stay our hand** and see which way the wind blows?\n\nOur choice may decide the fate of the North."
GOT_Diplomatic_Country.55.a:0 "Throw in with the Boltons"
GOT_Diplomatic_Country.55.b:0 "Aid Winterfell against the traitors"
GOT_Diplomatic_Country.55.c:0 "Remain neutral—for now"

GOT_Diplomatic_Country.56.t: "The Flame Extinguished"
GOT_Diplomatic_Country.56.d: "Word spreads through the camp that Ygritte, the fiery spearwife who fought beside us and loved the Crow called Jon Snow, has fallen in battle. Her arrows will fly no more, and the songs of her laughter are silenced by the Wall’s cold shadow. Some curse the Crows, others grieve in silence, but all feel the chill of her passing. Without Ygritte’s spirit to bind us, will the Free Folk stand together when the Long Night comes?"
GOT_Diplomatic_Country.56.a: "Mourn her and march on"

GOT_Diplomatic_Country.57.t: "The King‑Beyond‑the‑Wall Falls"
GOT_Diplomatic_Country.57.d: "The horn is silent and the fires are low; Mance Rayder, our King‑Beyond‑the‑Wall, is gone. Some say the Crows took his life at the stake, others whisper of an arrow of mercy loosed by one of their own. However it happened, the man who forged a hundred clans into one is ash upon the wind. With no crown but his courage, he led us south for our children’s sake. Now the Free Folk stand leaderless before the Wall’s shadow and the white walkers’ wrath. Who will speak for us in the long night that comes?"
GOT_Diplomatic_Country.57.a: "Keep the fires burning—together"
GOT_Diplomatic_Country.57.b: "Each clan must fend for itself"

GOT_Diplomatic_Country.58.t:0 "A Royal Betrothal Proposed"
GOT_Diplomatic_Country.58.d:0 "A raven has arrived from the capital. Tyrion Lannister, acting as Hand of the King, proposes a marriage between Princess Myrcella Baratheon and our heir, Prince Trystane. It is a calculated political gesture—one that could secure House Martell a place within the royal line and offer stability in these uncertain times. Though it comes from the lions of the west, the proposal carries weight. Should we accept, Myrcella would be sent to Sunspear and raised as one of our own, eventually ruling at Trystane’s side. Trust... or leverage? That is for us to decide."
GOT_Diplomatic_Country.58.a:0 "The offer is wise. Let the young ones be wed."
GOT_Diplomatic_Country.58.b:0 "We do not forget Elia. Let the lion keep his cub."

GOT_Diplomatic_Country.59.t:0 "Dorne Accepts Our Proposal"
GOT_Diplomatic_Country.59.d:0 "Word has returned from Sunspear—Prince Doran has agreed to the union between Princess Myrcella and Prince Trystane. The Martells have accepted our gesture of goodwill, and Myrcella will be sent to Dorne to be fostered among their court. This alliance strengthens our ties with the southern realm and brings a measure of stability to the realm. For now, at least, the lions and the suns share a common purpose."
GOT_Diplomatic_Country.59.a:0 "Excellent. Let the preparations begin."

GOT_Diplomatic_Country.60.t:0 "Dorne Refuses Our Proposal"
GOT_Diplomatic_Country.60.desc:0 "Our offer of a marriage alliance has been rejected. Prince Doran has declined the betrothal between Princess Myrcella and his son, Trystane. No reason was given, but the implications are clear—Dorne has not forgotten past grievances, nor are they ready to tie their fate to House Lannister. This is a setback to our efforts to secure the realm through diplomacy, and it leaves the Martells' intentions uncertain."
GOT_Diplomatic_Country.60.a:0 "Fools. They spurn peace."


GOT_Diplomatic_Country.61.t:0 "Princess Myrcella Arrives in Sunspear"
GOT_Diplomatic_Country.61.d:0 "Princess Myrcella Baratheon has arrived in Sunspear, accompanied by her escort from King’s Landing. She is to be fostered in our court and one day wed to Prince Trystane, sealing the alliance between House Martell and House Lannister. Though young, she carries herself with the poise of royalty. Her presence here is both a symbol of peace and a reminder of the risks that come with playing the game of thrones. We shall watch her closely—and treat her well."
GOT_Diplomatic_Country.61.a:0 "Let her be as Dornish as she is noble."

GOT_Diplomatic_Country.62.t:0 "Margaery Marries King Tommen"
GOT_Diplomatic_Country.62.d:0 "The bells have rung in King’s Landing—our beloved Margaery has wed King Tommen Baratheon. With the ceremony complete, House Tyrell stands united with the Iron Throne. This marriage is more than mere pageantry; it secures our position at the heart of power and brings the Reach closer than ever to the center of the realm’s governance. Margaery’s beauty and grace will no doubt charm the court, but it is her ambition and poise that may shape the future of the Seven Kingdoms."
GOT_Diplomatic_Country.62.a:0 "A Tyrell on the throne. As it should be."

GOT_Diplomatic_Country.63.t:0 "An Offer From Beyond the Wall"
GOT_Diplomatic_Country.63.d:0 "Jon Snow, Lord Commander of the Night’s Watch, extends an unexpected offer: an alliance between the Free Folk and the Watch, in exchange for safe passage south of the Wall. It is a choice that challenges centuries of enmity. Do we embrace this chance to survive and fight together, or do we turn away and face the coming storm alone?"
GOT_Diplomatic_Country.63.a:0 "Accept the alliance—open the gates to the south"
GOT_Diplomatic_Country.63.b:0 "Decline—maintain our independence beyond the Wall"

GOT_Diplomatic_Country.64.t:0 "The Wildlings Accept the Pact"
GOT_Diplomatic_Country.64.d:0 "Against all odds, the Free Folk have agreed to join forces with the Night’s Watch. The gates of the Wall will be opened, and old enmities set aside in the face of the greater threat beyond. This alliance breathes new hope into the Watch, though trust will take time to build."
GOT_Diplomatic_Country.64.a:0 "Together, we stand stronger."

GOT_Diplomatic_Country.65.t:0 "The Wildlings Reject the Offer"
GOT_Diplomatic_Country.65.d:0 "The Free Folk have chosen to remain beyond the Wall, refusing the Night’s Watch’s offer of alliance. Their pride and desire for independence outweigh the warnings of the coming darkness. The Watch must prepare to face the looming threat without their aid."
GOT_Diplomatic_Country.65.a:0 "The Watch stands alone, for now."

GOT_Diplomatic_Country.66.t:0 "Gates Remain Closed"
GOT_Diplomatic_Country.66.d:0 "[NWA.GetLeader], Lord Commander of the Night’s Watch, has refused to grant us passage south of the Wall. Despite the growing threat from the dead beyond, the ancient grudges and fears persist. We remain trapped behind the Wall, facing the coming storm alone."
GOT_Diplomatic_Country.66.a:0 "Renew the offensive against the Night's Watch"
GOT_Diplomatic_Country.66.b:0 "Look for another solution"


GOT_Diplomatic_Country.67.t:0 "The South Comes North"
GOT_Diplomatic_Country.67.d:0 "We gathered beneath Mance Rayder to break the Wall and flee the dead. But fire and steel came from the south. Stannis Baratheon struck our host like a hammer, scattering clans and breaking giants. Our dream lies in ruin. Some call for surrender, others for vengeance. The free folk are not easily ruled, and if we resist now, we may fight not just the crows—but ourselves."
GOT_Diplomatic_Country.67.a:0 "Surrender to the southern king"
GOT_Diplomatic_Country.67.b:0 "Fight on—no king rules the free folk!"

GOT_Diplomatic_Country.68.t:0 "Host Shattered at the Red Wedding"
GOT_Diplomatic_Country.68.d:0 "Treachery most vile has been committed beneath a guest’s roof. While gathered to honor a sacred pact of marriage and alliance, our lords and soldiers were butchered in cold blood by the Freys and their Lannister allies.\n\nHalf of our host lies dead. The rest are scattered or captured. The strength we had bled to raise over years of toil and heartbreak has been undone in a single night of steel and betrayal.\n\nThe heart of the Riverlands is broken. House Tully reels, leaderless and besieged, and many of our bannermen now face a grim choice: bend the knee to the Iron Throne or continue the fight alone.\n\nThe Red Wedding will be remembered — not just for the blood spilled, but for the honor lost. But this is not the end. Not yet."
GOT_Diplomatic_Country.68.a:0 "We will not forget."


 # 517 — The Trial of Fire
GOT_Diplomatic_Country.69.t: "The Stallion's Choice"
GOT_Diplomatic_Country.69.d: "The foreign khaleesi was brought before the gathered khals to answer for her defiance. Yet as the temple doors closed, whispers spread through Vaes Dothrak. Some say the fire itself has chosen her. Others call her a witch who must die. Before the sacred flames are lit, the khalasar must decide where its loyalty lies."
GOT_Diplomatic_Country.69.a: "The fire has spoken—follow Daenerys Stormborn."
GOT_Diplomatic_Country.69.b: "Stand with the khals and reject the foreign queen."

 # 70 — The Dragon Returns
GOT_Diplomatic_Country.70.t: "The Dragon Returns"
GOT_Diplomatic_Country.70.d: "After years in exile across the Narrow Sea, Daenerys Targaryen has returned to the ancestral seat of House Targaryen. Her fleet now lies anchored beneath the walls of Dragonstone, and envoys demand the castle be yielded to its rightful heir. The garrison must now decide whether to welcome the Dragon Queen home or defy her claim."
GOT_Diplomatic_Country.70.a: "Dragonstone belongs to House Targaryen."
GOT_Diplomatic_Country.70.b: "Hold the castle."

GOT_Diplomatic_Country.71.t: "The Faith Militant Crushed"
GOT_Diplomatic_Country.71.d: "The assault succeeds. The Faith Militant is scattered, its leadership captured or slain, and the High Sparrow's movement collapses beneath the weight of steel. Though blood stains the streets of King's Landing, the Iron Throne has reasserted its authority. For the first time in months, the Crown alone rules the capital."
GOT_Diplomatic_Country.71.a: "The Crown stands supreme."

GOT_Diplomatic_Country.72.t: "King's Landing in Revolt"
GOT_Diplomatic_Country.72.d: "The assault on the Great Sept has ended in disaster. The Faith Militant repelled the Crown's forces, and the High Sparrow has called upon the faithful to rise in defense of the Seven. Across King's Landing, bells toll as armed zealots clash with loyal soldiers. The capital has descended into civil war, and the Iron Throne now faces an enemy within its own walls."
GOT_Diplomatic_Country.72.a: "The Crown must restore order."

GOT_Diplomatic_Country.73.t: "The Assault on the Sept Fails"
GOT_Diplomatic_Country.73.d: "The Crown's forces advanced upon the Great Sept of Baelor, expecting a swift victory over the Faith Militant. Instead, the streets of King's Landing erupted into chaos as angry crowds of faithful citizens joined the Sparrow ranks, overwhelming the Lannister and Tyrell soldiers. Forced to abandon the assault, the royal host has retreated behind the walls of the Red Keep. The Crown still holds the capital, but its authority has suffered a devastating blow."
GOT_Diplomatic_Country.73.a: "The Red Keep must endure."

GOT_Diplomatic_Country.74.t: "The Great Sept Destroyed"
GOT_Diplomatic_Country.74.d: "The caches of wildfire hidden beneath the Great Sept of Baelor have been ignited. In an instant, the holiest place in the Seven Kingdoms was consumed by emerald flames, taking the High Sparrow, the Faith Militant, and countless nobles and smallfolk with it. The immediate threat to the Iron Throne has been extinguished, but at a terrible cost. King's Landing stands in shock, and the realm will long remember the day the Crown reduced its own sacred heart to ashes."
GOT_Diplomatic_Country.74.a: "The throne has been secured... whatever the cost."

GOT_Diplomatic_Country.75.t: "The Wildfire Plot Exposed"
GOT_Diplomatic_Country.75.d: "The conspiracy to destroy the Great Sept has failed. Before the wildfire could be ignited, word of the plot spread through King's Landing, provoking outrage among the faithful. Thousands have flocked to the banners of the High Sparrow, while loyalists rally behind the Iron Throne. Barricades rise across the streets, and fighting has broken out throughout the capital. What began as a desperate attempt to end the crisis has instead plunged the Crownlands into open civil war."
GOT_Diplomatic_Country.75.a: "The realm tears itself apart."

GOT_Diplomatic_News.36.t: "The Faith Militant Defeated"
GOT_Diplomatic_News.36.d: "The combined forces of Houses Lannister and Tyrell have crushed the Faith Militant in King's Landing. The High Sparrow's movement has been broken, its followers dispersed, and the authority of the Iron Throne restored after fierce fighting in the capital."
GOT_Diplomatic_News.36.a: "The Seven no longer guide the Crown."

GOT_Diplomatic_News.37.t: "Civil War Erupts in King's Landing"
GOT_Diplomatic_News.37.d: "The Crown's attempt to crush the Faith Militant has failed. Fighting now rages through the streets of King's Landing as the High Sparrow's followers battle soldiers loyal to the Iron Throne. With the capital consumed by civil war, the fate of the Seven Kingdoms hangs in the balance."
GOT_Diplomatic_News.37.a: "The realm tears itself apart."

GOT_Diplomatic_News.38.t: "Faithful Overwhelm the Crown's Host"
GOT_Diplomatic_News.38.d: "The Iron Throne's attempt to crush the Faith Militant has ended in failure. As Lannister and Tyrell forces moved against the Great Sept of Baelor, thousands of angry citizens flooded the streets in support of the Faithful, turning the assault into a bloody defeat. The royal host has withdrawn to the Red Keep, leaving King's Landing divided and the realm uncertain of what will follow."
GOT_Diplomatic_News.38.a: "The Seven have answered with steel."

GOT_Diplomatic_News.39.t: "Civil War Erupts in the Crownlands"
GOT_Diplomatic_News.39.d: "The attempted destruction of the Great Sept of Baelor has plunged the Crownlands into chaos. As news of the conspiracy spread, thousands of faithful took up arms alongside the Faith Militant, while royal loyalists rallied to defend the Iron Throne. Fighting now rages through King's Landing and the surrounding Crownlands as the realm watches in horror, uncertain who will emerge victorious."
GOT_Diplomatic_News.39.a: "The Crown and the Faith are at war."

GOT_Diplomatic_News.34.t:0 "Wildlings Reject Alliance Offer"
GOT_Diplomatic_News.34.d:0 "Despite [NWA.GetLeader]’s earnest efforts to forge an alliance with the Free Folk, the Wildlings have turned down the offer, choosing to remain beyond the Wall. This rejection deepens the divide between the realms of men and the Free Folk, even as the threat of the White Walkers looms ever closer."
GOT_Diplomatic_News.34.a:0 "A chance lost, but the war is not over."

GOT_Diplomatic_News.35.t:0 "The Gates Remain Closed"
GOT_Diplomatic_News.35.d:0 "In a controversial decision, [NWA.GetLeader], Lord Commander of the Night’s Watch, has refused to grant the Free Folk passage south of the Wall. This choice maintains the ancient barriers between the realms of men and the Wildlings, even as the shadow of the White Walkers grows ever darker."
GOT_Diplomatic_News.35.a:0 "The Wall still stands—divided, but standing."

 # 76 — Tommen's Choice
GOT_Diplomatic_Country.76.t: "Tommen's Choice"
GOT_Diplomatic_Country.76.d: "The destruction of the Great Sept of Baelor shattered what remained of House Baratheon's rule. Consumed by grief after witnessing the deaths of Queen Margaery, the High Sparrow, and countless innocents, King Tommen climbed to his chambers and cast himself from the Red Keep. His brief reign ended in silence, leaving the Iron Throne vacant. With no heir remaining and the realm in chaos, Queen Cersei Lannister now claims the Iron Throne."
GOT_Diplomatic_Country.76.a: "Long live Queen Cersei."

GOT_Diplomatic_News.40.t: "King Tommen Is Dead"
GOT_Diplomatic_News.40.d: "King's Landing has suffered another devastating blow. In the wake of the Great Sept's destruction, King Tommen Baratheon threw himself from a window of the Red Keep, unable to bear the loss of his queen and the horror engulfing his realm. With House Baratheon's royal line extinguished, Cersei Lannister has ascended the Iron Throne, ushering in a new and uncertain chapter for the Seven Kingdoms."
GOT_Diplomatic_News.40.a: "The lioness now wears the crown."

GOT_Diplomatic_Country.77.t: "The Future of the Reach"
GOT_Diplomatic_Country.77.d: "The destruction of the Great Sept of Baelor has left House Tyrell shattered. Lord Mace Tyrell, Queen Margaery, and Ser Loras Tyrell are dead, leaving no clear ruler to lead the Reach through its darkest hour. As grief gives way to uncertainty, the great houses look for new leadership. Some rally behind Lady Olenna Tyrell, the last surviving member of the main Tyrell line, whose wisdom and resolve have long guided Highgarden from the shadows. Others believe the Reach now requires a soldier rather than a statesman, turning instead to Lord Randyll Tarly, the realm's finest battlefield commander and the most powerful lord left standing."
GOT_Diplomatic_Country.77.a: "Lady Olenna shall lead the Reach."
GOT_Diplomatic_Country.77.b: "Lord Randyll Tarly shall lead the Reach."

GOT_Diplomatic_Country.78.t: "The Dragon Queen Returns"
GOT_Diplomatic_Country.78.d: "Daenerys Targaryen has crossed the Narrow Sea and claimed Dragonstone, the ancient seat of House Targaryen. Declaring herself the rightful Queen of the Andals, the Rhoynar, and the First Men, she has called upon the lords of Westeros to abandon Queen Cersei and restore the dragon to the Iron Throne. War has come once more to the Seven Kingdoms, and neutrality will not endure for long. We must decide where our loyalties lie."
GOT_Diplomatic_Country.78.a: "We shall stand with Daenerys Targaryen."
GOT_Diplomatic_Country.78.b: "We shall stand with the Iron Throne."
GOT_Diplomatic_Country.78.c: "We shall remain neutral."

GOT_Diplomatic_Country.79.t: "The Future of the Westerlands"
GOT_Diplomatic_Country.79.d: "The destruction of the Great Sept of Baelor claimed the life of Lord Kevan Lannister, who had faithfully governed Casterly Rock following the death of Lord Tywin. With the Rock once more without a clear lord, the lords of the Westerlands find themselves divided over the future of House Lannister. Some argue that Ser Jaime Lannister, despite his vows and years in the Kingsguard, remains Tywin's rightful heir and should reclaim his ancestral seat. Others instead look to Queen Cersei Lannister, whose authority and determination have restored Lannister power in King's Landing. A third faction contends that the Rock should not pass to either sibling, but instead remain under the direct authority of the Iron Throne, its governance entrusted to the Crown until a permanent settlement can be reached."
GOT_Diplomatic_Country.79.a: "Ser Jaime Lannister shall rule Casterly Rock."
GOT_Diplomatic_Country.79.b: "Queen Cersei Lannister shall rule Casterly Rock."
GOT_Diplomatic_Country.79.c: "Casterly Rock shall remain under the Crown."

 GOT_Diplomatic_Country.80.t: "A Call to Save the North"
 GOT_Diplomatic_Country.80.d: "Jon Snow has called upon us to join his campaign against House Bolton. Having stepped forward to lead the northern cause, he marches to reclaim his ancestral home at Winterfell and free the North from Bolton tyranny. Though Ramsay Bolton commands a formidable host behind high walls, Jon Snow believes that with the support of the realm, the usurpers can be overthrown and justice restored to the North. Whether motivated by ancient oaths to House Stark or the desire to break Bolton rule, the choice now rests with us."
 GOT_Diplomatic_Country.80.a: "Join Jon Snow and save the North."
 GOT_Diplomatic_Country.80.b: "We cannot spare our strength."

GOT_Diplomatic_Country.81.t: "The King's Offer"
GOT_Diplomatic_Country.81.d: "King Stannis Baratheon has summoned Jon Snow before him with an extraordinary proposal. Should Jon abandon his vows, Stannis will legitimize him as Jon Stark, restore him as Lord of Winterfell, and proclaim him Warden of the North. In return, Jon must rally the northern houses beneath the direwolf banner and march alongside the king to overthrow House Bolton. The offer promises the restoration of House Stark and the liberation of the North, yet it demands that Jon forsake the oath he swore before the old gods and the new."
GOT_Diplomatic_Country.81.a: "Accept the king's offer and reclaim the North."
GOT_Diplomatic_Country.81.b: "My vows come before all else."

 # 82 — Jon Accepts
GOT_Diplomatic_Country.82.t: "Jon Snow Accepts"
GOT_Diplomatic_Country.82.d: "Jon Snow has accepted our offer. Casting aside the black cloak of the Night's Watch, he has agreed to be legitimized as Jon Stark, rightful Lord of Winterfell and Warden of the North. Already, ravens have flown to the great houses, calling upon them to rally once more beneath the direwolf banner. With a Stark at our side, the campaign against House Bolton has gained a powerful symbol capable of uniting the North behind our cause."
GOT_Diplomatic_Country.82.a: "Together, we shall reclaim Winterfell."

 # 83 — Jon Declines
GOT_Diplomatic_Country.83.t: "Jon Snow Declines"
GOT_Diplomatic_Country.83.d: "Despite the promise of Winterfell and the restoration of House Stark, Jon Snow has refused our offer. Choosing to honor the vows he swore to the Night's Watch, he will not abandon his brothers nor involve the order in the wars of the realm. Without the support of a Stark, the task of rallying the North against House Bolton will be all the more difficult."
GOT_Diplomatic_Country.83.a: "Then we shall march without him."

 # 745 — The Great Northern Civil War
GOT_Diplomatic_Country.84.t: "The Great Northern Civil War"
GOT_Diplomatic_Country.84.d: "King Stannis Baratheon has begun his long-awaited march upon Winterfell. At his side rides Jon Stark, formerly Jon Snow, who has accepted the king's offer of legitimization and now leads the northern loyalists beneath the direwolf banner. Together they seek to overthrow House Bolton, restore Stark rule to Winterfell, and secure the North for the rightful king. Ramsay Bolton has rallied his own supporters in preparation for the coming struggle. Once more, the North descends into civil war, and its fate shall be decided upon the battlefield."
GOT_Diplomatic_Country.84.a: "The Night's Watch plays no role."
GOT_Diplomatic_Country.84.b: "We will lead the northern campaign."

GOT_Diplomatic_Country.85.t: "A Call to Save the North"
GOT_Diplomatic_Country.85.d: "King Stannis Baratheon has called upon us to join his campaign against House Bolton. At his side marches Jon Snow, now leading the northern cause alongside the king in a bid to restore House Stark to Winterfell and free the North from Bolton rule. Though Ramsay Bolton commands a formidable host, Stannis believes that with the support of the realm, the usurpers can be overthrown. Whether motivated by loyalty to House Stark, recognition of Stannis' claim to the Iron Throne, or the desire to see justice restored to the North, the choice now rests with us."
GOT_Diplomatic_Country.85.a: "Join Stannis and the North."
GOT_Diplomatic_Country.85.b: "We cannot spare our strength."


GOT_Diplomatic_Country.86.t: "The Wolf Bends the Knee"
GOT_Diplomatic_Country.86.d: "News has reached the realm that Jon Snow, King in the North, has journeyed south and pledged his support to Daenerys Targaryen. After years of war and suffering, the North has chosen to seek alliance with the last surviving Targaryen claimant rather than stand alone. With the armies of the North now aligned with the Dragon Queen, the balance of power in Westeros has shifted. The great houses must decide whether to follow the direwolf beneath the banner of the dragon, or remain apart from the coming war."
GOT_Diplomatic_Country.86.a: "Stand with the Dragon and the Wolf."
GOT_Diplomatic_Country.86.b: "We shall remain neutral."

GOT_Diplomatic_Country.87.t: "The Wolf Returns to the Lion"
GOT_Diplomatic_Country.87.d: "Word has spread across the realm that Jon Snow, King in the North, has chosen to abandon the path of independence and recognize Queen Cersei Lannister as the rightful ruler of the Seven Kingdoms. In exchange for the North's loyalty, Jon has sought peace with the Iron Throne and an end to the wars that have devastated the realm. To some, this is a necessary compromise that will bring stability after years of bloodshed. To others, it is a betrayal of the fallen Starks who fought and died for northern freedom. The great houses must now decide whether to follow the direwolf beneath the banner of the lion, or remain apart from the conflict."
GOT_Diplomatic_Country.87.a: "Stand with the Iron Throne."
GOT_Diplomatic_Country.87.b: "We shall remain neutral."

GOT_Diplomatic_Country.88.t: "The Fury Extinguished"
GOT_Diplomatic_Country.88.d: "Dark wings bring ruinous news from the frozen North. The King Who Cared is dead outside Winterfell, his army shattered by Bolton heavy horse. Lady Selyse has hanged herself, young Shireen was sacrificed to the cold flames, and the Red Priestess has fled into the night. The true line of House Baratheon lies buried in the snow. With Stannis fallen, the castles and marches of the Stormlands stand leaderless, surrounded by hostile armies with no heir left to carry our banner."
GOT_Diplomatic_Country.88.a: "Send word to the capital. We bend the knee."
GOT_Diplomatic_Country.88.b: "Ours is still the Fury! We fight to the end!"

GOT_Diplomatic_Country.89.t: "The Fury Extinguished"
GOT_Diplomatic_Country.89.d: "Dark wings bring ruinous news from the frozen North. The King Who Cared is dead outside Winterfell, his army shattered by Bolton heavy horse. Lady Selyse has hanged herself, young Shireen was sacrificed to the cold flames, and the Red Priestess has fled into the night. The true line of House Baratheon lies buried in the snow. With Stannis fallen, the castles and marches of the Stormlands stand leaderless, surrounded by hostile armies with no heir left to carry our banner."
GOT_Diplomatic_Country.89.a: "Send word to the capital. We bend the knee."
GOT_Diplomatic_Country.89.b: "Ours is still the Fury! We fight to the end!"

GOT_Diplomatic_Country.90.t: "The White Wolf Awakens"
GOT_Diplomatic_Country.90.d: "Shadows cling to Castle Black, but the impossible has come to pass. Jon Snow—stabbed through the heart by his own sworn brothers—breathes once more. The wildlings revere him as a god, while Northern loyalists see the true blood of Ned Stark restored. His Night's Watch vow was sworn 'until death,' and by death, his watch has ended. With Ramsay Bolton looming over Winterfell and the North fractured, the Northern lords gather in hushed council. Shall we crown the resurrected bastard as King in the North, or does the sacred law of inheritance forbid a dead man from claiming the direwolf crown?"
GOT_Diplomatic_Country.90.a: "He died for us, and he lives for us! Hail the King in the North!"
GOT_Diplomatic_Country.90.b: "A resurrected bastard holds no claim. We must look elsewhere for leadership."

 GOT_Diplomatic_Country.91.t:0 "Savage Allies in the Snow"
 GOT_Diplomatic_Country.91.d:0 "For thousands of years, the Wildlings were our sworn enemies—raiders who pillaged our villages, stole our women, and bled our lands. Yet today, as snows cover the kingsroad and Ramsay Bolton's terrors reign from Winterfell, the unthinkable has come to pass.\n\nBound by honor to the resurrected Jon Snow, Tormund Giantsbane and the chieftains of Beyond the Wall have brought their entire host to our camp. Furs, bronze, bone, and giantkind now stand shoulder-to-shoulder with our battered Northern levies. Many of our lords grumble and clutch their swords, unable to forget old blood feuds. But against the Bolton bastards and the treasonous Karstarks, we need every sword, axe, and spear we can muster. The wildlings do not kneel, but today, they march for the North."
 GOT_Diplomatic_Country.91.a:0 "Let the Boltons feel the fury of the Free Folk!"
 
 GOT_Diplomatic_Country.92.t:0 "A Divided Host"
 GOT_Diplomatic_Country.92.d:0 "Centuries of hatred do not vanish overnight. While Tormund and several chieftains remain fiercely loyal to Jon Snow, many of the Free Folk clans refuse to march south to die in a southron lord's war. They remember the centuries of Northern steel, and fear being used as meat for Ramsay Bolton's butcher block.\n\nAfter tense negotiations in the freezing winds, a compromise has been struck. Half of the wildling host—the most battle-hardened spearwives and warriors—have taken up arms alongside our Northern levies. The remainder will stay north to guard their women, children, and camps. It is not the overwhelming army we had hoped for, but thousands of free spears are still enough to bleed the Boltons."
 GOT_Diplomatic_Country.92.a:0 "Half a wildling host is better than none."
 
 GOT_Diplomatic_Country.93.t:0 "An Alliance of Equals"
 GOT_Diplomatic_Country.93.d:0 "The Free Folk do not kneel. Though Tormund and the clan leaders acknowledge the debt owed to Jon Snow, they flatly refuse to place their men under the command of Northern lords. Centuries of mistrust run too deep, and no wildling warrior will take orders from men whose grandfathers hunted them like beasts.\n\nInstead, the chieftains have agreed to fight alongside us as an independent host. They will bleed Ramsay Bolton’s men on their own terms, marching in parallel and striking from the flanks under their own warhorns. Our lords scoff at their lack of discipline, but in the brutal snows ahead, having an untamed, self-governed army tearing through Bolton lines may prove far more lethal than forcing them into our ranks."
 GOT_Diplomatic_Country.93.a:0 "They march with us, not under us. So be it."
 
 GOT_Diplomatic_Country.94.t:0 "Shattered Gates: The Freefolk Arrive!"
 GOT_Diplomatic_Country.94.d:0 "Daggers flash in the courtyard as the traitorous black brothers press their attack, shouting 'For the Watch!' as they seek to cut down our Lord Commander. Overwhelmed and backed against the cold stone walls, our defeat seemed certain—until the outer gates splintered under the force of a battering ram.\n\nWith war cries that echo across the Wall, Tormund Giantbane and a horde of fierce freefolk warriors charge into Castle Black. Fur-clad warriors and giant-slayers fall upon the mutineers with terrifying fury, turning the tide of the massacre in an instant. The wildlings have joined the fight—and today, the crows will not die alone."
 GOT_Diplomatic_Country.94.a:0 "With us, Freefolk! Drive the traitors back!"
 
 GOT_Diplomatic_Country.95.t:0 "Silence from the Freefolk"
 GOT_Diplomatic_Country.95.d:0 "The courtyard is a bloodbath. Surrounded and bleeding, our loyal brothers cast desperate glances toward the wildling encampment outside the gates, praying for Tormund's horn to sound. But no horn blows. No battle cry rings out through the cold air.\n\nWhether out of ancient mistrust for the Night's Watch or a unwillingness to spill blood for crow politics, the freefolk have chosen to stand by and watch us bleed. Cut off and completely isolated, we must rely solely on our own steel if we are to survive this night."
 GOT_Diplomatic_Country.95.a:0 "Then we fight and die as crows!"
 
 GOT_Diplomatic_Country.96.t:0 "The Mockingbird Slain: Lord Arryn Takes Command"
 GOT_Diplomatic_Country.96.d:0 "Word has arrived from the Great Hall of Winterfell of a swift and startling trial. Lord Petyr Baelish, who long governed the Eyrie as Lord Protector, was confronted by Lady Sansa and Lord Bran with a litany of past treasons—including the murder of Lysa Arryn. Caught in his own web of deceit, the Mockingbird was executed on the spot by Arya Stark. With Baelish eliminated, the shadowy influence over the Eyrie has vanished. In the aftermath, young Lord Robin Arryn has officially asserted his birthright, stepping forward to rule the Vale in his own name. The Knights of the Vale now answer solely to House Arryn once more."
 GOT_Diplomatic_Country.96.a:0 "Honor our alliance with the North."
 
 GOT_Diplomatic_Country.97.t:0 "The Dragon Queen Attacked"
 GOT_Diplomatic_Country.97.d:0 "Shockwaves reverberate from the charred ruin of the Red Keep following a desperate, bloody act of betrayal. In the shadow of the scorched throne, Jon Snow turned his blade against Queen Daenerys Targaryen in an attempt to halt her promised conquest. Yet as word of the attempt spreads to the foreign courts and noble halls across the realm, every major power is forced to make a defining choice. To back Jon Snow is to stand with the North and risk the wrath of her remaining armies; to condemn him is to uphold Targaryen rule and the terrifying promise of her global crusade. Our lords gather in emergency council to declare where our allegiance lies."
 GOT_Diplomatic_Country.97.a:0 "Side with Jon Snow"
 GOT_Diplomatic_Country.97.b:0 "Side with Daenerys"
 
 GOT_Diplomatic_Country.98.t:0 "Bending the Knee to King Bran"
 GOT_Diplomatic_Country.98.d:0 "Ravens carrying the seal of the Small Council have arrived from King's Landing, bearing the decree of the Great Council. Following the fall of the Targaryen dynasty and the destruction of the Iron Throne, Brandon Stark of House Stark has been formally elected King of the Six Kingdoms. The throne room is being prepared to receive oaths of fealty from every lord paramount, noble house, and regional ruler across Westeros. We are summoned to reaffirm our allegiance to the crown, accepting the new elective order in exchange for royal protection, or to refuse the summons and assert our own sovereign independence in an unmapped era."
 GOT_Diplomatic_Country.98.a:0 "Bend the knee."
 GOT_Diplomatic_Country.98.b:0 "Refuse the summons!"
 
 GOT_Diplomatic_Country.99.t:0 "Northern Sovereignty"
 GOT_Diplomatic_Country.99.d:0 "For thousands of years, the North stood as a free and sovereign kingdom until Torrhen Stark knelt before the dragons. Now, with the Dragon Queen dead and the Great Houses vying for the future of Westeros, the Northern lords gathered in the Great Hall of Winterfell demand a final accounting. The blood spilled at the Red Wedding, the Long Night, and the slaughter in the south was paid by Northern lives, and Lady Sansa Stark stands at a historic crossroads. She can honor the centuries-old dream of her ancestors and crown herself Queen in the North; she can accept her brother Bran as King of the Six Kingdoms and anchor the realm in unified Stark brotherhood; or she can align the North directly behind Jon Snow, rallying her bannermen to defend the White Wolf against his enemies in King's Landing."
 GOT_Diplomatic_Country.99.a:0 "Crown Sansa Queen in the North!"
 GOT_Diplomatic_Country.99.b:0 "Stand united under King Bran."
 GOT_Diplomatic_Country.99.c:0 "Rally behind Jon Snow! The North stands with the White Wolf."
 
 GOT_Diplomatic_Country.100.t:0 "Bending the Knee to King Bran"
 GOT_Diplomatic_Country.100.d:0 "Ravens carrying the seal of the Small Council have arrived from King's Landing, bearing the decree of the Great Council. Following the fall of the Targaryen dynasty and the destruction of the Iron Throne, Brandon Stark of House Stark has been formally elected King of the Six Kingdoms. The throne room is being prepared to receive oaths of fealty from every lord paramount, noble house, and regional ruler across Westeros. We are summoned to reaffirm our allegiance to the crown, accepting the new elective order in exchange for royal protection. Yet rumor whispers that Jon Snow still claims the true succession, while others preach total isolation. We must decide the future of our realm: bow to the Council's elected king, champion the White Wolf's claim, or stand alone as a sovereign land."
 GOT_Diplomatic_Country.100.a:0 "Bend the knee to King Bran."
 GOT_Diplomatic_Country.100.b:0 "Champion Jon Snow!"
 GOT_Diplomatic_Country.100.c:0 "Remain Neutral."
 
 GOT_Diplomatic_Country.101.t:0 "Reaving the Lion's Pride"
 GOT_Diplomatic_Country.101.d:0 "The greenlanders of Casterly Rock bleed, and the Drowned God demands we take what is ours. The Lion’s lands are rich with gold, iron, and soft thralls begging for the Iron Price. Yet as our longships gear for war, a question divides the captains at Pyke.\n\nThe Young Wolf in the North marches south with his hosts, seeking to burn the West to the ground. Some captains argue we should cast our lot alongside the Northmen, coordinating our naval might with their land hosts to shatter the Lannisters together. Others sneer at the thought of answering to a greenland boy-king—claiming the Ironborn kneel to no man, taking our plunder as an independent force and letting the wolves and lions tear each other apart."

 # Option A: Formal Faction Join (The "Italy / Axis" Approach)
 GOT_Diplomatic_Country.101.a:0 "Fly our banners alongside the Wolf. We march together!"
 GOT_Diplomatic_Country.101.a.tt:0 "We will formally join §YThe Northern Alliance§! as a faction member. We will coordinate directly with the Starks against Casterly Rock."

 # Option B: Independent Co-belligerent (The "Finland" Approach)
 GOT_Diplomatic_Country.101.b:0 "We take the Iron Price alone! We kneel to no Wolf!"
 GOT_Diplomatic_Country.101.b.tt:0 "We declare an independent war against §YThe Lannister Faction§!. We will operate as a co-belligerent without joining the Northern alliance or taking orders from Winterfell."
 
 GOT_Diplomatic_Country.102.t:0 "Reaving the Wolf's Realm"
 GOT_Diplomatic_Country.102.d:0 "The North is exposed. With Robb Stark's hosts marched south into the Riverlands, the pine-clad shores, rich shorelines, and ancient strongholds of the Northmen lie undefended, ripe for the taking. The Old Way demands we strike where the enemy is weak and take by force what is denied us by law.\n\nYet as our captains sharpen their axes at Pyke, a political divide splits the council. Ravens have arrived from the Iron Throne, offering titles, recognition, and gold if we formally join Tywin Lannister's coalition to crush the northern rebels. But many reavers spit at the mention of Casterly Rock—demanding we bleed the wolf alone, flying no greenland flags, taking our plunder as an independent power, and bowing to neither Lion nor Wolf."

 # Option A: Formal Faction Join (Lannister Alignment)
 GOT_Diplomatic_Country.102.a:0 "Treat with Casterly Rock. The Lion's gold fuels our ships!"
 GOT_Diplomatic_Country.102.a.tt:0 "We will formally join §YThe Iron Throne Alliance§! as a faction member. We will coordinate directly with the Lannisters to carve up the North."

 # Option B: Independent Co-belligerent (Historical Reaving)
 GOT_Diplomatic_Country.102.b:0 "We take the North by the Iron Price! We take no orders from Kings Landing!"
 GOT_Diplomatic_Country.102.b.tt:0 "We declare an independent war against §YThe Stark Faction§!. We will operate as a co-belligerent, seizing Northern land without entering a treaty with Casterly Rock."

GOT_Diplomatic_Country.113.t:0 "A Request from [VOL.GetName]"
GOT_Diplomatic_Country.113.d:0 "A diplomatic envoy arrives from the Triarchs of [VOL.GetName]. With firm courtesy and acknowledgment of past hospitality, they note that [GOL.GetNameDef] have now secured holdings of their own, and respectfully demand the return of their encampment lands. They emphasize that [VOL.GetAdjective] hospitality was a privilege, not a permanent gift, and now that the exiles are no longer destitute wanderers, the territory must be returned to the Old Blood."
GOT_Diplomatic_Country.113.a:0 "They sheltered us in our time of need. We shall withdraw peacefully."
GOT_Diplomatic_Country.113.b:0 "This camp is ours now. Tell them to come and take it."
GOT_Diplomatic_Country.113.c:0 "An insult! We will strike first and teach them their place."

GOT_Diplomatic_Country.114.t:0 "[GOL.GetName] Encampment Reclaimed"
GOT_Diplomatic_Country.114.d:0 "Word has arrived that [GOL.GetNameDef] have departed our lands in good faith. With their own territory secured, they have relinquished their former camp without dispute. The land has now returned to [VOL.GetAdjective] administration. Though simple in nature, this gesture marks a symbolic end to the era of their dependency — and a quiet relief for our court."
GOT_Diplomatic_Country.114.a:0 "Let the land be restored to [VOL.GetAdjective] use."

GOT_Diplomatic_Country.115.t:0 "[GOL.GetName] Refuses to Vacate the Encampment"
GOT_Diplomatic_Country.115.d:0 "Our demand was met not with compliance, but with defiance. [GOL.GetNameDef] have refused to leave our lands, insisting on remaining despite their newfound holdings. This blatant disregard for [VOL.GetAdjective] sovereignty is an insult to the First Daughter of Valyria. Some urge immediate action, while others counsel patience — for now."
GOT_Diplomatic_Country.115.a:0 "They leave us no choice. We’ll take it by force."
GOT_Diplomatic_Country.115.b:0 "We’ll let it slide — for now."

 #The Previous Event Spawns this one for all the other countries
GOT_Diplomatic_News.2.t: "Stark Refuses the King's Request"
GOT_Diplomatic_News.2.d: "Lord Eddard Stark has refused King Robert Baratheon's request to serve as Hand of the King, a surprising turn that will affect the political dynamics in King's Landing and beyond."
GOT_Diplomatic_News.2.a: "King Robert's request for a Hand has been denied."

 #Dothraki Reject Targaryen Proposal World's Perspective
GOT_Diplomatic_News.3.t: "Dothraki Spurn Targaryen Offer"
GOT_Diplomatic_News.3.d: "Word spreads across Essos and Westeros that Khal Drogo has rejected Viserys Targaryen’s offer of marriage to his sister Daenerys. The refusal is a major blow to Viserys’ hopes of raising a Dothraki army to reclaim the Iron Throne. Without the strength of the horselords at his back, the exiled prince’s ambitions may falter before they ever take root."
GOT_Diplomatic_News.3.a: "The Dragon’s cause grows colder"

GOT_Diplomatic_News.4.t: "Lions March to War"
GOT_Diplomatic_News.4.d: "The fragile peace of the Seven Kingdoms has been shattered. Following the capture of Tyrion Lannister by Catelyn Stark, Lord Tywin Lannister has raised his banners and declared war on the Riverlands, where Catelyn's host sought refuge. The Westerlands see this act as a grave insult and a threat to the power of House Lannister. Armies are already on the move, and the realm braces for what may become a bloody conflict between two of its great houses."
GOT_Diplomatic_News.4.a: "War comes to Westeros once more."

GOT_Diplomatic_News.6.t: "The Dragon Mocked"
GOT_Diplomatic_News.6.d: "In a display as tragic as it was pathetic, Viserys Targaryen confronted Khal Drogo with fire in his eyes and wine on his breath. Demanding his crown, he earned only scorn. Yet the khal showed mercy — or perhaps indifference. Stripped of dignity but spared his life, the so-called dragon now slinks among the Dothraki, a broken prince without a throne, mocked even by slaves."
GOT_Diplomatic_News.6.a: "The dragon mewls, but does not roar."

GOT_Diplomatic_News.7.t:0 "The Great Khal Rises Again"
GOT_Diplomatic_News.7.d:0 "Against all odds, Khal Drogo has survived his near-fatal wounds. Whispers of dark magic swirl among the traders of Essos, with some claiming the blood of the witch saved him. Others speak of a will so strong, even death could not claim him. Whatever the truth, the horse-lords of the Great Grass Sea once more rally behind their unbroken leader. The world watches as the mighty Khalasar rides again."
GOT_Diplomatic_News.7.a:0 "The Stallion Who Mounts the World endures."

GOT_Diplomatic_News.8.t:0 "The Great Khal Falls"
GOT_Diplomatic_News.8.d:0 "Khal Drogo, once the fiercest rider of the Dothraki and a terror across the grasslands of Essos, has succumbed to his wounds. His death casts a long shadow over the future of the Dothraki, as rival bloodriders eye his khalasar with ambition. Rumors spread of turmoil and fractured loyalties, and the silver-haired foreign queen said to ride beside him has vanished from the public eye. A new era of uncertainty begins for the horse-lords."
GOT_Diplomatic_News.8.a:0 "The Grass Sea runs red with blood."

GOT_Diplomatic_News.9.t: "[FROM.GetName] Bends the Knee"
GOT_Diplomatic_News.9.d: "In a move that will surely echo throughout the Seven Kingdoms, [FROM.GetLeader] has sworn fealty to [CRO.GetLeader], the ruler of the Iron Throne. With this act of submission, [FROM.GetNameDef] acknowledges [CRO.GetLeader] as the rightful sovereign, setting aside claims or resistance in favor of unity under the crown."
GOT_Diplomatic_News.9.a: "The realm watches and whispers."

 GOT_Diplomatic_News.10.t: "[FROM.GetName] Hosts Tournament"
 GOT_Diplomatic_News.10.d: "Rather than marching his host to King's Landing, [FROM.GetLeader] of [FROM.GetName] has declared that a great tourney shall be held in celebration of his claim to the Iron Throne. Nobles from across the realm are invited to test their mettle in jousts and melees, while alliances are forged behind silken curtains.\n\nMany wonder if this show of peace is a strategic pause—or a sign of weakness. Whatever the reason, the drums of war fall silent, for now."
 GOT_Diplomatic_News.10.a: "A curious move by [FROM.GetLeader]..."
 
GOT_Diplomatic_News.11.t: "[FROM.GetName] Bends the Knee"
GOT_Diplomatic_News.11.d: "In a move that will surely echo throughout the Seven Kingdoms, [FROM.GetLeader] has sworn fealty to [DRA.GetLeader], the rightful ruler of the Iron Throne. With this act of submission, [FROM.GetNameDef] acknowledges [DRA.GetLeader] as the rightful sovereign, setting aside claims or resistance in favor of unity under the crown."
GOT_Diplomatic_News.11.a: "The realm watches and whispers."

GOT_Diplomatic_News.12.t: "[FROM.GetName] Bends the Knee"
GOT_Diplomatic_News.12.d: "In a move that will surely echo throughout the Seven Kingdoms, [FROM.GetLeader] has sworn fealty to [STO.GetLeader], the rightful ruler of the Iron Throne. With this act of submission, [FROM.GetNameDef] acknowledges [STO.GetLeader] as the rightful sovereign, setting aside claims or resistance in favor of unity under the crown."
GOT_Diplomatic_News.12.a: "The realm watches and whispers."

GOT_Diplomatic_News.13.t: "Janos Slynt Sent to the Wall"
GOT_Diplomatic_News.13.d: "In a shocking display of royal authority, Janos Slynt, once Commander of the City Watch and a key enforcer of Lannister rule in King’s Landing, has been stripped of his rank and exiled to the Night’s Watch. His fall from grace was swift—banished by order of the acting Hand, Tyrion Lannister, following accusations of corruption and cowardice. Whispers across the capital speak of a power shift within the Red Keep, as old loyalties are tested and new alliances rise."
GOT_Diplomatic_News.13.a: "A harsh fate... but a just one."

GOT_Diplomatic_News.14.t: "Renly Baratheon Survives the Shadow's Attack"
GOT_Diplomatic_News.14.d: "In a surprising turn of events, Renly Baratheon has survived the grievous injuries inflicted upon him by the shadow birthed by Melisandre. Despite his near-death experience, he has emerged from the ordeal, and the world now wonders how he will proceed in his quest for the Iron Throne."
GOT_Diplomatic_News.14.a: "Renly Baratheon lives! Will he seek revenge or press forward with his claim?"

GOT_Diplomatic_News.16.t: "House Frey Bars the Bridge"
GOT_Diplomatic_News.16.d: "Tensions rise along the Trident as word spreads that Lord Walder Frey has denied passage to Robb Stark and his Northern host. The cause? A refusal by Robb to accept Frey’s terms—chief among them, a marriage pact to one of his daughters.\n\nObservers note that while the Twins offer the most direct route south, the Lord of the Crossing has never been one to act without gain. With negotiations collapsed, the North must now find another way forward—one that could cost them precious time, supplies, and perhaps the momentum of their campaign.\n\nSome whisper that Robb Stark has made a noble choice, preserving his freedom and pride. Others question the wisdom of alienating a powerful house for the sake of personal honor."
GOT_Diplomatic_News.16.a: "The river remains uncrossed—for now."

GOT_Diplomatic_News.17.t: "Robb Stark Detains Lord Karstark"
GOT_Diplomatic_News.17.d: "In a controversial move, King Robb Stark of the North has chosen to imprison Lord Rickard Karstark rather than execute him for the murder of two Lannister prisoners. While some view this as a wise attempt to preserve unity among his bannermen, others see it as a dangerous show of indecision. The Karstark host has broken away from the Stark army, raising tensions across the North. Whether this gamble will preserve the Northern alliance or invite further instability remains to be seen."
GOT_Diplomatic_News.17.a: "The North begins to fracture..."

GOT_Diplomatic_News.18.t: "Robb Stark Pardons Lord Karstark"
GOT_Diplomatic_News.18.d: "In a stunning decision, King Robb Stark has chosen to pardon Lord Rickard Karstark for the murder of two Lannister prisoners. The move has shocked many across Westeros—some see it as a necessary act of pragmatism to maintain unity in the North, while others view it as a grave mistake that undermines Robb’s authority. While the Karstarks remain in his ranks, murmurs of doubt now spread through his bannermen. Forgiveness, it seems, carries its own cost."
GOT_Diplomatic_News.18.a: "Mercy—or weakness?"

GOT_Diplomatic_News.19.t:0 "Daenerys Accepts the Yunkish Offer"
GOT_Diplomatic_News.19.d:0 "Envoys from Yunkai have come bearing gold, ships, and promises of peace, pleading with Daenerys Targaryen to spare their city in exchange for tribute. Though the Khaleesi had vowed to end slavery, her advisors weighed the offer carefully. In the end, Daenerys chose to accept the Yunkish proposal—for now. The slaves remain shackled, but her forces grow stronger. Whether this was mercy, pragmatism, or a temporary truce remains to be seen."
GOT_Diplomatic_News.19.a:0 "She has accepted their offer—for now."


GOT_Diplomatic_News.20.t:0 "The Viper Strikes True"
GOT_Diplomatic_News.20.d:0 "In a shocking outcome to Tyrion Lannister’s trial by combat, Prince Oberyn Martell—known as the Red Viper—has defeated Ser Gregor Clegane, the Mountain. Oberyn not only survived the brutal duel but emerged victorious, avenging his sister’s death and securing Tyrion’s freedom. The spectacle has sent ripples across Westeros, altering perceptions of both Dorne and the Lannisters."
GOT_Diplomatic_News.20.a:0 "A Martell never forgets."

GOT_Diplomatic_News.21.t:0 "The Great Betrayal"
GOT_Diplomatic_News.21.d:0 "In a shocking turn of events, the Freys and the Boltons have turned against their former allies in the North. Lord Roose Bolton has cast aside his allegiance to House Stark, and House Frey, once loyal to the Tullys, has joined him in rebellion.\n\nWhile the North remains embroiled in its struggle with the Lannisters, it now faces an even greater danger from within. This betrayal will undoubtedly change the course of the war."
GOT_Diplomatic_News.21.a:0 "The wolves turn on each other."

GOT_Diplomatic_News.22.t:0 "A Marriage in the North"
GOT_Diplomatic_News.22.d:0 "In a surprising turn of events, Robb Stark, King in the North, has honored his pact with the Freys, marrying Roslin Frey in a grand ceremony. The union is seen as a strategic move to solidify the alliance between the North and the Riverlands.\n\nWith the Lannister forces still pressing against the North, many wonder whether this marriage will bring stability or whether it will be a fleeting moment of peace before the next storm."
GOT_Diplomatic_News.22.a:0 "The North's bonds grow stronger."

GOT_Diplomatic_News.23.t:0 "The Red Wedding"
GOT_Diplomatic_News.23.d:0 "In a shocking act of treachery, House Frey has slaughtered Robb Stark and his bannermen at the wedding feast meant to unite them. What was intended to be a marriage of alliance between the North and the Riverlands has instead become one of the bloodiest betrayals in history. The Freys, led by Walder Frey, have turned against their sworn allies in the most brutal of ways, and the North is now in turmoil.\n\nThe repercussions of this betrayal are sure to be felt across the Seven Kingdoms, and the Riverlands, once again, lie in ruins."
GOT_Diplomatic_News.23.a:0 "The North weeps for its king."

GOT_Diplomatic_News.24.t:0 "The Riverlands Unite"
GOT_Diplomatic_News.24.d:0 "In an unexpected turn of events, Edmure Tully has married Roslin Frey, consolidating the Riverlands' alliance with House Frey. After the betrayal by the Freys at the Red Wedding, this marriage seems to signal a new direction for the Riverlands, one that hopes to heal old wounds and restore stability to the region.\n\nThough the Tullys and Freys remain united, questions linger about the future of the North and its relationship with the Riverlands."
GOT_Diplomatic_News.24.a:0 "The Riverlands find strength in unity."

GOT_Diplomatic_News.25.t:0 "The Red Wedding"
GOT_Diplomatic_News.25.d:0 "In a shocking act of treachery, House Frey has slaughtered Robb Stark and his bannermen at the wedding feast meant to unite them. What was intended to be a marriage of alliance between the North and the Riverlands has instead become one of the bloodiest betrayals in history. The Freys, led by Walder Frey, have turned against their sworn allies in the most brutal of ways. While Edmure Tully, the last hope of the Riverlands, was taken prisoner, the North is left in turmoil.\n\nThe repercussions of this betrayal are sure to be felt across the Seven Kingdoms, and the Riverlands, once again, lie in ruins."
GOT_Diplomatic_News.25.a:0 "The North weeps for its king."

GOT_Diplomatic_News.26.t:0 "Daario Remains Loyal to Yunkai"
GOT_Diplomatic_News.26.d:0 "In a surprising turn of events, Daario Naharis and the Second Sons have chosen to remain loyal to Yunkai, despite the growing influence of Daenerys Targaryen. The Second Sons, once feared as mercenaries in the service of the Mother of Dragons, will now continue to fight for the Slavers. This unexpected decision could change the balance of power in Slaver's Bay, and Daenerys will now have to face the formidable force of the Second Sons as she continues her struggle."

GOT_Diplomatic_News.27.t:0 "House Targaryen Leaves Illyrio's Mansion"
GOT_Diplomatic_News.27.d:0 "In a gesture of gratitude and respect, House Targaryen has peacefully vacated the estate of Illyrio Mopatis in Pentos. The mansion, which served as a sanctuary during their years of exile, is once again in the hands of its original owner. Many in Essos see this as a symbol of the Targaryens' rising power and independence — no longer beggars seeking shelter, but rulers reclaiming their place in the world."
GOT_Diplomatic_News.27.a:0 "A chapter ends; another begins."

GOT_Diplomatic_News.28.t:0 "House Targaryen Refuses to Leave Illyrio’s Mansion"
GOT_Diplomatic_News.28.d:0 "Despite Pentos' formal request, House Targaryen has refused to vacate the estate granted to them in exile by Illyrio Mopatis. Though they now command lands of their own, the Targaryens have chosen to remain in the mansion — a move seen by many as high-handed and provocative. Whispers swirl in the Free Cities; will Pentos tolerate this insult to its sovereignty, or will it take action to reclaim what is rightfully theirs?"
GOT_Diplomatic_News.28.a:0 "The dragon grows bold."

 # Robb Honors Pact With Renly
GOT_Diplomatic_News.29.t: "Robb Stark Marches South in Support of Renly"
GOT_Diplomatic_News.29.d: "In a significant shift in the War of the Five Kings, Robb Stark has honored his alliance with Renly Baratheon and committed Northern forces to his cause. As Renly's banners move toward the Crownlands, the direwolf marches beside the stag. This coordinated action signals a formidable threat to House Lannister’s grip on the capital."
GOT_Diplomatic_News.29.a: "The pact is honored. War escalates."

 # Robb Breaks Pact With Renly
GOT_Diplomatic_News.30.t: "Robb Stark Refuses to March with Renly"
GOT_Diplomatic_News.30.d: "Despite earlier promises, Robb Stark has chosen not to honor his alliance with Renly Baratheon. The North will not join the southern campaign, leaving Renly to face the Lannisters alone. This decision may reshape alliances and power dynamics across Westeros, raising questions about Stark intentions—and their reliability as allies."
GOT_Diplomatic_News.30.a: "The pact is broken. Renly stands alone."

GOT_Diplomatic_News.31.t: "Robb Stark Proclaimed King of the Trident"
GOT_Diplomatic_News.31.d: "In a dramatic turn of allegiance, the lords of the Riverlands have proclaimed Robb Stark not only King in the North, but King of the Trident as well. The union of the North and Riverlands under a single crown signals a bold new political reality in Westeros. While some see this as a rightful continuation of Stark leadership and Riverlander defiance, others view it as a dangerous consolidation of power that may escalate the already raging war. Whatever the case, the map of Westeros has just changed."
GOT_Diplomatic_News.31.a: "The North and Riverlands ride as one."

GOT_Diplomatic_News.32.t:0 "Princess Myrcella Betrothed to Trystane Martell"
GOT_Diplomatic_News.32.d:0 "In a surprising yet shrewd diplomatic move, House Lannister has secured a betrothal between Princess Myrcella Baratheon and Prince Trystane Martell, heir to House Martell of Dorne. The arrangement signals a rare moment of unity between the Iron Throne and the southern realm. Myrcella is to be fostered in Sunspear, a gesture of trust meant to strengthen the alliance. Whether this marriage will bring lasting peace or simply buy time remains to be seen, but the political landscape has undoubtedly shifted."
GOT_Diplomatic_News.32.a:0 "A royal match with far-reaching consequences."

GOT_Diplomatic_News.33.t:0 "Dorne Refuses Royal Marriage Offer"
GOT_Diplomatic_News.33.d:0 "Efforts to bind House Lannister and House Martell through marriage have failed. Prince Doran of Dorne has rejected the proposed betrothal between Princess Myrcella Baratheon and his son, Prince Trystane. The refusal highlights lingering tensions and unhealed wounds between the southern kingdom and the Iron Throne. While the court in King's Landing had hoped to secure an alliance through diplomacy, Dorne’s silence speaks volumes. The future of relations between the two houses is now more uncertain than ever."
GOT_Diplomatic_News.33.a:0 "Old grievances endure in the Dornish sands."

 # 745 — News
GOT_Diplomatic_News.41.t: "War Engulfs the North"
GOT_Diplomatic_News.41.d: "Open war has erupted across the North as King Stannis Baratheon launches his campaign against House Bolton. Fighting alongside him is Jon Stark, formerly known as Jon Snow, who has renounced the Night's Watch after accepting the king's offer of legitimization. With northern loyalists rallying to the direwolf and Baratheon stag alike, Ramsay Bolton has gathered his own bannermen to defend Winterfell. The outcome of the conflict will determine not only who rules the North, but whether Stannis Baratheon's claim to the Iron Throne gains the decisive victory it so desperately needs."
GOT_Diplomatic_News.41.a: "The stag and the direwolf march together."

 GOT_Diplomatic_News.42.t:0 "Empire of Ashes: The Targaryen Schism"
 GOT_Diplomatic_News.42.d:0 "Plumes of dark smoke rise over the ruins of King's Landing as open civil war erupts across Queen Daenerys’s fragile empire. Following the shocking assassination of the Dragon Queen, a deadly conflict for total control has pitted Jon Snow against the foreign host she brought across the Narrow Sea. Rallying Northern lords, Westerosi loyalists, and those who fear foreign rule, Jon Snow fights to break the dragon's grip on the realm. Standing against him, Grey Worm and the Unsullied—joined by Dothraki bloodriders and Targaryen loyalists—have locked down the capital, sworn to execute the Queen's final crusade and avenge her murder. As armies mobilize from the Crownlands to the North, the Great War gives way to a ruthless war of succession."
 GOT_Diplomatic_News.42.a:0 "The Dragon's realm tears itself apart."
 
 GOT_Diplomatic_News.43.t:0 "The Dragon Survives: War of the Two Dragons"
 GOT_Diplomatic_News.43.d:0 "Shockwaves ripple across Westeros as word escapes the Red Keep: Queen Daenerys Targaryen has survived the assassination attempt by Jon Snow. Though wounded, the Dragon Queen has unleashed her full fury upon those who conspired against her, branding the King in the North a traitor to the realm. Refusing to yield to dragonfire, Jon Snow has rallied the northern lords, riverlords, and loyalist remnants under the banner of his true Targaryen lineage, framing the conflict as a final stand for the realm's survival. With Drogon circling the skies over the Crownlands and northern hosts marching south, the Seven Kingdoms are consumed by a devastating schism—a war between the Dragon Queen who brought fire and blood, and the White Wolf who would defy her."
 GOT_Diplomatic_News.43.a:0 "Fire and blood meets the cold of winter."
 
GOT_Diplomatic_News.47.t:0 "[GOL.GetName] Vacates Encampment"
GOT_Diplomatic_News.47.d:0 "In a gesture of compliance and respect, [GOL.GetNameDef] have peacefully vacated their encampment within the borders of [VOL.GetName]. The lands, which served as a crucial staging ground during their years of exile, are once again under full Volantene authority. Many across the Free Cities see this as a symbol of the [GOL.GetAdjective]' rising strength and independence — no longer desperate sellswords relying on [VOL.GetAdjective] grace, but rulers carving out their own destiny."
GOT_Diplomatic_News.47.a:0 "A chapter ends; another begins."

GOT_Diplomatic_News.48.t:0 "[GOL.GetName] Refuses to Vacate Encampment"
GOT_Diplomatic_News.48.d:0 "Despite a formal decree from [VOL.GetName], [GOL.GetNameDef] have refused to vacate the encampment granted to them during their exile. Though they now command lands of their own, [GOL.GetNameDef] have chosen to hold the [VOL.GetAdjective] territory — a move seen across Essos as an audacious insult to the First Daughter of Valyria. Whispers swirl through the Free Cities: will the Triarchs tolerate this breach of sovereignty, or will the Old Blood march to reclaim what is rightfully theirs?"
GOT_Diplomatic_News.48.a:0 "The Black Dragon grows bold."

GOT_Alt_Country.1.t: "A Royal Union for Power"
GOT_Alt_Country.1.d: "In a surprising turn of events, Daenerys Targaryen has married her brother, Viserys. This union was arranged to strengthen the Targaryen claim to the Iron Throne, with both siblings hoping to restore their family's former glory. Despite the personal complexities, the Targaryens now stand united in their bid to reclaim Westeros."
GOT_Alt_Country.1.a: "Celebrate the union and strengthen our claim to the Iron Throne"

GOT_Alt_News.1.t: "Targaryen Siblings Wed in Shocking Union"
GOT_Alt_News.1.d: "In a surprising move, Daenerys and Viserys Targaryen, the last of the once-great dynasty, have married each other. This controversial union has caused a stir throughout the realm, with many questioning the motivations behind it. The Targaryens are now united in both blood and ambition, setting their sights on the Iron Throne once more."
GOT_Alt_News.1.a: "The Targaryens have united under one banner—will they now pose a real threat to Westeros?"

GOT_Alt_Country.2.t: "Lord Stark Takes the Black"
GOT_Alt_Country.2.d: "Eddard Stark, once Lord of Winterfell and Hand of the King, has arrived at Castle Black. Sentenced to take the black instead of execution, he now joins our ancient order. His presence is both a boon and a burden — some men respect him, others fear what he represents. Still, he has taken the vows, and he is one of us now."
GOT_Alt_Country.2.a: "The realm forgets, but the Wall remembers."

GOT_Alt_News.2.t: "Eddard Stark Takes the Black"
GOT_Alt_News.2.d: "In a surprising act of mercy, King Joffrey has spared Eddard Stark's life, sending him to take the black instead of facing the headsman’s sword. Once a lord and a Hand of the King, he is now a brother of the Night’s Watch. Some see this as a wise decision to avoid rebellion, others as weakness. Regardless, the realm watches, and remembers."
GOT_Alt_News.2.a: "The North may yet stay its wrath."

GOT_Alt_Country.3.t: "Lord Stark is Spared"
GOT_Alt_Country.3.d: "Word has reached us that Lord Eddard Stark has been spared execution. As part of a political compromise, he has taken the black and joined the Night’s Watch. Though he will never again return to Winterfell or wield his sword in the North’s defense, he lives — and for that, many are grateful. The North breathes a sigh of relief."
GOT_Alt_Country.3.a: "He lives. That is enough."

GOT_Alt_Country.4.t: "The Lord of Winterfell Returns"
GOT_Alt_Country.4.d: "Eddard Stark has returned to Winterfell. Not in chains, nor as a broken man exiled to the Wall, but as Lord Stark of House Stark — free, alive, and bearing the weight of all that has passed. His return is a balm to the North, a sign that honor has not yet perished from the realm. Though his time in captivity has left its mark, his presence alone steadies the hearts of our people."
GOT_Alt_Country.4.a: "Winterfell stands strong once more."

GOT_Alt_News.4.t: "Lord Stark Returns to Winterfell"
GOT_Alt_News.4.d: "In a shocking turn, Eddard Stark has been released from captivity and allowed to return to the North. The Lord of Winterfell rides once more through the gates of his ancestral home, greeted with cheers from bannermen and smallfolk alike. Though the war has stained the realm with blood and broken oaths, this act — rare in mercy and even rarer in politics — offers a glimmer of peace. Whether this signals the end of hostilities or simply a pause, the North now rallies behind its lord."
GOT_Alt_News.4.a: "The North remembers."

GOT_Alt_News.5.t: "Khaleesi Rises Among the Dothraki"
GOT_Alt_News.5.d: "Following the death of Khal Drogo, an unprecedented shift has taken place in the Dothraki leadership. Daenerys Targaryen, the Khaleesi and widow of the fallen Khal, has taken command of the great khalasar. Her claim, backed by fire, blood, and defiance of tradition, has stunned observers across the known world. The Dothraki now ride under a foreign-born queen."
GOT_Alt_News.5.a: "Fire rides with the Dothraki."

GOT_Alt_News.6.t: "Khal Moro Unites the Khalasar"
GOT_Alt_News.6.d: "In the aftermath of Khal Drogo’s death, Khal Moro, a respected and feared bloodrider, has claimed leadership over the Dothraki. Many within the khalasar have rallied to his side, valuing tradition and strength in uncertain times. The horse lords ride once again under a seasoned warrior, and the world watches to see which direction Moro will lead them."
GOT_Alt_News.6.a: "Another Khal rises from the ashes."

GOT_Alt_News.7.t: "The Dragon Queen's Gambit Fails"
GOT_Alt_News.7.d: "Rumors from Vaes Dothrak tell of a daring attempt by Daenerys Targaryen to burn the assembled khals alive within the Temple of the Dosh Khaleen. Yet the plot failed before the flames could claim their victims. The surviving khals denounced the foreign queen as a deceiver, forcing her to flee for her life. With the khalasars remaining united under their traditional leaders, the dream of a Targaryen-Dothraki alliance appears to have gone up in smoke."
GOT_Alt_News.7.a: "The Dragon Queen's luck has run dry."

 GOT_Alt_Country.8.t:0 "The Dark Falls Over Winterfell"
 GOT_Alt_Country.8.d:0 "The strike came in a heartbeat—a flash of steel from the shadows of the weirwood tree. But the Night King was faster. Caught mid-air by the throat, Arya Stark was choked into silence before her Valyrian blade could find its mark. With a brutal snap, the living lost their last desperate gamble. As her body hit the snow, the White Walkers closed in around Bran, and the ancient iron gates of Winterfell finally gave way to the endless tide of wights. The North has fallen, and a cold, silent night descends across the world of men."
 GOT_Alt_Country.8.a:0 "Fall back south!"
 
 GOT_Alt_News.8.t:0 "The Army of the Dead Marches South"
 GOT_Alt_News.8.d:0 "The terrifying rumors blowing in from the North have been confirmed: Winterfell has fallen. The living's last-ditch effort to slay the Night King in the godswood ended in tragic failure, as the assassin's strike was caught and broken. With the stark walls breached and the defenders swept away into the blizzard, the host of the dead swells with hundreds of thousands of fresh wights. There is no longer a Wall, nor a fortress in the North to stem the tide. The Endless Night rolls south toward the Riverlands and King's Landing, and the realm stands on the precipice of absolute doom."
 GOT_Alt_News.8.a:0 "Gods protect us... the dead are coming."
 
 GOT_Alt_Country.9.t:0 "Mercy in the Great Hall"
 GOT_Alt_Country.9.d:0 "The air in Winterfell’s Great Hall turned to ice as Lady Sansa laid bare a lifetime of Lord Baelish's treasons, backed by the hauntingly precise visions of Bran Stark. Yet, as Arya’s Valyrian steel blade hovered at his throat, the weeping Lord Protector offered a final, desperate bargain: total submission, his vast spy networks across Westeros, and the full military backing of the Vale in the wars to come. Stripped of his leverage but granted his life, Lord Baelish returns to the Vale a humbled man—yet remarkably intact. Though his authority is tarnished, the Mockingbird still holds the Eyrie, and his web of secrets remains as dangerous as ever."
 GOT_Alt_Country.9.a:0 "The Eyrie remains ours."

 GOT_Alt_News.9.t:0 "Trial at Winterfell"
 GOT_Alt_News.9.d:0 "Astonishing reports arrive from the North regarding the fate of Lord Petyr Baelish. Accused of treason and murder before the lords of the North and the Vale, the former Master of Coin stood on the brink of execution at the hands of House Stark. In a shocking display of clemency, however, Lady Sansa Stark spared his life in exchange for his complete political capitulation and intelligence networks. Across Westeros, monarchs and spymasters digest the news: Lord Baelish may have lost his pride, but he retains control of the Eyrie. The most dangerous gambler in the Seven Kingdoms lives to play another day."
 GOT_Alt_News.9.a:0 "He walks a tightrope..."

GOT_Wars_Country.1.t: "The Battle of Blackwater Begins"
GOT_Wars_Country.1.d: "The fleet is assembled. The fires are lit. King’s Landing lies before us, its gates ripe for storming. The Iron Throne is ours by right, and now by force. Let the fury of House Baratheon descend upon the usurpers."
GOT_Wars_Country.1.a: "Come with me and take this city."

GOT_Wars_Country.2.t: "Stannis Invasion Imminent!"
GOT_Wars_Country.2.d: "Stannis Baratheon’s fleet is already in Blackwater Bay, and the banners of House Baratheon rise once more. King’s Landing braces itself for the storm that will come. The time has come to defend the capital — we must make our preparations, or face ruin."
GOT_Wars_Country.2.a: "We must prepare for the coming battle."

GOT_Wars_Country.3.t: "The Ironborn Set Sail"
GOT_Wars_Country.3.d: "The tides are with us. The North is weak, scattered by war, and its shores lie undefended. Balon Greyjoy has declared his claim, and the kraken rises once again. With fire and salt, we will take what is owed. Let the old way reign."
GOT_Wars_Country.3.a: "The North will remember the taste of salt and steel."

GOT_Wars_Country.4.t: "The Ironborn Plot in the Shadows"
GOT_Wars_Country.4.d: "Rumors spread from the western shores—black sails spotted on the horizon, whispers of Balon Greyjoy's ambition, and Theon’s return to Pyke. Though no blades have yet been drawn, the kraken stirs beneath the waves. The North must not be caught unawares."
GOT_Wars_Country.4.a: "We must remain vigilant—the sea brings enemies."

GOT_Wars_Country.5.t: "The Landing at Dragonstone Begins"
GOT_Wars_Country.5.d: "Our fleet has crossed the Narrow Sea at last. Before us rises Dragonstone, the ancient seat of House Targaryen and the birthplace of our dynasty in Westeros. Exile is over. We return with dragons, loyal allies, and a claim forged in fire and blood. Today, the first step toward reclaiming the Iron Throne is taken."
GOT_Wars_Country.5.a: "Let us go home."

GOT_Wars_Country.6.t: "The Invasion of Dragonstone is Imminent!"
GOT_Wars_Country.6.d: "A vast fleet has been sighted off the coast, bearing the banners of House Targaryen. Daenerys Stormborn has returned from exile with Unsullied, Dothraki, and dragons at her command. Dragonstone stands directly in her path. The garrison must prepare itself, for the storm is about to break."
GOT_Wars_Country.6.a: "To arms! Hold Dragonstone!"

GOT_Location_Country.1.t: "Arrangements for the Coronation"
GOT_Location_Country.1.d: "The time has come to crown the new ruler of the Seven Kingdoms. Preparations begin across the capital: the High Septon is summoned, nobles and lords receive their invitations, and the Iron Throne is polished for the grand ceremony. The court bustles with activity as banners are raised and feast halls readied. While the faithful rejoice and loyalists pledge fealty, rumors already spread of dissent and unrest. This is a moment that will shape the realm — and its future."
GOT_Location_Country.1.a: "Let the bells ring — the coronation is at hand."

GOT_Location_Country.2.t: "A New Ruler for Casterly Rock"
GOT_Location_Country.2.d: "The halls of Casterly Rock stir with renewed purpose. With the seat of House Lannister now under new leadership, preparations are underway to formally install the new ruler. Goldsmiths polish heirlooms of the Rock, banners are mended, and the ancient halls echo with the steps of retainers and bannermen returning to swear fealty. Though the Westerlands may seem united in celebration, not all voices are raised in cheer — some question whether the new lion is worthy of the den."
GOT_Location_Country.2.a: "Let the Rock roar once more."

GOT_Location_Country.3.t: "A New Ruler for Winterfell"
GOT_Location_Country.3.d: "The ancient walls of Winterfell once more prepare to witness the rise of a new ruler. Ravens fly across the North, summoning bannermen to the ancestral seat of House Stark. Fires are lit in the great hall, and the godswood stands silent in solemn anticipation. Though many in the North honor the old ways and stand ready to swear loyalty, others question what this change will mean for their future. In Winterfell, legacy is everything — and now a new chapter begins."
GOT_Location_Country.3.a: "The North remembers."

GOT_Location_Country.4.t: "A New Ruler for Storm's End"
GOT_Location_Country.4.d: "Storm’s End, the mighty fortress overlooking Shipbreaker Bay, prepares to welcome a new lord or lady. Thunder rolls in the distance as couriers ride through the stormlands, bearing news of the succession. Within the thick, unyielding walls of the keep, banners are hung and the ancient hall readied for the oath-taking. Though the seat is secure for now, the stormlands are a proud and tempestuous realm — and not all are content with the winds of change."
GOT_Location_Country.4.a: "The storm rises anew."

GOT_Location_Country.5.t: "A New Ruler for the Eyrie"
GOT_Location_Country.5.d: "High atop the Mountains of the Moon, the Eyrie prepares to receive its new ruler. The sky is clear, the falcons restless, and the lords of the Vale make their treacherous ascent to the famed mountain stronghold. In the airy halls of House Arryn, long associated with honor and isolation, banners are unfurled and the Moon Door stands closed — for now. Yet beneath the ceremony, whispers echo through the high passes: some question the strength of the new lord or lady to hold such a lofty seat."
GOT_Location_Country.5.a: "The Vale bows to its new protector."

GOT_Location_Country.6.t: "A New Ruler for Sunspear"
GOT_Location_Country.6.d: "Far in the scorched lands of Dorne, Sunspear stirs as a new ruler takes their place within the shadowed halls of the ancient palace. The spear-towers glint beneath the sun, and Dornish banners snap in the desert wind. Riders spread the news across the arid plains and stony passes, summoning the lords and ladies of Dorne to pledge their loyalty. Yet the Dornish are a proud and independent people — and though the succession is announced, true loyalty must still be earned."
GOT_Location_Country.6.a: "Dorne bows to no one — but it watches."

GOT_Location_Country.7.t: "A New Ruler for Highgarden"
GOT_Location_Country.7.d: "In the heart of the Reach, Highgarden blossoms under the rule of a new lord or lady. The golden rose unfurls once more as word spreads through fertile fields and bustling market towns. Minstrels sing, bannermen ride, and the great houses of the Reach prepare to pay homage at the seat of House Tyrell. Yet amid the splendor and song, some question whether the new ruler can truly command the loyalty of the most bountiful—and fickle—region in Westeros."
GOT_Location_Country.7.a: "A new bloom in the garden."

GOT_Location_Country.8.t: "A New Ruler for Riverrun"
GOT_Location_Country.8.d: "The rivers run swift, and change comes to the Trident. In the halls of Riverrun, the ancestral seat of House Tully, a new ruler prepares to take up the mantle of leadership. Lords and knights gather from across the Riverlands, their loyalties as winding as the waters they live beside. The great hall is dressed for ceremony, yet beneath the surface, tension stirs — for the Riverlands have long been a land divided, and unity will not come easily."
GOT_Location_Country.8.a: "The rivers bend toward a new lord."

GOT_Location_Country.9.t: "A New Ruler for Dragonstone"
GOT_Location_Country.9.d: "On the rocky shores of Dragonstone, beneath the shadow of the volcano, a new ruler ascends to the ancestral seat of House Targaryen. The black banners of the dragon are raised high as the court prepares for a solemn yet fiery ceremony. The winds howl across the narrow sea, carrying rumors and whispers — for the throne of Dragonstone is not easily held, and the blood of the dragon commands both reverence and fear."
GOT_Location_Country.9.a: "The dragon stirs once more."

GOT_Location_Country.10.t: "A New Ruler for Pyke"
GOT_Location_Country.10.d: "Amid the windswept cliffs of Pyke, the Iron Islands are set to witness the rise of a new ruler. The seastone chair, long a symbol of the harsh and proud ways of House Greyjoy, awaits its new occupant. The salt and steel of the Ironborn fill the air as bannermen and raiders make their way to the fortress by the sea. Yet while some welcome the new ruler, the Ironborn are a people who respect strength above all else, and not all will bend the knee so easily."
GOT_Location_Country.10.a: "The tide rises with a new captain."

GOT_Location_Country.11.t: "House Baratheon of King's Landing"
GOT_Location_Country.11.d: "House Baratheon, a great and powerful house of Westeros, has its seat in King’s Landing, where the Baratheons serve as the ruling family of the Seven Kingdoms. The Baratheons rose to power during Robert’s Rebellion, when Lord Robert Baratheon claimed the Iron Throne after overthrowing the Targaryen dynasty. Robert’s rule has been marked by a heavy hand, while his brothers, Stannis and Renly, each maintain their own ambition and rivalry. Though the Baratheons enjoy wealth and power, their rule is fragile, with threats brewing within the realm, from the North to the capital itself. As of now, Robert Baratheon, King of the Andals and Protector of the Realm, sits on the Iron Throne. His reign, however, is surrounded by growing intrigue, and his health and decision-making are in decline, with whispers of troubles that may shake the foundation of his kingdom."
GOT_Location_Country.11.a: "Ours is the Fury."

GOT_Location_Country.12.t: "House Lannister"
GOT_Location_Country.12.d: "House Lannister of Casterly Rock is one of the wealthiest and most influential families in the Seven Kingdoms. The Lannisters’ rise to prominence began with the legendary Lann the Clever, who tricked the Casterlys out of their ancestral seat. With vast riches from their gold mines, House Lannister has held significant power for generations. As of now, Tywin Lannister serves as the head of the house, a ruthless and calculating ruler who commands great respect. Tywin’s children, Jaime, Cersei, and Tyrion, each play critical roles in the political maneuvering at King’s Landing. Despite their immense wealth and power, the Lannisters are embroiled in dangerous games of politics and intrigue, with their family’s honor and future on the line."
GOT_Location_Country.12.a: "Hear Me Roar!"


GOT_Location_Country.13.t: "House Stark"
GOT_Location_Country.13.d: "House Stark of Winterfell is one of the oldest and most noble houses in the North, known for their resilience and honor. Descended from the First Men, the Starks have ruled over the North for millennia. Their seat, Winterfell, stands as a symbol of their enduring legacy. As of the beginning of Robert's Rebellion, Eddard Stark, the current Lord of Winterfell, is a man of great integrity and honor, famed for his loyalty and sense of justice. The Stark family is fiercely protective of the North, with Eddard's children—Robb, Sansa, Arya, Bran, and Rickon—carrying the weight of their house's future on their shoulders. With the looming threat of the growing tension in Westeros, House Stark faces its greatest challenges yet."
GOT_Location_Country.13.a: "Winter is Coming"


GOT_Location_Country.14.t: "House Baratheon of Storm's End"
GOT_Location_Country.14.d: "House Baratheon of Storm's End is a powerful family with a legacy of strength and pride. Founded by Orys Baratheon, a half-brother of Aegon the Conqueror, they have long ruled the Stormlands from their ancestral seat at Storm's End. At the start of the War of the Five Kings, Renly Baratheon, the younger brother of King Robert Baratheon, rules Storm's End. Renly is known for his charisma and his ambition, seeking to claim the Iron Throne for himself. As the youngest of the Baratheon brothers, Renly's ambitions bring him into conflict with his older brother Stannis and the ruling king, Robert. Storm's End is a place where the storms are fierce, but so too are the Baratheons who call it home."
GOT_Location_Country.14.a: "Ours is the Fury"


GOT_Location_Country.15.t: "House Arryn"
GOT_Location_Country.15.d: "House Arryn rules the Vale of Arryn from the impregnable Eyrie. The family has a long history of guarding the eastern borders of the Seven Kingdoms. At the beginning of the War of the Five Kings, House Arryn is ruled by Jon Arryn, Warden of the East, who is a respected figure. However, with Jon’s sudden death, his young wife, Lysa Arryn, has taken control. The Vale is a land of lofty mountains and formidable defenses, and House Arryn’s strength lies in its strategic position and its loyal bannermen. The Eyrie stands as a symbol of their power and isolation, untouched by the turmoil that engulfs the rest of Westeros."
GOT_Location_Country.15.a: "As High as Honor"


GOT_Location_Country.16.t: "House Martell"
GOT_Location_Country.16.d: "House Martell rules the hot and arid region of Dorne, located in the southernmost part of Westeros. The Martells have long been known for their fierce independence and pride. As of Season 1, House Martell is led by Prince Doran Martell, who governs Dorne with wisdom and caution. However, after the death of the previous ruler, his younger brother, Oberyn Martell, seeks to take matters into his own hands. The Martells are loyal to the Targaryens due to their shared history, but tensions with the rest of the Seven Kingdoms are palpable. Dorne’s ruling family has a reputation for honoring their traditions and fighting for their rights, with the famous words 'Unbowed, Unbent, Unbroken' serving as a testament to their enduring strength."
GOT_Location_Country.16.a: "Unbowed, Unbent, Unbroken"


GOT_Location_Country.17.t: "House Tyrell"
GOT_Location_Country.17.d: "House Tyrell is one of the most powerful houses in the Seven Kingdoms, ruling the fertile and prosperous region of the Reach. Known for their wealth, influence, and vast armies, the Tyrells are led by Mace Tyrell, though much of the actual political power resides with his ambitious and calculating mother, Olenna Tyrell. House Tyrell has always been loyal to the Iron Throne, seeking to maintain their position as the most influential house after House Lannister. The Tyrells are also known for their strategic marriages, with Margaery Tyrell betrothed to King Renly Baratheon at the start of the series, and later, Queen to King Joffrey Baratheon. With the abundance of their lands, House Tyrell seeks to expand its influence, though they must balance their relationship with the Lannisters and their growing ambitions."
GOT_Location_Country.17.a: "Growing Strong"


GOT_Location_Country.18.t: "House Tully"
GOT_Location_Country.18.d: "House Tully rules the Riverlands from their seat, Riverrun. Known for their honor and strong family bonds, the Tullys are led by Hoster Tully, though much of the daily affairs are overseen by his son, Edmure Tully. House Tully’s motto is ‘Family, Duty, Honor,’ a reflection of their strong sense of duty to their kin and their realm. The Tullys are loyal to the Iron Throne, and at the start of the series, they are deeply involved in the political intrigues of King Robert Baratheon’s court, as they arrange a marriage between Catelyn Tully and Eddard Stark. With the Riverlands often caught between the ambitions of the Lannisters and the Baratheons, House Tully faces constant challenges but remains a formidable and respected force in Westeros."
GOT_Location_Country.18.a: "Family, Duty, Honor"


GOT_Location_Country.19.t: "House Baratheon of Dragonstone"
GOT_Location_Country.19.d: "House Baratheon of Dragonstone is ruled by Stannis Baratheon, the younger brother of King Robert Baratheon. While Robert rules from King's Landing, Stannis holds the fortress of Dragonstone, located on a rocky island off the coast of Westeros. Known for his stern sense of duty and honor, Stannis is often seen as the least charismatic of the Baratheon brothers, yet his unwavering sense of justice makes him a formidable figure. His devotion to the Iron Throne and the law is matched only by his desire for power. At the start of the series, Stannis is watching the political landscape from Dragonstone, feeling slighted by Robert's neglect of his claims to power. As tensions rise, Stannis is on the verge of taking more aggressive action to secure his future."
GOT_Location_Country.19.a: "Ours is the Fury"


GOT_Location_Country.20.t: "House Greyjoy"
GOT_Location_Country.20.d: "House Greyjoy of Pyke is one of the Great Houses of Westeros, ruling over the Iron Islands. Known for their seafaring culture, the Ironborn follow the Old Way, a harsh and raiding lifestyle that places great value on strength and independence. House Greyjoy is currently ruled by Balon Greyjoy, a man whose aspirations have led him to challenge the stability of the Iron Throne. With Robert Baratheon’s reign weakening, Balon seeks to reclaim the power of the Iron Islands and restore its former glory. His earlier rebellion was crushed, but his ambitions remain strong, and at the start of the series, he plots his next move. His two sons, Asha and Theon, have different views on their house’s future, adding tension within the family."
GOT_Location_Country.20.a: "We Do Not Sow"

GOT_Location_Country.21.t: "The Night's Watch"
GOT_Location_Country.21.d: "The Night's Watch is a sworn brotherhood tasked with defending the realm of men from the dangers lurking beyond the Wall. Stationed in the frigid North, they guard the Seven Kingdoms from wildlings, direwolves, and far darker threats whispered of in ancient tales. Once a prestigious and honorable order, the Night's Watch has dwindled in strength and reputation, now manned largely by outcasts, criminals, and those with no place elsewhere in Westeros. Despite this, the Watch remains a symbol of duty and sacrifice, upheld by vows that demand a lifetime of service, celibacy, and renunciation of all titles and lands. The Lord Commander, Jeor Mormont, leads the few remaining true men of the Watch from Castle Black. As rumors of strange creatures stir in the far North and King Robert’s rule begins to falter, the Night's Watch finds itself standing alone, a black-clad line between the realms of men and the encroaching darkness."
GOT_Location_Country.21.a: "Night gathers, and now my watch begins"

GOT_Location_Country.22.t: "The Free Folk"
GOT_Location_Country.22.d: "The Free Folk, often called wildlings by those south of the Wall, are a diverse and fiercely independent collection of clans and tribes who live beyond the reach of the Seven Kingdoms. Unbound by lords or kings, they reject the feudal structures of Westeros and pride themselves on personal freedom and strength. Life beyond the Wall is harsh and unforgiving, forging a hardy people who rely on raiding, hunting, and ancient traditions to survive. Though often seen as barbaric by southerners, the Free Folk possess their own rich culture and sense of honor. With rumors spreading of the White Walkers’ return and the long winter approaching, the various clans have begun to rally under a single leader—Mance Rayder, the self-proclaimed King-Beyond-the-Wall. A former man of the Night's Watch, Mance seeks to unite the Free Folk not to conquer, but to flee the true threat that stirs in the frozen north."
GOT_Location_Country.22.a: "We Do Not Kneel"

GOT_Location_Country.23.t: "House Targaryen"
GOT_Location_Country.23.d: "House Targaryen once ruled the Seven Kingdoms with fire and blood, but their dynasty was shattered during Robert’s Rebellion. Now, the last known Targaryens, Prince Viserys and his sister Daenerys, live in exile in the Free City of Pentos, clinging to the fading legacy of their house. Viserys, driven by obsession and wounded pride, believes it is his destiny to reclaim the Iron Throne at any cost. Daenerys, still young and timid, has been raised under his shadow, groomed as a tool for his ambitions. Though their dragons are long gone, the Targaryen name still commands fear and fascination across the Narrow Sea. As Westeros teeters on the edge of chaos, the last embers of House Targaryen may yet be reignited — or extinguished forever."
GOT_Location_Country.23.a: "Fire and Blood"

GOT_Location_Country.24.t: "A New Lord Commander"
GOT_Location_Country.24.d:"Within the cold, black halls of Castle Black, the brothers of the Night’s Watch gather beneath flickering torchlight to decide the future of their ancient order. The Lord Commander has fallen, and tradition calls for the election of a new leader — one who will bear the burden of command atop the Wall. Voices rise, votes are cast, and loyalties are tested as each brother weighs courage, wisdom, and the strength to face the coming darkness. In the frozen shadows of the North, leadership is not merely a title — it is a shield against the end of all things."
GOT_Location_Country.24.a: "The Watch has chosen."

GOT_Location_Country.25.t: "A New King-Beyond-the-Wall"
GOT_Location_Country.25.d: "From the frostbitten forests to the jagged peaks of the Far North, the clans of the Free Folk stir. Whispers echo across the wilderness — a new King-Beyond-the-Wall has risen. Among a people who bow to no lord and kneel to no throne, such a claim is not given, but earned through strength, cunning, and the will to unite. The scattered tribes, raiders, and giants now look to a single banner, drawn not by bloodlines but by survival. Whether for conquest or escape, the Free Folk march as one for the first time in a generation. The Wall looms ahead — and the realm of men is no longer safe in its shadow."
GOT_Location_Country.25.a: "The clans march together once more."

GOT_Location_News.1.t: "[CRO.GetLeader] Crowned King of the Seven Kingdoms"
GOT_Location_News.1.d: "In a moment of grandeur and gravity, [CRO.GetLeader] has been crowned as King of the Andals and the First Men, Lord of the Seven Kingdoms, and Protector of the Realm. King’s Landing erupts in celebration, with the great bells of the Sept ringing out over the city and banners of [CRO.GetRulingParty] unfurling atop the Red Keep. Across the realm, some kneel with loyalty, while others eye the Iron Throne with quiet defiance. The game of thrones is far from over."
GOT_Location_News.1.a: "All hail the king."

GOT_Location_News.2.t: "[CRO.GetLeader] Crowned Queen of the Seven Kingdoms"
GOT_Location_News.2.d: "With fire, steel, and ceremony, [CRO.GetLeader] has been crowned as Queen of the Andals and the First Men, Lady of the Seven Kingdoms, and Protector of the Realm. The throne room of the Red Keep fills with nobles and lords pledging fealty, as the bells of King’s Landing ring through the capital. Yet not all hearts are loyal — some see her coronation as a challenge to tradition and power. Her reign begins under the watchful eyes of friend and foe alike."
GOT_Location_News.2.a: "The realm has a queen."


 # GOT_Location_News.3 – New Lord of Casterly Rock
GOT_Location_News.3.t: "[WES.GetLeader] Named Lord of Casterly Rock"
GOT_Location_News.3.d: "In a move few anticipated, [WES.GetLeader] has been granted the title of Lord of Casterly Rock, the ancestral seat of House Lannister. Long denied the recognition afforded to other Lannisters, [WES.GetLeader] now stands as the master of one of the most powerful strongholds in Westeros. The decision has stirred whispers throughout the realm—some speak of justice, others of folly."
GOT_Location_News.3.a: "A new lion rises at the Rock."

GOT_Location_News.4.t: "[WES.GetLeader] Named Lady of Casterly Rock"
GOT_Location_News.4.d: "In a moment both historic and controversial, [WES.GetLeader] has been named Lady of Casterly Rock, claiming the seat long held by the lords of House Lannister. Once overlooked in the line of succession, she now rules over the golden halls of the Rock and the vast riches of the Westerlands. Some praise the decision as long-overdue justice, while others whisper that tradition has been cast aside. The lioness now roars from the heights of the Rock."
GOT_Location_News.4.a: "The West has a new matriarch."

GOT_Location_News.5.t: "[NOR.GetLeader] Named Lord of Winterfell"
GOT_Location_News.5.d: "In a moment that many saw as inevitable, [NOR.GetLeader] has been named Lord of Winterfell, the ancestral seat of House Stark. Though the North has long been known for its stoic traditions, this appointment has nonetheless stirred mixed reactions. Some speak of a long-awaited return to Stark leadership, while others question the future of the North under this new rule. Regardless, the banners of House Stark now fly high over Winterfell once more."
GOT_Location_News.5.a: "The North remembers its new lord."

GOT_Location_News.6.t: "[NOR.GetLeader] Named Lady of Winterfell"
GOT_Location_News.6.d: "In a shift that has captured the attention of the realm, [NOR.GetLeader] has been named Lady of Winterfell, assuming control of the Stark stronghold. Once a seat of men, the halls of Winterfell are now under the rule of a woman — a decision both progressive and controversial. While many in the North honor the Stark legacy, some question whether this new leadership will stand firm against the harsh winds of the world. Yet the iron will of House Stark runs deep, and the North watches closely."
GOT_Location_News.6.a: "Winterfell rises under a new matriarch."

GOT_Location_News.7.t: "[STO.GetLeader] Named Lord of Storm's End"
GOT_Location_News.7.d: "In a decision that has echoed across the stormlands, [STO.GetLeader] has been named Lord of Storm's End, the ancestral seat of House Baratheon. The stone fortress, which has withstood countless storms, now falls under the rule of a new hand. Some hail the decision as a return to strength, while others whisper that the winds of change may weaken the Baratheon grip on the stormlands. Only time will tell whether this new ruler can keep the storm at bay."
GOT_Location_News.7.a: "A new storm rises at Storm's End."

GOT_Location_News.8.t: "[STO.GetLeader] Named Lady of Storm's End"
GOT_Location_News.8.d: "In a move that has both surprised and intrigued the realm, [STO.GetLeader] has been named Lady of Storm's End, the proud and weathered seat of House Baratheon. With the title now claimed by a woman, many wonder how the stormlands will respond to this shift in leadership. Some see it as a sign of strength and adaptability, while others believe that the Baratheon legacy may be in jeopardy. The storm may be ready for a new face at its helm."
GOT_Location_News.8.a: "The stormlands bow to a new matriarch."

GOT_Location_News.9.t: "[VAL.GetLeader] Named Lord of the Eyrie"
GOT_Location_News.9.d: "In an unexpected turn, [VAL.GetLeader] has been named Lord of the Eyrie, the impregnable seat of House Arryn. The lofty fortress, high above the Vale, now belongs to a new ruler. Though the people of the Vale have long been known for their loyalty, many wonder whether this new leadership will strengthen or divide the region. The winds of change blow cold, but House Arryn's legacy remains unwavering, high in the mountains."
GOT_Location_News.9.a: "A new lord ascends to the mountain peaks."

GOT_Location_News.10.t: "[VAL.GetLeader] Named Lady of the Eyrie"
GOT_Location_News.10.d: "In a decision that has left the Vale abuzz, [VAL.GetLeader] has been named Lady of the Eyrie, ruling from the ancient seat of House Arryn. As the first woman to hold this title in the Eyrie’s long history, she faces both praise and skepticism. Some view this as a bold and just move, while others question whether the fragility of the Eyrie’s political position will remain intact under this new rule. The future of the Vale now rests in her hands."
GOT_Location_News.10.a: "A new lady rises in the mountains."

GOT_Location_News.11.t: "[DOR.GetLeader] Named Prince of Sunspear"
GOT_Location_News.11.d: "In a decision that echoes across the sands, [DOR.GetLeader] has been named Prince of Sunspear, the heart of House Martell. The sun-baked city now falls under new leadership, and with it, the fate of Dorne. Some celebrate the appointment as a return to House Martell’s glory, while others whisper of rising tensions between the traditionalists and reformists. In Dorne, change is always a matter of time."
GOT_Location_News.11.a: "A new sun rises over Dorne."

GOT_Location_News.12.t: "[DOR.GetLeader] Named Princess of Sunspear"
GOT_Location_News.12.d: "In a bold and historic decision, [DOR.GetLeader] has been named Princess of Sunspear, taking the seat of House Martell in a realm long ruled by men. The news spreads rapidly through the desert, with some hailing the decision as a stride toward equality, while others question whether a woman can preserve the delicate balance of power in Dorne. Regardless, House Martell’s legacy finds new leadership beneath the scorching sun."
GOT_Location_News.12.a: "Dorne bows to a new matriarch."


GOT_Location_News.13.t: "[REA.GetLeader] Named Lord of Highgarden"
GOT_Location_News.13.d: "In a move that has left the Reach buzzing with speculation, [REA.GetLeader] has been named Lord of Highgarden, the majestic seat of House Tyrell. The lush fields and fertile lands of the Reach now fall under the rule of a new leader, whose ability to manage the powerful bannermen of the region will be tested. While some see this as the return of stability, others are wary of what this new leadership might mean for the future of the Reach."
GOT_Location_News.13.a: "The Reach flourishes under a new lord."

GOT_Location_News.14.t: "[REA.GetLeader] Named Lady of Highgarden"
GOT_Location_News.14.d: "In a remarkable and unprecedented turn, [REA.GetLeader] has been named Lady of Highgarden, the great seat of House Tyrell. As the first woman to claim the title, she faces both high expectations and deep skepticism from the powerful houses of the Reach. While some hail her as a symbol of change, others doubt her ability to command the loyalty of the region’s lords. The Tyrell legacy now rests in her hands, and the future of the Reach remains uncertain."
GOT_Location_News.14.a: "A new lady reigns over the Reach."

GOT_Location_News.15.t: "[RIV.GetLeader] Named Lord of Riverrun"
GOT_Location_News.15.d: "In a move that has sent ripples through the Riverlands, [RIV.GetLeader] has been named Lord of Riverrun, the ancestral seat of House Tully. The great castle by the river now falls under the rule of a new lord, and with it, the future of the Riverlands. While some see this as the restoration of House Tully’s power, others worry about the turbulent political waters that may follow. The rivers of the land may change course, but they will always run through Riverrun."
GOT_Location_News.15.a: "A new lord claims the heart of the Riverlands."

GOT_Location_News.16.t: "[RIV.GetLeader] Named Lady of Riverrun"
GOT_Location_News.16.d: "In a bold and historic turn, [RIV.GetLeader] has been named Lady of Riverrun, the powerful seat of House Tully. As the first woman to hold this title, she faces both the legacy of her house and the weight of the Riverlands’ expectations. Some view her ascent as a refreshing change, while others question whether she can keep the unstable region in line. The waters of Riverrun now run beneath a new matriarch’s reign."
GOT_Location_News.16.a: "Riverrun rises under a new matriarch."

GOT_Location_News.17.t: "[DRA.GetLeader] Named Lord of Dragonstone"
GOT_Location_News.17.d: "In a historic decision, [DRA.GetLeader] has been named Lord of Dragonstone, the ancient seat of House Targaryen. The volcanic island, once the stronghold of the dragonlords, now falls under the command of a new ruler. Some see this as a symbol of the Targaryen legacy returning to the forefront, while others whisper that the island’s power may be eroded by new leadership. The stormwinds howl, but Dragonstone remains a bastion of fire and stone."
GOT_Location_News.17.a: "A new flame rises at Dragonstone."

GOT_Location_News.18.t: "[DRA.GetLeader] Named Lady of Dragonstone"
GOT_Location_News.18.d: "In a move that has ignited both admiration and doubt, [DRA.GetLeader] has been named Lady of Dragonstone, the ancient stronghold of House Targaryen. As the first woman to claim the title, she now commands the island’s storied legacy and the potential return of dragons to the realm. While some praise the appointment as a bold step forward, others fear that the island’s traditions and strength may be weakened under her leadership. Dragonstone’s future now rests in her hands."
GOT_Location_News.18.a: "Dragonstone welcomes a new matriarch."

GOT_Location_News.19.t: "[IRO.GetLeader] Named Lord Reaper of Pyke"
GOT_Location_News.19.d: "In a decision that reverberates across the Iron Islands, [IRO.GetLeader] has been named Lord Reaper of Pyke, the ancestral seat of House Greyjoy. The Ironborn now look to a new ruler, one who will guide them through the turbulent waters of the Sunset Sea. While some view this as a return to the strength of the Greyjoy legacy, others question whether the Iron Islands can survive under a new hand. The sea winds howl as the Ironborn prepare for a new era."
GOT_Location_News.19.a: "A new iron lord rises from the waves."

GOT_Location_News.20.t: "[IRO.GetLeader] Named Lady Reaper of Pyke"
GOT_Location_News.20.d: "In an unprecedented move, [IRO.GetLeader] has been named Lady Reaper of Pyke, claiming the seat of House Greyjoy. As the first woman to rule the Iron Islands, she faces both the harsh traditions of her people and the challenges of leading a kingdom bound by the sea. Some praise the appointment as a sign of change and progress, while others question if a woman can truly lead the Ironborn. The waves crash, but the future of Pyke now rests in her hands."
GOT_Location_News.20.a: "Pyke bows to a new matriarch."

GOT_Location_News.21.t: "[NWA.GetLeader] Elected Lord Commander of the Night's Watch"
GOT_Location_News.21.d: "At the edge of the world, where the Wall stands against the frozen wilds, [NWA.GetLeader] has been elected as the new Lord Commander of the Night’s Watch. Chosen by the sworn brothers of the order, [NWA.GetLeader] now bears the weight of leadership in a time of growing shadows. With threats stirring beyond the Wall and tensions within the Watch itself, the new Lord Commander must unite the black-cloaked sentinels for what may be their most perilous hour. All eyes now turn to Castle Black, where fate and frost converge."
GOT_Location_News.21.a: "The realm has a new shield in the North."

GOT_Location_News.22.t: "[NWA.GetLeader] Elected Lady Commander of the Night's Watch"
GOT_Location_News.22.d: "In a moment that defies centuries of tradition, [NWA.GetLeader] has been named the first Lady Commander of the Night’s Watch. Her election marks a turning point in the ancient brotherhood, where oaths are sworn for life and the Wall has stood against the cold for generations. Some question the break from custom, but others see strength in change — a leader forged in the same cold steel as the men she commands. As the long night creeps closer, Castle Black once again becomes the crucible of history."
GOT_Location_News.22.a: "A black cloak, a new command."

GOT_Location_News.23.t: "[WIL.GetLeader] Declared King-Beyond-the-Wall"
GOT_Location_News.23.d: "From the frozen expanse of the Far North comes word that [WIL.GetLeader] has united the Free Folk under a single banner, claiming the ancient and fearsome title of King-Beyond-the-Wall. Among a people who kneel to no throne and follow no crown, such unity is rare — and dangerous. Whispers of giants, raiders, and sorcery trail behind the new king’s rise. With the Wall standing tall between them and the realms of men, the old stories stir once more. The true North is on the move."
GOT_Location_News.23.a: "A wild king rises from the snow."

GOT_Location_News.24.t: "[WIL.GetLeader] Declared Queen-Beyond-the-Wall"
GOT_Location_News.24.d: "In a moment both historic and perilous, [WIL.GetLeader] has taken the mantle of Queen-Beyond-the-Wall, uniting the scattered clans of the Free Folk under one fierce will. Her ascent defies not only the traditions of the South, but also those of her own people — yet the harsh lands of the North breed harsh leaders, and none question her right who cannot best her. The wind howls across the tundra, and under her rule, the Free Folk look southward with purpose. The Wall may no longer be enough."
GOT_Location_News.24.a: "The wild marches under her banner."

 #Crownlands  
GOT_Location_Country.31.t: "Our Claim to the Crownlands"  
GOT_Location_Country.31.d: "[FROM.GetLeader], of [FROM.GetParty], has today proclaimed their rightful claim to the Crownlands. With ancestral ties and royal lineage as their foundation, they assert that these lands belong to them by birthright. Let it be known across Westeros that we do not forget the legacy of our house."  
GOT_Location_Country.31.a: "The Crownlands are ours by right."

GOT_Location_News.31.t: "[FROM.GetName] Lays Claim to the Crownlands"  
GOT_Location_News.31.d: "In a bold move with deep historical implications, [FROM.GetLeader], ruling over [FROM.GetName] and leading House [FROM.GetParty], has laid claim to the Crownlands. This declaration is said to stem from dynastic legitimacy and ancestral right, and is already stirring tensions across Westeros. Many now wonder if this is merely a symbolic gesture—or a prelude to war."  
GOT_Location_News.31.a: "A dangerous precedent has been set."

 # Westerlands
GOT_Location_Country.32.t: "Our Claim to the Westerlands"
GOT_Location_Country.32.d: "[FROM.GetLeader], of [FROM.GetParty], has declared their rightful claim to the Westerlands. Citing blood ties, feudal obligation, and ancestral dominion, they have declared these gold-rich lands as part of their house’s inheritance. The drums of ambition beat louder with each passing day."
GOT_Location_Country.32.a: "The Westerlands shall return to us."

GOT_Location_News.32.t: "[FROM.GetName] Lays Claim to the Westerlands"
GOT_Location_News.32.d: "In a move that may shake the foundations of Westeros, [FROM.GetLeader] of [FROM.GetName], leading House [FROM.GetParty], has formally laid claim to the Westerlands. The declaration references ancient rights and familial ties to the region, but many suspect this is a prelude to armed conflict. The great houses now watch carefully—will gold or steel decide the matter?"
GOT_Location_News.32.a: "The lions may yet roar."

 # The North
GOT_Location_Country.33.t: "Our Claim to the North"
GOT_Location_Country.33.d: "[FROM.GetLeader], of [FROM.GetParty], has declared their ancient and rightful claim to the North. Rooted in old blood and forged in ice and hardship, this claim speaks not only to history but to destiny. The howling winds carry our name, and soon, so shall the land."
GOT_Location_Country.33.a: "The North remembers who its true rulers are."

GOT_Location_News.33.t: "[FROM.GetName] Lays Claim to the North"
GOT_Location_News.33.d: "In a powerful declaration invoking both legacy and tradition, [FROM.GetLeader] of [FROM.GetName], head of House [FROM.GetParty], has laid claim to the vast region of the North. Though their justification is steeped in ancestral right, the timing of the announcement has many whispering of war to come. Winter may not be the only threat on the horizon."
GOT_Location_News.33.a: "A cold wind rises."

 # Stormlands
GOT_Location_Country.34.t: "Our Claim to the Stormlands"
GOT_Location_Country.34.d: "[FROM.GetLeader], of [FROM.GetParty], has proclaimed a rightful claim to the Stormlands. Citing blood ties to the storm kings of old and a legacy forged in thunder and war, they vow to restore their dominion over the region. Let the storm break—and sweep away all who stand in our path."
GOT_Location_Country.34.a: "The Stormlands belong to us."

GOT_Location_News.34.t: "[FROM.GetName] Lays Claim to the Stormlands"
GOT_Location_News.34.d: "With thunderous resolve, [FROM.GetLeader] of [FROM.GetName], leading House [FROM.GetParty], has laid claim to the Stormlands. The declaration harkens back to ancient dynasties and the storm-forged rule of their ancestors. While some see this as an appeal to history, others fear the sound of drums in the distance—war may soon follow the storm."
GOT_Location_News.34.a: "The realm braces for a tempest."

 # The Eyrie
GOT_Location_Country.35.t: "Our Claim to the Eyrie"
GOT_Location_Country.35.d: "[FROM.GetLeader], of [FROM.GetParty], has declared their rightful claim to the Eyrie and the Vale. Drawing upon the legacy of mountain kings and noble bloodlines, they assert that these soaring heights are theirs by ancestral right. Let the falcons fly once more beneath our banner."
GOT_Location_Country.35.a: "The Vale is ours by right."

GOT_Location_News.35.t: "[FROM.GetName] Lays Claim to the Eyrie"
GOT_Location_News.35.d: "In a declaration that echoes through the mountains, [FROM.GetLeader] of [FROM.GetName], leading House [FROM.GetParty], has laid claim to the Eyrie and the Vale. With lineage traced to ancient rulers of the highlands, this move has stirred the winds in Westeros. Allies and enemies alike will be watching the heights

 # Dorne
GOT_Location_Country.36.t: "Our Claim to Dorne"
GOT_Location_Country.36.d: "[FROM.GetLeader], of [FROM.GetParty], has declared their rightful claim to Dorne. Rooted in the fiery blood of ancient royalty and bound by the memory of old allegiances, this proclamation asserts that the southern sands are theirs by right. The sun beats down, but we do not waver."
GOT_Location_Country.36.a: "The sands remember our name."

GOT_Location_News.36.t: "[FROM.GetName] Lays Claim to Dorne"
GOT_Location_News.36.d: "In a declaration bound to stir the southern realms, [FROM.GetLeader] of [FROM.GetName], leading House [FROM.GetParty], has laid claim to Dorne. Invoking blood ties and ancient oaths, this move challenges the status quo of Westerosi rule. From Sunspear to the mountains, tensions rise once more."
GOT_Location_News.36.a: "The heat in Dorne grows ever fiercer."

 # Reach
GOT_Location_Country.37.t: "Our Claim to the Reach"
GOT_Location_Country.37.d: "[FROM.GetLeader], of [FROM.GetParty], has declared their rightful claim to the Reach. With ancient roots sunk deep into the fertile heart of Westeros, they invoke the legacy of their forebears to justify their right to rule these prosperous lands. The fields shall bloom under their banner once more."
GOT_Location_Country.37.a: "The Reach is ours by heritage and strength."

GOT_Location_News.37.t: "[FROM.GetName] Lays Claim to the Reach"
GOT_Location_News.37.d: "In a sweeping assertion of ancestral right, [FROM.GetLeader] of [FROM.GetName], speaking for House [FROM.GetParty], has laid claim to the Reach. Known for its wealth and vital position within Westeros, the Reach now finds itself the focus of growing ambition and revived dynastic memory. The balance of power shifts again."
GOT_Location_News.37.a: "The green heart of the realm is contested."

 # Riverlands
GOT_Location_Country.38.t: "Our Claim to the Riverlands"
GOT_Location_Country.38.d: "[FROM.GetLeader], of [FROM.GetParty], has laid claim to the Riverlands, invoking their house's historical dominion over these fertile lands. With their bloodline intertwined with the ancient rivers of Westeros, they assert their right to rule, promising peace and prosperity to the region under their banner."
GOT_Location_Country.38.a: "The Riverlands are ours to govern."

GOT_Location_News.38.t: "[FROM.GetName] Lays Claim to the Riverlands"
GOT_Location_News.38.d: "In a bold declaration that echoes the past, [FROM.GetLeader], leader of [FROM.GetName] and House [FROM.GetParty], has proclaimed their claim to the Riverlands. With ties to the very soil of the realm and a deep sense of heritage, their move is being met with both support and fear, as the potential for unrest grows in the heart of Westeros."
GOT_Location_News.38.a: "The heart of the realm is in flux."

 # Dragonstone
GOT_Location_Country.39.t: "Our Claim to Dragonstone"
GOT_Location_Country.39.d: "[FROM.GetLeader], of [FROM.GetParty], has formally declared their claim to Dragonstone. With the island's ancient connection to House Targaryen, they assert their dominion over the ancestral seat of the dragonlords. The flames of heritage burn brightly in this bold claim, setting the stage for a potential resurgence of Targaryen might."
GOT_Location_Country.39.a: "Dragonstone belongs to us by right."

GOT_Location_News.39.t: "[FROM.GetName] Lays Claim to Dragonstone"
GOT_Location_News.39.d: "In a moment that has reignited old flames, [FROM.GetLeader], ruling over [FROM.GetName] and House [FROM.GetParty], has claimed Dragonstone, the ancient seat of House Targaryen. This declaration, laden with the weight of history, raises questions about the future of Westeros and whether the Targaryen legacy is destined to return in full force."
GOT_Location_News.39.a: "The dragon's shadow looms once more."

 # Iron Islands
GOT_Location_Country.40.t: "Our Claim to the Iron Islands"
GOT_Location_Country.40.d: "[FROM.GetLeader], of [FROM.GetParty], has staked a claim to the Iron Islands. With a legacy of ironborn traditions and the old gods watching over them, they lay their right to rule these harsh and unforgiving lands. This is no mere assertion—it is a challenge to all who question their sovereignty over the Iron Islands."
GOT_Location_Country.40.a: "The Iron Islands are ours by law and custom."

GOT_Location_News.40.t: "[FROM.GetName] Lays Claim to the Iron Islands"
GOT_Location_News.40.d: "In a move that has sent ripples across the Iron Islands and beyond, [FROM.GetLeader], leader of [FROM.GetName] and House [FROM.GetParty], has claimed dominion over the Iron Islands. Their declaration harkens back to the old ways, invoking the ironborn's right to rule the harsh seas and windswept lands. This action is already stirring rumors of unrest and the possibility of open conflict."
GOT_Location_News.40.a: "A new storm brews over the Iron Islands."

 # Night's Watch
GOT_Location_Country.41.t: "Our Claim to the Night's Watch"
GOT_Location_Country.41.d: "[FROM.GetLeader], of [FROM.GetParty], has declared the rightful claim to the Night's Watch. As the defenders of the realm, we assert that the lands beyond the Wall are part of our dominion. Our heritage as protectors of the realm demands this recognition, and we will not stand by while others seek to undermine our authority over the Watch."
GOT_Location_Country.41.a: "The Night's Watch belongs to us."

GOT_Location_News.41.t: "[FROM.GetName] Lays Claim to the Night's Watch"
GOT_Location_News.41.d: "In a striking declaration, [FROM.GetLeader], leader of [FROM.GetName] and House [FROM.GetParty], has asserted their claim to the Night's Watch. Citing the need to protect the realm from the dangers beyond the Wall, this bold move has already sparked debate across the Seven Kingdoms. Whether this is a political maneuver or a precursor to military action remains uncertain."
GOT_Location_News.41.a: "Tensions rise over the future of the Night's Watch."

 # Wildlings Land
GOT_Location_Country.42.t: "Our Claim to the Wildlings' Land"
GOT_Location_Country.42.d: "[FROM.GetLeader], of [FROM.GetParty], has boldly declared their claim to the lands of the Wildlings. With the Wall standing between us and these lands, we now assert our right to these territories, which have long been home to those who defy the realm. It is time to bring them under our rule and ensure they no longer threaten the peace of Westeros."
GOT_Location_Country.42.a: "The Wildlings' Land is ours."

GOT_Location_News.42.t: "[FROM.GetName] Lays Claim to the Wildlings' Land"
GOT_Location_News.42.d: "In a daring and controversial move, [FROM.GetLeader], ruling over [FROM.GetName] and House [FROM.GetParty], has laid claim to the lands of the Wildlings beyond the Wall. This declaration comes at a time of increasing tensions, with many questioning whether this is an attempt to consolidate power or if there are larger ambitions at play. The fate of the Wildlings remains uncertain, and the Seven Kingdoms wait for what will come next."
GOT_Location_News.42.a: "A bold claim with uncertain consequences."

 GOT_Location_News.51.t:0 "The Fall of King's Landing"
 GOT_Location_News.51.d:0 "At dawn today, [FROM.GetAdjective] forces smashed through the hastily erected defenses at the gates of King's Landing. Advanced vanguards were seen securing the Grand Sept of Baelor as smoke from raging fires across the city billowed high into the sky.\n\nHeavy fighting erupted near the Red Keep, where [FROM.GetAdjective] troops were forced to breach the heavy iron gates and clear room-by-room against stubborn defenders intent on fighting to the bitter end. The ancient seat of the Seven Kingdoms is now in [FROM.GetAdjective] hands, though much of the city lies in smoldering ruins.\n\nUnconfirmed reports indicate the Iron Throne itself remains intact amidst the ashes, while key members of the royal court fled east ahead of the city's collapse."
 GOT_Location_News.51.a:0 "Is this the end of the Seven Kingdoms?"
 GOT_Location_News.51.b:0 "At last, King's Landing is ours!"
 GOT_Location_News.51.c:0 "The invaders must be driven from King's Landing!"
 
 GOT_Location_News.52.t:0 "The Fall of Casterly Rock"
 GOT_Location_News.52.d:0 "At dawn today, [FROM.GetAdjective] forces breached the ancient defenses guarding the lower approaches to Casterly Rock. Spearmen and heavy infantry pressed into the subterranean mines, where smoke from burning siege engines filled the vast carved halls.\n\nDesperate fighting erupted around the Golden Gallery and the Lion's Mouth, where stubborn Lannister holdouts made a bitter last stand to defend the ancestral seat of House Lannister. The mighty fortress carved into the stone is now in [FROM.GetAdjective] hands, though its famous gold vaults lie raided and its banners torn down.\n\nUnconfirmed reports indicate that several high-born commanders managed to slip out through hidden coastal tunnels before the final collapse."
 GOT_Location_News.52.a:0 "A dark day for the West..."
 GOT_Location_News.52.b:0 "The Rock has finally fallen to us!"
 GOT_Location_News.52.c:0 "We must reclaim the Rock from the invaders!"
 
 GOT_Location_News.53.t:0 "The Fall of Winterfell"
 GOT_Location_News.53.d:0 "At dawn today, [FROM.GetAdjective] forces battered through the double granite walls of Winterfell. Vanguard units pushed deep into the Great Keep as thick smoke billowed into the freezing northern air from burning siege towers and shattered courtyards.\n\nFierce hand-to-hand combat raged through the Godswood and the ancient crypts, where stubborn defenders made a desperate last stand beneath the stone faces of the old Kings of Winter. The historic heart of the North is now under [FROM.GetAdjective] control, leaving the fortress scarred and its famous hot springs running red.\n\nUnconfirmed reports suggest key members of the northern line escaped south through hidden passageways before the courtyard was completely overrun."
 GOT_Location_News.53.a:0 "The North remembers..."
 GOT_Location_News.53.b:0 "Winterfell is ours at last!"
 GOT_Location_News.53.c:0 "The invaders must be driven from the North!"
 
 GOT_Location_News.54.t:0 "The Fall of Storm's End"
 GOT_Location_News.54.d:0 "At dawn today, [FROM.GetAdjective] forces finally breached the massive outer curtain wall of Storm's End. Vanguard units pressed through the shattered sea gate as gale-force winds and heavy rain whipped across Shipbreaker Bay, carrying thick smoke from burning siege engines into the tempest.\n\nFierce, brutal hand-to-hand combat raged within the immense central drum tower, long thought to be impervious to magic or siege craft. Stubborn defenders fought down to the last hallway before the fortress was ultimately secured. The legendary ancestral seat of House Baratheon is now under [FROM.GetAdjective] control, its proud stag banner torn down amidst the howling storm.\n\nUnconfirmed reports indicate several defenders attempted to escape into the churning waters below, though few are believed to have survived the rocks."
 GOT_Location_News.54.a:0 "Even the drum tower could not hold..."
 GOT_Location_News.54.b:0 "Storm's End has fallen to us!"
 GOT_Location_News.54.c:0 "We must reclaim Storm's End from the invaders!"
 
 GOT_Location_News.55.t:0 "The Fall of the Eyrie"
 GOT_Location_News.55.d:0 "At dawn today, [FROM.GetAdjective] forces completed their perilous ascent of the Giant's Lance and forced their way into the Eyrie. Vanguard troops stormed through the bloody gate and swept past the stone waycastles as mountain winds howled through the high peaks.\n\nDesperate, bitter fighting erupted within the High Hall of Arryn, where defenders made a heroic stand around the Weirwood Throne. Sentinels and knights fought until the end, with several high-ranking officers cast out through the Moon Door into the abyss below during the final chaos. The impregnable mountain sanctuary is now under [FROM.GetAdjective] control, its falcon banner cast down into the clouds.\n\nUnconfirmed reports indicate that a small party managed to escape down the perilous winch chains before the mountain pass was sealed."
 GOT_Location_News.55.a:0 "As High as Honor... and now fallen."
 GOT_Location_News.55.b:0 "The Eyrie is ours at last!"
 GOT_Location_News.55.c:0 "The invaders must be driven from the Vale!"
 
 GOT_Location_News.56.t:0 "The Fall of Sunspear"
 GOT_Location_News.56.d:0 "At dawn today, [FROM.GetAdjective] forces battered through the triple winding walls of Sunspear. Spearmen and assault infantry swept past the Shadow City, where thick smoke from burning sand-skiffs and coastal watchtowers drifted over the shimmering waters of the Summer Sea.\n\nBrutal combat erupted within the Old Palace and around the Spear Tower, where stubborn Martell guards fought fiercely beneath the scorching desert sun. defenders contested every corridor before the palace was finally subdued. The seat of Dornish power is now in [FROM.GetAdjective] hands, its sun and spear banner torn down amidst the heat and ruins.\n\nUnconfirmed reports indicate several high-born Dornish figures slipped into the deep red dunes of the hinterlands to continue the resistance."
 GOT_Location_News.56.a:0 "Unbowed, Unbroken... but now fallen."
 GOT_Location_News.56.b:0 "Sunspear has fallen to us!"
 GOT_Location_News.56.c:0 "Drive the invaders back into the sea!"
 
 GOT_Location_News.57.t:0 "The Fall of Highgarden"
 GOT_Location_News.57.d:0 "At dawn today, [FROM.GetAdjective] forces breached the outer concentric white stone walls of Highgarden. Assault units pressed through the shattered gates as thick smoke drifted across the famous marble arcades, orchards, and burning pleasure gardens along the Mander.\n\nFierce hand-to-hand combat erupted through the maze of gilded halls and surrounding battlements, where stubborn Tyrell loyalists made a desperate stand to protect the ancestral seat of the Reach. The great castle is now under [FROM.GetAdjective] control, its golden rose banner torn down amidst the ashes of the Reach's pride.\n\nUnconfirmed reports indicate that vast stores of grain and coin were captured in the lower vaults, though several regional commanders managed to flee downriver."
 GOT_Location_News.57.a:0 "Growing Strong no longer..."
 GOT_Location_News.57.b:0 "Highgarden is ours at last!"
 GOT_Location_News.57.c:0 "The invaders must be driven from the Reach!"
 
 GOT_Location_News.58.t:0 "The Fall of Riverrun"
 GOT_Location_News.58.d:0 "At dawn today, [FROM.GetAdjective] forces breached the sandstone walls of Riverrun after forcing a crossing over the sluice-gates. Vanguard units surged through the flooded moats as heavy smoke drifted over the confluence of the Tumblestone and Red Fork rivers.\n\nFierce, claustrophobic fighting raged across the central keep and water towers, where stubborn Tully defenders contested every courtyard and stairwell. Despite holding out against the rising waters and relentless bombardment, the garrison was ultimately overwhelmed. The ancestral stronghold of the Riverlands is now under [FROM.GetAdjective] control, its leaping trout banner cast into the muddy river currents below.\n\nUnconfirmed reports indicate that several commanders used the fortress's famous water gates to slip downstream under cover of the morning fog."
 GOT_Location_News.58.a:0 "Family, Duty, Honor... shattered."
 GOT_Location_News.58.b:0 "Riverrun has fallen to us!"
 GOT_Location_News.58.c:0 "The invaders must be driven from the Riverlands!"
 
 GOT_Location_News.59.t:0 "The Fall of Dragonstone"
 GOT_Location_News.59.d:0 "At dawn today, [FROM.GetAdjective] amphibious forces forced a landing upon the black volcanic shores of Dragonstone. Vanguard assault units stormed past the carved dragon gates as salty ocean spray mixed with thick smoke rising from burning harbor ships and coastal watchtowers.\n\nBrutal combat raged up the stone stairways and inside the Stone Drum tower, where defenders fought tenaciously beneath the ominous gargoyles. Despite the formidable Valyrian architecture and island position, the fortress was finally breached. The legendary seat of House Targaryen and ancient island citadel is now under [FROM.GetAdjective] control, its dragon banners torn down over the stormy narrow sea.\n\nUnconfirmed reports suggest several high-ranking officers evacuated key valyrian artifacts by sea before the harbor was completely blockaded."
 GOT_Location_News.59.a:0 "The ancient citadel has fallen..."
 GOT_Location_News.59.b:0 "Dragonstone is ours at last!"
 GOT_Location_News.59.c:0 "The invaders must be driven from Dragonstone!"
 
 GOT_Location_News.60.t:0 "The Fall of Pyke"
 GOT_Location_News.60.d:0 "At dawn today, [FROM.GetAdjective] forces completed a perilous amphibious assault across the treacherous cliffs and jagged rocks of Pyke. Vanguard units forced their way across the swaying rope bridges connecting the ancient sea towers as crushing waves and black smoke swept over the Iron Islands.\n\nFierce, unyielding combat raged through the Great Keep and the Kitchen Keep, where stubborn Ironborn defenders made a bloody last stand, giving no quarter and asking for none. The fortress was ultimately overwhelmed, its sea-carved towers captured. The ancient seat of House Greyjoy is now under [FROM.GetAdjective] control, its golden kraken banner cast into the foaming sea below.\n\nUnconfirmed reports indicate that several longships managed to slip into the sea fog, taking surviving raiders into the open ocean."
 GOT_Location_News.60.a:0 "What is dead may never die..."
 GOT_Location_News.60.b:0 "Pyke has fallen to us!"
 GOT_Location_News.60.c:0 "Drive the invaders back into the sea!"
 
 GOT_Location_News.61.t:0 "The Fall of Castle Black"
 GOT_Location_News.61.d:0 "At dawn today, [FROM.GetAdjective] forces breached the wooden palisades and outer defenses of Castle Black. Vanguard units pressed past the timber keeps and armories as howling northern winds carried thick smoke high against the towering, icy face of the Wall.\n\nDesperate, bitter fighting raged through the Lord Commander's tower and the dark stone passages of the fortress, where stubborn brothers of the Night's Watch made a final stand. Despite the stronghold's lack of southern fortification, defenders fought to the last man before the headquarters was subdued. The primary bastion of the Wall is now under [FROM.GetAdjective] control, leaving the Night's Watch shattered and the realm exposed.\n\nUnconfirmed reports indicate a handful of rangers fled through the wormways beneath the ice, heading deeper into the haunted forest."
 GOT_Location_News.61.a:0 "And now their watch is ended..."
 GOT_Location_News.61.b:0 "Castle Black is ours at last!"
 GOT_Location_News.61.c:0 "The invaders must be driven from the Wall!"
 
