 # 715 — Arya Defeats the Night King
 GOT_Story_Country.715.t:0 "Dawn at the Edge of Extinction"
 GOT_Story_Country.715.d:0 "The Long Night brought a nightmare to Winterfell’s ancient stone walls. Thousands fell to the relentless wave of wights, and as the cold mist swallowed the godswood, the Night King raised his hand to end the reign of living men forever. But from the shadows stepped Arya Stark. With a single, decisive strike from a Valyrian steel dagger, the ancient terror shattered into dust. In an instant, the endless swarm crumbled, the freezing winds died down, and the morning sun broke over a battered but victorious North. The realm of the living endures."
 GOT_Story_Country.715.a:0 "The Long Night is ended!"

 GOT_Story_News.715.t:0 "Dawn Breaks: The Long Night Ends"
 GOT_Story_News.715.d:0 "Ravens carrying desperate dispatches from the North have arrived across the realm, bringing news that borders on the miraculous. At the gates of Winterfell, where the army of the dead threatened to swallow the world of living men, the Great War reached its terrifying climax. It was Arya Stark who delivered the killing blow, driving a Valyrian steel blade into the Night King himself. In a single heart-stopping moment, the dark lord turned to ice-shards, and the vast undead horde collapsed into lifeless dust. The unnatural winter recedes, and for the first time in millennia, the realm looks toward the dawn without fear."
 GOT_Story_News.715.a:0 "Dawn rises over Westeros!"

