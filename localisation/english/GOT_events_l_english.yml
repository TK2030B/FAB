Game_Event.1.t:0 "Welcome (1/5)"
Game_Event.1.d:0 "First of all, I’d like to extend my deepest thanks to §RRoemer9§!—without him and his *Westeros at War* mod, as well as §RMaestro§! and his *Old Europe 1300* mod, this project would not have been possible.\n\nI hope you enjoy playing this mod as much as I enjoyed making it. It’s still a work in progress, but it’s fully playable and should provide a fun and immersive experience from the beginning to the end of the series.\n\nDon’t forget to §Rjoin the Discord§! to share your feedback, discuss strategies, or just chat with fellow players.\n\nMost importantly—§Rhave fun!§!\n\n§R- TK2030§!"
Game_Event.1.a:0 "Reccommended SP Settings"
Game_Event.1.b:0 "Reccommended MP Settings"
Game_Event.1.c:0 "Plain Gameplay"
Game_Event.1.e:0 "Customize Gameplay"


Game_Event.2.t:0 "Game of Thrones Mode (2/5)"
Game_Event.2.d:0 "Game of Thrones Mode is currently §ROFF§!.\n\nYou're playing with mechanics that closely follow base HOI4, offering a more traditional gameplay experience.\n\nWould you like to enable Game of Thrones Mode? This immersive mode introduces major changes:\n- Dragons are 10× more expensive but also 10× more powerful\n- Additional tweaks to mechanics for a truly Westerosi feel.\n\nRecommendation: Enable this mode for a more epic and thematic experience — or keep it off if you prefer a classic HOI4 base."
Game_Event.2.a:0 "TURN §GON§!"
Game_Event.2.b:0 "TURN §ROFF§!"

Game_Event.3.t:0 "Vanilla Mode Chosen"
Game_Event.3.d:0 "§R[FROM.GetName]§! has selected §RVanilla Mode§!. The game will follow standard HOI4 mechanics with minimal changes."
Game_Event.3.a:0 "OK"

Game_Event.4.t:0 "Game of Thrones Mode Chosen"
Game_Event.4.d:0 "§R[FROM.GetName]§! has selected §RGame of Thrones Mode§!. This mode enables immersive mechanics, including powerful but costly §Rdragons§! and heavily fortified §RForts§!, among other adjustments."
Game_Event.4.a:0 "OK"

Game_Event.8.t:0 "Sandbox Mode (3/5)"
Game_Event.8.d:0 "Sandbox Mode is currently §ROFF§!.\n\nIn standard historical play, the Seven Kingdoms follow a more scripted path, with outcomes closely tied to canon events from the lore. This ensures a more stable and narrative-driven experience.\n\nEnabling Sandbox Mode changes this\n- Assassinations, coups, and alternate outcomes become possible, allowing more reactive and emergent storytelling — even with Historical Focuses turned on.\n- AI nations still follow their historical decisions, but players have the freedom to forge their own destiny.\n\nRecommendation:\n- For a lore-faithful experience: enable Game of Thrones Mode, keep Sandbox Mode §ROFF§, and turn Historical AI §GON§.\n- For chaotic multiplayer or creative roleplay: turn Sandbox Mode §GON§ and Historical AI §ROFF§ — or mix and match to create your ideal balance of narrative and freedom!"
Game_Event.8.a:0 "TURN §GON§!"
Game_Event.8.b:0 "TURN §ROFF§!"

Game_Event.9.t:0 "Realism Mode Enabled"
Game_Event.9.d:0 "§R[FROM.GetName]§! has activated §RRealism Mode§!. In this mode, scripted outcomes will play out with full historical weight: key assassinations, betrayals, and power shifts will proceed as they did in the source material if AI Historical Focuses is enabled. This setup is ideal for players who want a cinematic, lore-accurate experience with minimal divergence from canon events."
Game_Event.9.a:0 "Order must be maintained."


Game_Event.10.t:0 "Sandbox Mode Enabled"
Game_Event.10.d:0 "§R[FROM.GetName]§! has activated §RSandbox Mode§!. In this mode, scripted outcomes are softened, even in Historical Mode: events like assassinations may no longer be guaranteed, survival is possible, and unexpected developments can occur. This setup offers players greater flexibility, making it ideal for multiplayer and roleplay-driven games where freedom and unpredictability are valued."
Game_Event.10.a:0 "Good. Let the chaos begin."

Game_Event.11.t:0 "Peace Deals (4/5)"
Game_Event.11.d:0 "Adjust how the AI evaluates and responds to peace deals in your game. Choose the setting that best fits your preferred level of challenge and realism.\n\n- **AI Carefully Weighs Options**: The AI evaluates peace deals based on a wide range of strategic and situational factors. Expect more realistic and varied decisions, where the outcome of each proposal depends on the broader context of the war.\n\n- **AI Always Accepts Peace Deals**: The AI will automatically accept any peace deal offered, regardless of circumstances. Ideal for players who prefer fast, simplified conclusions to conflicts.\n\n- **AI Never Accepts Peace Deals**: The AI will automatically reject all peace offers, continuing to fight until total victory or defeat. This setting can be useful for multiplayer or those who want prolonged wars.\n\n- **Disable Peace Deal System**: Disables the custom peace deal mechanics entirely. The game will revert to default behavior or rely on other mod systems."
Game_Event.11.a:0 "AI Carefully Weighs Options"
Game_Event.11.b:0 "AI Always Accepts Peace Deals"
Game_Event.11.c:0 "AI Never Accepts Peace Deals"
Game_Event.11.e:0 "TURN §ROFF§!"

Game_Event.12.t:0 "Realm Administration Decisions (5/5)"
Game_Event.12.d:0 "You may now choose whether to enable or disable §WRealm Administration§! decisions. These tools are useful for consolidating power and expanding your direct control over your realm."
Game_Event.12.a:0 "TURN §GON§!"
Game_Event.12.b:0 "TURN §ROFF§!"

 Game_Event.14.t:0 "Customize Settings"
 Game_Event.14.d:0 "Welcome to the customize settings configuration menu. Choose how you wish to set up your campaign:\n\n* Select §ROption A§! to manually configure each individual game rule and setting to your liking.\n* Select §ROption B§! to explore unique, full conversion game modes—such as Battle Royale and other special scenarios.\n* Select §ROption C§! to exit this menu and return to the main welcome event."
 Game_Event.14.a:0 "Continue to Customize Settings"
 Game_Event.14.b:0 "Open Special Game Modes"
 Game_Event.14.c:0 "Return to Welcome Screen"
 
 # Game Event 15 - Custom Game Modes
 Game_Event.15.t:0 "Special Game Modes"
 Game_Event.15.d:0 "Select a special game mode to alter the core rules of the campaign:\n\n* §RBattle Royale Mode§!: Disbands and disables all factions, grants conquest wargoal decisions against every nation, disables peace negotiations, and enforces a sandbox environment for total continent-wide warfare.\n\nChoose an option below or return to the previous settings menu."
 Game_Event.15.a:0 "Enable Battle Royale Mode"
 Game_Event.15.b:0 "Go Back"
 
 Game_Event.16.t:0 "Battle Royale Mode Activated"
 Game_Event.16.d:0 "The host nation has initiated §YBattle Royale Mode§!!\n\nAll existing alliances and factions have been permanently disbanded, peace offers will no longer be accepted, and total conquest wargoal decisions are now available against every power across the realm. \n\nPrepare your realm—there can only be one conqueror standing."
 Game_Event.16.a:0 "To victory or death!"


 GOT_Generic.1.t: "The Red Riot"
 GOT_Generic.1.d: "What began as a protest by the smallfolk over food shortages and corrupt local rule quickly escalated into chaos. Armed with little more than tools and torches, the peasants stormed the town square—only to be met with brutal force. The clash left dozens dead, homes ablaze, and tensions at a breaking point. What was meant to be a demonstration has become a symbol of the deep divide festering beneath the surface."
 GOT_Generic.1.a: "Blood flows in the streets..."

 GOT_Generic.2.t: "Sabotage in the Workshops"
 GOT_Generic.2.desc: "Under the cover of night, saboteurs slipped into our workshops and smithies, setting fires and smashing what they could not steal. These were no mere thieves—they were agitators, radicals stirred by whispers of rebellion and the blood spilled during the Red Riot. Crucial arms and tools lie in ruin, our ability to equip the realm gravely weakened. The revolution brews not only in the streets, but in the forges as well."
 GOT_Generic.2.a: "Their treachery will not go unpunished."
 RI_commie_damage: "Several workshops have been sabotaged."
 
 GOT_Generic.3.t: "The March on [From.Capital.GetName]"
 GOT_Generic.3.d: "The gates of [From.Capital.GetName] have fallen. What began as scattered unrest in the villages and hamlets has swelled into a full-scale uprising. Peasant militias and dissident banners now fly above the city walls, the old lords either slain or vanished into exile. In their place rise the voices of the common folk—organizing, declaring, demanding. The revolution has not just arrived—it has prevailed."
 GOT_Generic.3.a: "The people now rule."
 
 GOT_Generic.4.t: "The Backlash of the Old Blood"
 GOT_Generic.4.d: "Though the revolution triumphed in [From.Capital.GetName], the fires of victory have not yet burned away the old order. Disgraced lords, bannermen, and hardened commanders rally in the hills and strongholds, unwilling to yield to the rule of peasants and radicals. Across the countryside, whispers of counter-rebellion stir. The struggle is not over—the old blood resists, and they do so with steel."
 GOT_Generic.4.a: "They cling to the past like drowning men to driftwood."

 GOT_Generic.6.t: "The Grand Assembly"
 GOT_Generic.6.d: "Across the realm, banners were raised—not for war, but for discourse. From lords and learned scribes to guildmasters and village spokesmen, voices gathered in what came to be known as the Grand Assembly. Within its great hall, the people debated, argued, and ultimately decided the course of our nation. Power has shifted—not to the mob, but to the many. A new chapter begins, forged not by the sword, but by the will of the people."
 GOT_Generic.6.a: "Let the people's voice be our guide."
 
 GOT_Generic.7.t: "The Old Guard Resists"
 GOT_Generic.7.d: "Though the Assembly now steers the fate of the realm, not all bend the knee to this new order. Noble houses whisper of betrayal, officers mutter about lawless rabble, and some corners of the army begin to stir with discontent. The promise of a more just realm threatens those who once ruled by bloodline and birthright. The road ahead will not be without its saboteurs, both in the shadows and in plain sight."
 GOT_Generic.7.a: "They fear the future we now build."

 GOT_Generic.8.t: "Unite the Kingdom"
 GOT_Generic.8.d: "The voices calling for reform have been silenced, and the realm returns to the old ways. A new council has been formed, but its makeup is familiar—those who once held power are back at the helm, pledging to restore the stability that has long been absent. The people watch in uneasy silence as the old order is re-established, though not without whispers of doubt and uncertainty in the streets. For some, the restoration of unity is a blessing; for others, a curse."
 GOT_Generic.8.a: "Let us restore the rightful order."

 GOT_Generic.9.t: "Discontent Among the People"
 GOT_Generic.9.d: "The return to tradition has not been welcomed by all. Though the old elites reclaim their positions, there are those who had dreamed of something more—a realm that might break free from its shackles and embrace a new era of opportunity. Now, their hopes lie in tatters, and anger brews in the hearts of the common folk. Protests in the streets and rumors of unrest grow louder, as the dream of change fades beneath the heavy hand of the old guard."
 GOT_Generic.9.a: "They do not understand what it takes to rule."

 GOT_Generic.10.t: "The Coup of the True Monarch"
 GOT_Generic.10.d: "The realm has fallen under the iron fist of a single leader. The streets now echo with the sound of disciplined boots and the banners of the new order. The old elites have bent the knee, and the people are expected to fall in line. Though the promise of strength and unity is proclaimed, many question whether this is the dawn of true power or the beginning of a dark chapter in the history of our land."
 GOT_Generic.10.a: "Strength through unity, power through fear."

 GOT_Generic.11.t: "The Resistance of the Hopeful"
 GOT_Generic.11.d: "Not all have accepted this new rule. In the shadows, a growing resistance stirs, led by those who once dreamed of freedom and equality. These rebels see the rise of the tyrant as a betrayal of the very values they once held dear. Now, their hopes have turned to anger, and whispers of rebellion grow louder by the day. They will stop at nothing to restore what has been taken from them."
 GOT_Generic.11.a: "We will not kneel to tyranny."

 GOT_Generic.12.t: "The Old Gods"
 GOT_Generic.12.d: "The Old Gods of the Forest have long been worshipped by the people of the North, a faith steeped in ancient traditions and rituals. With the growth of other religions and the rise of foreign influences, some now question whether it is time to renew our devotion to the Old Gods. The question stands: should we reaffirm our connection to these ancient deities, or continue following the faith that has dominated our realm for so long?"
 GOT_Generic.12.a: "Embrace This New Faith"
 GOT_Generic.12.b: "Keep Our Current Faith"
 GOT_Generic.12.c: "We Already Worship Them"
 
 GOT_Generic.13.t: "The Drowned God"
 GOT_Generic.13.d: "The faith of the Drowned God, worshipped by the people of the Iron Islands, speaks of strength, rebirth, and the will to overcome death. It is a faith built around the sea and its power, promising eternal life through drowning and revival. As the Ironborn grow ever more devout, the question remains: should we embrace the Drowned God fully, or stay loyal to our established beliefs?"
 GOT_Generic.13.a: "What Is Dead May Never Die"
 GOT_Generic.13.b: "Keep Our Current Faith"
 GOT_Generic.13.c: "We Already Worship Him"
 
 GOT_Generic.14.t: "The Lord of Light"
 GOT_Generic.14.d: "The Lord of Light, a mysterious and powerful deity, offers a vision of the future filled with fire, life, and light. His followers believe in the eternal battle between light and darkness, with his followers often guided by visions and prophecies. As this religion gains followers and influence, we must decide whether we will embrace the Lord of Light or continue following our existing faith."
 GOT_Generic.14.a: "The Night Is Dark And Full of Terrors"
 GOT_Generic.14.b: "Keep Our Current Faith"
 GOT_Generic.14.c: "We Already Worship Him"
 
 GOT_Generic.15.t: "The Way of Salt And Iron"
 GOT_Generic.15.d: "The Way of Salt and Iron is a sacred tradition of the Ironborn, a code that emphasizes strength, resilience, and the importance of the sea in shaping their identity. It is a brutal and unforgiving path, where survival and honor are paramount. The Ironborn view salt as a symbol of life, and iron as a symbol of their strength and death. As their influence grows, we must decide whether to adopt this tradition or maintain our own."
 GOT_Generic.15.a: "Adopt The Ironborn Tradition"
 GOT_Generic.15.b: "Keep Our Current Tradition"
 GOT_Generic.15.c: "We Already Have That Tradition"
 
GOT_Generic.16.t: "The Great Stallion"
GOT_Generic.16.d: "The Great Stallion is the supreme deity of the Dothraki, representing strength, swiftness, and conquest across the vast grasslands of the Essos steppe. His followers believe that the stars in the night sky are a herd of fiery horses riding through the heavens, and that the strong will ride alongside him in the afterworld. As the influence of the horse lords expands, the question arises: should we bow to the divine power of the Great Stallion, or cling to our long-standing traditions?"
GOT_Generic.16.a: "The Stallion Who Mounts the World"
GOT_Generic.16.b: "Keep Our Current Faith"
GOT_Generic.16.c: "We Already Worship Him"

GOT_Generic.17.t: "The Lion of Night and Maiden-Made-of-Light"
GOT_Generic.17.d: "In the distant and ancient realm of Yi Ti, faith is bound to the sacred duality of the Maiden-Made-of-Light and the dark wrath of the Lion of Night. Steeped in ritual, imperial tradition, and veneration of the God-Emperors, this Eastern faith preaches harmony, celestial order, and eternal vigilance against the shadows. As whispers of their ancient wisdom reach beyond the Jade Sea, we must decide: shall we embrace the wisdom of the Golden Empire, or remain steadfast in our established beliefs?"
GOT_Generic.17.a: "Embrace the Imperial Truth"
GOT_Generic.17.b: "Keep Our Current Faith"
GOT_Generic.17.c: "We Already Worship Them"

GOT_Generic.18.t: "The Golden Tradition of Yi Ti"
GOT_Generic.18.d: "The imperial customs of Yi Ti are rooted in millennia of unmatched refinement, strict hierarchy, and devotion to the cosmic harmony of the Golden Empire. It is a path governed by courtly ritual, ancestral respect, and the absolute authority of the God-Emperors, where duty and lineage hold the realm together. As knowledge of these foreign ways spreads west from beyond the Jade Sea, we must decide whether to adopt this prestigious tradition or adhere to our own."
GOT_Generic.18.a: "Adopt The Imperial Tradition"
GOT_Generic.18.b: "Keep Our Current Tradition"
GOT_Generic.18.c: "We Already Have That Tradition"
 
