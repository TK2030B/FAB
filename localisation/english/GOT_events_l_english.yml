 GOT_Story_Country.1.t: "A Terror in the Woods"
 GOT_Story_Country.1.d: "A scouting party has stumbled back to Castle Black, trailing blood and incoherent warnings. The surviving rangers speak of unnatural shapes in the cold and glowing blue eyes—the legendary White Walkers, long relegated to nursemaid's tales. While the officers debate whether to punish the men for cowardice or heed their terror, one disturbing reality remains: these men were driven mad not by wildlings, but by something far older."
 GOT_Story_Country.1.a: "The Wall must hold."

 GOT_Story_News.1.t: "Whispers from the Frozen North"
 GOT_Story_News.1.d: "Despatches from Castle Black report strange disturbances beyond the Wall—vanished scouting parties, abandoned wildling villages, and frantic claims of ice-demons from old legends. Across southern courts, lords dismiss the news as the desperate ramblings of criminals banished to the ice. Yet across the North, where winter remembers, eyes turn toward the Wall with quiet apprehension."
 GOT_Story_News.1.a: "Fables to scare children... surely."

 GOT_Story_Country.2.t: "The Price of Desertion"
 GOT_Story_Country.2.d: "A sworn brother of the Night's Watch has abandoned his post at the Wall, fleeing south in a desperate bid for freedom. In keeping with the ancient customs of the First Men, Lord Eddard Stark led the execution himself, striking off the deserter's head beneath the cold eyes of Winterfell's young heirs. A grave lesson has been imparted to the next generation: the man who passes the sentence should swing the sword."
 GOT_Story_Country.2.a: "In the name of King Robert, justice is done."

 GOT_Story_News.2.t: "An Execution in the North"
 GOT_Story_News.2.d: "Word spreads from Winterfell that Lord Eddard Stark has personally executed a deserter from the Night's Watch, swiftly enforcing the realm's laws upon the fugitive. While southern nobles often view such ancient hands-on traditions as grimly archaic, the event serves as a clear reminder to all of the West: honor, duty, and the ancient law remain absolute in the North."
 GOT_Story_News.2.a: "The North remembers."

 GOT_Story_Country.3.t: "The King's Request"
 GOT_Story_Country.3.d: "The royal wheelhouse has rattled into Winterfell's courtyard alongside King Robert Baratheon, his queen, and a massive southern retinue. Bound by the ghost of Jon Arryn's sudden death, the King brings an offer that feels more like a command: Lord Eddard Stark is to be named Hand of the King. Accepting means plunging Winterfell directly into the treacherous lion's den of King's Landing, while refusing risks insulting a volatile monarch and leaving the realm unguarded."
 GOT_Story_Country.3.a: "Accept the King's burden."
 GOT_Story_Country.3.b: "Decline the honour."

 GOT_Story_News.3.t: "A Royal Visit to Winterfell"
 GOT_Story_News.3.d: "King Robert Baratheon has arrived at the ancient seat of House Stark in a grand procession, flanked by the court and Queen Cersei's Lannister guard. Whispers across Westeros confirm the purpose of the journey: the King seeks his old comrade during Greyjoy's Rebellion, Lord Eddard Stark, to fill the office of Hand of the King left vacant by Jon Arryn. Power is shifting north, and the Great Houses watch eagerly to see if the Lord of Winterfell will step into southern politics."
 GOT_Story_News.3.a: "Old alliances are forged anew."

 GOT_Story_Country.4.t: "The Fate of the Targaryen Princess"
 GOT_Story_Country.4.d: "Exiled across the Narrow Sea and clinging to diminished prestige, House Targaryen stands at a critical juncture. Viserys seeks to leverage his sister, Princess Daenerys, to secure the power needed to reclaim the Iron Throne. A grand alliance offers the muscle of a mighty Dothraki khalasar in exchange for the Valyrian bride, yet ancient Valyrian tradition urges keeping the bloodline pure through sibling marriage to consolidate authority within the dynasty."
 GOT_Story_Country.4.a: "Pledge Daenerys to Khal Drogo in exchange for an army."
 GOT_Story_Country.4.b: "Bind the bloodline internally and wed Daenerys to Viserys."

 GOT_Story_News.4.t: "A Targaryen Alliance in Essos"
 GOT_Story_News.4.d: "Reports from Pentos confirm that Princess Daenerys Targaryen has been married to Khal Drogo, a formidable Dothraki warlord. Her brother, Viserys, reportedly arranged the union to secure ten thousand Dothraki riders for an invasion of Westeros. While smallfolk whisper of dragonlords and horse-archers, the lords of the Seven Kingdoms weigh whether this alliance poses a true threat or merely distant saber-rattling."
 GOT_Story_News.4.a: "The exiled dragon stirs across the sea."

 GOT_Story_Country.5.t: "A Fall in the Tower"
 GOT_Story_Country.5.d: "Young Bran Stark has been discovered broken and bleeding at the base of a Winterfell tower, plunging the castle into grief and dread. While the maester fights to keep the boy's life tethered to his body, private whispers and suspicious absences among the southern retinue suggest the fall was no accident. Someone sought to silence a pair of climbing eyes."
 GOT_Story_Country.5.a: "Keep vigil over the boy."

 GOT_Story_News.5.t: "A Tragedy at Winterfell"
 GOT_Story_News.5.d: "Despatches from the North report that young Bran Stark has suffered a catastrophic fall from a tower rampart, leaving him suspended between life and death. Official accounts attribute the incident to a child's reckless climbing, yet murmurs drift down the Kingsroad of dark secrets witnessed in the shadows of the ancient fortress. Tension grips the northern keep as the realm watches and waits."
 GOT_Story_News.5.a: "Dark tidings travel south."

 GOT_Story_Country.6.t: "A Gift of Steel"
 GOT_Story_Country.6.d: "With Jon Snow preparing to depart for the Night's Watch, a final private exchange takes place before the courtyard empties. A slender blade, forged by Mikken for swift and deadly water dancing, passes into the hands of young Arya Stark. Christened 'Needle,' the hidden weapon marks a decisive turn away from lady-like needlework and toward a colder, sharper path."
 GOT_Story_Country.6.a: "Stick them with the pointy end."

 GOT_Story_News.6.t: "A Farewell in Winterfell"
 GOT_Story_News.6.d: "As the royal party prepares to journey south and Jon Snow rides north to Castle Black, quiet departures mark the end of an era for House Stark. Observers note the rebellious young Arya Stark taking up unconventional martial pursuits, guided by the wild spirit of the North. The young wolves scatter across the realm, each embarking on a distinct and dangerous journey."
 GOT_Story_News.6.a: "The wolf pack separates."

 GOT_Story_Country.7.t: "The Journey North Begins"
 GOT_Story_Country.7.d: "Jon Snow has ridden out from Winterfell's gates, casting a final glance back at the home that never fully claimed him. Alongside an entourage that includes Tyrion Lannister, the bastard son of Eddard Stark rides toward the Wall to swear away his life to the Night's Watch. Ahead lies a frozen wilderness of frostbite, discipline, and ancient shadows—a brutal reality far removed from romantic tales of honor."
 GOT_Story_Country.7.a: "Take the black and serve the realm."

 GOT_Story_News.7.t: "An Unlikely Pair Rides for the Wall"
 GOT_Story_News.7.d: "Riders on the Kingsroad confirm that Lord Eddard Stark's bastard son and Tyrion Lannister have departed Winterfell together, heading deep into the frozen North. One journeys to take the solemn vows of the Night's Watch, while the other travels merely to stand at the edge of the world. Southern courts chuckle at the strange pairing, yet travelers report a growing grimness as the duo nears the ancient ice rampart."
 GOT_Story_News.7.a: "A strange companionship on a cold road."

 GOT_Story_Country.8.t: "Fire and the Horse Lords"
 GOT_Story_Country.8.d: "Exiled across the Narrow Sea, the blood of Old Valyria must adapt to survive. Daenerys Targaryen, now wed to Khal Drogo, casts off the fragile doubts of her youth and embraces the brutal customs of the Dothraki. In the open steppe, she begins to command the respect of the khalasar, awakening the dormant strength of the dragon within."
 GOT_Story_Country.8.a: "Blood and fire will pave our path."

 GOT_Story_News.8.t: "The Beggar King's Sister Adapts to the Wastes"
 GOT_Story_News.8.d: "Whispers from the Free Cities suggest that the exiled Targaryen girl has abandoned Western dress and customs for the saddle and leather of the savage horse lords. While the USURPER's spies monitor her movements across the Dothraki Sea, observers note that the young Khaleesi is gaining alarming influence among Khal Drogo's riders."
 GOT_Story_News.8.a: "A barbarian horde behind a Targaryen banner?"

 GOT_Story_Country.9.t: "A Lion Draws Steel on a Pup"
 GOT_Story_Country.9.d: "While Arya was practicing water dancing down by the river with young Mycah, Prince Joffrey ambushed them, brandishing live steel against an unarmed butcher's boy. Arya stood her ground like a true Stark, striking the Prince and disarming him before his foolish pride could cost a boy his life. The Lannisters will cry foul, but the North knows who truly holds the honor."
 GOT_Story_Country.9.a: "He drew steel on a child."

 GOT_Story_News.9.t: "Lannister Arrogance Ignites the Kingsroad"
 GOT_Story_News.9.d: "Word travels from the Kingsroad that Prince Joffrey cornered Lady Arya Stark and a local commoner, threatening them with a blade. Defying the young prince, Lord Eddard's daughter disarmed him and sent his direwolf to protect the boy. While the court in the south murmurs of treason, the lords of the North applaud the girl's courage against Lannister cruelty."
 GOT_Story_News.9.a: "The North remembers who raised the sword first."

 GOT_Story_Country.10.t: "The Warden Rides South"
 GOT_Story_Country.10.d: "Duty calls Lord Eddard Stark away from the ancient walls of Winterfell to serve as Hand of the King in the snake pit of King's Landing. Taking Sansa and Arya with him to court, Ned leaves Lady Catelyn and young Robb to rule the North. Though honor demands his presence in the south, the cold winds remind us that a Stark's true place is always in the North."
 GOT_Story_Country.10.a: "Winter is coming with us."

 GOT_Story_News.10.t: "Lord Stark Answers the Call"
 GOT_Story_News.10.d: "Lord Eddard Stark has departed the North to answer King Robert’s summons, riding south with his daughters to take up the mantle of Hand of the King. While Southern courtiers plot and whisper over seats of power, Northern lords watch anxiously as the Quiet Wolf steps into the vipers' nest of the capital."
 GOT_Story_News.10.a: "May the Old Gods protect him in the south."

 GOT_Story_Country.11.t: "The Quiet Wolf Steps into the Pit"
 GOT_Story_Country.11.d: "The stench and heat of King's Landing greet the Northern entourage like an insult, but honor demands they stand tall. Ser Jaime Lannister waits in the throne room, dripping with gold and smirking over past betrayals. Lord Eddard steps into a nest of adders where words are poisoned and smiles mask daggers. The Stark patriarch must tread with extreme caution, ensuring the North never bows its head to Lannister pride."
 GOT_Story_Country.11.a: "Keep a hand on the hilt."
 GOT_Story_Country.11.b: "The North remembers."

 GOT_Story_News.11.t: "The Northern Hand Reaches the Capital"
 GOT_Story_News.11.d: "Lord Eddard Stark and his procession have entered the Red Keep to assume the burden of the Hand's office. Southern courtiers watch with keen interest as the austere Warden of the North immediately exchanged frost-cold words with Ser Jaime Lannister in the throne room. Tensions simmer between the King's oldest friend and the Queen's powerful family beneath the shadow of the Iron Throne."
 GOT_Story_News.11.a: "A cold wind blows through the Red Keep."

 GOT_Story_Country.12.t: "Forging Bastards and Thieves"
 GOT_Story_Country.12.d: "The courtyard at Castle Black is unforgiving, filled with common criminals, exiled poachers, and unwanted highborns. Jon Snow, bastard of Winterfell, steps into the slush armed with castle-forged steel and proper instruction. Though arrogance at first creates a divide between the Lord Commander's new recruit and the lowborn rapers and thieves, forced drills under Ser Alliser Thorne begin to hammer this ragtag group into sworn brothers of the black."
 GOT_Story_Country.12.a: "Raise them up to knightly standards."

 GOT_Story_News.12.t: "A Wolf Among the Black Brothers"
 GOT_Story_News.12.d: "Fresh recruits continue to arrive at Castle Black, among them Lord Eddard Stark's bastard son. Reports from the Wall indicate the young snow-child initially clashed with his lowborn peers in the training yard, but is now instructioning the thieves, murderers, and poachers in basic swordplay. With wildling activity reported beyond the Wall, the Watch needs every blade it can forge—no matter how green."
 GOT_Story_News.12.a: "The Wall takes all who come."
 GOT_Story_News.12.b: "We will only take the strong."

 GOT_Story_Country.13.t: "The Stallion in the Womb"
 GOT_Story_Country.13.d: "The blood of Old Valyria endures, carrying the future of a dynasty across the vast grasslands of the Dothraki Sea. Daenerys Targaryen carries Khal Drogo’s child—a son destined to be the Stallion Who Mounts the World. The fragile exile of yesterday has vanished; in her veins flows the fire of dragons, and in her womb rests the key to reclaiming the throne that was stolen."
 GOT_Story_Country.13.a: "He will conquer the world."

 GOT_Story_News.13.t: "An Heir to the Horse Lord"
 GOT_Story_News.13.d: "Whispers from Essos report that Daenerys Targaryen, the exiled princess, is pregnant with Khal Drogo’s child. Eastern dosh khaleen foretell a warlord who will unite the nomadic khalasars under one banner. While the Iron Throne dismisses barbarian omens, lords across the Seven Kingdoms quietly ponder the danger of a Targaryen heir backed by tens of thousands of Dothraki screamers."
 GOT_Story_News.13.a: "A dangerous storm gathers in the East."

 GOT_Story_Country.14.t: "The Water Dancer's Blade"
 GOT_Story_Country.14.d: "In a quiet hall within the Red Keep, Lord Eddard's younger daughter casts aside embroidery needles for a Braavosi foil. Guided by Syrio Forel, former First Sword of Braavos, the girl learns to move like water and strike like steel. Free from the constraints of noble ladyship, she sharpens her instinct, taking her first real steps on the path of a true warrior."
 GOT_Story_Country.14.a: "Swift as a deer, quiet as a shadow."

 GOT_Story_News.14.t: "An Unconventional Education in the Capital"
 GOT_Story_News.14.d: "Whispers from the Red Keep reveal that Lord Eddard Stark has hired the former First Sword of Braavos to instruct his youngest daughter in swordplay. While Southern nobility scoffs at the Northern girl indulging in the wild martial arts of Essos, observers in King's Landing note the odd match of a Braavosi master and a wolf-child running amok in the castle halls."
 GOT_Story_News.14.a: "Northern wildness meets Essosi flair."

 GOT_Story_Country.15.t: "A Mother's Grim Search"
 GOT_Story_Country.15.d: "Lady Catelyn Stark arrives in King's Landing incognito, slipped past the city gates before dawn. Driven by the bloody attempt on Bran’s life, she carries the Valyrian steel dagger that nearly slaughtered her boy. Down dark alleyways and into secret brothels, she seeks the truth behind the blade, willing to brave any danger in the heart of Lannister influence to protect her family."
 GOT_Story_Country.15.a: "Follow the trail of the Valyrian steel."

 GOT_Story_News.15.t: "Northern Lady Spotted in the Capital"
 GOT_Story_News.15.d: "Spies within King's Landing report that Lady Catelyn Stark has slipped into the city under a cloak of secrecy, avoiding the traditional grand processions of highborn nobility. Though official channels remain silent on her purpose, court gossip suggests a link to the tragic injury of her young son at Winterfell. The unexpected presence of the Hand's wife has sent whispers rippling through the Red Keep."
 GOT_Story_News.15.a: "Shadows deepen around the Hand's household."

 GOT_Story_Country.16.t: "A Shield for the Soft-Spoken"
 GOT_Story_Country.16.d: "Samwell Tarly is no warrior, but a man does not deserve to be butchered in the mud for lack of martial skill. Jon Snow has intervened at Castle Black, standing between Ser Alliser's cruelty and the terrified heir of Horn Hill. By convincing the other recruits to withhold their blades during drills, the bastard of Winterfell builds a newfound unity among the outcast brothers of the black."
 GOT_Story_Country.16.a: "Protect those who cannot fight."
 GOT_Story_Country.16.b: "Let the weak endure the yard."

 GOT_Story_News.16.t: "An Alliance of Outcasts at the Wall"
 GOT_Story_News.16.d: "Reports from Castle Black detail an unusual shift in the recruit yard, where Jon Snow interceded on behalf of the disinherited Samwell Tarly. By rallying the new brothers to spare the gentle craven from brutal beatings during training, Lord Eddard's bastard is forging unexpected loyalty among the thieves and outlaws bound to the Night's Watch."
 GOT_Story_News.16.a: "Even on the Wall, bloodlines find ways to lead."

 GOT_Story_Country.17.t: "A Shadow Over the Hand’s Tomb"
 GOT_Story_Country.17.d: "The sudden demise of Lord Jon Arryn casts a long, dark shadow over the Red Keep. The newly appointed Hand, Eddard Stark, spends his nights poring through dusty lineage ledgers and questioning royal armorers, unearthing secrets that threaten to shatter the peace of the Seven Kingdoms. In the treacherous halls of King's Landing, digging too deep into the former Hand's final days is a dangerous game that could cost the wolf his head."
 GOT_Story_Country.17.a: "Uncover every secret in the capital."
 GOT_Story_Country.17.b: "Let dead Hand's secrets rest."

 GOT_Story_News.17.t: "The Hand Digs Into the Past"
 GOT_Story_News.17.d: "Whispers swirl through the taverns and keeps of the realm as Lord Eddard Stark conducts quiet inquiries into the sudden illness that claimed Jon Arryn. From the street of steel to the Grand Maester's chambers, the Warden of the North seeks answers to questions many in the capital would prefer left unasked. As tensions simmer among the Great Houses, many wonder what deadly truth the Hand hopes to uncover."
 GOT_Story_News.17.a: "Some stones are better left unturned."

 GOT_Story_Country.18.t: "Visions in the Deep Cold"
 GOT_Story_Country.18.d: "Though young Brandon Stark remains bound to his bed in Winterfell with shattered legs, his mind roams free in the dark of night. Guided by a strange three-eyed crow through strange wolf-dreams, the boy sees far beyond the walls of his home. Something ancient and forgotten stirs in the blood of the First Men, binding the crippled Stark to the wild magic of the North."
 GOT_Story_Country.18.a: "Embrace the sight."
 GOT_Story_Country.18.b: "Dismiss them as feverish nightmares."

 GOT_Story_News.18.t: "Tales of the Broken Boy's Dreams"
 GOT_Story_News.18.d: "Riders from the North bring strange reports from Winterfell regarding young Bran Stark, who survived his terrible fall only to remain bedridden. Whispers across the realm claim the boy experiences vivid, unnatural dreams of a three-eyed crow and prowling beasts. While southern maesters dismiss such claims as mere feverish delirium, northern folk quietly whisper that the Old Gods still speak to the Starks."
 GOT_Story_News.18.a: "Old superstitions run deep in the North."

 GOT_Story_Country.19.t: "The Trap Spings at the Crossroads"
 GOT_Story_Country.19.d: "Fate delivers Tyrion Lannister straight into Lady Catelyn Stark’s path at the Crossroads Inn. Brandishing the Valyrian steel blade used in the attempt on young Bran's life, she calls upon her father's bannermen to seize the Imp in the name of King Robert. Escorting the dwarf prisoner toward the high pass of the Eyrie, the Starks have cast down a gauntlet that Casterly Rock cannot ignore."
 GOT_Story_Country.19.a: "Drag the dwarf to the Vale for trial."
 GOT_Story_Country.19.b: "Release him before the West marches."

 GOT_Story_News.19.t: "The Imp Seized at the Crossroads Inn"
 GOT_Story_News.19.d: "Shockwaves ripple across the Seven Kingdoms following reports that Lady Catelyn Stark has publicly arrested Tyrion Lannister at a roadside inn, accusing the Queen's brother of conspiring to murder her son. With the prisoner spirited away toward the mountains of the Vale, lords across the realm brace for the inevitable wrath of Lord Tywin Lannister. The long peace fragilely maintained since Greyjoy's rebellion threatens to shatter into open war."
 GOT_Story_News.19.a: "The lion will not suffer such an insult."

 GOT_Story_Country.20.t: "The Beggar King's Madness"
 GOT_Story_Country.20.d: "Across the scorching plains of the Dothraki Sea, the last male heir of House Targaryen unravels as his sister gains the devotion of the khalasar. Striding among horse lords who mock his weakness, Viserys Targaryen demands the crown promised in exchange for his sister's hand. Fueled by manic pride and desperate vanity, the exiled prince threatens to wake the dragon, blind to the truth that a crown demands respect, not mere blood."
 GOT_Story_Country.20.a: "Claim the throne with fire and blood."
 GOT_Story_Country.20.b: "Endure the shame until the army marches."

 GOT_Story_News.20.t: "Targaryen Pretender Unravels in the East"
 GOT_Story_News.20.d: "Reports from merchants trading along the Great Grass Sea describe the exiled Viserys Targaryen growing increasingly erratic and hostile toward his Dothraki hosts. Disregarded by Khal Drogo and humiliated before the nomads, the self-proclaimed king threatens violence while demanding an army to invade Westeros. Traders note that the horselords' patience with the foolish beggar king runs perilously thin."
 GOT_Story_News.20.a: "A king of beggars commands no army."

 GOT_Story_Country.21.t: "Honor Above the Badge"
 GOT_Story_Country.21.d: "When King Robert demands the assassination of the pregnant Daenerys Targaryen across the Narrow Sea, Lord Eddard Stark refuses to stain his honor with the murder of a child. Standing alone against the royal council in the Small Chamber, the Warden of the North strips the Hand's badge from his breastplate and casts it down. Principles outweigh the power of the throne, even if leaving the King's side leaves the entire realm vulnerable to chaos."
 GOT_Story_Country.21.a: "Cast down the badge of the Hand."
 GOT_Story_Country.21.b: "Walk away before honor is lost."

 GOT_Story_News.21.t: "The Quiet Wolf Quits the Small Council"
 GOT_Story_News.21.d: "Shocking news echoes through the Red Keep as Lord Eddard Stark abruptly resigns as Hand of the King after a fierce confrontation with King Robert. Witnesses report a furious argument over royal policy regarding exiled Targaryens, leaving the King without his most trusted friend and commander. With the Starks preparing to ride north and Lord Tywin's forces gathering in the west, the political foundation of the Seven Kingdoms fractures."
 GOT_Story_News.21.a: "A Hand without a badge leaves the King unguarded."

 GOT_Story_Country.22.t: "Blood in the Capital Alleyways"
 GOT_Story_Country.22.d: "In retaliation for the capture of the Imp, Ser Jaime Lannister and his armed guards surround Lord Eddard Stark outside a street whorehouse. Swords are drawn in broad daylight, leaving the Hand's loyal guardsmen slaughtered in the mud. Lord Stark fights bravely until a Lannister spear pierces his leg, leaving him broken and bleeding in the street. The mask of royal peace has slipped, exposing the raw hatred between wolf and lion."
 GOT_Story_Country.22.a: "Bide time until the leg heals."
 GOT_Story_Country.22.b: "Summon the banners to avenge Northern blood."

 GOT_Story_News.22.t: "Clash of Lions and Wolves in the Capital"
 GOT_Story_News.22.d: "Violence erupted in the streets of King's Landing when Ser Jaime Lannister confronted Lord Eddard Stark, demanding the release of his brother Tyrion. The bloody skirmish left several Stark guardsmen dead and the Lord Hand severely wounded by a speartip. With Jaime fleeing the capital to join his father's hosts, open warfare between Casterly Rock and Winterfell seems all but inevitable."
 GOT_Story_News.22.a: "The blood on the cobblestones will demand more."

 GOT_Story_Country.23.t: "Drag the Imp to the Vale"
 GOT_Story_Country.23.d: "Marching up the perilous High Road toward the impregnable Eyrie, Lady Catelyn's party guards their valuable prisoner closely. Shadowy mountain clans and treacherous ice paths threaten the journey, but the Northern retainers keep their blades drawn and eyes fixed on the clever dwarf. Tyrion Lannister may whisper of gold and scheme for escape, but he will face justice before the Arryns for his crimes against Winterfell."
 GOT_Story_Country.23.a: "Bind the Imp tight."

 GOT_Story_News.23.t: "The Imp Spirited Toward the Eyrie"
 GOT_Story_News.23.d: "Reports from travelers along the High Road confirm that Lady Catelyn Stark is dragging her royal prisoner into the treacherous mountains of the Vale to face trial before Lady Lysa Arryn. Amid attacks by bloodthirsty mountain clans, the captive Lannister remains under heavy guard as the party ascends toward the sky cells. Lords throughout the Seven Kingdoms watch nervously as the rift between Casterly Rock and Winterfell reaches the point of no return."
 GOT_Story_News.23.a: "A fatal fall awaits at the end of the road."

 GOT_Story_Country.24.t: "A Beast Unleashed in the Crownlands"
 GOT_Story_Country.24.d: "During the royal tournament, Ser Gregor Clegane flew into a violent rage following his defeat, slaughtering his own warhorse and turning his blade toward Ser Loras Tyrell. Royal guards intervened to restrain the Mountain before a formal decree of exile was issued to clear the tourney grounds of his presence. His departure leaves a dangerous void in local enforcement, but restores order to the capital."
 GOT_Story_Country.24.a: "Shocking."

 GOT_Story_News.24.t: "Blood at the Capital Tourney"
 GOT_Story_News.24.d: "Reports spread across Westeros of Ser Gregor Clegane's unbridled fury at the tourney in King's Landing. After his brutal public outburst and subsequent banishment by the King, lords and smallfolk alike question the stability of the realm and the decay of chivalric honor among highborn knights."
 GOT_Story_News.24.a: "True honor fades from the Seven Kingdoms."

 GOT_Story_Country.25.t: "A Prisoner Arrives at the Eyrie"
 GOT_Story_Country.25.d: "Lady Catelyn Stark has scaled the Giant's Lance, delivering Tyrion Lannister to the High Hall of the Arryns in chains. Lady Lysa demands immediate retribution for the death of Lord Jon, while the lords of the Vale urge caution lest this act drag the mountain stronghold directly into a ruinous feud with Casterly Rock. Behind secure gates and impassable peaks, a fateful decision must be made."
 GOT_Story_Country.25.a: "Lock the imp in the sky cells to await judgment."
 GOT_Story_Country.25.b: "Refuse involvement and send the prisoner away."

 GOT_Story_News.25.t: "The Lannister Captured in the Mountains"
 GOT_Story_News.25.d: "Word spreads rapidly across the Seven Kingdoms that Tyrion Lannister has been taken captive by Catelyn Stark and presented for trial at the Eyrie. As tensions flare between House Stark and House Lannister, noble houses throughout the realm watch closely to see if the isolated Vale will ignite an all-out civil war."
 GOT_Story_News.25.a: "The Vale's actions threaten the peace of the realm."

 # Event 26
 # Country Event
 GOT_Story_Country.26.t: "The Imp's Trial by Combat"
 GOT_Story_Country.26.d: "Accused of murdering Lord Jon Arryn, the dwarf Tyrion Lannister invoked his right to a trial by combat. To the court's dismay, a baseborn sellsword named Bronn stepped forward to champion his cause—and defeated our valiant captain of the guards, Ser Vardis Egen. By the laws of gods and men, the Imp is now free to leave the Vale, escaping the justice Lady Lysa sought to deliver."
 GOT_Story_Country.26.a: "The gods have spoken, however bitter the outcome."

 GOT_Story_News.26.t: "The Dwarf Survives the Eyrie"
 GOT_Story_News.26.d: "Tales descend from the Mountains of the Moon that Tyrion Lannister has survived his harrowing captivity at the Eyrie. Securing a trial by combat, his unlikely sellsword champion defeated Lady Lysa Arryn's chosen knight. As the Imp walks free from the Vale, lords across the Seven Kingdoms whisper of the brewing storm, knowing the Lannisters always pay their debts."
 GOT_Story_News.26.a: "The lion escapes the falcon's grasp."

 # Event 27
 # Country Event
 GOT_Story_Country.27.t: "The Bastards of Baratheon"
 GOT_Story_Country.27.d: "An investigation into royal court records and the lineages of the King's illegitimate offspring in King's Landing has revealed a devastating anomaly: every trueborn child of Robert Baratheon possesses coal-black hair, yet the royal heirs display none. The physical evidence strongly suggests the royal children carry no Baratheon blood. If made public, this secret threatens to completely undermine the legitimacy of the throne."
 GOT_Story_Country.27.a: "The royal heirs hold no legitimate claim to the throne."

 GOT_Story_News.27.t: "Whispers of Treason in King's Landing"
 GOT_Story_News.27.d: "Unease spreads across the Seven Kingdoms following reports that Lord Eddard Stark has unearthed dark secrets regarding the royal succession. Rumors originating from the court claim the Hand of the King has questioned the true lineage of King Robert's legal heirs, sending ripples of anxiety to every major house in Westeros."
 GOT_Story_News.27.a: "A dangerous shadow falls over the Iron Throne."

 # Event 28
 # Country Event
 GOT_Story_Country.28.t: "The Heart of the Stallion"
 GOT_Story_Country.28.d: "Before the Dosh Khaleen in Vaes Dothrak, Daenerys Targaryen consumed the raw, beating heart of a stallion without wavering. By enduring the sacred ritual, she has bound the khalasar to her bloodline and claimed their grandest prophecy. The wise women proclaim that the son in her womb will be the Stallion Who Mounts the World—a conqueror destined to unite the horselords and ride to the ends of the earth."
 GOT_Story_Country.28.a: "Blood and fire shall breed the conqueror of the world."

 GOT_Story_News.28.t: "A Prophecy in the Great Grass Sea"
 GOT_Story_News.28.d: "Travelers returning from the East report that the exiled Targaryen princess has completed a barbarian ritual in Vaes Dothrak. The Dothraki now hail her unborn child as a promised conqueror who will unite all the nomadic hordes. While Westeros dismisses eastern superstitions, rumors of a unified khalasar cause quiet concern among merchants and lords alike."
 GOT_Story_News.28.a: "Savages and their wild prophecies mean nothing to Westeros."

 # Event 29
 # Country Event
 GOT_Story_Country.29.t: "A Crown for the Beggar King"
 GOT_Story_Country.29.d: "In sacred Vaes Dothrak, the foolish foreign kinglet Viserys drew steel and threatened the Khaleesi and her unborn child. To spill blood in the holy city is forbidden, but Khal Drogo granted the beggar his ultimate desire without shedding a drop. The Khal melted gold medallions in a cooking pot and poured the molten metal over the weakling's head. His screaming stopped, proving he was no dragon."
 GOT_Story_Country.29.a: "He received the crown he begged for."
 GOT_Story_Country.29.b: "Spare him the gold—let the fool ride behind in a cart."

 GOT_Story_News.29.t: "The End of the Beggar King"
 GOT_Story_News.29.d: "Word arrives from far across the Narrow Sea that Viserys Targaryen, the self-proclaimed rightful King of Westeros, is dead. Reports claim he angered a Dothraki warlord in their sacred city and was killed in a gruesome ritual with molten gold. With his death, the male line of House Targaryen is broken."
 GOT_Story_News.29.a: "The last dragon's claim dies with him."

 # Event 30
 # Country Event
 GOT_Story_Country.30.t: "The King's Royal Hunt"
 GOT_Story_Country.30.d: "King Robert Baratheon has departed King's Landing to hunt wild boar in the Kingswood, seeking relief from the burdens of statecraft. In his absence, the governance of the realm, the management of the court, and the seat upon the Iron Throne fall entirely to the Hand of the King, Lord Eddard Stark."
 GOT_Story_Country.30.a: "Maintain order in the capital until the King returns."

 GOT_Story_News.30.t: "The Royal Hunt in the Kingswood"
 GOT_Story_News.30.d: "Word spreads from the capital that King Robert Baratheon has left King's Landing for an extended royal hunt, leaving Hand of the King Eddard Stark in command of the Iron Throne. Across the Seven Kingdoms, great houses watch closely to see how the quiet Northman manages the turbulent politics of the realm."
 GOT_Story_News.30.a: "The realm rests in the hands of the Stark."
 # Event 31
 # Country Event
 GOT_Story_Country.31.t: "Treason in the Great Hall"
 GOT_Story_Country.31.d: "Lord Eddard Stark has confronted Queen Cersei in private, revealing that he discovered the true lineage of Prince Joffrey and his siblings. Rather than seizing the Queen immediately, the Hand offered her a brief opportunity to flee the capital with her children before King Robert's return. The Queen refused to leave, setting the stage for a dangerous confrontation within the Red Keep."
 GOT_Story_Country.31.a: "Prepare the City Watch."

 GOT_Story_News.31.t: "A Rift in the Capital"
 GOT_Story_News.31.d: "Whispers from King's Landing reveal a direct confrontation between the Hand of the King and Queen Cersei Lannister. Lord Stark has reportedly challenged the legitimacy of the royal heirs, sparking rumors of an imminent struggle for power that could tear the court apart before the King even returns from his hunt."
 GOT_Story_News.31.a: "When you play the game of thrones, you win or you die."

 # Event 32
 # Country Event
 GOT_Story_Country.32.t: "Vows Beneath the Weirwood"
 GOT_Story_Country.32.d: "Beyond Castle Black, deep within the Haunted Forest, new recruits Jon Snow and Samwell Tarly recited their sacred vows before an ancient heart tree. Pledging their lives to shield the realms of men, the new sworn brothers take their places along the Wall as the shadows beyond the ice grow longer."
 GOT_Story_Country.32.a: "Night gathers, and their watch begins."

 GOT_Story_News.32.t: "New Blood at the Wall"
 GOT_Story_News.32.d: "Word travels south from Castle Black that highborn recruits, including the bastard son of Lord Eddard Stark, have taken their final vows into the Night's Watch. While few in the south pay mind to the ancient order, the Wall gains fresh defenders against the harsh northern wilderness."
 GOT_Story_News.32.a: "The black brothers stand vigil in the cold."

 # Event 33
 # Country Event
 GOT_Story_Country.33.t: "Khal Drogo Vows to Conquer Westeros"
 GOT_Story_Country.33.d: "Following a cowardly attempt on the Khaleesi's life by a poisoner sent across the salt sea, Khal Drogo gathered the entire khalasar at Vaes Dothrak. Striking his chest before thousands of screaming warriors, he swore an oath before the Mother of Mountains to lead his riders across the poison water, tear down the iron chair of the usurpers, and claim the lands of Westeros for his unborn son."
 GOT_Story_Country.33.a: "We ride at dawn — Westeros will burn!" 
 GOT_Story_Country.33.b: "One day, they will feel my fury."
 GOT_Story_Country.33.c: "The khaleesi lives — let their shame be enough."

 GOT_Story_News.33.t: "Khal Drogo Declares Invasion of Westeros"
 GOT_Story_News.33.d: "Reports from Essos reveal that a failed assassination attempt on the exiled princess Daenerys Targaryen has provoked the great Khal Drogo into declaring open war upon Westeros. The powerful warlord has reportedly sworn to cross the Narrow Sea with his vast khalasar, threatening the Seven Kingdoms with a massive horse-lord invasion."
 GOT_Story_News.33.a: "The Dothraki prepare to cross the salt sea."

 # Event 34
 # Country Event
 GOT_Story_Country.34.t: "Lord Tywin Takes Command"
 GOT_Story_Country.34.d: "With tensions mounting across the Seven Kingdoms, Lord Tywin Lannister has asserted his authority over the armies of the West. Meeting with Ser Jaime in camp while personally skinning a fallen stag, the Lord of Casterly Rock reminded his heir that family legacy outweighs all personal glory. The full military and financial might of House Lannister stands ready to defend its honor and secure the throne."
 GOT_Story_Country.34.a: "The Lord of Casterly Rock will secure our legacy."

 GOT_Story_News.34.t: "The Great Lion Rouses"
 GOT_Story_News.34.d: "Reports from the Westerlands confirm that Lord Tywin Lannister has mobilized his forces and taken personal command of his hosts. As rumors of his cold, calculated preparations spread beyond Casterly Rock, lords across Westeros recognize that the most formidable commander in the realm has officially entered the gathering conflict."
 GOT_Story_News.34.a: "A Lannister always pays his debts."

 # Event 35
 # Country Event
 GOT_Story_Country.35.t: "Poison in the Western Market"
 GOT_Story_Country.35.d: "In the crowded stalls of Vaes Dothrak, an assassin posing as a wine merchant attempted to murder Daenerys Targaryen with a cask of poisoned arbor red. Ser Jorah Mormont uncovered the plot just moments before the Khaleesi could drink, capturing the culprit before he could escape. The reach of the Usurper in King's Landing stretches far across the Narrow Sea, but the blood of the dragon remains untouched."
 GOT_Story_Country.35.a: "The Usurper's assassins cannot extinguish the dragon."

 GOT_Story_News.35.t: "A Foiled Strike Across the Narrow Sea"
 GOT_Story_News.35.d: "Whispers reach the noble courts of Westeros that a covert attempt to poison the exiled Targaryen princess in Vaes Dothrak has ended in disaster. The failure of the assassin has only enraged her Dothraki protectors, drawing unnecessary attention back toward the Iron Throne and the shadows of King's Landing."
 GOT_Story_News.35.a: "Shadows and poison fail to claim the last dragon."

 # Event 36
 # Country Event
 GOT_Story_Country.36.t: "The Hand Seized in the Red Keep"
 GOT_Story_Country.36.d: "Following the sudden death of King Robert, Lord Eddard Stark entered the throne room presenting a decree to challenge King Joffrey's legitimacy and install Lord Stannis. However, Lord Baelish secured the loyalty of the City Watch for the crown. The Gold Cloaks turned their pikes upon the Hand's northern guard, seizing Lord Stark on the orders of Queen Cersei to secure King Joffrey's succession."
 GOT_Story_Country.36.a: "Lock the traitor in the dungeons beneath the Red Keep."

 GOT_Story_News.36.t: "Lord Stark Imprisoned in the Capital"
 GOT_Story_News.36.d: "Shockwaves ripple through the Seven Kingdoms following the sudden death of King Robert Baratheon and the immediate arrest of Hand of the King Eddard Stark. Accused of high treason after challenging young King Joffrey's right to rule, Lord Stark now lies in chains beneath the Red Keep as the North and the realm prepare for the fallout."
 GOT_Story_News.36.a: "The realm teeters on the brink of civil war."

 # Event 37
 # Country Event
 GOT_Story_Country.37.t: "Escape from the Red Keep"
 GOT_Story_Country.37.d: "During the purge of the Hand's household following Eddard Stark's arrest, Lannister guards attempted to detain his youngest daughter, Arya Stark. However, her foreign sword instructor engaged the royal guardsmen in the training yard, delaying them long enough for the girl to slip into the hidden passageways beneath the castle and vanish into the streets of King's Landing."
 GOT_Story_Country.37.a: "Seal the city gates and search every alley in Flea Bottom."

 GOT_Story_News.37.t: "The Young Wolf Cub Vanishes"
 GOT_Story_News.37.d: "Reports from the capital confirm that while Lord Eddard Stark sits in the dungeons of the Red Keep, his younger daughter Arya Stark evaded Lannister guards and escaped into the labyrinthine streets of King's Landing. As royal forces search the capital, rumors spread across the realm that at least one Stark has eluded the Queen's clutches."
 GOT_Story_News.37.a: "A stark reminder that wolves are hard to cage."

 # Event 38
 # Country Event
 GOT_Story_Country.38.t: "A Demand from the Capital"
 GOT_Story_Country.38.d: "A raven from King's Landing brings a royal summons following the imprisonment of Lord Eddard Stark. Queen Cersei and the Iron Throne demand that Winterfell recognize Joffrey Baratheon as the rightful ruler and submit to royal authority. Northern lords gathered in our halls urge defiance, unwilling to bend the knee to those who hold their liege lord in chains."
 GOT_Story_Country.38.a: "Call the banners — the North rides south!"
 GOT_Story_Country.38.b: "We will not fight. I shall bend the knee — for now."

 GOT_Story_News.38.t: "The North Rallies its Banners"
 GOT_Story_News.38.d: "News spreads across Westeros that in response to Lord Eddard Stark's arrest in the capital, his heir Robb Stark has summoned the lords of the North to Winterfell. Thousands of Northern warriors gather beneath the direwolf banner, signaling that the house of Stark will not yield peacefully to the Iron Throne."
 GOT_Story_News.38.a: "The Young Wolf gathers his pack."

 # Event 39
 # Country Event
 GOT_Story_Country.39.t: "Terror in the Lord Commander's Tower"
 GOT_Story_Country.39.d: "A fallen ranger brought back from beyond the Wall reanimated in the dead of night, slipping past our guards to strike at Lord Commander Mormont. Only the quick thinking of Jon Snow—who set the creature ablaze with a lantern—saved the Old Bear's life. The charred remains confirm our worst fears: the ancient horrors of the Far North have returned, and cold hands are moving in the dark."
 GOT_Story_Country.39.a: "Fire is our only shield against the dead."

 GOT_Story_News.39.t: "Horrors Beyond the Wall"
 GOT_Story_News.39.d: "Disturbing reports filter south from Castle Black claiming an undead corpse rose in the night to attack the leadership of the Night's Watch. While southern lords dismiss the tale as wildling folklore or northern superstition, the black brothers insist an ancient darkness is stirring at the edge of the world."
 GOT_Story_News.39.a: "Idle rumors to frighten children."


 # Event 40
 # Country Event
 GOT_Story_Country.40.t: "The Raid on the Lamb Men"
 GOT_Story_Country.40.d: "During the sacking of a Lhazareen village to gather slaves and gold for the crossing, the Khaleesi intervened to claim the captive women for herself, denying the warriors their customary spoils. Her commands spared the captives from brutal treatment, but her actions drew loud protests from Khal Drogo's bloodriders, who view such mercy as a dangerous violation of Dothraki tradition."
 GOT_Story_Country.40.a: "The Khaleesi's word is law."

 GOT_Story_News.40.t: "The Khalasar Sacks Lhazar"
 GOT_Story_News.40.d: "Reports from Essos indicate that Khal Drogo’s riders have raided a peaceful Lhazareen settlement to fund their rumored campaign. Surprisingly, travelers claim the exiled Targaryen princess intervened to shield captives from abuse, demonstrating an unexpected level of authority over the Dothraki horde."
 GOT_Story_News.40.a: "Even among barbarians, the dragon exerts her will."

 # Event 41
 # Country Event
 GOT_Story_Country.41.t: "The Mountain Clans Enlisted"
 GOT_Story_Country.41.d: "While negotiating safe passage through the treacherous Mountains of the Moon, Tyrion Lannister forged a bloody pact with the wild Hill Tribes of the Vale. By promising them armaments, gold, and the fertile lands of their rivals, the Imp has transformed a band of mountain raiders into a formidable vanguard for the Western hosts."
 GOT_Story_Country.41.a: "Equip the savages and march them to war."

 # News Event
 GOT_Story_News.41.t: "The Hill Tribes Down from the Mountains"
 GOT_Story_News.41.d: "Shocking reports arrive from the East stating that Tyrion Lannister has descended from the Vale at the head of a massive host of mountain clansmen. Armed with promises of steel and land, these lawless raiders now swell the ranks of Casterly Rock, threatening to unleash mountain savagery upon the wider realm."
 GOT_Story_News.41.a: "Desperate times yield wild alliances."

 #Country Event
 GOT_Story_Country.42.t: "Victory in the Whispering Wood"
 GOT_Story_Country.42.d: "The strategic feint at the Green Fork succeeded. While Lord Bolton drew away Lord Tywin's host, Robb Stark led our main vanguard into the woods near Riverrun to spring a surprise night ambush on the unsuspecting Western army. The Lannister forces were completely routed, and Ser Jaime Lannister himself was taken captive. The Kingslayer now sits in Northern chains."
 GOT_Story_Country.42.a: "The Young Wolf shows his teeth."

 GOT_Story_News.42.t: "The Kingslayer Captured!"
 GOT_Story_News.42.d: "Word spreads rapidly across the Seven Kingdoms of a stunning Northern victory in the Whispering Wood. Robb Stark's forces ambushed and shattered the Western army relieving Riverrun, capturing Ser Jaime Lannister alive. With the realm's most famous knight in Northern chains, the balance of power in the gathering war has shifted dramatically."
 GOT_Story_News.42.a: "A crushing blow to Casterly Rock."

 # Country Event (Crownlands Perspective)
 GOT_Story_Country.43.t: "A Sighting at the Great Sept"
 GOT_Story_Country.43.d: "As Lord Eddard Stark was led to the plaza of the Great Sept of Baelor, guards spotted a young girl matching the description of his missing daughter, Arya, hiding among the mob. Before Lannister men could seize her, a wandering crow from the Night's Watch pulled her into the crowd and vanished into the city streets."
 GOT_Story_Country.43.a: "Scour the harbor and search every recruit leaving for the Wall."

 # News Event (Realm-Wide Perspective)
 GOT_Story_News.43.t: "The Stark Girl Vanishes in the Capital"
 GOT_Story_News.43.d: "Whispers from King's Landing report that during Lord Eddard Stark's public trial at the Great Sept of Baelor, his youngest daughter Arya was spotted amidst the gathered crowd. Despite royal guards quickly surrounding the square, she slipped through their fingers, leaving her fate and whereabouts unknown."
 GOT_Story_News.43.a: "The little wolf escapes into the shadows."

 #Country Event
 # Country Event (Crownlands Perspective)
 GOT_Story_Country.44.t: "A Maiden's Petition"
 GOT_Story_Country.44.d: "Before the Iron Throne and the assembled court, Sansa Stark fell to her knees to plead for the life of her father, Lord Eddard. She promised that if granted royal mercy, he would confess his treason publicly and take the black. Queen Cersei and the Small Council seemed inclined toward leniency for the sake of peace, but the final decision rests solely upon King Joffrey's whim."
 GOT_Story_Country.44.a: "Pray the King shows royal clemency."

 # News Event (Realm-Wide Perspective)
 GOT_Story_News.44.t: "Plea for Mercy in the Great Hall"
 GOT_Story_News.44.d: "Reports from King's Landing describe a dramatic scene in the Red Keep, where Sansa Stark begged King Joffrey to spare her father's life in exchange for a full confession and exile to the Night's Watch. As the court awaits the crown's final verdict, the entire realm holds its breath to see if royal mercy will prevail."
 GOT_Story_News.44.a: "A daughter's plea hangs in the balance."

 #Country Event
 # Country Event (Crownlands Perspective)
 GOT_Story_Country.45.t: "Confession at the Great Sept"
 GOT_Story_Country.45.d: "Standing atop the marble steps of the Great Sept of Baelor before a massive crowd of smallfolk, Lord Eddard Stark publicly confessed to treason against the Iron Throne. Though broken and weak from his time in the dungeons, he named King Joffrey the true heir to save his daughters' lives. The Small Council stands ready to enforce the agreed terms and send the traitor to the Wall."
 GOT_Story_Country.45.a: "He has confessed—let the King grant him the black."

 # News Event (Realm-Wide Perspective)
 GOT_Story_News.45.t: "Lord Stark Confesses to High Treason"
 GOT_Story_News.45.d: "In a stunning display outside the Great Sept of Baelor, Lord Eddard Stark publicly declared his treason and affirmed Joffrey Baratheon as the rightful King. Lords and smallfolk across Westeros were stunned by the disgraced Hand's words, with many expecting his immediate exile to the Night's Watch in exchange for his public surrender."
 GOT_Story_News.45.a: "A humiliating end to the Warden of the North."

 # Country Event (Crownlands Perspective)
 GOT_Story_Country.46.t: "The Fate of Eddard Stark"
 GOT_Story_Country.46.d: "Eddard Stark stands before the crowd at the Great Sept of Baelor, having confessed to high treason against King Joffrey. Queen Cersei, Lord Varys, and Grand Maester Pycelle urge royal clemency—exiling him to the Wall to keep peace with the North. However, the King holds absolute authority, and many calling for blood want the traitor made an example of. What shall be done with him, Your Grace?"
 GOT_Story_Country.46.a: "Off with his head—let the traitor die!"
 GOT_Story_Country.46.b: "Let him take the black—send him to the Wall."

 # News Event (Realm-Wide Perspective)
 GOT_Story_News.46.t: "Ned Stark Beheaded!"
 GOT_Story_News.46.d: "In a shocking act of blood justice on the steps of the Great Sept of Baelor, King Joffrey disregarded his advisors and ordered the immediate execution of Eddard Stark. The former Hand was beheaded with his own Valyrian steel sword before a stunned crowd. With Lord Stark slain, all hopes of a peaceful resolution are shattered, and war is now inevitable."
 GOT_Story_News.46.a: "The North will never forgive this."

 # Country Event (North Perspective)
 GOT_Story_Country.47.t: "A Crown for the Wolf"
 GOT_Story_Country.47.d: "In the great hall of Riverrun, news of Lord Eddard's execution has shattered any remaining tie to the Iron Throne. As our bannermen discuss which contender in the South to support, Greatjon Umber draws his steel, declaring that the North will answer only to a dragon or a wolf. Lord after lord rises, unsheathing their swords and cheering until the rafters ring: the North and the Riverlands will serve their own king once more."
 GOT_Story_Country.47.a: "The King in the North!"
 GOT_Story_Country.47.b: "Stannis is the rightful heir."
 GOT_Story_Country.47.c: "Renly commands the largest host."
 GOT_Story_Country.47.e: "Lord of Winterfell is enough."

 # News Event (Realm-Wide Perspective)
 GOT_Story_News.47.t: "A New King Rises in the North!"
 GOT_Story_News.47.d: "Outraged by the execution of Eddard Stark, the lords of the North and the Riverlands have gathered at Riverrun to renounce their allegiance to the Iron Throne. In an ancient ceremony not seen since the Targaryen conquest, they have proclaimed Robb Stark as 'The King in the North,' severing half the continent from royal rule."
 GOT_Story_News.47.a: "The realm fractures into warring kingdoms."

 # Country Event (Dothraki Perspective)
 GOT_Story_Country.48.t: "The Funeral Pyre"
 GOT_Story_Country.48.d: "As Khal Drogo’s pyre blazes against the night sky, the Khaleesi binds the maegi Mirri Maz Duur to the stakes and places three stone dragon eggs beside the fallen Khal. Before the remaining warriors and followers, Daenerys steps directly into the roaring inferno. Silence falls over the camp as the Dothraki watch the heat consume the wood, expecting to find only ash when dawn breaks."
 GOT_Story_Country.48.a: "Blood of the dragon."

 # News Event (Realm-Wide Perspective)
 GOT_Story_News.48.t: "The Last Targaryen Walks Into the Fire"
 GOT_Story_News.48.d: "Riders returning from the Red Waste bring unbelievable tales of Khal Drogo's funeral pyre. It is reported that his widow, Princess Daenerys Targaryen, stepped directly into the roaring blaze alongside her fossilized dragon eggs. Whispers cross the Narrow Sea that the last dragon has perished in fire—though distant rumors insist something ancient woke in the flames."
 GOT_Story_News.48.a: "A tragic end to the dragon line."

 # Country Event (Night's Watch Perspective)
 GOT_Story_Country.49.t: "A Brother's Trial of Honor"
 GOT_Story_Country.49.d: "Word of Lord Eddard's execution reached Castle Black, driving Jon Snow to ride south under cover of darkness to join his brother's host. Intercepted in the woods by Samwell, Grenn, and Pyp, he was reminded of the sacred vows sworn before the weirwood trees. Choosing brotherhood and duty over blood and vengeance, Snow turned his horse back toward the Wall before dawn."
 GOT_Story_Country.49.a: "Night gathers, and now his watch begins."

 # News Event (Realm-Wide Perspective)
 GOT_Story_News.49.t: "Desertion Averted at the Wall"
 GOT_Story_News.49.d: "Whispers from Castle Black reveal that Eddard Stark's bastard son attempted to desert his post upon hearing of his father's execution. Though retrieved by his sworn brothers before reaching the southern roads, the near-desertion highlights the intense strain placed upon the Night's Watch as civil war engulfs the realm."
 GOT_Story_News.49.a: "The sworn vows of the Watch hold fast."

 # Country Event (North Perspective)
 GOT_Story_Country.50.t: "Confronting the Kingslayer"
 GOT_Story_Country.50.d: "In the dark depths of Riverrun's dungeons, Lady Catelyn Stark stood face-to-face with the chained Ser Jaime Lannister to demand the truth behind Bran's fall and the attempt on his life. Bound to a post and covered in dirt, the Kingslayer met her grief with his usual arrogant mockery, yet beneath his bitter jests, the truth of Lannister treachery hung heavy in the cold air."
 GOT_Story_Country.50.a: "His pride will not protect him forever."

 # News Event (Realm-Wide Perspective)
 GOT_Story_News.50.t: "The Lady of Winterfell Questions Her Royal Captive"
 GOT_Story_News.50.d: "Whispers from Riverrun report that Lady Catelyn Stark personally confronted the imprisoned Ser Jaime Lannister regarding the conspiracy surrounding her family. Though the Kingslayer reportedly offered only insolence in reply, the high-stakes interrogation reveals the deep personal rancor fueling the war between Stark and Lannister."
 GOT_Story_News.50.a: "A dangerous game of words in the Riverlands."

 # Country Event (Dothraki Perspective)
 GOT_Story_Country.51.t: "Mother of Dragons"
 GOT_Story_Country.51.d: "As the sun rises over the smoking ashes of Khal Drogo's pyre, Daenerys Targaryen emerges unharmed, her skin unblemished by the heat. Clinging to her shoulders and lap are three newly hatched dragons, their screeches piercing the morning air. Overwhelmed by the miracle, Ser Jorah and the remaining Dothraki fall to their knees, swearing blood-oaths to the unburnt queen who has restored magic to the world."
 GOT_Story_Country.51.a: "Blood of my blood—we serve the Dragon Queen."

 # News Event (Realm-Wide Perspective)
 GOT_Story_News.51.t: "Dragons Reborn in the East"
 GOT_Story_News.51.d: "Incredible reports travel across the Narrow Sea: Daenerys Targaryen has stepped out of a roaring funeral pyre bearing three living dragons. Long thought extinct since the reign of the Targaryen kings, the return of these mythical beasts signals the awakening of ancient magic, casting a long shadow over the warring lords of Westeros."
 GOT_Story_News.51.a: "Fire and Blood stir once more."

 # Country Event (Crownlands Perspective)
 GOT_Story_Country.52.t: "A Fatal Hunt in the Kingswood"
 GOT_Story_Country.52.d: "The royal hunting party has returned to the Red Keep in panic and disarray. Deep within the Kingswood, King Robert Baratheon was gored through the belly by a massive boar after sending his kingsguard away. Though the King struck the beast down, his wounds are festering and lethal. As pyromancers and maesters tend to his dying bed, courtiers in the Red Keep are already covertly arming their guards for the coming power vacuum."
 GOT_Story_Country.52.a: "Prepare the Red Keep—the realm is about to shatter."

 # News Event (Realm-Wide Perspective)
 GOT_Story_News.52.t: "King Robert Wounded on Royal Hunt"
 GOT_Story_News.52.d: "Shocking news spreads from King's Landing: King Robert Baratheon lies on his deathbed after suffering a terrible goring from a wild boar in the Kingswood. Grand Maester Pycelle works frantically to ease the sovereign's agony, but rumors persist that the King will not survive the night, plunging the Seven Kingdoms into an immediate crisis of succession."
 GOT_Story_News.52.a: "The storm gathers over King's Landing."

 # Country Event (Crownlands Perspective)
 GOT_Story_Country.53.t: "A Sentence of Poison"
 GOT_Story_Country.53.d: "Reports from Essos confirming Daenerys Targaryen's pregnancy have thrown King Robert into a blind rage. Ignoring the Hand's moral protests, the King demands the Small Council arrange her immediate assassination before a Targaryen heir can cross the Narrow Sea with a Dothraki host. The royal command is given, but Hand of the King Eddard Stark threatens to resign his office rather than sanction the murder of a pregnant child."
 GOT_Story_Country.53.a: "Send word to the shadows—the dragon girl must die."
 GOT_Story_Country.53.b: "Stand with Lord Stark—we will not execute children."

 # News Event (Realm-Wide Perspective)
 GOT_Story_News.53.t: "Assassins Targeted at the Exile Princess"
 GOT_Story_News.53.d: "Whispers from the Small Council reveal that King Robert Baratheon has ordered the assassination of Daenerys Targaryen following reports that she is pregnant with a Dothraki warlord's child. The ruthless order reportedly provoked a bitter rupture between the King and his Hand, exposing deep political fractures at the highest levels of the realm."
 GOT_Story_News.53.a: "The shadow of Robert's Rebellion lingers."

 # Country Event (Crownlands Perspective)
 GOT_Story_Country.54.t: "The Death of the King"
 GOT_Story_Country.54.d: "King Robert Baratheon has finally succumbed to his horrific hunting wounds, passing in his chambers after days of agony. Lord Eddard Stark claims the King signed a final decree naming him Lord Regent until Prince Joffrey comes of age. However, Queen Cersei and the Lannisters move swiftly to secure the Red Keep, insisting the Queen Regent alone must hold the realm's authority. The bells of Baelor toll, and the battle for the succession begins."
 GOT_Story_Country.54.a: "Enforce King Robert's last decree—Lord Stark is Regent."
 GOT_Story_Country.54.b: "Back Queen Cersei—the Lannisters must rule."

 # News Event (Realm-Wide Perspective)
 GOT_Story_News.54.t: "King Robert Baratheon Lies Dead"
 GOT_Story_News.54.d: "The Iron Throne sits empty. King Robert Baratheon has died from the wounds inflicted by a wild boar in the Kingswood. Even as funeral bells toll across King's Landing, intense political rivalry erupts within the Red Keep regarding the regency, plunging the Seven Kingdoms into an immediate crisis of authority."
 GOT_Story_News.54.a: "The Stag is fallen."

 # Country Event (Dothraki Perspective)
 GOT_Story_Country.55.t: "The Great Khal Is Wounded"
 GOT_Story_Country.55.d: "In a fierce fight sparked by the division of plunder, Khal Drogo slew the defiant rider Mago, but not before receiving a deep chest wound from the warrior's blade. Though Drogo dismisses the injury as a minor scratch, the cut bleeds heavily and shows signs of rapid infection. Bloodriders murmur that a Khal who cannot ride cannot lead, forcing a critical choice upon the camp before his strength wanes completely."
 GOT_Story_Country.55.a: "Allow the captive maegi to bind his wound."

 # News Event (Realm-Wide Perspective)
 GOT_Story_News.55.t: "The Great Khal Wounded in Single Combat"
 GOT_Story_News.55.d: "Reports from the grasslands of Essos state that the formidable Khal Drogo has been severely injured in a dual of honor against one of his own captains. While the Khal remains alive, word of his lingering infection spreads quickly, sparking speculation that his massive khalasar may soon fracture into warring factions if the Great Khal succumbs to his wounds."
 GOT_Story_News.55.a: "A titan of the Great Grass Sea falters."

 # Country Event (North Perspective)
 GOT_Story_Country.56.t: "A Deal at the Twins"
 GOT_Story_Country.56.d: "Our host stands halted at the Green Fork of the Trident, staring up at the formidable twin castles of the Late Lord Frey. Control of the bridge is vital to relieve Riverrun, but Lord Walder demands an extraordinary price for passage: Robb Stark must pledge to marry a Frey daughter, fostered wards must be taken, and Frey troops must join our vanguard. Delaying to march around the river will allow Lord Tywin to crush us, but binding the heir of Winterfell to Walder Frey is a heavy burden."
 GOT_Story_Country.56.a: "A lord must do his duty—agree to the Frey alliance."
 GOT_Story_Country.56.b: "We will not be coerced—find another way across."

 # News Event (Realm-Wide Perspective)
 GOT_Story_News.56.t: "The Young Wolf Pledges to House Frey"
 GOT_Story_News.56.d: "Reports from the Riverlands confirm that Robb Stark has secured safe passage across the vital crossing at the Twins by striking a marriage pact with Lord Walder Frey. By promising to marry a Frey daughter once the war is won, the Northern commander has bought crucial strategic speed and swollen his ranks with Frey swords, allowing his host to march unimpeded toward the Lannister forces."
 GOT_Story_News.56.a: "A shrewd pact signed on the Trident."

 # # # # # # # # # #
 #SEASON 2 #
 # # # # # # # # # #

 # Tyrion Arrives in King's Landing
 GOT_Story_Country.100.t:0 "The Hand Arrives"
 GOT_Story_Country.100.d:0 "Whispers spread through the Red Keep like wildfire as Tywin Lannister's youngest son rides through the Gates of the Moon. Armed with his father's seal and a razor-sharp wit, Tyrion Lannister has claimed the office of Acting Hand of the King. Queen Regent Cersei makes no effort to hide her disgust at his intrusion, but Tyrion is wasting no time establishing his authority—openly questioning her recent council decisions and taking control of the city's defenses. A dangerous new power struggle has taken root within the heart of the Capital."
 GOT_Story_Country.100.a:0 "He's small, but his shadow will loom large."
 GOT_Story_Country.100.b:0 "Let us see how long he survives the snakes of King's Landing."

 GOT_Story_News.100.t:0 "Tyrion Lannister Named Acting Hand of the King"
 GOT_Story_News.100.d:0 "Reports from King's Landing confirm that Tyrion Lannister has arrived at the Red Keep to serve as Hand of the King in Lord Tywin's stead. The appointment has reportedly provoked intense friction with the Queen Regent, Cersei Lannister, as her dwarf brother moves swiftly to assert control over the Iron Throne's administration and military preparations. As the Realm descends deeper into war, all eyes turn to the Capital to see if the new Hand can keep the Young King's crown intact."
 GOT_Story_News.100.a:0 "A mind needs books like a sword needs a whetstone."


 GOT_Story_Country.101.t:0 "The Question of the Throne"
 GOT_Story_Country.101.d:0 "The realm bleeds from a thousand open wounds, yet the abomination sitting upon the Iron Throne—[CRO.GetLeader]—claims the crown with blood-stained hands and no lawful right. By all the laws of Westeros, my blood is true. I am the true heir to Robert Baratheon, and the Seven Kingdoms are mine by rights and duty. Yet to raise the fiery heart above Dragonstone is to ignite a war that will consume every lord and peasant from the Wall to the Arbor. Lady Melisandre gazes into the flames, whispering of destiny, darkness, and a crown written in fire, while Maester Cressen's fragile voice echoes with bitter warnings of ruin and defeat. The hour of indecision has passed. Will Dragonstone march to claim its righteous birthright, or shall we yield to a line of bastards and false kings?"
 GOT_Story_Country.101.a:0 "They will bend the knee or I will destroy them."
 GOT_Story_Country.101.b:0 "The night is dark... but our time has not yet come."
 GOT_Story_Country.101.c:0 "My brother has the love of the lords. For the realm, I bow."

 GOT_Story_News.101.t:0 "Stannis Baratheon Claims the Iron Throne"
 GOT_Story_News.101.d:0 "From the gloomy fortress of Dragonstone, raven wings carry dire tidings across the Seven Kingdoms. Lord Stannis Baratheon has formally declared himself the true and rightful King of Westeros, denouncing [CRO.GetLeader] as a baseborn bastard born of incest and treason. Beside him stands the Red Priestess, Melisandre of Asshai, whose fiery doctrines and prophecies have gained a terrifying foothold among the island's garrison. As the fiery heart banner is raised above the salt and smoke of the Blackwater, the realm holds its breath—another King has entered the War of the Five Kings, and he will yield to no one."
 GOT_Story_News.101.a:0 "The iron will does not bend."


 GOT_Story_Country.102.t:0 "The Matter of Peace with the Iron Throne"
 GOT_Story_Country.102.d:0 "The war in the Riverlands has spilled the blood of thousands, yet the Young Wolf remains undefeated in the field. From Riverrun, King Robb Stark now ponders a fateful envoy to King's Landing: an offer of peace to the Iron Throne. The terms are absolute—complete independence for the Kingdom of the North and the Trident, the immediate release of Sansa and Arya Stark, and the return of Lord Eddard's bones to Winterfell. Some lords counsel that the Lannisters will never surrender half the realm without a sword at their throats, while others argue that securing our sovereignty through parchment will save countless Northern lives. The fate of the North hinges upon the messenger's horse."
 GOT_Story_Country.102.a:0 "Send the terms. Let the Southrons recognize our freedom."
 GOT_Story_Country.102.b:0 "There can be no peace with the murderers of Ned Stark!"

 GOT_Story_News.102.t:0 "The Young Wolf Offers Peace"
 GOT_Story_News.102.d:0 "Riders bearing the direwolf banner have arrived under a flag of truce at the gates of King's Landing, delivering formal terms from Robb Stark, the King in the North. The Northern king demands full recognition of independence for the North and the Riverlands, along with the safe return of his captive sisters and his father's remains. In exchange, the North offers a cessation of hostilities and a release of Lannister captives. As the Iron Throne weighs this brazen ultimatum, lords across Westeros wonder whether the Lion will yield to the Wolf, or if the flames of war will only burn higher."
 GOT_Story_News.102.a:0 "Will the Lion bend, or will the Riverlands burn?"


 GOT_Story_Country.103.t:0 "An Unwelcome Refuge at Craster's Keep"
 GOT_Story_Country.103.d:0 "Freezing winds whip through the haunted forest as the Great Ranging of the Night's Watch grinds to a halt at Craster's Keep. The crude timber homestead offers bitter shelter, but its master—a vile wildling who takes his own daughters as wives—views the black brothers with open disdain. While Lord Commander Mormont negotiates for scraps of salt pork and warm hearths, the men whisper in the dark. Craster's strange sacrifices to the woods and his absolute terror of the true cold beyond reveal a chilling truth: the Wildlings are not the greatest threat lurking in the deep snows of the North."
 GOT_Story_Country.103.a:0 "We press onward into the frozen dark."
 GOT_Story_Country.103.b:0 "There are foul gods in these woods, and fouler secrets."

 GOT_Story_News.103.t:0 "The Great Ranging Reaches Craster's Keep"
 GOT_Story_News.103.d:0 "Reports from the far north confirm that the Lord Commander’s Great Ranging has reached the squalid compound of Craster, a infamous wildling ally beyond the Wall. As hundreds of sworn brothers rest their weary mounts amidst growing mutinous murmurs and harsh winter gales, sinister rumors trickle south of strange offerings made to the cold shadows of the forest. The Night's Watch marches deeper into the untamed wilderness, seeking Mance Rayder's host, even as the ancient horrors of the Long Night stir once more."
 GOT_Story_News.103.a:0 "The cold winds are rising."


 GOT_Story_Country.104.t:0 "Across the Bleeding Sands"
 GOT_Story_Country.104.d:0 "The Red Waste is a wasteland of scorched bone and sun-bleached stone, claiming horses and riders with relentless cruelty. Following the pyre of Drogo and the miraculous hatching of her three young dragons, Queen Daenerys Targaryen leads the meager remnants of her khalasar through an unending expanse of dust and death. Water skins run dry, the weak perish under the merciless sun, and faint whispers of despair grow among her people. Knowing they cannot survive in these dead lands much longer, the Mother of Dragons dispatches her trusted bloodriders to the scout the three cardinal directions, desperate for a haven before the desert swallows the last blood of Old Valyria."
 GOT_Story_Country.104.a:0 "If I look back, I am lost."
 GOT_Story_Country.104.b:0 "Blood of the dragon does not bleed out in the sand."

 GOT_Story_News.104.t:0 "The Dragon Queen in the Red Waste"
 GOT_Story_News.104.d:0 "Distant merchants and travelers arriving from Essos bring bizarre tales from the red deserts beyond the Dothraki Sea. Daenerys Targaryen, the last surviving heir of the exiled dragonlords, is reportedly leading a starving band of survivors through the deadly expanse known as the Red Waste. Though many across the Free Cities dismissed her as a tragic footnote in the aftermath of Khal Drogo's fall, traders speak in hushed tones of three living nightmares winging through the desert heat—dragons reborn into the world, trailing the young queen as she fights for her people's survival."
 GOT_Story_News.104.a:0 "Fire and blood will find a way."


 GOT_Story_Country.105.t:0 "The Ironborn Question"
 GOT_Story_Country.105.d:0 "The war in the Riverlands demands every blade, but the West remains a formidable foe. At Riverrun, councilors whisper that the ironborn fleet could turn the tide, laying waste to the Lannister coastlines while the Young Wolf marches south. To win Lord Balon Greyjoy to the Stark banner, some propose sending his only surviving son, Theon, back to Pyke. After nine years spent as a ward of Winterfell, raised alongside Eddard Stark's own sons, many believe Theon's bond with the North is absolute. The terms proposed are lavish: full independence for the Iron Islands and the plunder of Casterly Rock once the Lannisters fall. Yet old lords urge caution—blood runs thicker than water, and an ironborn raised in silk may find himself torn when standing once more upon the salt-blasted shores of his fathers. Empowering Balon Greyjoy is a dangerous gamble, and letting his heir slip from northern hands might cost the Young Wolf more than just a foster brother."
 GOT_Story_Country.105.a:0 "Send Theon to Pyke with our offer."
 GOT_Story_Country.105.b:0 "Keep Theon close. He is not yet truly one of us."

 GOT_Story_News.105.t: "Theon Greyjoy Returns to the Iron Islands"
 GOT_Story_News.105.d: "After nine long years of wardship at Winterfell, Theon Greyjoy has sailed into the harbor of Lordsport, bearing a letter of alliance from King Robb Stark to his father, Balon Greyjoy. The Young Wolf sought to trade the lordship of Casterly Rock for the ironborn fleet, hoping to unleash the reavers upon the Westerlands. Yet the Old Kraken scorns soft words and green-land parchment. Tearing up the offer, Lord Balon has made it clear that the ironborn do not pay for crowns with gold or treaties, but with iron. Far from securing an alliance for the North, Theon's homecoming has only served to rouse the Iron Islands from their long slumber, and the longships gather in the mist, hungry for war."
 GOT_Story_News.105.a: "The Kraken does not serve."



 GOT_Story_Country.106.t:0 "A Secret Shared in the Dark"
 GOT_Story_Country.106.d:0 "The Kingsroad north grows more perilous by the day, swarming with Gold Cloaks and Lannister raiders searching for highborn escapees. Disguised as 'Arry' the orphan boy, Arya Stark has hidden among Yoren's ragtag band of Night's Watch recruits, keeping her name and noble blood closely guarded. Yet among the thieving boys and hardened criminals, the blacksmith's apprentice Gendry stands out—resolute, stubborn, and observant. After Gendry recognizes the castle-forged steel of Needle and deduces the truth, Arya chooses to confide in him, revealing her identity as the youngest daughter of the late Lord Eddard Stark. Unbeknownst to either of them, Gendry carries his own dangerous bloodline as a bastard son of King Robert Baratheon. In the cold shadows of the Riverlands, this shared secret binds the wolf girl and the bull-headed armorer in a rare pact of mutual protection."
 GOT_Story_Country.106.a:0 "He can keep a secret. We stand together now."
 GOT_Story_Country.106.b:0 "It is good to have a true friend in these dark times."

 GOT_Story_News.106.t:0 "Whispers on the Kingsroad"
 GOT_Story_News.106.d:0 "Reports from travelers along the Kingsroad speak of growing turmoil as Gold Cloaks hunt across the Riverlands for runaway nobles and bastards of the former King. Among a wandering band of Night's Watch recruits bound for the Wall, young Arya Stark—long presumed lost or captive in the Red Keep—has formed a tight bond with Gendry, the unacknowledged bastard son of King Robert Baratheon. Though both travel in secrecy under the protection of the Black Brothers, their unlikely fellowship links the blood of Winterfell and Storm's End once more amidst the gathering storm of war."
 GOT_Story_News.106.a:0 "The wolf and the bull tread a dangerous path."



 GOT_Story_Country.107.t:0 "The Purge of the Gold Cloaks"
 GOT_Story_Country.107.d:0 "The capital swelters under the threat of siege, but the internal corruption of King's Landing poses just as great a danger. Janos Slynt, Commander of the City Watch, has proven himself a ruthless sellsword disguised as a lawman—enriching himself through bribes and complicit in the bloody murder of King Robert's innocent bastards. Worse still, his loyalty belongs to Queen Cersei and the highest bidder, making him an intolerable threat to the Hand's authority. The small council room is quiet as the trap closes. Slynt can be stripped of his stolen titles and shipped to the Night's Watch under heavy guard, replacing him with the mercenary Bronn to ensure ironclad control over the Gold Cloaks. Alternatively, keeping Slynt at his post might preserve fragile political harmony with the Queen Regent, though it leaves an untrustworthy snake coiled at the heart of the city's defenses."
 GOT_Story_Country.107.a:0 "Send him to the Wall. Ser Bronn shall lead the Gold Cloaks."
 GOT_Story_Country.107.b:0 "Keep him as Commander—for now."

 GOT_Story_News.107.t:0 "A New Commander in King's Landing"
 GOT_Story_News.107.d:0 "In a swift and unyielding stroke of authority, Tyrion Lannister, acting Hand of the King, has removed Lord Janos Slynt from his command of the City Watch. Citing corruption and brutal excesses, the Hand stripped Slynt of his newly awarded seat at Harrenhal and exiled him to the Black Fort to take the black. In his place, the Hand has elevated the lowborn sellsword Bronn to Lord Commander of the Gold Cloaks. The sudden purge has sent shockwaves through the Red Keep, firmly placing the capital's nearly six thousand guardsmen under the direct control of the Imp."
 GOT_Story_News.107.a:0 "Power in the capital shifts once more."


 GOT_Story_Country.108.t:0 "Darkness at Craster's Keep"
 GOT_Story_Country.108.d:0 "The Great Ranging has reached the dreary timber halls of Craster's Keep, where the Night's Watch shelters against the relentless cold. Yet the hearthfire brings no warmth to Jon Snow, whose suspicions grow as he observes the strange absence of young men among Craster's many daughter-wives. Following a mother into the frozen woods under cover of night, Jon witnesses a ghastly ritual: a newborn son left upon the ice as an offering to the cold shadows, claimed by the pale, cold horrors of legend. Before he can intervene, a blow to the head drops him into the snow. Lord Commander Mormont knows of these dark sacrifices but turns a blind eye to secure food and shelter beyond the Wall. For Jon, the line between ally and monster is shattered, forcing him to reckon with the harsh and terrible compromises required to survive in the haunted wild."
 GOT_Story_Country.108.a:0 "We harbor a monster. Something must be done!"
 GOT_Story_Country.108.b:0 "The true dread of the North is far worse than we feared."

 GOT_Story_News.108.t:0 "Horrors Beyond the Wall"
 GOT_Story_News.108.d:0 "Rangers returning from the Great Ranging bring chilling reports from the frozen northern wastes beyond the Wall. While quartered at Craster's Keep, brother Jon Snow uncovered a dreadful truth regarding the wildling patriarch who shelters the Watch. To appease the ancient threats lurking in the deep woods, Craster leaves his newborn sons in the snow as living sacrifices to the Others. Though Lord Commander Mormont maintains the fragile pact to secure passage and supplies, the horrific revelation has cast a dark pall over the Brothers of the Night's Watch, exposing the terrifying horrors gathering in the realm of Always Winter."
 GOT_Story_News.108.a:0 "Winter brings horrors beyond imagining."


 GOT_Story_Country.109.t:0 "The Shadow and the Flame"
 GOT_Story_Country.109.d:0 "The chamber on Dragonstone is cold, but the red priestess Melisandre brings a searing heat. Standing over the Painted Table, she speaks of ancient prophecies, the Lord of Light, and a dark power capable of smiting King Stannis Baratheon's enemies without a single sword being drawn. She promises not just victory, but a son—a shadowy heir born of his own royal blood to sweep aside the usurpers in King's Landing and Highgarden. Though Stannis has ever been a man of iron duty and unyielding discipline, the temptation of unearthly fire proves overwhelming as the darkness settles over the narrow sea. To claim his rightful seat upon the Iron Throne, the Lord of Dragonstone binds himself even closer to Asshai's red shadow, stepping across a threshold from which there can be no return."
 GOT_Story_Country.109.a:0 "For the night is dark and full of terrors."

 GOT_Story_News.109.t:0 "Dark Omens on Dragonstone"
 GOT_Story_News.109.d:0 "Whispers from the island fortress of Dragonstone tell of a deepening communion between Stannis Baratheon and the red priestess Melisandre of Asshai. As Stannis prepares his forces to claim the Iron Throne, the red woman's influence over the self-proclaimed king has grown absolute, supplanting the ancient Faith of the Seven with the fiery worship of R'hllor. Sailors and merchants passing through the Gullet speak of strange rituals in the night, as red shadows flicker against the gargoyles of Dragonstone and a new, unsettling magic is summoned to aid the Baratheon cause."
 GOT_Story_News.109.a:0 "A strange and dangerous fire burns in the East."


 GOT_Story_Country.110.t:0 "Reborn of Salt and Sea"
 GOT_Story_Country.110.d:0 "Standing upon the rocky, windswept shores of Pyke, Theon Greyjoy faces a choice between the green lands that raised him and the iron blood that birthed him. Rejecting Robb Stark's letter of alliance and casting aside the silks of Winterfell, Theon kneels before his uncle Aeron Damphair in the pounding surf. As cold seawater pours over his head in the ancient baptism of the Drowned God, the bonds of his ten-year wardship are severed forever. He is no longer a shadow Stark or a pampered captive, but an heir of the Iron Islands ready to win his glory by paying the iron price. To prove his worth to a father who views him with contempt and ironborn reavers who see him as soft, he must embrace the hard, unyielding ways of his ancestors and turn his bow against the North."
 GOT_Story_Country.110.a:0 "What is dead may never die!"
 GOT_Story_Country.110.b:0 "I will pay the iron price and make them fear my name."

 GOT_Story_News.110.t:0 "The Prince of Pyke Reclaims His Heritage"
 GOT_Story_News.110.d:0 "Word spreads across Westeros that Theon Greyjoy has renounced his foster family, the Starks, and formally pledged his sword to his father, Lord Balon Greyjoy. On the stony coast of Pyke, the heir to the Iron Islands was immersed in seawater by the drowners, taking the solemn vows of the Drowned God and forsaking the old gods of Winterfell. With Theon firmly in the ironborn camp, any hope of a northern-ironborn alliance against the Lannisters has evaporated. Longships are launching from every cove across the archipelago, as the reavers prepare to strike out into the green lands once more."
 GOT_Story_News.110.a:0 "Blood proves thicker than northern snow."


 GOT_Story_Country.111.t:0 "A Web of Whispers"
 GOT_Story_Country.111.d:0 "The Small Council is a pit of vipers, and every word spoken within its walls slithers directly back to Queen Cersei. To root out the rat leaking the Hand's private counsel, Tyrion Lannister constructed an elaborate snare, feeding three distinct marriage proposals for Princess Myrcella to Lord Varys, Littlefinger, and Grand Maester Pycelle. The trap closed swiftly when an enraged Cersei stormed into his chambers to confront him over the specific arrangement whispered only to Pycelle—a match with Prince Trystane of Dorne. His deceit uncovered, the feeble old Grand Maester has been unmasked as a devoted creature of the Queen Regent. Stripped of his robes, his chain of office, and his liberty, Pycelle now rots in the dark dungeons, a stark warning to any councillor who underestimates the Acting Hand."
 GOT_Story_Country.111.a:0 "One rat caught, but the nest remains full."
 GOT_Story_Country.111.b:0 "Throw him in a black cell. Let him ponder his loyalty there."

 GOT_Story_News.111.t:0 "Purge in the Small Council"
 GOT_Story_News.111.d:0 "Shocking news echoes through the Red Keep as Grand Maester Pycelle, who has served four kings over several decades, has been arrested and cast into the dungeons on the orders of Tyrion Lannister, Hand of the King. Through a series of false marriage alliances floated for Princess Myrcella, the Hand exposed Pycelle as a spy feeding secrets directly to Queen Cersei. With the Grand Maester disgraced and imprisoned, the Acting Hand has struck a decisive blow against internal treachery, seizing firm control over the King's inner circle as war looms on every horizon."
 GOT_Story_News.111.a:0 "The Hand plays the game of thrones with deadly skill."


 GOT_Story_Country.112.t:0 "The Blue Cloak of Highgarden"
 GOT_Story_Country.112.d:0 "Before a cheering host of tens of thousands gathered at Bitterbridge, the grand melee reached its dramatic climax as Brienne of Tarth brought down the famous Knight of Flowers, Ser Loras Tyrell, in martial combat. Awestruck by her fierce valor and martial skill, King Renly Baratheon granted the victor her heart's desire: a coveted cloak among his newly formed Rainbow Guard. Stepping forward amidst the snickers and hushed scoffs of lords who look down upon a woman bearing steel, Brienne took her vows, swearing her shield and life to the charismatic king. In the sprawling camp of the Reach and Stormlands, her appointment adds a formidable warrior to King Renly's inner guard, binding the Maid of Tarth in absolute, unbreakable devotion to her sovereign."
 GOT_Story_Country.112.a:0 "My sword and my life belong to my King."
 GOT_Story_Country.112.b:0 "Let them mock. My steel shall prove my worth."

 GOT_Story_News.112.t:0 "The Rainbow Guard Gains a New Shield"
 GOT_Story_News.112.d:0 "Reports from the massive encampment at Bitterbridge describe a surprising turn at King Renly Baratheon's tourney. Brienne of Tarth—the formidable daughter of Lord Selwyn of Evenfall Hall—vanquished Ser Loras Tyrell in the final bout of the grand melee. Impressed by her strength and martial prowess, King Renly raised her directly to his personal bodyguard, the Rainbow Guard, cloaking her in blue. While many traditional lords whisper in dismay at a woman taking up a knight's vows, none can deny the prowess of the warrior who now stands guard at the king's shoulder as his army marches toward King's Landing."
 GOT_Story_News.112.a:0 "A formidable knight joins the pretender's cause."


 GOT_Story_Country.113.t:0 "The Fall of the Black Bull"
 GOT_Story_Country.113.d:0 "Night falls heavily over a ruined holdfast in the Riverlands, where Yoren and his band of Night's Watch recruits make a desperate stand. Surrounded by Ser Amory Lorch's brutal Lannister raiders and set ablaze, the timber walls offer little shelter against the rain of fire and steel. Old Yoren dies as he lived—fighting like a rabid hound, taking several attackers down before being overwhelmed. In the bloody chaos that follows, Arya Stark manages to pull the bull-horned helmet off a slain recruit and place it beside another dead boy, convincing the searching Lannister men that Gendry, the king's bastard, has already been killed. Though stripped of weapons and dragged away as prisoners bound for Harrenhal, Arya's quick wits spared Gendry's life, even as Yoren's blood stains the Riverlands mud behind them."
 GOT_Story_Country.113.a:0 "Yoren died protecting us. We must endure and survive."
 GOT_Story_Country.113.b:0 "They believe Gendry is dead. The secret remains safe."

 GOT_Story_News.113.t:0 "Massacre in the Riverlands"
 GOT_Story_News.113.d:0 "Reports from the devastated Riverlands detail a brutal attack by Lannister foraging parties led by Ser Amory Lorch upon a band of Night's Watch recruits bound for the Wall. Overcoming the black-clad wanderer Yoren, who fell defending his charge, the Lannister soldiers put the holdfast to the torch and slaughtered those who resisted. Among the survivors taken captive into the shadowy keep of Harrenhal are highborn escapees disguised in rags. Though stripped of their freedom, the survivors carry vital secrets amidst the smoldering ash of the war-torn countryside."
 GOT_Story_News.113.a:0 "The Riverlands bleed under the Lannister lion."


 GOT_Story_Country.114.t:0 "Through the Eyes of the Wolf"
 GOT_Story_Country.114.d:0 "In the stone halls of Winterfell, Prince Bran Stark lies in his bed, tethered to a body that no longer obeys him. Yet when sleep takes him, he runs free through the Wolfswood upon four powerful legs, tasting cold night air and the copper tang of fresh blood. Through the eyes of his direwolf, Summer, the world is vibrant, sharp, and primal. Old Nan's fables speak of skinchangers and wargs—ancient Northmen who could slip into the beasts of the wild—but Maester Luwin insists such things vanished with the Children of the Forest. Yet as the dreams grow more frequent and intense, the boundary between boy and wolf wears thin. In an age where magic stirs once more across the world, the crippled heir to Winterfell finds himself touching an ancient, long-forgotten power woven into the very bone and marrow of the First Men."
 GOT_Story_Country.114.a:0 "I am the wolf, and the wolf is me."
 GOT_Story_Country.114.b:0 "These visions carry meaning. I must learn to master them."

 GOT_Story_News.114.t:0 "An Ancient Power Awakens in the North"
 GOT_Story_News.114.d:0 "Whispers drift south from Winterfell of strange and supernatural occurrences surrounding young Bran Stark. Crippled after his fall, the boy has begun experiencing vivid, untamed visions, slipping his mind into the body of his direwolf to hunt in the godswood and wander the northern forests. Scholars and maesters recall old legends of skinchangers—wargs who could inhabit the minds of beasts—a magic long thought lost since the Age of Heroes. As strange omens multiply across Westeros, the awakening of such blood magic in the Stark heir hints that the old powers of the First Men are stirring once more in the cold North."
 GOT_Story_News.114.a:0 "The ancient blood of the First Men runs deep."


 GOT_Story_Country.115.t:0 "Surprise at Oxcross"
 GOT_Story_Country.115.d:0 "Deep within the hills of the Westerlands, the Young Wolf has struck another devastating blow against the Lannisters. Under cover of night, Grey Wind led northern scouts through a forgotten mountain path, bypassing the enemy outposts and falling upon Lord Stafford Lannister's raw levies as they slept at Oxcross. The slaughter was swift and absolute; Lord Stafford was slain, his army shattered, and thousands of horses stampeded through the camp. The road to Lannisport and Casterly Rock lies undefended, and the wealth of the West is now open to northern reavers. This brilliant victory proves that the King in the North can strike at the heart of Lannister power itself, filling the Northmen with fierce pride and leaving King's Landing reeling in panic."
 GOT_Story_Country.115.a:0 "They set a trap for us, but we brought down the lion."
 GOT_Story_Country.115.b:0 "Let Tywin Lannister bleed in his own den!"

 GOT_Story_News.115.t:0 "Nightmare at Oxcross"
 GOT_Story_News.115.d:0 "Disaster has struck the Lannister cause in the West. Reports from the Westerlands confirm that King Robb Stark has crossed the mountains by night and annihilated the newly raised host of Lord Stafford Lannister at the Battle of Oxcross. Lord Stafford was killed in the chaos, his forces routed, and vast herds of warhorses captured by the northern host. With this crushing triumph, the Young Wolf now ranges freely across Casterly Rock's lands, plundering gold mines and cattle while main Lannister forces remain bogged down in the Riverlands. The Young Wolf's legend grows larger with every victory."
 GOT_Story_News.115.a:0 "The Young Wolf remains undefeated in battle."


 GOT_Story_Country.116.t:0 "A Shield in the Throne Room"
 GOT_Story_Country.116.d:0 "The Great Hall of the Red Keep has become a stage for King Joffrey's unbridled malice. In the wake of Robb Stark's victories in the West, the boy king took his fury out on Sansa Stark—ordering his Kingsguard to strip and beat the helpless northern hostage before the entire court. Arriving just in time, Tyrion Lannister intervened, casting his cloak around the girl and using his authority as Hand of the King to halt the public humiliation. When Joffrey snarled threats in response, Tyrion stood his ground, openly mocking the king's cowardice and sending him a pair of bed partners as a pointed lesson in restraint. While Cersei coddles her son's sadism, the Acting Hand remains the sole figure in King's Landing willing to cross the sadistic boy king, desperately attempting to preserve what little honor and sanity remain in the royal court."
 GOT_Story_Country.116.a:0 "We have had vicious kings and we have had idiot kings..."
 GOT_Story_Country.116.b:0 "Someone must teach the boy that royalty is not madness."

 GOT_Story_News.116.t:0 "The Hand Checks the Crown"
 GOT_Story_News.116.d:0 "Shocking accounts from the Red Keep describe a fiery confrontation between King Joffrey Baratheon and his uncle, Tyrion Lannister. Following a public display of royal cruelty against the hostage Sansa Stark, the Acting Hand personally intervened, commanding the Kingsguard to stand down and publicly reprimanding the king before his assembled courtiers. The bold defiance has drawn a stark line in the capital: while Queen Cersei indulges the young monarch's dark impulses, the Imp continues to exercise a firm, uncompromising hand over the royal household, asserting his control over the court despite growing tension within the royal family."
 GOT_Story_News.116.a:0 "The Imp stands between the king and total madness."


 GOT_Story_Country.117.t:0 "In the Shadow of the Black Castle"
 GOT_Story_Country.117.d:0 "The gargantuan, melted towers of Harrenhal rise like charred fingers against the Riverlands sky—a place haunted by ghosts and choked with the reek of smoke and death. Marched inside alongside the surviving recruits of Yoren's band, Arya Stark hides her highborn lineage under filth and ragged clothes, serving as a cupbearer and servant to save her own life. Every day brings fresh horrors, as Ser Gregor Clegane and his bloody men-at-arms subject captives to unspeakable tortures in the courtyard, hunting for 'the Brotherhood.' Amidst the terror and cruelty, Arya keeps her spirit from breaking by reciting a dark litany before sleep: a list of names of every person who has wronged her family. In the grim darkness of Harrenhal, the young wolf girl bides her time, nursing a quiet, icy vengeance that no wall or guard can quench."
 GOT_Story_Country.117.a:0 "Joffrey. Cersei. Ser Ilyn. Ser Meryn. The Hound. Polliver..."
 GOT_Story_Country.117.b:0 "Valar Morghulis. I will survive to see them all fall."

 GOT_Story_News.117.t:0 "Captives Enter Harrenhal"
 GOT_Story_News.117.d:0 "The terrifying stronghold of Harrenhal, currently held as a primary base for Lord Tywin Lannister's Riverlands campaign, continues to swell with smallfolk and captured prisoners gathered by foraging parties. Among the hundreds of nameless war captives swept up in the wake of Ser Gregor Clegane's bloody raids are northern refugees and recruits bound for the Wall. Under the cruel gaze of the Mountain That Rides, prisoners endure harsh labor and brutal interrogations within the blackened walls. Though rumors persist of highborn escapees hidden among the captives, the iron grip of the Lannisters over Harrenhal leaves little hope of rescue or mercy."
 GOT_Story_News.117.a:0 "The curse of Harrenhal claims more souls."


 GOT_Story_Country.118.t:0 "The Gates of the Queen of Cities"
 GOT_Story_Country.118.d:0 "Out of the sun-scorched expanse of the Red Waste, Queen Daenerys Targaryen has led her starving khalasar to the formidable Triple Walls of Qarth. The grand city, jewel of Essos and gateway between east and west, initially barred its massive gates against the ragged dragon queen and her bloodriders. Yet the Thirteen, the ruling merchant princes, could not ignore the miracle perched upon her shoulders: three living dragon hatchlings, the first seen in the world for over a century. After a tense standoff, Xaro Xhoan Daxos invoked the ancient law of sanctuary, forcing the council to unbar the great gates of bronze and stone. Now entering the gilded palaces and fragrant gardens of Qarth, Daenerys finds herself surrounded by wealthy traders, warlocks, and treacherous nobles—all eager to admire, buy, or steal her dragons as she seeks the gold and ships needed to reclaim the Iron Throne."
 GOT_Story_Country.118.a:0 "I am of the blood of the dragon. The world will bow."
 GOT_Story_Country.118.b:0 "We shall take their wealth and sail for Westeros."

 GOT_Story_News.118.t:0 "Dragons Enter Qarth"
 GOT_Story_News.118.d:0 "Astonishing reports from the Far East confirm that Daenerys Targaryen, the last surviving heir of House Targaryen, has survived the deadly crossing of the Red Waste and arrived at the ancient city of Qarth. Though initially turned away by the city's rulers, the sight of three living dragons born in the flames of Khal Drogo's pyre compelled the Thirteen to grant her refuge within their triple walls. Traders, sorcerers, and merchant lords across Essos now flock to Qarth to glimpse the mythical beasts, as the Mother of Dragons seeks powerful benefactors to fund her bid to retake Seven Kingdoms."
 GOT_Story_News.118.a:0 "Fire and Blood stir once more in the East."


 GOT_Story_Country.119.t:0 "A Shadow in the Night"
 GOT_Story_Country.119.d:0 "The storm breaks over the narrow sea, but inside the chambers of Dragonstone, the tension is heavier still. Renly Baratheon has gathered eighty thousand spears, declaring himself King with the support of Highgarden and the Stormlands, openly stealing his elder brother's rightful birthright. Open battle against such overwhelming numbers would mean slaughter, yet King Stannis Baratheon refuses to yield to an usurper, brother or no. Beneath the gargoyles of Dragonstone, the red priestess Melisandre promises an unnatural victory—a shadow birthed from the royal blood itself that can slip past any guard or wall to strike down the pretender in his tent. As Ser Davos Seaworth steers a smuggler's skiff through the dark waters beneath Storm's End, Stannis stands at a grave threshold: unleash dark, forbidden magic to murder his own flesh and blood, face his brother in honorable combat, or bide his time until the Lannisters fall."
 GOT_Story_Country.119.a:0 "Unleash the shadow. He stole my crown—he pays with his life."
 GOT_Story_Country.119.b:0 "We fight him openly on the field of honor."
 GOT_Story_Country.119.c:0 "Let Renly bled against the Lannisters first. We shall wait."

 GOT_Story_News.119.t:0 "Darkness Birthed Beneath Storm's End"
 GOT_Story_News.119.d:0 "Chilling rumors sweep across the Stormlands following a terrifying event in the dead of night near the ancient walls of Storm's End. Guards and smugglers tell of an elusive black skiff carrying the red priestess Melisandre into the sea caverns beneath the fortress. There, beneath the wards of the First Men, witness accounts describe the birth of a monstrous shadow—a silhouette bearing the features of King Stannis himself, vanishing into the darkness toward the encamped armies. Whispers of sorcery and blood magic now hang heavy over the Baratheon war, as lords and commanders realize that Stannis wields a terrifying power far beyond mortal steel."
 GOT_Story_News.119.a:0 "The night is dark and full of terrors."



 # Renly Baratheon's Death
 GOT_Story_Country.120.t:0 "The Assassination of King Renly"
 GOT_Story_Country.120.d:0 "Disaster has struck the massive host encamped at Storm's End. On the eve of battle against his brother Stannis, King Renly Baratheon was struck down inside his royal pavilion by an impossible creature—a living shadow that cut his throat before vanishing into thin air. With the charismatic king dead, his vast coalition has fractured overnight. The Tyrells and the chivalry of the Reach have ridden west in disarray, while the lords of the Stormlands are left leaderless and stunned in the face of Stannis's approaching fleet. As the shadow of war deepens, the storm lords must choose their path: submit to Stannis as the rightful heir, make peace with King's Landing, or retreat behind the ancient curtain walls of Storm's End to defy both kings."
 GOT_Story_Country.120.a:0 "Swear fealty to Stannis—he is the rightful King."
 GOT_Story_Country.120.b:0 "Pledge loyalty to the Crown and protect our lands."
 GOT_Story_Country.120.c:0 "Let a Castellan rule—we stand alone in the storm."

 GOT_Story_News.120.t:0 "The Fall of King Renly"
 GOT_Story_News.120.d:0 "Shockwaves ripple across the Seven Kingdoms following the sudden and mysterious death of Renly Baratheon in his camp at Storm's End. On the morning before his forces were to engage his elder brother Stannis, the self-proclaimed King was slain within his own pavilion under terrifying circumstances, sparking rumors of dark sorcery and blood magic wielded by the red priestess Melisandre. In the wake of his death, the mighty alliance between Highgarden and Storm's End has collapsed; most stormland banners have defected to Stannis, while the Reach army has withdrawn. The landscape of the War of the Five Kings has been irrevocably altered overnight."
 GOT_Story_News.120.a:0 "Renly Baratheon is dead."


 GOT_Story_Country.121.t:0 "An Envoy to the South"
 GOT_Story_Country.121.d:0 "Word has reached the northern host at Riverrun that Lord Renly Baratheon has crowned himself King, backed by the immense wealth and eighty thousand spears of Highgarden. While the Young Wolf wins victories in the field, the Lannisters still hold the capital and the King's sisters. An alliance with Renly could trap Tywin Lannister in a vice, but treating with an usurper requires delicate hands. Counselors suggest dispatching Lady Catelyn Stark south to Bitterbridge as an envoy. She brings terms: a joint war against House Lannister in exchange for Renly's recognition of King Robb's sovereign crown in the North and the Riverlands. Yet the southern roads are fraught with danger, and negotiating with a proud pretender whose army outnumbers the Northmen four to one is a perilous gamble."
 GOT_Story_Country.121.a:0 "Send Lady Catelyn south. We must secure this alliance."
 GOT_Story_Country.121.b:0 "No. The North does not beg for terms from pretenders."

 GOT_Story_News.121.t:0 "Northern Envoys Ride South"
 GOT_Story_News.121.d:0 "In a bid to unite the enemies of House Lannister, Lady Catelyn Stark has ridden into King Renly Baratheon's massive encampment at Bitterbridge as a diplomatic envoy from the Kingdom of the North. Seeking a grand coalition against King's Landing, Lady Catelyn has offered northern steel to aid Renly's claim to the Iron Throne, demanding in return that the southern monarch recognize Robb Stark as the independent King in the North. As two great hosts weigh a potential alliance, all eyes across Westeros turn to see whether the Wolf and the Stag will march together."
 GOT_Story_News.121.a:0 "The Wolves look south for allies."


 GOT_Story_Country.122.t:0 "The Subterranean Flame"
 GOT_Story_Country.122.d:0 "In the dark cellars beneath the Guildhall of the Alchemists, thousands of volatile clay jars sit filled with a shimmering, viscous green liquid: wildfire. Created through secret, forgotten magic, the substance burns so hot that water only fans its violent flame, capable of melting stone and consuming men in seconds. Queen Cersei had originally commissioned the Pyromancers to produce tens of thousands of jars to rain down from the city walls upon Stannis Baratheon's approaching fleet. Realizing the immense catastrophe of catapulting such volatile jars over a crowded city, Tyrion Lannister has seized control of the Alchemists' Guild and redirected the entire supply toward a far more calculated, devastating trap. As Stannis's vanguard sails toward the Blackwater, the Hand prepares to turn the river into a sea of emerald fire."
 GOT_Story_Country.122.a:0 "Burn them all... on our own terms."
 GOT_Story_Country.122.b:0 "We will turn the Blackwater into a flaming grave."

 GOT_Story_News.122.t:0 "Green Fire in the Guildhall"
 GOT_Story_News.122.d:0 "Reports from King's Landing reveal that Tyrion Lannister, Hand of the King, has taken direct oversight of the Alchemists' Guild and their vast stockpiles of wildfire. The volatile, unquenchable substance—a dark legacy of Mad King Aerys—is being produced in massive quantities around the clock under royal decree. As Stannis Baratheon's formidable fleet prepares to strike the capital from the sea, the Hand's desperate turn to pyromancy signals that the impending siege of King's Landing will be fought with terrors not seen since the days of dragonlords."
 GOT_Story_News.122.a:0 "A dark and volatile power wakes in the capital."


 # Jaqen H'ghar's Debt to Arya Stark
 GOT_Story_Country.123.t:0 "Three Deaths for the Red God"
 GOT_Story_Country.123.d:0 "In the dark, reeking court of Harrenhal, a strange man with two-colored hair approaches Arya Stark in the shadows. He calls himself Jaqen H'ghar, one of three caged prisoners she saved from burning alive in Yoren's wagon. By stealing three lives from the Red God, Jaqen claims she has incurred a debt—a life for a life. He offers to whisper three names of her choosing to the Red God, promising that whoever she names will die, no matter who they are or where they hide. For a young girl trapped in a castle of monsters, surrounded by Ser Gregor Clegane's brutal men-at-arms, this deadly gift presents a terrifying power. Arya must choose her targets with ruthless precision, stepping onto a shadow-draped path that points toward the assassin guild of Braavos and the House of Black and White."
 GOT_Story_Country.123.a:0 "A man gives a girl a name, and the Red God receives his due."
 GOT_Story_Country.123.b:0 "I will choose carefully... and make every name count."

 GOT_Story_News.123.t:0 "Whispers in the Ruins of Harrenhal"
 GOT_Story_News.123.d:0 "Dark and puzzling reports emerge from the cursed fortress of Harrenhal, where mysterious deaths have begun to claim prominent Lannister men and overseers without a trace of the killers. Rumors among the castle smallfolk whisper of a mysterious Lorathi criminal named Jaqen H'ghar, secretly an initiate of the feared Faceless Men of Braavos. It is said he bound himself in a lethal pact of three deaths to repay a young fugitive who saved him from fire. As high-ranking garrison officers perish in inexplicable accidents, fear takes hold of Harrenhal, revealing that even behind castle walls, invisible death stalked the enemies of the North."
 GOT_Story_News.123.a:0 "Valar Morghulis—all men must die."


 # Daenerys Targaryen's Encounter with the Warlocks
 GOT_Story_Country.124.t:0 "Inside the House of the Undying"
 GOT_Story_Country.124.d:0 "Deep within the spireless, pale palace known as the House of the Undying, Queen Daenerys Targaryen steps into a labyrinth of shifting illusions and dark magic. Led by the blue-lipped warlocks of Qarth and Pyat Pree, the Mother of Dragons seeks visions of her past, present, and future to unlock her true destiny. Yet the warlocks' promises of wisdom and aid conceal a sinister trap; bound by ancient sorcery, they seek to imprison Daenerys and her hatchlings forever, feeding upon the living magic of her dragons to restore their own fading powers. Trapped in a chamber of dead sorcerers surrounded by terrifying visions of a bleeding star and a burning throne, Daenerys must unleash the fiery wrath of her dragons to burn through the illusions and escape the warlocks' snare before she is consumed."
 GOT_Story_Country.124.a:0 "Dracarys! Fire and blood shall consume their deceit."
 GOT_Story_Country.124.b:0 "I will not be a prisoner to their shadow magic."

 GOT_Story_News.124.t:0 "Sorcery in the Heart of Qarth"
 GOT_Story_News.124.d:0 "Disturbing news reaches the ports of Essos as Pyat Pree and the pale warlocks of Qarth lured Daenerys Targaryen into the House of the Undying. Hoping to harness the miraculous magic reborn with her three dragons, the sorcerers attempted to bind the Dragon Queen within their shadow-draped palace. Their dark schemes ended in ruin, however, when dragonfire tore through the ancient structure, leaving Pyat Pree's cabal broken and burning. Having destroyed the most feared mystical order in Qarth, the Mother of Dragons has proven that those who attempt to leash her beasts will reap only ash and ruin."
 GOT_Story_News.124.a:0 "The Dragon Queen's flame burns brighter than sorcery."




 # Theon Greyjoy Seizes Winterfell
 GOT_Story_Country.125.t:0 "The Prince of Winterfell"
 GOT_Story_Country.125.d:0 "In a stroke of reckless audacity, Theon Greyjoy has drawn away Winterfell's garrison with a feint at Torrhen's Square, striking in the dead of night to scale the stone walls of the ancestral Stark fortress with a handful of reavers. By morning, the seat of Kings of Winter lies under ironborn occupation, its young princes Bran and Rickon taken hostage in their own home. To consolidate his fragile grip over an enraged populace, Theon struck off the head of the loyal master-at-arms, Ser Rodrik Cassel, outside the castle gates. Yet holding the ancient castle with barely thirty men is a far colder prospect than taking it; northern lords assemble their levies to crush the turncoat, and the smallfolk glare at their new ruler with silent, murderous hatred."
 GOT_Story_Country.125.a:0 "I am Prince of Winterfell! They will learn to bow!"
 GOT_Story_Country.125.b:0 "The iron price has been paid, but the North will never forget this."

 GOT_Story_News.125.t:0 "Winterfell Falls to Treachery"
 GOT_Story_News.125.d:0 "A shocking betrayal has struck the heart of the North. Taking advantage of the main northern host's absence in the South, Theon Greyjoy—foster son to Lord Eddard Stark—has led a band of ironborn raiders to seize Winterfell in a night raid. The ancient fortress, long deemed impregnable, was taken with barely a dozen guards inside, and the venerable Ser Rodrik Cassel was executed before its gates for refusing to yield. With Bran and Rickon Stark held captive in their own keep, anger spreads across the North like wildfire as northern loyalists rally their banners to march on the turncoat prince."
 GOT_Story_News.125.a:0 "A knife in the back of the Young Wolf."


 # Jon Snow Captures Ygritte
 GOT_Story_Country.126.t:0 "A Spearwife in the Skirling Pass"
 GOT_Story_Country.126.d:0 "High among the jagged, snow-draped peaks of the Skirling Pass, Jon Snow and a scouting party led by Qhorin Halfhand ambushed a wildling look-out post. Steel flashed in the biting mountain wind, leaving two wildlings dead, but Jon stayed his blade when he discovered the third sentry was a fiery, red-haired spearwife named Ygritte. Bound by his vows as a brother of the Night's Watch, Jon was ordered by the Halfhand to kill her, yet he found himself unable to strike down an unarmed prisoner in cold blood. Spared and held captive, Ygritte answers his questions with sharp tongue and fierce defiance, mocking his celibate vows and revealing the vast free folk army gathering under Mance Rayder. Her words linger like frostbite, forcing the bastard of Winterfell to question everything he was taught about the wildlings beyond the Wall."
 GOT_Story_Country.126.a:0 "Strike off her bonds. You know nothing, Jon Snow..."
 GOT_Story_Country.126.b:0 "Keep her as a captive. Her knowledge of Mance Rayder is invaluable."

 GOT_Story_News.126.t:0 "A Spearwife Captured Beyond the Wall"
 GOT_Story_News.126.d:0 "Word reaches Castle Black from ranger patrols venturing deep into the Frostfangs. In the treacherous heights of the Skirling Pass, a elite scouting party under Qhorin Halfhand surprised a wildling outpost, taking captive a red-haired spearwife named Ygritte. Interrogations of the prisoner confirm the worst fears of the Lord Commander: Mance Rayder, the King-Beyond-the-Wall, has unified the warring wildling clans into a massive horde marching toward the Wall. As cold darkness gathers beyond the realm of men, the Night's Watch faces an impending storm unlike any in recorded history."
 GOT_Story_News.126.a:0 "The wildlings gather in the frozen waste."


 # King's Landing Riots Against Joffrey
 GOT_Story_Country.127.t:0 "The Bread Riots of King's Landing"
 GOT_Story_Country.127.d:0 "Starvation and fear have driven the smallfolk of King's Landing to the brink of madness. With the Reach naval blockade cutting off grain supplies and refugees flooding Flea Bottom, the city is a powder keg waiting for a spark. That spark ignited during a royal procession returning from the harbor, when an angry peasant struck King Joffrey with a lump of dung. Outraged, the boy king ordered his Kingsguard to slaughter the crowd, inciting a full-scale riot that tore through the streets. Prince Myrcella was safely escorted away, but High Septon Fat Walder was dismembered by the mob, and Sansa Stark was nearly dragged from her horse before the Hound cut a path through the violence. As the Hand of the King slapped his royal nephew across the face for his utter foolishness, the brutal outbreak made one thing abundantly clear: the starving masses are ready to tear down the Red Keep brick by brick."
 GOT_Story_Country.127.a:0 "We are surrounded by starving wolves inside our own walls!"
 GOT_Story_Country.127.b:0 "If we do not feed this city, the smallfolk will open the gates to Stannis."

 GOT_Story_News.127.t:0 "Anarchy in the Capital"
 GOT_Story_News.127.d:0 "Terrifying reports from King's Landing detail a catastrophic riot that erupted in the shadow of the Great Sept of Baelor. Driven to desperate fury by war-induced famine and soaring bread prices, thousands of smallfolk attacked the royal court as King Joffrey Baratheon paraded through the streets. Royal guards were overwhelmed, the High Septon was torn to pieces by the mob, and senior nobility barely escaped back into the safety of the Red Keep. The chaos underscores the crumbling authority of the Iron Throne, revealing a capital plagued by civil unrest and ill-prepared for the storm approaching its gates."
 GOT_Story_News.127.a:0 "The smallfolk cry out for bread and blood."


 # Daenerys Discovers Her Dragons Are Stolen
 GOT_Story_Country.128.t:0 "The Theft of the Dragons"
 GOT_Story_Country.128.d:0 "Returning to Xaro Xhoan Daxos's palatial manse, Queen Daenerys Targaryen steps into a silent bloodbath. Her loyal Dothraki handmaidens and khalasar guards lie slaughtered on the marble floors, their blood pooling beneath pristine silk tapestries. Worse still, the iron cages where her three young hatchlings were kept stand empty and broken. In the heart of Qarth, where wealth and silver tongues conceal lethal ambition, the Mother of Dragons has been stripped of her children, leaving her isolated and vulnerable in an alien land. As grief turns to white-hot anger, Daenerys realizes that her dragons were not merely taken by common thieves—they were stolen by those who seek to harness their ancient flame to seize total dominion over the city."
 GOT_Story_Country.128.a:0 "They have taken my children. I will burn Qarth to the ground to reclaim them!"
 GOT_Story_Country.128.b:0 "Blood for blood. Whosoever touched them shall know a dragon's fury."

 GOT_Story_News.128.t:0 "Dragons Stolen in Qarth"
 GOT_Story_News.128.d:0 "Shocking news sweeps through the grand bazaars and harbors of Essos as word arrives that Daenerys Targaryen's three living dragons have been stolen from her residence in Qarth. A bloody night raid left her Dothraki retainers dead and her dragon cages empty, plunging the young queen's cause into desperate peril. Whispers across the city point toward powerful conspirators within Qarth's ruling elite, sparking fear that whoever now controls the mythical beasts holds the power to bend the Queen of Cities—and perhaps the whole of Essos—to their will."
 GOT_Story_News.128.a:0 "The Mother of Dragons is left defenseless."


 # Bran and Rickon Stark Escape Winterfell
 GOT_Story_Country.129.t:0 "Flight from the Crypts"
 GOT_Story_Country.129.d:0 "Under the veil of a moonless night, Bran and Rickon Stark slip out from the dark stone vaults beneath Winterfell, guided by the faithful Hodor, Osha the wildling, and Reed siblings Meera and Jojen. To conceal his failure to capture the young heirs, Theon Greyjoy murdered two farm boys and tarred their flayed heads outside the castle gates, convincing the North that the line of Eddard Stark was ended. But hidden in the shadows of the wolfswood, the true princes live on. Guided by cryptic green dreams of a Three-Eyed Raven, Bran realizes that their ancestral home is no longer safe. The small party must make a fateful choice: split up to protect young Rickon, or venture north beyond the Wall into the frozen unknown, chasing a mystical destiny that may hold the key to saving the realm."
 GOT_Story_Country.129.a:0 "We must scatter into the wild. Let the world believe us dead."
 GOT_Story_Country.129.b:0 "My path lies north, beyond the Wall and into the winter cold."

 GOT_Story_News.129.t:0 "The Stark Princes Vanish"
 GOT_Story_News.129.d:0 "Conflicting reports and grim rumors swirl around the ironborn occupation of Winterfell following the reported murder of Bran and Rickon Stark by Theon Greyjoy. Whispers from escaped servants suggest that the tarred, charred heads displayed above the castle walls were not those of the Young Wolf's brothers, but poor farm children slaughtered to cover a daring escape. As northern lords gather their forces to avenge the Stark bloodline, reports grow that the true young heirs have vanished into the vast northern wilderness, guarded by loyal companions and wolfpacks, kept alive by the ancient magic of the First Men."
 GOT_Story_News.129.a:0 "The direwolves still run in the dark."


 # Theon Greyjoy Discovers Bran and Rickon's Escape
 GOT_Story_Country.130.t:0 "An Empty Cage"
 GOT_Story_Country.130.d:0 "Theon Greyjoy awakes to cold dread inside the Lord's chambers of Winterfell. In the dark hours before dawn, Bran and Rickon Stark vanished from their beds, guided past the guards by the wildling woman Osha, the gentle giant Hodor, and their direwolves. The escape is a catastrophic blow to Theon's fragile authority; if the ironborn cannot even hold two crippled boys captive, his own men will mock him, and the surrounding northern lords will show no mercy. Riding out at first light with hunting hounds and Reek at his side, the Prince of Winterfell hunts through the wolfswood in growing panic. Desperate to hide his humiliation and prove his iron resolve before the realm, Theon prepares to commit an act of unspeakable savagery that will forever seal his fate as a turncoat and a monster."
 GOT_Story_Country.130.a:0 "Find them! I cannot let those boys make a fool of me!"
 GOT_Story_Country.130.b:0 "If I cannot bring back the Starks, I will bring back their heads."

 GOT_Story_News.130.t:0 "Chaos in Occupied Winterfell"
 GOT_Story_News.130.d:0 "Reports from the heart of the North indicate that Theon Greyjoy's control over Winterfell is rapidly disintegrating. Following the sudden night escape of Brandon and Rickon Stark, the ironborn commander led a desperate hunt into the surrounding forests to recapture the highborn hostages. Faced with open defiance from the local smallfolk and the looming threat of northern vengeance, Greyjoy's rule over the castle has descended into paranoia and violence, signaling that the Ironmen's hold on the Stark ancestral seat may be short-lived."
 GOT_Story_News.130.a:0 "The Prince of Winterfell stands on sinking sands."


 # Jon Snow and Qhorin Halfhand Captured by Wildlings
 GOT_Story_Country.131.t:0 "Trapped in the Skirling Pass"
 GOT_Story_Country.131.d:0 "Deep within the frostbitten peaks of the Skirling Pass, the trap has sprung. Outnumbered and relentless, the wildling warbands under Rattleshirt have hunted down Qhorin Halfhand and Jon Snow, cornering the last rangers of the patrol against the sheer ice cliffs. Realizing that defeat is absolute, the legendary Halfhand whispers a desperate, secret order to the young bastard: Jon must yield, pretend to break his solemn vows, and join the Free Folk as a turncoat. Only by winning the wildlings' trust can Jon infiltrate Mance Rayder's host and discover their true plans for the Wall. To prove his feigned betrayal, Jon is forced to draw Longclaw against his own brother of the Watch in a fatal, single combat that will forever sever him from his old life."
 GOT_Story_Country.131.a:0 "I am the sword in the darkness... I will do what I must to survive."
 GOT_Story_Country.131.b:0 "Forgive me, brother. I shall play the turncoat for the Watch."

 GOT_Story_News.131.t:0 "Rangers Fall in the Frostfangs"
 GOT_Story_News.131.d:0 "Grim tidings arrive from the frozen wilderness north of the Wall. A veteran scouting party led by the renowned Qhorin Halfhand has been wiped out in the Skirling Pass by wildling raiders. Among the fallen was Lord Eddard Stark's bastard son, Jon Snow, who was reported captured by the Free Folk vanguard. With seasoned commanders lost and the wildling horde under Mance Rayder advancing unchecked toward the Wall, a dark pall hangs over Castle Black as the Night's Watch prepares to face a siege with severely weakened ranks."
 GOT_Story_News.131.a:0 "The shadows deepen over the Wall."


 # Catelyn Stark's Arrest for Jaime's Release
 GOT_Story_Country.132.t:0 "A Mother's Desperate Choice"
 GOT_Story_Country.132.d:0 "Grief and desperation have shattered the unity of the Northern high command at Riverrun. Driven mad by news of Bran and Rickon's supposed murder at Winterfell and terrified for her remaining daughters trapped in King's Landing, Lady Catelyn Stark committed an act of unbelievable treason: in the dead of night, she released the Kingslayer, Ser Jaime Lannister, from his dark dungeon. Bound by a solemn oath to return Sansa and Arya safely, Jaime was escorted away in chains by Ser Brienne of Tarth. Lord Rickard Karstark and the northern bannermen demand Lady Catelyn's execution for robbing them of their most valuable captive, forcing King Robb Stark to place his own mother under house arrest. As anger boils through the camps, the Young Wolf faces an agonizing rift within his own ranks that threatens to tear the kingdom apart from within."
 GOT_Story_Country.132.a:0 "Place Lady Catelyn under guard. Love has driven her to treason."
 GOT_Story_Country.132.b:0 "She acted out of grief, but the damage to our cause is absolute."

 GOT_Story_News.132.t:0 "Treason in Riverrun"
 GOT_Story_News.132.d:0 "Shocking news spreads from the riverlands after Lady Catelyn Stark secretly freed the Kingslayer, Ser Jaime Lannister, from captivity in the dungeons of Riverrun. Dispatched into the dark under the guard of Ser Brienne of Tarth in a desperate bid to trade him for her daughters, Lannister's escape has provoked fury among the northern lords. Lord Rickard Karstark and rival commanders openly denounce the act, forcing King Robb Stark to arrest his own mother to maintain order among his rebellious bannermen. With their prized captive gone and internal strife mounting, the Northern war effort faces its darkest crisis yet."
 GOT_Story_News.132.a:0 "The Young Wolf's council fractures from within."


 # Arya Stark Coerces Jaqen H’ghar
 GOT_Story_Country.133.t:0 "A Girl Gives a Name"
 GOT_Story_Country.133.d:0 "Trapped within the cavernous halls of Harrenhal under the thumb of Lord Roose Bolton, Arya Stark knows her time is running out. With only her final unnamed death remaining from Jaqen H'ghar, she approaches the mysterious Lorathi assassin with a clever, audacious demand: to kill Jaqen H'ghar himself. Horrified by the paradox, Jaqen begs her to un-name him, promising to do whatever she asks instead. Seizing her chance, Arya demands his aid in escaping the cursed fortress along with her companions Gendry and Hot Pie. That night, the guards at the postern gate fall dead with their throats slit, their weapons dropped into the mud as the iron doors swing open. Slipping into the dark riverlands, Arya proves that despite her youth, she possesses the lethal cunning and fierce resolve of a true wolf of Winterfell."
 GOT_Story_Country.133.a:0 "A girl has a name—and a plan."
 GOT_Story_Country.133.b:0 "Un-name a man, if he opens the gates for us tonight."

 GOT_Story_News.133.t:0 "Escape from Harrenhal"
 GOT_Story_News.133.d:0 "Word spreads from the ruined towers of Harrenhal that a small band of captives, including high-value northern prisoners, has escaped into the night under mysterious circumstances. Sentries guarding the outer postern gate were found dead at their posts, killed with terrifying, silent precision before the heavy iron gates were unbarred from within. Reports attribute the daring jailbreak to a fierce young girl guided by a shadowy assassin, leaving the garrison in confusion as search parties scour the riverlands in vain."
 GOT_Story_News.133.a:0 "The wolf cubs run free in the dark."


 # Cersei Lannister Tries to Blackmail Tyrion
 GOT_Story_Country.134.t:0 "A Threat in the Shadows"
 GOT_Story_Country.134.d:0 "In the gilded snakes' nest of the Red Keep, Queen Cersei Lannister strikes a venomous blow against her brother Tyrion. Believing she has uncovered his deepest secret—a northern whore hidden in the city—Cersei orders her guards to seize the courtesan Ros, binding and beating her in a dark bedchamber to blackmail the Hand of the King. Cersei promises to inflict horrifying torture upon the girl should any harm come to King Joffrey in the impending siege. Tyrion is forced to swallow his rage, letting his sister believe she holds his true love Shae captive. Playing along with the cruel illusion to protect his actual lover, the Imp vows severe vengeance, proving that the deadliest battles in King's Landing are fought not with swords, but with spite, deceit, and family hatred."
 GOT_Story_Country.134.a:0 "She thinks she holds my heart... but she will pay for this."
 GOT_Story_Country.134.b:0 "Let her believe her leverage is real. I will hit back harder."

 GOT_Story_News.134.t:0 "Intrigue Within the Red Keep"
 GOT_Story_News.134.d:0 "As enemy armies close in on the capital, whispers of severe internal strife emerge from the royal apartments of King's Landing. Queen Regent Cersei Lannister has struck out against her brother Tyrion, ordering the arrest and imprisonment of a prominent court courtesan in an attempt to leverage control over the Hand of the King. The vicious power struggle between the royal siblings highlights the bitter fractures within House Lannister, threatening to tear apart the crown's leadership on the very eve of Stannis Baratheon's assault."
 GOT_Story_News.134.a:0 "House Lannister turns its claws upon itself."


 # Theon Greyjoy's Deception of Bran and Rickon
 GOT_Story_Country.135.t:0 "Charred Flesh upon the Gates"
 GOT_Story_Country.135.d:0 "Having failed to find Brandon and Rickon Stark in the wolfswood, panic drove Theon Greyjoy to commit an irredeemable atrocity. Guided by the sadistic whispers of Reek, the Prince of Winterfell rode to Acorn Hall, slaughtered two innocent miller's sons, and stripped their flesh. After dipping their headless corpses in pitch and charring them over a bonfire, he mounted the gruesome remains upon spiked iron cages high above the castle gates. To the horrified smallfolk and the grieving North, the line of Eddard Stark appears broken forever. Though the terrible lie secures his fragile reputation as a ruthless conqueror among his ironborn crew, the monstrous deception seals Theon's fate, earning him the eternal, merciless hatred of every lord and peasant from the Neck to the Wall."
 GOT_Story_Country.135.a:0 "They will believe the Starks are dead. Fear alone shall secure my keep."
 GOT_Story_Country.135.b:0 "The iron price demands sacrifice... let them weep over false graves."

 GOT_Story_News.135.t:0 "Darkness over Winterfell"
 GOT_Story_News.135.d:0 "In a horror that has sent shockwaves through every hall in Westeros, two pitch-blackened, tarred bodies have been hung above the gates of Winterfell by order of Theon Greyjoy. The ironborn turncoat publicly claims the corpses belong to young Brandon and Rickon Stark, proclaiming the ancient line of Kings of Winter extinguished. As news of the gruesome spectacle reaches the northern hosts fighting in the Riverlands, grief turns to murderous fury across the realm, uniting northern lords in a solemn vow to flay the Ironmen from the walls of Winterfell."
 GOT_Story_News.135.a:0 "A dark day for the realm... the direwolves are slain."


 # Tyrion Plans King's Landing Defense
 GOT_Story_Country.136.t:0 "Defenders of the Mud Gate"
 GOT_Story_Country.136.d:0 "Lookouts atop the Maidenvault report that Stannis Baratheon's massive fleet has rounded Massey's Hook, hundreds of warships sailing under the flaming heart banner straight for the mouth of the Blackwater Rush. In the tense hours before the assault, Tyrion Lannister and his commander of the City Watch, Ser Bronn of the Blackwater, labor tirelessly to transform the capital into an iron fortress. Massive iron chains have been forged in secrecy and anchored across the riverbed, giant catapults loaded with pitch sit mounted upon the battlements, and thousands of Gold Cloaks line the mud ramparts. With King Joffrey cowering behind his mother's skirts and the garrison outnumbered three to one, the Imp must rely on ruthless tactical cunning and deadly traps to break the grand armada before Stannis's armored knights can breach the gates."
 GOT_Story_Country.136.a:0 "Every chain link and catapult must be ready. Give them a fiery welcome!"
 GOT_Story_Country.136.b:0 "They expect us to cower behind stone. We shall drown them in green flame."

 GOT_Story_News.136.t:0 "The Capital Braces for Assault"
 GOT_Story_News.136.d:0 "Tension reaches a fever pitch across the Crownlands as Stannis Baratheon's formidable land and sea forces converge upon King's Landing. Under the frantic direction of Tyrion Lannister and Ser Bronn, the City Watch has fortified the gates, mounted scorpions upon the battlements, and laid secret naval defenses along the Blackwater Rush. As smoke rises from burning outskirts and the royal fleet anchors in defense, the impending battle promises to be the bloodiest clash of the War of the Five Kings, deciding who shall sit upon the Iron Throne."
 GOT_Story_News.136.a:0 "The storm breaks over King's Landing."


 # Cersei Blackmails Tyrion with Ros (Expanded Context)
 GOT_Story_Country.137.t:0 "A Queen's Vicious Leverage"
 GOT_Story_Country.137.d:0 "Driven by fiercely protective instincts for her son King Joffrey, Queen Cersei Lannister executes a cold, calculated strike against her brother Tyrion. Believing she has dragged the Hand's secret lover from his bed, Cersei holds the courtesan Ros under heavy guard in Maegor's Holdfast. The Queen Regent delivers a chilling ultimatum: if Joffrey suffers even a scratch during the approaching siege, Ros will endure unspeakable torments before being put to death. Forced to play the distraught lover to shield his real secret romance with Shae, Tyrion bites his tongue and accepts her terms with masking bitter fury, vowing to himself that the debt Cersei has incurred this night will be repaid with interest."
 GOT_Story_Country.137.a:0 "She thinks she holds my weakness... I shall let her believe it."
 GOT_Story_Country.137.b:0 "Let her play her vicious games. I will pay her back tenfold."

 GOT_Story_News.137.t:0 "Hostage in the Red Keep"
 GOT_Story_News.137.d:0 "Dark intrigue destabilizes the inner chambers of the Red Keep as Queen Regent Cersei Lannister takes a prominent court courtesan hostage to force compliance from the Acting Hand, Tyrion Lannister. With enemy armies gathering outside the gates, the bitter rivalry between the Lannister siblings reaches a dangerous breaking point, threatening the stability of the crown's leadership on the eve of battle."
 GOT_Story_News.137.a:0 "Lannister fights Lannister while the city burns."


 # Daenerys Refuses to Leave Without Her Dragons
 GOT_Story_Country.138.t:0 "The Blood of the Dragon Unbroken"
 GOT_Story_Country.138.d:0 "Surrounded by treacherous merchant princes and hostile sorcerers in the ancient city of Qarth, Queen Daenerys Targaryen stands resolute despite the theft of her hatchlings and the slaughter of her loyal guards. Advisors urge her to flee across the Red Waste before her enemies strike again, yet the Mother of Dragons refuses to retreat an inch without her children. Confronting the Thirteen and defying those who deem her helpless, Daenerys declares that she will tear down the stone walls of Qarth and lay waste to its marble palaces before she abandons her dragons. Her fierce defiance awes the remaining members of her khalasar, transforming a stranded exile into an unyielding conqueror who will stop at nothing to reclaim her birthright."
 GOT_Story_Country.138.a:0 "I am the blood of the dragon. I do not flee from thieves!"
 GOT_Story_Country.138.b:0 "No wall, warlord, or warlock will keep my children from me."

 GOT_Story_News.138.t:0 "Defiance in the Great Plaza"
 GOT_Story_News.138.d:0 "Despite the theft of her dragons and rising threats to her life, Daenerys Targaryen has publicly refused to flee the city of Qarth. Standing before the council of merchant lords, the Dragon Queen swore an unyielding oath to recover her hatchlings and punish those responsible, refusing all offers of safe passage across the Jade Sea. Her fierce determination has stunned the city's ruling factions, signaling that the last Targaryen will meet her enemies with fire and blood rather than bow to intimidation."
 GOT_Story_News.138.a:0 "The Mother of Dragons refuses to yield."


 # Robb Stark Responds to Jaime’s Escape
 GOT_Story_Country.139.t:0 "The Young Wolf's Fury"
 GOT_Story_Country.139.d:0 "Returning victorious from the siege of the Crag alongside his new bride, Lady Talisa Maegyr, King Robb Stark marches back into Riverrun only to be met with devastating news: Ser Jaime Lannister has been freed by his own mother, Lady Catelyn. The loss of their prized bargaining chip sends shockwaves through the northern war camp, stirring open dissent among the bannermen. Refusing to allow this betrayal to paralyze his campaign, the Young Wolf channels his fury into action. Ordering his mother placed under strict guard, Robb gathers his battle commanders to dramatically redirect his grand strategy. Abandoning defense, he prepares to march his main host directly against Lord Tywin Lannister's army, determined to force a decisive, bloody confrontation before the Lannister-Tyrell alliance can crush the North."
 GOT_Story_Country.139.a:0 "Jaime may be gone, but the war goes on. Tywin Lannister will face us in the field!"
 GOT_Story_Country.139.b:0 "My own mother has broken our front... We must strike before Tywin recovers."

 GOT_Story_News.139.t:0 "The Young Wolf Realigns His Host"
 GOT_Story_News.139.d:0 "Following the scandalous release of Ser Jaime Lannister from the dungeons of Riverrun, King Robb Stark has dramatically altered his military strategy. Rather than falling back to defend his borders, the Young Wolf has ordered a swift regrouping of his northern and riverland forces to strike directly against Lord Tywin Lannister's army. This bold maneuver shifts the center of gravity in the Riverlands, setting the stage for a monumental clash between the undefeated Young Wolf and the Old Lion of Casterly Rock."
 GOT_Story_News.139.a:0 "The armies of the North prepare for a decisive clash."


 # Battle of Blackwater
 GOT_Story_Country.140.t:0 "The Battle of the Blackwater"
 GOT_Story_Country.140.d:0 "Night falls over the capital as Stannis Baratheon's grand armada sails into the Blackwater Rush. Tyrion Lannister springs his master trap: a lone ship leaking emerald liquid springs to life as Ser Bronn fires a flaming arrow, detonating thousands of jars of wildfire. The river erupts into a roaring inferno of green fire, incinerating scores of warships and drowning thousands in blazing water. Yet Stannis leads his surviving armored foot soldiers ashore, hammering at the Mud Gate with battering rams. Tyrion leads a desperate sally out the postern gate to hold the line, suffering a near-fatal blow from a Kingsguard turncoat. Just as the defenses buckle, horn calls echo from the woods: Lord Tywin Lannister and Ser Loras Tyrell, clad in Renly Baratheon's armor, crash into Stannis's rear with a massive host of cavalry, smashing the besiegers and saving the Iron Throne."
 GOT_Story_Country.140.a:0 "The green fire consumed them, and the lion was victorious!"
 GOT_Story_Country.140.b:0 "We bled for every inch of stone... but King's Landing stands."

 GOT_Story_News.140.t:0 "Inferno on the Blackwater"
 GOT_Story_News.140.d:0 "The greatest clash of the War of the Five Kings has ended in a catastrophic defeat for Stannis Baratheon before the walls of King's Landing. A devastating deployment of wildfire by Acting Hand Tyrion Lannister annihilated the invading fleet in the Blackwater Rush, turning the river into a burning cauldron. Stannis's remaining landing forces were shattered when Lord Tywin Lannister and the vanguard of House Tyrell arrived in force, striking the besiegers from the flank. Stannis was forced to flee back to Dragonstone with a fraction of his army, securing King Joffrey's hold on the Iron Throne and cementing a formidable new alliance between the Lion and the Rose."
 GOT_Story_News.140.a:0 "The Iron Throne is saved in a sea of green flame."


 # Cersei’s Emotional Collapse
 GOT_Story_Country.141.t:0 "Despair in Maegor's Holdfast"
 GOT_Story_Country.141.d:0 "Barricaded inside Maegor's Holdfast while the battle rages beyond the castle walls, Queen Cersei Lannister surrounds herself with the noble ladies of the court. Soaking her terror in strong wine, Cersei subjects Sansa Stark to dark, cynical truths about power, cruelty, and the harsh realities women face in a world ruled by men. As the distant thud of battering rams echoes through the stone floors and false reports of breached gates arrive, the Queen Regent leads young Tommen to the Iron Throne itself. Holding a bottle of nightshade to her young son's lips, Cersei prepares to end both their lives rather than surrender to Stannis Baratheon's wrath—a harrowing testament to the sheer desperation that consumed the Red Keep before relief arrived at the eleventh hour."
 GOT_Story_Country.141.a:0 "Tears are a woman's weapon. I prefer iron and poison."
 GOT_Story_Country.141.b:0 "A lioness protects her cubs from the hunters—even in madness."

 GOT_Story_News.141.t:0 "Terror in the Royal Apartments"
 GOT_Story_News.141.d:0 "Behind the thick stone walls of the Red Keep, the terrifying climax of the Battle of the Blackwater pushed the royal court to the absolute brink of total ruin. Reports from highborn ladies inside Maegor's Holdfast describe Queen Cersei Lannister preparing for the ultimate downfall of House Lannister as siege engines battered the city gates. Only the sudden, bloody rout of Stannis Baratheon's army saved the royal family from a gruesome end, laying bare the profound vulnerability and desperate measures at the heart of the Iron Throne."
 GOT_Story_News.141.a:0 "The Red Keep came within an inch of falling into shadow."


 # The Hound Abandons the Fight
 GOT_Story_Country.142.t:0 "F*ck the King's Guard"
 GOT_Story_Country.142.d:0 "As wildfire turns the Blackwater into a roaring hellscape, crippling terror strikes at the heart of Sandor Clegane. Sent to hold the Mud Gate against Stannis's vanguard, the sight of men burning alive triggers the Hound's deepest, most traumatic fear. Overwhelmed by the blinding horror of the flames and utterly disgusted by King Joffrey's cowardice from the safety of the keep, the formidable sworn shield refuses to return to the front line. Stripping off his white mantle and swearing a curse upon the king and the capital, Clegane turns his back on House Lannister. Before deserting into the dark riverlands, he slips into Sansa Stark's bedchamber, offering to take her away from her tormentors into the North, leaving the crown's most deadly warrior lost to the realm."
 GOT_Story_Country.142.a:0 "Bugger the king. Bugger the city. I am done."
 GOT_Story_Country.142.b:0 "There is no honor in serving a coward while the world burns."

 GOT_Story_News.142.t:0 "The Hound Deserts"
 GOT_Story_News.142.d:0 "In a shocking betrayal during the height of the Battle of the Blackwater, Sandor Clegane—the fierce, scarred sworn shield of King Joffrey Baratheon—abandoned his post and fled the capital. Witnesses report that Clegane openly cursed the young king and cast aside his cloak after seeing the horrors of the wildfire inferno at the gates. The desertion of one of the realm's most feared warriors has sent shockwaves through the garrison of King's Landing, signaling a profound break in the iron discipline of the royal guard."
 GOT_Story_News.142.a:0 "A killer abandons the crown's service."


 # Joffrey’s Cowardice Exposed
 GOT_Story_Country.143.t:0 "The Coward King Retreats"
 GOT_Story_Country.143.d:0 "As the battering rams of Stannis Baratheon crash against the Mud Gate and flaming pitch rains down upon the defenders, Queen Cersei sends royal guards to summon King Joffrey back to the safety of Maegor's Holdfast. Gladly seizing the excuse to flee the gore and terrifying din of the battlements, the young king slinks away from the front lines, leaving his commanders in disbelief. The sight of their sovereign abandoning the walls sends a wave of panic through the City Watch and garrison troops, causing many to cast down their spears and flee. Only Tyrion Lannister's furious intervention and rally cry keep the gates from falling outright, laying bare Joffrey's utter lack of martial courage to the soldiers who bled while he cowered behind thick stone walls."
 GOT_Story_Country.143.a:0 "Let the smallfolk bleed. My royal life is too precious to waste!"
 GOT_Story_Country.143.b:0 "I am the King! My mother summoned me... I do not need to fight!"

 GOT_Story_News.143.t:0 "King Joffrey Abandons the Ramparts"
 GOT_Story_News.143.d:0 "Reports from the battlements of King's Landing reveal that King Joffrey Baratheon abandoned his post at the Mud Gate during the peak of Stannis Baratheon's assault. Summoned back to the inner keep by Queen Cersei, the young monarch's hasty retreat caused widespread panic among the City Watch, nearly leading to a complete collapse of the capital's defenses before auxiliary commanders stepped in to restore order. The incident has fueled widespread mockery and whispers of cowardice across the realm, casting a dark shadow over Joffrey's legitimacy and royal authority."
 GOT_Story_News.143.a:0 "The Boy King shows his true colors under fire."


 # Tyrion’s Defense Strategy Shines
 GOT_Story_Country.144.t:0 "The Demon of the Blackwater"
 GOT_Story_Country.144.d:0 "When the Hound fled and King Joffrey retreated to his mother's skirts, the defense of the capital fell squarely upon the shoulders of the dwarf. Donning heavy steel plate and wielding a battleaxe, Tyrion Lannister rallied the terrified Gold Cloaks at the Mud Gate, crying out, 'They say I'm a halfman! What does that make you?' Leading a ferocious counter-sally through the sally port, Tyrion drove Stannis's vanguard back onto the burning mudflats. Though betrayed and slashed across the face by Ser Mandon Moore of the Kingsguard in the chaotic bloodbath, Tyrion's cunning play with wildfire and heroic charge held the gate until Tywin Lannister's relief host arrived. He bled for a city that despised him, proving that the smallest man can cast the largest shadow."
 GOT_Story_Country.144.a:0 "I fought for this ungrateful city... let them remember who saved them!"
 GOT_Story_Country.144.b:0 "They mocked the halfman... until I turned the river into a burning hell."

 GOT_Story_News.144.t:0 "The Imp's Heroic Stand"
 GOT_Story_News.144.d:0 "Eye-witness accounts from the Battle of the Blackwater reveal that Acting Hand Tyrion Lannister personally led the desperate counter-attack that saved King's Landing from falling to Stannis Baratheon. After incinerating the enemy fleet with wildfire, the Hand led a charge into the fray at the Mud Gate, sustaining a gruesome facial wound in the process. Though court sycophants rush to attribute the total victory to Lord Tywin Lannister, veterans of the City Watch freely admit that without the Imp's fiery brilliance and brave leadership, the Iron Throne would have fallen hours before help arrived."
 GOT_Story_News.144.a:0 "The halfman proved his mettle in blood and fire."


 # Robb Marries Talisa
 GOT_Story_Country.145.t:0 "A Broken Oath in the Heart Tree's Light"
 GOT_Story_Country.145.d:0 "In a quiet sept beneath the starry skies of the Riverlands, King Robb Stark stands beside Lady Talisa Maegyr before a solitary septon. Torn between sacred duty to his kingdom and the undeniable passion in his heart, the Young Wolf makes a choice that will reverberate across the Seven Kingdoms. To honor his betrothal to House Frey would secure the crucial crossing at the Twins and maintain the backbone of his army; to break it for love risks alienating the proud, vengeful Lord Walder Frey. As seven vows are spoken and the maiden's cloak is swapped for the direwolf of Stark, Robb binds his destiny to Talisa, choosing love over political expedience—a noble act that may cost him the very crown he wears."
 GOT_Story_Country.145.a:0 "I marry Talisa Maegyr. Let the heart rule over cold politics."
 GOT_Story_Country.145.b:0 "I must honor my word to Lord Frey. The cause demands sacrifice."

 GOT_Story_News.145.t:0 "The King in the North Weds"
 GOT_Story_News.145.d:0 "In a secret ceremony away from the eyes of his war council, King Robb Stark has taken Lady Talisa Maegyr as his queen, breaking his solemn betrothal to a daughter of House Frey. News of the unexpected royal marriage has sparked immediate outrage at the Twins, with Lord Walder Frey denouncing the dishonor brought upon his house. As northern commanders urge caution, whispers grow that this breach of faith could fracture the Young Wolf's alliance at the precise moment he needs every sword to face the combined might of Casterly Rock and Highgarden."
 GOT_Story_News.145.a:0 "A king's love risks the wrath of the Twins."


 # Joffrey and Margaery Betrothal
 GOT_Story_Country.146.t:0 "The Lion and the Rose"
 GOT_Story_Country.146.d:0 "In the grand throne room of the Red Keep, before a packed court of victorious lords and ladies, King Joffrey Baratheon publicly casts aside his betrothal to Sansa Stark. Citing her father's treason and her house's rebellion, the young king sets the Northern girl aside to accept the hand of Lady Margaery Tyrell, the radiant widow of Renly Baratheon. Brokered by Lord Petyr Baelish and ratified by Lord Tywin Lannister, this union seals a formidable military and economic pact between Casterly Rock and Highgarden. While Sansa silently rejoices at her release from Joffrey's sadistic cruelty, the grand engagement signals a catastrophic shift in the war, uniting the immense wealth and grain reserves of the Reach with the iron grip of House Lannister."
 GOT_Story_Country.146.a:0 "Sansa was the daughter of a traitor. Margaery brings the strength of the Reach!"
 GOT_Story_Country.146.b:0 "A union of beauty and political power to secure the Iron Throne."

 GOT_Story_News.146.t:0 "Royal Betrothal Announced"
 GOT_Story_News.146.d:0 "Proclamations issued from King's Landing confirm that King Joffrey Baratheon has formally set aside Sansa Stark to enter into a betrothal with Lady Margaery Tyrell. The momentous match cements the burgeoning alliance between House Lannister and House Tyrell, uniting the forces that broke Stannis Baratheon's siege at the Blackwater. As food shipments from the Reach begin flowing into the starving capital, the wedding promises to establish an untouchable coalition, casting a long, dark shadow over the remaining enemies of the Crown."
 GOT_Story_News.146.a:0 "The Lion and the Rose bind the realm together."


 # Arya and Jaqen Part Ways
 GOT_Story_Country.147.t:0 "A Coin of Iron and Shadow"
 GOT_Story_Country.147.d:0 "In a quiet wood within the war-torn Riverlands, Arya Stark bids farewell to Jaqen H'ghar. The enigmatic assassin reveals his true nature by magically changing his face before her eyes, shifting from the Lorathi rogue into an entirely different man. Impressed by her fierce spirit, Jaqen invites Arya to travel with him to Braavos to learn the secrets of the Faceless Men. Though her urgent desire to find her family forces her to decline, Jaqen presses a small, heavy iron coin into her palm. He instructs her that should she ever need passage across the Narrow Sea, she need only give the coin to any man from Braavos and speak the High Valyrian words: 'Valar Morghulis.' Clutching the cold token, the young wolf takes another decisive step down a dark path of vengeance."
 GOT_Story_Country.147.a:0 "Valar Morghulis—all men must die. But my list is not complete."
 GOT_Story_Country.147.b:0 "I hold the iron coin. A day will come when I speak those words."

 GOT_Story_News.147.t:0 "A Ghost in the Riverlands"
 GOT_Story_News.147.d:0 "Following the mysterious breakout at Harrenhal, all trace of Arya Stark has vanished into the thick forests of the Riverlands. Whispers travel among peasant campfires of a young northern girl traveling alongside sellswords and strange foreigners, leaving silent deaths in her wake. Though Lannister search parties and river lords continue to comb the roads, the young wolf has faded into shadow, leaving behind only eerie rumors of iron tokens and dark, foreign phrases echoing through the night."
 GOT_Story_News.147.a:0 "The wolf girl disappears into the shadows of war."


 # Daenerys Faces the Warlocks
 GOT_Story_Country.148.t:0 "Dracarys in the House of the Undying"
 GOT_Story_Country.148.d:0 "Guided by the desperate cries of her children, Daenerys Targaryen enters the eerie, labyrinthine halls of the House of the Undying to face Pyat Pree and the warlocks of Qarth. Trapped in magic chains within the dark chamber, the Mother of Dragons beholds her three hatchlings bound in iron. Pyat Pree taunts her, declaring that her presence will sustain their magical power for millennia. Yet the warlocks fail to realize that dragons are not mere beasts to be caged. Whispering the high Valyrian command 'Dracarys', Daenerys unleashes streams of crimson and gold flame from the hatchlings, reducing Pyat Pree to ash and shattering the sorcerous tower. Emerging victorious with her dragons, Daenerys strips the palaces of Qarth to buy passage west, her legend as an unyielding conqueror echoing across Essos."
 GOT_Story_Country.148.a:0 "Fire cannot kill a dragon!"
 GOT_Story_Country.148.b:0 "You will not cage what was born to burn!"

 GOT_Story_News.148.t:0 "Inferno at the House of the Undying"
 GOT_Story_News.148.d:0 "Plumes of dark smoke and magical flame have consumed the ancient spires of the House of the Undying in Qarth. Witnesses report that Daenerys Targaryen breached the mystical fortress, slew the grand warlock Pyat Pree, and reclaimed her three stolen dragons before plundering the treachery-laden city for resources. With her hatchlings restored and her enemies reduced to ash, the last Targaryen sets sail from Qarth at the head of a rejuvenated khalasar, her eyes fixed firmly on the Iron Throne."
 GOT_Story_News.148.a:0 "The Mother of Dragons reclaims her children in fire."


 # Jon Snow’s Path Beyond the Wall
 GOT_Story_Country.149.t:0 "Into the Tent of the King"
 GOT_Story_Country.149.d:0 "Spared from death by Qhorin Halfhand's deliberate sacrifice, Jon Snow marches through the frozen expanse of the Frostfangs under the heavy guard of Rattleshirt and his wildling raiding party. Dragged into the vast encampment of the Free Folk, Jon beholds thousands of campfires stretching across the snow-covered valley—an army unlike any the Night's Watch has ever faced. Bound and branded a turncloak, the bastard of Winterfell is brought before Mance Rayder, a former ranger of the Shadow Tower who abandoned his vows to unite the wildling clans. To survive and fulfill his secret mission for the Watch, Jon must convince the King-Beyond-the-Wall that he has truly forsaken his oaths, stepping into a world where freedom is bought with blood and cold resolve."
 GOT_Story_Country.149.a:0 "If I must play the turncloak to save the realm, so be it."
 GOT_Story_Country.149.b:0 "I will walk among the Free Folk and learn what drives their king."

 GOT_Story_News.149.t:0 "A Crow in the Frostfangs"
 GOT_Story_News.149.d:0 "Reports filtering down from the Haunted Forest confirm that Jon Snow, bastard son of Eddard Stark and a sworn brother of the Night's Watch, has been captured alive by Free Folk raiders beyond the Wall. Rumors suggest that after slaying his companion Qhorin Halfhand in single combat, Snow was brought directly before Mance Rayder, the King-Beyond-the-Wall. As the wildling host gathers in unprecedented numbers beneath the peaks of the Frostfangs, commanders at Castle Black grow increasingly fearful of what the young ranger's fate—or potential treason—portends for the defense of the realm."
 GOT_Story_News.149.a:0 "The Night's Watch watches the northern horizon with dread."


 GOT_Story_Country.150.t:0 "The Matter of the Succession"
 GOT_Story_Country.150.d:0 "The Iron Throne sits in chaos. Robert is dead, Joffrey is a bastard born of incest, and my elder brother Stannis is cold, rigid, and unloved. The realm does not need another stern tyrant—it needs hope, generosity, and charm. Lords from across the Stormlands and the Reach have urged me to act, offering seventy thousand spears and the vast wealth of Highgarden to place me upon the dais. The crown does not belong to the eldest by right of cold law, but to the man who can win the hearts of the people and hold the kingdom together. The choice now stands before us: do we raise our banners and stake our claim, or bend the knee and await the disaster to come?"
 GOT_Story_Country.150.a:0 "I shall take the crown—Renly Baratheon, First of His Name!"
 GOT_Story_Country.150.b:0 "It is not yet our time. We will bend the knee—for now."
 GOT_Story_Country.150.c:0 "Stannis has already claimed the throne. We will bend the knee to our brother."

 GOT_Story_News.150.t:0 "Renly Baratheon Claims the Iron Throne"
 GOT_Story_News.150.d:0 "Renly Baratheon, Lord of Storm's End and youngest brother of the late King Robert, has officially declared himself King of the Seven Kingdoms. With the full backing of House Tyrell and the vast chivalry of the Reach behind him, Renly's claim is bolstered by the largest army currently assembled in Westeros. As his massive host begins a leisurely march toward King's Landing, lords across the realm brace for a devastating civil war among the stag brothers, further fragmenting the Seven Kingdoms."
 GOT_Story_News.150.a:0 "A young charismatic king steps into the fray."

 
 GOT_Story_Country.151.t:0 "Princess Myrcella Departs for Dorne"
 GOT_Story_Country.151.d:0 "With the agreement sealed between House Lannister and House Martell, Princess Myrcella Baratheon now departs the capital. She will travel south to Sunspear, where she is to be fostered and eventually wed to Prince Trystane Martell. The court bids her farewell with pride and apprehension. Though still a child, her journey marks a critical step in uniting two great houses—one forged not by conquest, but by diplomacy. In these uncertain times, such alliances may prove more powerful than swords."
 GOT_Story_Country.151.a:0 "May she bring honor and peace to the realm."

 GOT_Story_News.151.t:0 "Princess Myrcella Sent to Dorne"
 GOT_Story_News.151.d:0 "Princess Myrcella Baratheon, daughter of Queen Cersei Lannister, has departed King’s Landing to be fostered in Sunspear. This journey marks the beginning of her betrothal to Prince Trystane Martell, heir to House Martell. The alliance, arranged by the Hand of the King, is a rare instance of diplomacy in a realm often governed by war and intrigue. While some view it as a wise move to secure peace in the South, others whisper that placing a royal child in the hands of the Martells may yet prove dangerous."
 GOT_Story_News.151.a:0 "Another piece moves on the board."

 # # # # # # # # # # # #
 # #SEASON 3 # #
 # # # # # # # # # # # # 

# GOT_Story_Country.201 – Meeting Mance Rayder
 GOT_Story_Country.201.t:0 "Meeting Mance Rayder"
 GOT_Story_Country.201.d:0 "Guarded by harsh winds and jagged iron weapons, Jon Snow was dragged through the chaotic encampment of the Free Folk into the warmth of the chief’s tent. Expecting a terrifying conqueror, he initially mistook the towering, boisterous Tormund Giantsbane for the leader of the wildling host. Yet it was a lean, unassuming man strumming a lute—Mance Rayder, the former ranger turned King Beyond the Wall—who commanded the true authority of the realm beyond. With cold, calculating eyes, Mance demanded to know why a sworn bastard of the Night's Watch would foreswear his sacred oaths. In the presence of harsh northern kings and fierce spear-wives, Jon offered his answer: a desperate vow to fight for the living before the true enemy sweeps down from the Frostfangs to consume them all."
 GOT_Story_Country.201.a:0 "I want to fight for the side that fights for the living."

 GOT_Story_News.201.t:0 "A Crow Among Wildlings"
 GOT_Story_News.201.d:0 "Whispers from the frozen north bring troubling tidings from beyond the Wall. Jon Snow, a bastard of Winterfell and a sworn brother of the Night’s Watch, has been paraded before the Free Folk host and brought before Mance Rayder himself. Once a proud ranger of Castle Black, Snow now walks among the very raiders and wildlings he was sworn to destroy. Whether this act represents the tragic betrayal of a brother succumbing to the harsh northern waste or a desperate ploy buried deep in enemy lines, a chill ripple of unease passes along the ice walls of the Watch and through the halls of the Seven Kingdoms."
 GOT_Story_News.201.a:0 "Has the Wall truly begun to crumble from within?"


 
# GOT_Story_Country.202 – The Issue of Casterly Rock
 GOT_Story_Country.202.t:0 "The Issue of Casterly Rock"
 GOT_Story_Country.202.d:0 "The ancient fortress of Casterly Rock, seated high upon its golden mountain, remains the ultimate symbol of House Lannister's wealth and sovereignty—a seat that by all laws of blood and inheritance should pass to Lord Tywin's eldest surviving son. Though Tyrion bled for the defense of the capital during the Battle of the Blackwater, his recovery was met not with gratitude, but with total displacement as his father assumed the Handship. Denied his rightful recognition, the imp of Casterly Rock now stands at a crossroads: step into the Hand's solar to demand the ancestral seat that is legally his, or swallow his pride and avoid the ruthless wrath of the Old Lion."
 GOT_Story_Country.202.a:0 "Neither sailor nor thrall shall sit my seat. It is mine by right!"
 GOT_Story_Country.202.b:0 "Silence is safer than exposing oneself to the Lion's claws."

 GOT_Story_News.202.t:0 "Tyrion Spurned by His Father"
 GOT_Story_News.202.d:0 "Tensions within the highest echelons of the Iron Throne have erupted into quiet scandal. Despite playing a decisive role in holding the mud gate and orchestrating the wildfire assault during the Battle of the Blackwater, Tyrion Lannister has been bitterly spurned by his father, Lord Tywin. Reports from within the Red Keep indicate that Tyrion's bid to be acknowledged as heir to Casterly Rock was met with scathing contempt and absolute denial. As the Hand consolidates his grip over King's Landing, this deepening fissure within the ruling dynasty leaves the court questioning the stability of House Lannister."
 GOT_Story_News.202.a:0 "A dwarf is never a hero in the eyes of his lord father."
 GOT_Story_News.202.b:0 "Even the golden lion cannot conceal its internal fractures."


 
# Daenerys Arrives in Astapor
 GOT_Story_Country.203.t:0 "A Blade in the Shadows"
 GOT_Story_Country.203.d:0 "The dusty harborside of Astapor reeked of salt, slave-sweat, and cooked meat. Amidst the sweltering heat of Slaver's Bay, the last Targaryen princess walked alongside her meager court, seeking to trade her dragons for thousands of castrated warrior-slaves. Yet in the shadowed alleys of Slaver's Bay, danger lurked in plain sight—a warlock's child presented a deadly manticore, intent on ending the dragon line once and for all. Before the venomous beast could strike, a cloaked old traveler shattered the plot with a swift thrust of his staff. Throwing back his hood to reveal the weathered face of Ser Barristan Selmy, the legendary former Lord Commander of the Kingsguard fell to one knee, offering his life and steel to the true queen."
 GOT_Story_Country.203.a:0 "I take you into my service, Ser Barristan the Bold."

 GOT_Story_News.203.t:0 "The Queen Gains a Sword"
 GOT_Story_News.203.d:0 "Far across the Narrow Sea, in the brutal slave markets of Astapor, word has reached the realm of a dramatic clash involving the exiled Targaryen pretender. Reports detail an assassination attempt via a venomous manticore, thwarted at the final second by an unexpected ally: Ser Barristan Selmy, former Lord Commander of King Robert's Kingsguard. Having fled Westeros after his dishonorable discharge by King Joffrey, the legendary knight has knelt before Daenerys Targaryen, pledging his formidable sword and centuries of Kingsguard lineage to her reclaiming march. The exiled dragon now possesses not only her beasts, but one of the realm's greatest living martial icons."
 GOT_Story_News.203.a:0 "Even legends turn their backs on the Iron Throne."


 
# Davos Imprisoned at Dragonstone
 GOT_Story_Country.204.t:0 "Chains of Loyalty"
 GOT_Story_Country.204.d:0 "Drawn from the wreckage of the Blackwater by swift currents and sheer spite, Ser Davos Seaworth dragged his broken body back to the cold basalt towers of Dragonstone. Yet the castle he returned to was no longer governed merely by Stannis Baratheon's rigid justice, but by the burning pyres of the Lord of Light. Horrified by the sacrificial burnings and convinced that the Red Priestess Melisandre was leading his king toward eternal damnation, the Onion Knight drew steel to rid the realm of her shadows. Disarmed and dragged down into the damp, salt-crusted dungeons below the fortress, Davos now sits in heavy irons—a fiercely loyal servant condemned as a traitor by the very master he sought to save from darkness."
 GOT_Story_Country.204.a:0 "I am the King's man, whether he chain me or crown me."

 GOT_Story_News.204.t:0 "The Onion Knight Shackled"
 GOT_Story_News.204.d:0 "Grave reports emerge from the gloomy island fortress of Dragonstone. Ser Davos Seaworth, Hand of King Stannis Baratheon and hero of the Blackwater Bay retreat, has been thrown into the dungeon in iron shackles. Reports from beyond the gullet indicate that Seaworth attempted to slay the red priestess Melisandre of Asshai, whose fanatical faith in R'hllor has increasingly dominated Stannis's court and strategy. With the most grounded and honest advisor to the Lord of Dragonstone silenced in a damp cell, Stannis's remaining loyalists drift deeper into the red shadow of prophecy and sacrifice."
 GOT_Story_News.204.a:0 "Fire burns brightest in the darkest halls."


 
# Robb Stark Finds Harrenhal Abandoned
 GOT_Story_Country.205.t:0 "The Butchered Fortress"
 GOT_Story_Country.205.d:0 "The charred ruins of Harrenhal loomed out of the mist like black, broken fingers clawing at the sky. Expecting a brutal battle against the Lannister garrison, the vanguard of the Northern army rode through the colossal iron gates only to be met by a sickening silence and the reek of putrefaction. Hundreds of Northmen and Riverlords lay slaughtered in the courtyards, butchered in cold blood before the Mountain abandoned the castle. As the Young Wolf toured the massacre, his men dragged a single shivering survivor from among the piled corpses—a disgraced maester stripped of his chain named Qyburn. Amidst the ancient curse that clings to these melted stone walls, a solitary life saved from the slaughter may yet prove useful to the Northern cause."
 GOT_Story_Country.205.a:0 "Tend to his wounds. We shall see what knowledge he possesses."

 GOT_Story_News.205.t:0 "Harrenhal Soaked in Blood"
 GOT_Story_News.205.d:0 "Grim news spreads from the Riverlands as Robb Stark's forces have occupied the monstrous stronghold of Harrenhal. The King in the North found no garrison to fight; Ser Gregor Clegane and his men had put hundreds of Northern prisoners to the sword before abandoning the fortress to rot. Among the mountains of the dead, only one man—a unfrocked maester named Qyburn—was pulled alive from the carnage. As the Young Wolf establishes his camp in the blood-soaked ruins, scholars and lords alike murmur that the dark legacy of Harren the Black continues to devour all who dare claim its shadowed halls."
 GOT_Story_News.205.a:0 "Harrenhal claims yet another toll of blood."


 
# Bran Meets Jojen and Meera Reed
 GOT_Story_Country.206.t:0 "A New Path Revealed"
 GOT_Story_Country.206.d:0 "Deeper into the cold northern wilderness, Brandon Stark was joined by Jojen and Meera Reed, the children of Lord Howland Reed of Greywater Watch. While Meera carries the spear and net of the crannogmen, Jojen possesses eyes green as moss and a quiet, haunting wisdom far beyond his years. The strange boy spoke directly of Bran's green dreams, explaining the mysterious three-eyed raven that haunts the boy's sleep. Jojen revealed that Bran carries 'the Sight'—a rare gift of prophecy—and the blood of a warg, capable of slipping his mind into the skin of his direwolf, Summer. Crippled in body though he may be, Bran realizes his true destiny lies not in swords or castles, but down a far darker, stranger path."
 GOT_Story_Country.206.a:0 "Fly, winged wolf... fly."

 GOT_Story_News.206.t:0 "The Sight Revealed"
 GOT_Story_News.206.d:0 "Strange tales drift south from the crannogs and pine forests of the North. Young Brandon Stark, long presumed dead or lost following the sack of Winterfell, has reportedly aligned with the crannogman heirs of Greywater Watch, Jojen and Meera Reed. Rumors swirling through northern hearths suggest the young Stark boy possesses ancient, forgotten bloodlines—gifted with greensight and the rare ability of a warg to inhabit the minds of beasts. As the war for the Iron Throne rages on, old magic seems to stir once more in the ancient blood of the First Men."
 GOT_Story_News.206.a:0 "The old gods still watch over the North."


# Arya Captured by the Brotherhood Without Banners
 GOT_Story_Country.207.t:0 "A New Band of Outlaws"
 GOT_Story_Country.207.d:0 "Disguised as a common orphan boy, Arya Stark was dragged alongside Gendry and Hot Pie into the flickering light of an underground cavern, surrounded by the hollow-eyed outlaws of the Brotherhood Without Banners. What began as a desperate flight across the war-torn Riverlands ended when Sandor Clegane, the disgraced Hound, was brought in as a captive and instantly recognized the youngest Stark daughter. Though surrounded by desperate men who march under no king's banner, Arya refused to cower. Held by men who claim to fight for the smallfolk, her true identity as a highborn hostage of Winterfell is now laid bare to the Brotherhood's shadowy leaders."
 GOT_Story_Country.207.a:0 "I am Arya of House Stark, and I am not afraid."

 GOT_Story_News.207.t:0 "Arya Stark Taken by Outlaws"
 GOT_Story_News.207.d:0 "Whispers from the scorched villages of the Riverlands reveal that Lady Arya Stark, youngest daughter of the late Lord Eddard, lives and has fallen into the hands of the Brotherhood Without Banners. The young noblewoman, previously thought lost or dead following the fall of Hand's Tower, was unmasked when the former Kingsguard knight Sandor Clegane identified her among a group of war refugees. Led by the resurrected Lord Beric Dondarrion and Thoros of Myr, the guerrilla band now holds a priceless bargaining chip, sending ripples of shock through both Riverrun and King's Landing."
 GOT_Story_News.207.a:0 "A wolf in a pack of rogue sheep."


# Sansa Confides in Lady Olenna Tyrell
 GOT_Story_Country.208.t:0 "The Queen's Heart"
 GOT_Story_Country.208.d:0 "In a secluded courtyard garden filled with lemon trees and guarded by Tyrell men-at-arms, Sansa Stark was invited to break bread with Lady Olenna Tyrell, the formidable Queen of Thorns, and her granddaughter Margaery. Surrounded by the glittering court of King's Landing, Sansa had long learned that honesty was a death sentence. Yet, pressed gently by the old matriarch of Highgarden, the young Northern hostage broke her silence, laying bare the bloody cruelty and sadistic nature of King Joffrey Baratheon. Releasing the truth felt like stepping off a cliff, but in the treacherous waters of the Red Keep, the thorned roses of Highgarden may be the only allies left to protect her."
 GOT_Story_Country.208.a:0 "He is a monster. Every word of it is true."

 GOT_Story_News.208.t:0 "Sansa Stark Confides in Highgarden"
 GOT_Story_News.208.d:0 "Intrigues inside the Red Keep have taken a delicate turn following a private dinner between Lady Sansa Stark and the ruling matriarchs of House Tyrell. Sources close to the court report that the Northern heiress laid bare the dark reality of King Joffrey's temperament to Lady Olenna and Lady Margaery, describing the boy-king not as a noble sovereign, but as a vicious monster. As Highgarden prepares to solidify its alliance with the Crown through marriage, this secret revelation could drastically alter the Queen of Thorns' strategy in the capital."
 GOT_Story_News.208.a:0 "A rose has thorns, and Highgarden listens closely."


# Jaime and Brienne Captured
 GOT_Story_Country.209.t:0 "Fate’s Hand"
 GOT_Story_Country.209.d:0 "Crossed blades andexhaustion ended in disaster along the riverbank as Ser Jaime Lannister and Brienne of Tarth were ambushed and dragged into irons by Locke's detachment of Bolton men. Though the Kingslayer fought with every ounce of his legendary swordplay, months of starvation and heavy steel bindings left him outmatched by his captors. Now paraded through the mud under the banner of the Flayed Man of Dreadfort, Jaime finds himself a helpless hostage once again. Bound to the relentless maid of Tarth, the Lord Commander of the Kingsguard must rely on cunning, threats, and sheer force of personality if he hopes to survive the cruel whims of his northern captors."
 GOT_Story_Country.209.a:0 "A Lannister always pays his debts... if he lives long enough."

 GOT_Story_News.209.t:0 "Jaime Lannister and Brienne Captured"
 GOT_Story_News.209.d:0 "Shocking developments from the Riverlands confirm that Ser Jaime Lannister, the Kingslayer, has been captured alongside Lady Brienne of Tarth by vanguard forces of House Bolton. Intercepted while secretly traveling toward the capital, the infamous Lannister commander was disarmed and bound alongside his escort. Though House Bolton remains nominally tied to the Northern cause, holding the Golden Lion's heir gives the Dreadfort immense leverage amidst the ongoing war. News of the Kingslayer's capture sends shockwaves through Casterly Rock and the halls of the Iron Throne alike."
 GOT_Story_News.209.a:0 "The Golden Lion falls into the grips of the Flayed Man."


# Robb Stark Learns of Winterfell's Destruction
 GOT_Story_Country.210.t:0 "Winterfell in Ashes"
 GOT_Story_Country.210.d:0 "Devastating dispatches from the North have shattered the encampment of the Young Wolf. Winterfell, the ancient ancestral seat of House Stark that stood for eight thousand years, has been sacked and put to the torch by Ironborn raiders under Theon Greyjoy. Raven scroll after raven scroll brings agony: Bran and Rickon are feared murdered in the ashes, while Lord Hoster Tully has finally succumbed to his lingering illness at Riverrun. Bereft of his brothers, his ancestral home, and his grandfather all at once, Robb Stark faces an agonizing test of resolve. Yet with enemy forces closing in and his own bannermen demanding blood, there is no respite for grief—the King in the North must ride for Riverrun to rally what remains of his broken realm."
 GOT_Story_Country.210.a:0 "They will pay for every stone of Winterfell with their blood."

 GOT_Story_News.210.t:0 "Winterfell Destroyed by the Ironborn"
 GOT_Story_News.210.d:0 "Tragedy and ruin have struck the very heart of the North. Reports confirmed across the Seven Kingdoms reveal that Winterfell, the legendary castle of House Stark, has been burned to the ground following a brutal betrayal by Ironborn invaders. With young Bran and Rickon Stark feared dead among the smoking ruins and Lord Hoster Tully passing away at Riverrun, King Robb Stark finds his cause struck by catastrophic loss. As the Northern host redirects its march toward Riverrun for Lord Tully's funeral, lords and monarchs across Westeros brace for the Young Wolf's vengeful wrath."
 GOT_Story_News.210.a:0 "The wolf pack bleeds, but the winter is coming."

 
# Jaime Lannister Loses His Sword Hand
 GOT_Story_Country.211.t:0 "A Hand Lost"
 GOT_Story_Country.211.d:0 "The wooden chopping block reeked of stale blood before the steel blade came flashing down. In a single moment of barbaric malice, Locke and his Northern sellswords severed Ser Jaime Lannister's right hand—the sword hand that made him the youngest Kingsguard in history, the finest swordsman in the Seven Kingdoms, and the Golden Lion of Casterly Rock. Attempting to bargain using his father's vast wealth to save Brienne of Tarth from horrific abuse only provoked his captors to butcher his pride. Hanging from his saddle in a haze of fever, agony, and infection, Jaime is left a hollow husk of a knight, stripped of the single gift that defined his existence."
 GOT_Story_Country.211.a:0 "Without my sword hand, what am I?"

 GOT_Story_News.211.t:0 "Jaime Lannister’s Hand Severed"
 GOT_Story_News.211.d:0 "Dreadful reports from the Riverlands have stunned the high lords of Westeros. Ser Jaime Lannister, Lord Commander of the Kingsguard and heir to Casterly Rock, has been maimed by his captors. While being transported under the guard of Locke, a man in the service of Lord Roose Bolton, the Kingslayer had his right hand brutally severed following a clash of pride. News of the tragic maiming of one of the realm's premier warriors spreads like wildfire across the continent, forever altering the balance of martial power and political inheritance within House Lannister."
 GOT_Story_News.211.a:0 "The Golden Lion has lost his sharpest claw."


# Tyrion Becomes Master of Coin
 GOT_Story_Country.212.t:0 "Master of Coin"
 GOT_Story_Country.212.d:0 "In a maneuver designed to exploit his administrative sharp wit while keeping him far from Casterly Rock's inheritance, Lord Tywin Lannister has named Tyrion the new Master of Coin, replacing Petyr Baelish following Littlefinger's departure for the Eyrie. Stepping into the Small Council chambers and opening the treasury ledgers, Tyrion was met not with piles of Lannister gold, but with a staggering labyrinth of systemic debt. Millions of dragons are owed to the Faith, to Casterly Rock, and most dangerously, to the Iron Bank of Braavos. Inheriting Littlefinger's web of borrowed coin and phantom accounts, the dwarf of Casterly Rock must pull the Crown back from total insolvency before the realm's creditors come to collect in blood."
 GOT_Story_Country.212.a:0 "Petyr Baelish didn't find gold... he stole it from the future."

 GOT_Story_News.212.t:0 "Tyrion Appointed Master of Coin"
 GOT_Story_News.212.d:0 "A major restructuring of the Small Council has taken place in King's Landing. By decree of the Hand of the King, Lord Tywin Lannister, Tyrion Lannister has been appointed Master of Coin following Lord Petyr Baelish's departure to court Lady Lysa Arryn. Tyrion assumes control of a royal treasury severely depleted by years of tournament extravagances and the crushing costs of the War of the Five Kings. Whispers from court suggest that Lord Baelish left the Crown in catastrophic debt to foreign entities—most notably the formidable Iron Bank of Braavos—leaving the newly appointed Master of Coin with an almost impossible balance sheet."
 GOT_Story_News.212.a:0 "A Lannister always pays his debts... but can he pay the Crown's?"


# Daenerys Negotiates for the Unsullied
 GOT_Story_Country.213.t:0 "The Price of Power"
 GOT_Story_Country.213.d:0 "The sweltering Plaza of Pride in Astapor rang with the rhythmic thud of thousands of bronze-shielded spears. Before Daenerys Targaryen stood the Good Masters, arrogant and cruel, offering eight thousand fully trained Unsullied and five thousand boys still in training. In exchange for the greatest infantry force in the Known World, the slave lords demanded a price beyond gold—one of her living dragons, Drogon, alongside the scribal services of the young Naathi interpreter, Missandei. Ser Jorah Mormont and Ser Barristan Selmy urge caution, horrified at parting with a child of her blood. Yet as she gazes upon the whip-scarred soldiers who feel no pain, the dragon queen realizes that an army of slave-warriors could tear open the gates of Westeros—or burn the slavers of Essos to ash."
 GOT_Story_Country.213.a:0 "A dragon is not a slave. Agree to their terms."
 GOT_Story_Country.213.b:0 "I will not sell my children into bondage."

 GOT_Story_News.213.t:0 "Daenerys Targaryen Secures the Unsullied"
 GOT_Story_News.213.d:0 "Stunning dispatches from the Red Waste and Slaver's Bay report that Daenerys Targaryen, last scion of House Targaryen, has struck an unprecedented bargain with the Good Masters of Astapor. In exchange for one of her three growing dragons, the Mother of Dragons has claimed absolute ownership of the entire Unsullied host—thirteen thousand elite eunuch warriors renowned for their unbreakable discipline and lack of fear. Accompanied by her new translator Missandei and guarded by legendary knights, the exiled princess has transformed overnight from a homeless pretender into one of the most formidable military powers in the East."
 GOT_Story_News.213.a:0 "Blood and fire march upon Slaver's Bay."


# Robb Stark Attends His Grandfather's Funeral
 GOT_Story_Country.214.t:0 "Riverrun's Grief"
 GOT_Story_Country.214.d:0 "The sandstone walls of Riverrun offered no solace to the Young Wolf upon his return. Set adrift on the red waters of the Red Fork, the funeral boat of Lord Hoster Tully carried away the grand patriarch of the Riverlands, yet the solemn ceremony quickly turned into an embarrassing display. Lord Edmure Tully, newly elevated to ruler of the castle, missed three consecutive shots with flaming arrows as the boat drifted downstream toward the tumbling falls. It fell to Ser Brynden 'The Blackfish' Tully to snatch the bow, shoot true from a distance without looking back, and ignite his brother's pyre before it reached the rocks. For Robb Stark, observing his uncle's public stumble amidst a brutal war for survival served as a grim reminder of the frailties within his own coalition."
 GOT_Story_Country.214.a:0 "We must show steel, not bungled bows and bluster."

 GOT_Story_News.214.t:0 "Robb Stark’s Return to Riverrun"
 GOT_Story_News.214.d:0 "The river lords gathered at the confluence of the Red Fork and Tumblestone to lay to rest Lord Hoster Tully, the long-standing Lord Paramount of the Trident. King Robb Stark and Lady Catelyn attended the ancient water-burial ceremony alongside the high banners of the Riverlands and the North. Reports from the riverbanks note a tense moment during the ritual, as the new Lord of Riverrun, Edmure Tully, repeatedly failed to land a flaming arrow upon his father's funeral vessel, forcing his famed uncle, Ser Brynden 'The Blackfish' Tully, to step forward and complete the rite. The awkward display comes at a perilous hour as House Tully grapples with internal leadership strain amidst the ongoing conflict."
 GOT_Story_News.214.a:0 "The trout swims in uncertain currents."


# Arya Parts Ways with Hot Pie
 GOT_Story_Country.215.t:0 "A Farewell to Friendship"
 GOT_Story_Country.215.d:0 "At the Inn at the Kneeling Man, where the scent of baking crust broke through the damp air of the Riverlands, Hot Pie made his choice to lay down his fears and remain behind as the inn's new baker. Before Arya Stark turned her horse back toward the dusty trails with the Brotherhood Without Banners, her round-faced companion pressed a heavy, baked loaf into her hands—dough shaped into the rough, recognizable form of a Stark direwolf. Holding the warm bread in her dirt-stained fingers, Arya realized how few companions from her old life remained. Yet with her father's death unavenged and winter closing in, the young wolf knew she could not linger in warm kitchens."
 GOT_Story_Country.215.a:0 "Valar Morghulis. A wolf must walk her own path."

 GOT_Story_News.215.t:0 "Arya Stark Parts Ways with Hot Pie"
 GOT_Story_News.215.d:0 "Scattered reports from travellers along the Red Fork reveal that Lady Arya Stark has parted company with her longtime companion, the baker's boy known as Hot Pie. While the boy elected to take up honest hearth work at an inn along the river, the young Stark daughter remains in the company of the outlaw Brotherhood Without Banners. Eye-witnesses report a small gesture of loyalty between the orphans before their parting—a crude direwolf loaf baked as a gift of farewell. As the fires of war consume the Riverlands, Eddard Stark's youngest daughter moves ever further from the life she once knew."
 GOT_Story_News.215.a:0 "A lone wolf in a land of outlaw men."


 
# Daenerys Liberates Astapor
 GOT_Story_Country.216.t:0 "Liberation of Astapor"
 GOT_Story_Country.216.d:0 "The red dust of the Plaza of Pride turned to ash as the true nature of Daenerys Targaryen was laid bare before the horrified Good Masters. Accepting the whip of command, the dragon queen spoke in High Valyrian—the mother tongue her captors assumed she could not comprehend—and issued a single, thunderous order: 'Dracarys.' As Drogon unleashed a torrent of dragonfire that consumed the slaver Kraznys, the dragon queen commanded her newly acquired Unsullied to turn their spears upon their former masters and tear down the slavers of Astapor. Standing amidst the fallen city, Daenerys shattered their chains, granting eight thousand elite soldiers their freedom and inviting them to march as free men under her dragon banner."
 GOT_Story_Country.216.a:0 "Dracarys! Blood and fire shall cleanse this city."

 GOT_Story_News.216.t:0 "Daenerys Targaryen Liberates Astapor"
 GOT_Story_News.216.d:0 "In a spectacular display of dragonfire and cunning strategy, Daenerys Targaryen has overthrown the ruling regime of Astapor, utterly smashing the slave trade that defined the city for centuries. Pretending to trade one of her dragons for ownership of the Unsullied host, the Targaryen princess revealed her mastery of High Valyrian and commanded her dragon to burn the high slaver Kraznys alive. Her new army immediately executed the Good Masters and dismantled the slave pits. After granting full freedom to every Unsullied warrior, the entire host unanimously chose to march behind the Mother of Dragons, sending shockwaves across Slaver's Bay and the free cities beyond."
 GOT_Story_News.216.a:0 "The dragon has untamed the slave city."


# Mutiny at Craster's Keep
 GOT_Story_Country.217.t:0 "Mutiny at Craster's Keep"
 GOT_Story_Country.217.d:0 "The air inside Craster’s Keep was thick with the reek of blood, sweat, and rancid grease as months of starvation and despair erupted into open rebellion. When the disgraced ranger Karl Tanner slit Craster’s throat over hidden food stores, the sacred laws of guest right shattered in an instant. Standing in defense of order, Lord Commander Jeor Mormont was foully stabbed in the belly by his own sworn brothers. As the hall descended into a frenzy of murder and pillage, Samwell Tarly seized the moment of chaos to rescue Gilly and her newborn son from the bloodbath. Fleeing into the freezing darkness of the haunted forest, Sam turned his back on his mutinous brothers, clutching a dragonglass blade and a desperate hope for survival."
 GOT_Story_Country.217.a:0 "The Watch has broken its vows. I must protect Gilly and the child."

 GOT_Story_News.217.t:0 "Mutiny Breaks Out at Craster’s Keep"
 GOT_Story_News.217.d:0 "A horrific act of treason has torn the Night’s Watch apart in the frozen wastes far beyond the Wall. Starving survivors of the Great Ranging turned upon their host at Craster’s Keep, slaughtering the wildling chieftain before murdering Lord Commander Jeor Mormont as he attempted to restore order. With the Old Bear slain by his own black brothers, a faction of rogue deserters has claimed the holdfast, plunging the Night’s Watch into its darkest crisis in generations. As news of the Old Bear's fall spreads south to Castle Black, the shattered order finds itself leaderless, fractured, and utterly exposed to the winter shadows closing in from the north."
 GOT_Story_News.217.a:0 "The Old Bear is dead, and the realm’s shield is broken."


# Varys Enacts Long-Planned Revenge
 GOT_Story_Country.218.t:0 "Varys's Revenge"
 GOT_Story_Country.218.d:0 "In a dimly lit chamber far beneath the bustling streets of King's Landing, Lord Varys stood before a large, wooden shipping crate delivered across the Narrow Sea. For decades, the Spider had harbored the bitter memory of his youth in Lys, when a dark sorcerer severed his manhood to cast into a brazier for blood magic. That nameless horror birthed Varys's lifelong hatred of magic and those who practice it. Pryed open with an iron crowbar, the crate revealed the very sorcerer who mutilated him—bound, gagged, and helpless. Patient, precise, and devoid of reckless fury, the Master of Whisperers reminded his captive that influence, secrets, and time are the most lethal poisons of all."
 GOT_Story_Country.218.a:0 "Patience is a weapon, and my revenge is long in coming."

 GOT_Story_News.218.t:0 "Varys Takes Revenge on Sorcerer"
 GOT_Story_News.218.d:0 "Quiet rumors from the deepest cellars of the Red Keep report that Lord Varys, the realm's Master of Whisperers, has settled a decades-old personal vendetta. The eunuch spymaster reportedly arranged the secret abduction and cross-continental transport of the Essosi sorcerer who mutilated him in his childhood. Rather than resorting to public execution, Lord Varys has sealed his former tormentor away in darkness, demonstrating the terrifying reach and cold patience of the Crown's chief intelligencer. As the game of thrones turns increasingly bloody, court intrigue reminds all that those who work in shadow strike with absolute precision."
 GOT_Story_News.218.a:0 "The Spider's web reaches even across the Narrow Sea."


# Arya Witnesses the Hound's Judgment
 GOT_Story_Country.219.t:0 "Trial by Combat"
 GOT_Story_Country.219.d:0 "Deep within the hollow hill, illuminated only by torchlight and the terrifying glow of a flaming broadsword, Arya Stark watched as Sandor Clegane faced the judgment of the Lord of Light. Accused of murdering Mycah the butcher's boy, the Hound offered no apology, claiming his trial in blood before the Brotherhood Without Banners. As Lord Beric Dondarrion brought down his fiery blade, the cavern echoed with the clash of steel, the reek of burning flesh, and the Hound's instinctual, frantic terror of flame. Watching the giant man fight for his life, Arya saw not just a ruthless killer from her hit-list, but a scarred and broken beast struggling against fate itself."
 GOT_Story_Country.219.a:0 "Burn him! Let the fire consume the butcher's dog!"

 GOT_Story_News.219.t:0 "The Hound Faces Trial by Combat"
 GOT_Story_News.219.d:0 "Reports from the shadowed caverns of the Riverlands describe a harrowing spectacle of divine justice enacted by the Brotherhood Without Banners. Sandor 'The Hound' Clegane, former sworn shield to King Joffrey, was subjected to a trial by combat to answer for his past atrocities. Facing Lord Beric Dondarrion—who wielded a sword magically ignited with his own blood—Clegane fought through flames and fury in a desperate duel to prove his innocence under the eyes of R'hllor. Though the outlaw lord matched him with fiery zeal, the Hound's brutal strength carried him to a bloody victory, earning him his freedom from the Brotherhood's clutches."
 GOT_Story_News.219.a:0 "The Lord of Light works in mysterious ways."


# Theon's Betrayal and Recapture
 GOT_Story_Country.220.t:0 "Theon’s False Hope"
 GOT_Story_Country.220.d:0 "The frantic flight across the cold northern wastes was nothing more than an elaborate, sadistic game. Guided through the dark by a soft-spoken boy claiming to be sent by his sister Yara, Theon Greyjoy believed he had finally escaped the dungeon racks of the Dreadfort. Yet, as his rescuer led him directly back into the bloody torture chambers and locked the heavy iron doors, the horrific reality shattered his spirit. The boy was no savior, but Ramsay Snow, the bastard son of Roose Bolton, who orchestrated the entire flight merely for the joy of hunting him down again. Stripped of all hope and broken in body and mind, Theon realizes there is no rescue coming—only endless, cruel torment."
 GOT_Story_Country.220.a:0 "Please... no more. Just tell me what you want me to be."

 GOT_Story_News.220.t:0 "Theon Greyjoy Betrayed and Recaptured"
 GOT_Story_News.220.d:0 "Grim rumors from the Dreadfort reveal that Theon Greyjoy's brief escape from captivity was nothing more than a twisted psychological game engineered by his captors. The ironborn turncoat, who seized and lost Winterfell, was manipulated into believing a rescue party sent by Iron Islands forces had come to spirit him home. Instead, his mysterious guide delivered him right back into the hands of House Bolton's torturers. Utterly shattered by the ordeal, the heir to Pyke remains a helpless prisoner in the deep dungeons of the Flayed Man, his lingering hopes for freedom entirely extinguished."
 GOT_Story_News.220.a:0 "A harsh punishment for the Turncloak of Winterfell."


 
# The Hound Defeats Beric Dondarrion in Trial by Combat
 GOT_Story_Country.221.t:0 "The Hound’s Triumph in Trial by Combat"
 GOT_Story_Country.221.d:0 "The air inside the dark, cavernous hollow hill grew suffocatingly hot as Lord Beric Dondarrion's blade burst into supernatural fire. Terror tore through Sandor Clegane, the ancient fear of flame threatening to paralyze him where he stood. Yet, driven by pure animal survival and raw, unyielding ferocity, the Hound fought through the blinding glare, bringing his heavy broadsword down in a crushing, fatal blow that split the Lightning Lord open. Standing over his fallen opponent, Clegane expected the trial to end. Instead, Thoros of Myr knelt beside the lifeless corpse and whispered ancient High Valyrian prayers to R'hllor—and to Sandor's utter shock and quiet horror, Beric gasped back to life, his mortal wound sealing before their eyes."
 GOT_Story_Country.221.a:0 "I killed him... yet the red wizard pulls him back from the grave."

 GOT_Story_News.221.t:0 "The Hound Wins Trial by Combat"
 GOT_Story_News.221.d:0 "Whispers from deep within the Riverlands detail a terrifying turn of events during a trial by combat overseen by the Brotherhood Without Banners. Sandor 'The Hound' Clegane overcame his infamous fear of fire to slay Lord Beric Dondarrion, despite the guerrilla leader wielding a sword ablaze with red magic. Clegane's bloody victory granted him his freedom under sacred law, but witnesses report an even greater shock: the Red Priest Thoros of Myr immediately resurrected Dondarrion through mysterious rites of the Lord of Light. The miraculous event marks yet another grim sign of magic returning to the Seven Kingdoms."
 GOT_Story_News.221.a:0 "Death itself seems to have lost its grip in the Riverlands."


# Jaime Lannister Reveals the Truth About Killing the Mad King
 GOT_Story_Country.222.t:0 "Jaime Lannister's Confession"
 GOT_Story_Country.222.d:0 "Soaking in the steaming baths of Harrenhal, stripped of his gilded armor, his sword hand, and his pride, Ser Jaime Lannister collapsed into the arms of Brienne of Tarth. Overcome by fever and decades of bitter silence, the Kingslayer laid bare the dark secret that shaped his dishonor. He recounted the final days of Robert's Rebellion—how King Aerys II, consumed by madness, had hidden caches of wildfire beneath every street and alley of King's Landing, intending to burn half a million innocent souls to ash rather than yield. When Aerys commanded Jaime to bring him his own father's head and ordered the pyromancers to ignite the city, Jaime drove his sword into the Mad King's back to save the realm. Branded a oathbreaker ever since, Jaime revealed the truth not to seek forgiveness, but so at least one honorable soul might finally understand."
 GOT_Story_Country.222.a:0 "By what right does the wolf judge the lion?"

 GOT_Story_News.222.t:0 "Jaime Lannister Confesses Truth of Mad King's Death"
 GOT_Story_News.222.d:0 "A dramatic disclosure from the halls of Harrenhal has sent shockwaves through the political circles of Westeros. Ser Jaime Lannister, long reviled across the Seven Kingdoms as the dishonorable 'Kingslayer,' has reportedly confessed the true circumstances behind his betrayal of King Aerys II Targaryen. According to accounts from Lady Brienne of Tarth, the Mad King had placed massive stockpiles of wildfire throughout the capital and ordered the total destruction of King's Landing during the siege. Ser Jaime executed his sovereign to prevent the horrific slaughter of half a million commoners and noblemen alike. The revelation reframe one of the most pivotal and infamous moments in recent Westerosi history."
 GOT_Story_News.222.a:0 "A dishonorable title borne for an honorable act."


# Robb Stark Executes Lord Karstark, Losing Key Allies
 GOT_Story_Country.223.t:0 "Robb Stark’s Difficult Decision"
 GOT_Story_Country.223.d:0 "The courtyard of Riverrun reeked of blood and wet iron under a bitter rain. In a fit of grief and vengeful madness over his own sons fallen in battle, Lord Rickard Karstark led a midnight slaughter, butchering two helpless Lannister squires in their cell. Traitors and kinslayers in the eyes of gods and men, Karstark and his conspirators stand bound before King Robb Stark. Catelyn Stark and Edmure Tully plead desperately for restraint, warning that striking off the head of the Lord of Karhold will drive the entire Karstark host to abandon the King in the North. Yet allowing such high treason to go unpunished threatens to destroy the very honor upon which the Young Wolf built his reign. With the fate of his army hanging in the balance, Robb must render judgment."
 GOT_Story_Country.223.a:0 "He who passes the sentence should swing the sword. Execute him."
 GOT_Story_Country.223.b:0 "Keep him in irons as a hostage to ensure Karhold's loyalty."
 GOT_Story_Country.223.c:0 "Pardon him for his service, but demand heavy hostings."

 GOT_Story_News.223.t:0 "Robb Stark Executes Lord Karstark"
 GOT_Story_News.223.d:0 "A catastrophic rift has torn through the Northern coalition following the execution of Lord Rickard Karstark at Riverrun. Driven by vengeance for his fallen sons, Lord Karstark had murdered two young Lannister squires held prisoner in the dungeons, forcing King Robb Stark to pass sentence and personally sever the head of one of his primary bannermen. In response, the entire Karstark army has abandoned the King in the North, stripping the Young Wolf of vital infantry and cavalry. Desperate to rebuild his shattered forces before marching on Casterly Rock, King Robb has turned toward the Twins, proposing a marriage between Lord Edmure Tully and a daughter of Lord Walder Frey to mend their broken alliance."
 GOT_Story_News.223.a:0 "Honor demanded his life, but justice cost an army."


# Jon Snow and Ygritte’s Relationship Deepens
 GOT_Story_Country.224.t:0 "Jon Snow and Ygritte’s Bond Grows"
 GOT_Story_Country.224.d:0 "Deep within a thermal cavern hidden beneath the snows beyond the Wall, far from the freezing wind and the watchful eyes of Tormund's raiding party, Jon Snow found a warmth he had never known. Unwinding her furs beside a subterranean hot spring, Ygritte coaxed the bastard of Winterfell to cast aside his heavy black cloak and the rigid vows of his brotherhood. In the quiet darkness of the cave, the stoic sworn brother yielded to passion, stepping across the line that separated a ranger of the Night's Watch from the free folk he was sworn to fight. Yet even as he held her in the steamy gloom, the ghostly memory of his sacred oaths lingered like ice on his skin."
 GOT_Story_Country.224.a:0 "Lord Eddard's blood demands honor, but my heart lies in the cave."

 GOT_Story_News.224.t:0 "Jon Snow and Ygritte Grow Closer"
 GOT_Story_News.224.d:0 "Whispers from the wildling warbands marching south toward the Wall reveal a deepening bond between Lord Eddard Stark's bastard son, Jon Snow, and the spearwife Ygritte. Trapped in the frozen wilderness under the guise of a turncloak ranger, Snow has drawn increasingly close to his wildling captors, culminating in an intimate encounter within the hidden caves of the Frostfangs. While this passion has cemented his acceptance among Mance Rayder's free folk, it marks an unmistakable breach of the celibacy vows sworn by the brothers of the Night's Watch, casting grave doubt upon where his true loyalties will lie when war reaches the Wall."
 GOT_Story_News.224.a:0 "He knows nothing, yet he has forsaken his vows."


# Tywin Lannister Arranges Marriages to Counter the Tyrells
 GOT_Story_Country.225.t:0 "Tywin Lannister’s Strategic Marriages"
 GOT_Story_Country.225.d:0 "The grand game of thrones leaves no room for sentimentality, only cold arithmetic. Discovering that Highgarden sought to quietly marry Sansa Stark—key to the North and heir to Winterfell—to Willas Tyrell, Lord Tywin Lannister struck with ruthless speed. By decree of the Hand, Sansa shall be wed to his son Tyrion, securing the Northern claim for House Lannister before the Reach can seize it. To shackle the Knight of Flowers and firmly anchor Highgarden to the Crown, Tywin further commanded that Queen Regent Cersei marry Ser Loras Tyrell. Though both of his children voiced bitter protestation against being used as political pawns, the Old Lion remains unflinching: the family name is all that endures."
 GOT_Story_Country.225.a:0 "They will obey. House Lannister comes before all."

 GOT_Story_News.225.t:0 "Tywin Lannister Foils Tyrell Marriage Plans"
 GOT_Story_News.225.d:0 "In a decisive political maneuver that has sent shockwaves through the Red Keep, Lord Tywin Lannister has completely rewritten the matchings of the realm's highest nobility. Learning of a covert plot by House Tyrell to marry Lady Sansa Stark into Highgarden, the Hand of the King intercepted the match by betrothing the Stark heiress to his youngest son, Tyrion Lannister. To further cement the alliance while neutralizing Reach ambitions, Lord Tywin has also decreed that Queen Regent Cersei Lannister wed Ser Loras Tyrell. The double betrothal re-establishes House Lannister's iron grip on the court, despite fiery discontent behind closed doors."
 GOT_Story_News.225.a:0 "The Old Lion plays the board with practiced cruelty."


 
# Jon Snow and Ygritte Scale the Wall
 GOT_Story_Country.226.t:0 "Jon Snow and Ygritte’s Dangerous Climb"
 GOT_Story_Country.226.d:0 "Rising seven hundred feet into the frozen sky, the Wall stood as an unforgiving sheet of blue ice. Alongside Tormund Giantsbane, Orell, and Ygritte, Jon Snow drove his iron crampons and ice axes into the ancient colossus, ascending into blinding gales. Mid-climb, disaster struck—a colossal sheet of ice fractured and sheared away, dropping wildlings into the abyss and leaving Jon and Ygritte dangling helplessly over the void. Panicked, Orell drew his blade to cut their rope and save himself, but Jon fought through the vertigo, driving his pick into solid ice to anchor them both. Exhausted, frostbitten, and breathless upon the high summit, Jon and Ygritte embraced against the wind, gazing out together over the sprawling green realm of the Seven Kingdoms."
 GOT_Story_Country.226.a:0 "We reached the top... but the hard part lies ahead."

 GOT_Story_News.226.t:0 "Wildling Raiders Scale the Wall"
 GOT_Story_News.226.d:0 "In a harrowing feat of mountaineering, a elite wildling raiding party led by Tormund Giantsbane—and joined by the turncloak ranger Jon Snow and the spearwife Ygritte—has successfully scaled the summit of the Wall. The treacherous ascent nearly turned fatal when a massive icefall tore through their climbing line, nearly sending Snow and Ygritte plunging to their deaths before they managed to secure a foothold. Now perched atop seven hundred feet of ice and looking down into the North, this vanguard scouting party poses a direct and deadly threat to the undefended gift lands south of Castle Black."
 GOT_Story_News.226.a:0 "The Wall has been scaled from the north."


# Littlefinger Delivers the 'Chaos Is a Ladder' Speech
 GOT_Story_Country.227.t:0 "Littlefinger’s Philosophical Revelation"
 GOT_Story_Country.227.d:0 "Standing before the vacant Iron Throne, Lord Petyr Baelish laid bare his dark philosophy to the Master of Whisperers. Rejecting the realm's belief that political collapse is a abyss that swallows nations, Littlefinger insisted that chaos is not a pit—chaos is a ladder. Many who attempt to climb it fail and never get to try again, broken by the fall, while others cling to illusions of realm, gods, or love. Yet for Baelish, the war he helped ignite is the ultimate incline toward supreme power. As his ship weighed anchor for the Vale, Sansa Stark watched her hopes of rescue dissolve from the harbor walls, entirely unaware that she remained the ultimate prize in Littlefinger's ruthless ascent—an ascent paved with the corpses of those, like the unfortunate Ros, whom he sacrificed along the way."
 GOT_Story_Country.227.a:0 "The climb is all there is."

 GOT_Story_News.227.t:0 "Chaos Is a Ladder"
 GOT_Story_News.227.d:0 "Tensions inside the Red Keep continue to simmer as Lord Petyr Baelish prepares to depart the capital for the Eyrie, leaving behind a court increasingly fractured by paranoia and ambition. Whispers from within the throne room suggest that Littlefinger views the raging War of the Five Kings not as a tragedy, but as an unprecedented opportunity to redraw the feudal order of Westeros to his own design. Meanwhile, Lady Sansa Stark remains isolated in King's Landing under heavy Lannister guard, her prospects of fleeing the capital dashed as Baelish's web of intrigue tightens around both the Crownlands and the Vale."
 GOT_Story_News.227.a:0 "Only the ladder is real. The climb is all there is."


# Melisandre Acquires Gendry
 GOT_Story_Country.228.t:0 "Melisandre Takes Gendry"
 GOT_Story_Country.228.d:0 "Riding into the riverland hollows, Melisandre of Asshai found far more than she anticipated—not only the resurrected Lord Beric Dondarrion, brought back six times by R'hllor's flame, but also King Robert Baratheon's unacknowledged bastard son, Gendry. In exchange for two heavy sacks of gold, the gold-hungry Brotherhood surrendered the blacksmith lad into her keeping. When young Arya Stark leapt forward in fury, branding her a witch for buying her friend, the Red Priestess merely held the girl's gaze, sensing the dark destiny waiting in her eyes: 'I see a darkness in you. And in that darkness, eyes staring back at me. Brown eyes, blue eyes, green eyes... eyes you'll shut forever. We shall meet again.' With Gendry in tow, Melisandre set out toward Dragonstone, eager to offer royal blood to the Lord of Light."
 GOT_Story_Country.228.a:0 "There is power in a king's blood."

 GOT_Story_News.228.t:0 "Melisandre Takes Gendry"
 GOT_Story_News.228.d:0 "Cryptic reports from the Riverlands confirm that Melisandre of Asshai, the red priestess bound to Stannis Baratheon, has purchased a young blacksmith named Gendry from the Brotherhood Without Banners for a vast sum of gold. Though treated as a common armorer's apprentice, the youth is secretly a bastard son of the late King Robert Baratheon. Armed with this knowledge, the Shadowbinder intends to transport the boy to Dragonstone to conduct ancient blood rituals designed to strike down King Stannis's rivals. The transaction has left outlaws and smallfolk alike unsettled by the growing influence of the Essosi faith."
 GOT_Story_News.228.a:0 "A king's blood for the Red God's fires."


# Robb Stark Seeks Alliance with House Frey
 GOT_Story_Country.229.t:0 "Robb Stark Negotiates with House Frey"
 GOT_Story_Country.229.d:0 "Desperate to replace the infantry lost to Karstark's departure and open a path toward Casterly Rock, King Robb Stark sent envoys to the Twins to repair relations with the bitter, vengeful Lord Walder Frey. The old man's envoys returned with unforgiving conditions: a public, formal apology from Robb for breaking his royal marriage pact, the immediate handover of the fortress of Harrenhal, and the hand of Lord Edmure Tully in marriage to one of Walder Frey's daughters. With his mother Catelyn and Brynden 'The Blackfish' Tully stressing the cold reality that the Northern cause will collapse without the Twins' crossing, Edmure reluctantly agreed to sacrifice his freedom for the realm. The Young Wolf now stands at the crossroads of pride and survival."
 GOT_Story_Country.229.a:0 "Swallow our pride. Agree to Lord Walder's terms."
 GOT_Story_Country.229.b:0 "We do not need the Freys. We will forge another way."

 GOT_Story_News.229.t:0 "Robb Stark Seeks Reconciliatory Alliance with House Frey"
 GOT_Story_News.229.d:0 "In a high-stakes diplomatic effort to salvage his campaign, King Robb Stark has agreed to terms dictated by Lord Walder Frey of the Twins. Following the Young Wolf's breach of his original betrothal pact, the Frey lord demanded a formal royal apology, the lordship of Harrenhal, and the immediate marriage of Lord Edmure Tully to a bride of House Frey. By securing Edmure's consent, the Stark-Tully coalition hopes to restore the vital crossing of the Green Fork and regain thousands of Frey spearmen ahead of their upcoming offensive. Yet, many across the Riverlands wonder if the notoriously grudging Lord Walder will truly forget the insult done to his house."
 GOT_Story_News.229.a:0 "A fractured alliance patched together with wedding vows."


# Tyrion Informs Sansa of Their Betrothal
 GOT_Story_Country.230.t:0 "Tyrion Informs Sansa of Their Betrothal"
 GOT_Story_Country.230.d:0 "Tasked with delivering his father's unyielding decree, Tyrion Lannister entered Sansa Stark's chambers with a heavy heart. Finding the young Northern lady dreaming of a secret escape to Highgarden, Tyrion broke the devastating news: by order of the Hand, she was to be wed to him instead. Sansa's composure shattered into silent tears, her hopes of freedom crushed beneath the weight of House Lannister's relentless ambition. Standing in the shadows, Shae watched in masked horror and jealousy as her lover bound himself to her mistress. Trapped in a match born of political ruthlessness rather than affection, Tyrion could offer no comfort beyond a solemn promise never to force himself upon his unwilling bride."
 GOT_Story_Country.230.a:0 "Neither of us desired this, yet the Imp and the Wolf must bow to my father."

 GOT_Story_News.230.t:0 "Tyrion Lannister and Sansa Stark Betrothed"
 GOT_Story_News.230.d:0 "In a swift political maneuver orchestrated by Lord Tywin Lannister, the Crown has officially announced the betrothal of Lady Sansa Stark to the Acting Master of Coin, Tyrion Lannister. The sudden union permanently dashes any lingering hopes of a Tyrell or Northern marriage for the heiress of Winterfell, firmly locking the Stark succession under Lannister authority. Though court observers note the profound distress of the bride and the evident reluctance of the groom, the match cements the West's dominion over the Crownlands and sends a clear message to any who would challenge Lord Tywin's mastery of the realm."
 GOT_Story_News.230.a:0 "A bleak pairing forged in the fires of ambition."


 
# Jaime Rescues Brienne from the Bear Pit
 GOT_Story_Country.231.t:0 "Jaime Lannister Saves Brienne"
 GOT_Story_Country.231.d:0 "Riding away from Harrenhal under escort, Ser Jaime Lannister forced Qyburn to admit the truth of Brienne's fate: Locke had refused her father's ransom of sapphire mines and cast her into the castle's bear pit for his men's amusement, armed only with a tournament wooden sword. Turning his horse around without hesitation, Jaime galloped back into the ruinous courtyard just as a towering brown bear pinned the Maid of Tarth against the stone walls. Despite lacking his sword hand and wearing no armor, the Kingslayer leapt directly into the pit, placing his own body between Brienne and the thrashing beast to force Locke's crossbowmen to hold their fire. Pulling Brienne to safety, Jaime proved that honor remained within him."
 GOT_Story_Country.231.a:0 "I could not leave her behind. Even a Kingslayer keeps his debts."

 GOT_Story_News.231.t:0 "Jaime Lannister Rescues Brienne from Bear Pit"
 GOT_Story_News.231.d:0 "Shocking reports from the cursed fortress of Harrenhal recount an extraordinary act of chivalry by the maimed Kingslayer, Ser Jaime Lannister. Left behind by Locke's sellswords, Lady Brienne of Tarth was forced into a blood-sport pit to face a massive bear with nothing more than a wooden practice sword. Learning of her plight while en route to King's Landing, Ser Jaime turned back and recklessly leapt into the pit to shield her, daring the guards to shoot the heir of Casterly Rock. His desperate intervention forced the captors to haul both fighters to safety, securing Brienne's release and forging an unthinkable alliance between the Lion and the Maid of Tarth."
 GOT_Story_News.231.a:0 "A strange spark of honor from the Kingslayer."


# Daenerys Confronts Yunkai's Emissary
 GOT_Story_Country.232.t:0 "The Dragon Queen Approaches"
 GOT_Story_Country.232.d:0 "Disturbing tidings have crossed the red wastes from Astapor. The exiled Targaryen princess, Daenerys Stormborn, has burned the Good Masters in their own plaza, hatched three fully grown dragons, and now marches upon Yunkai at the head of eight thousand disciplined Unsullied warrior-eunuchs. Her zealot's crusade against the ancient trade of human flesh threatens to tear down the very foundations of Slaver's Bay. As her vast host and freedmen swarm toward our walls, the Wise Masters assemble in panic. Some urge us to buy off the dragon queen with chest upon chest of gold and a fleet of ships to carry her toward Westeros, while others insist that the proud masters of Yunkai must never bow to a beggar queen."
 GOT_Story_Country.232.a:0 "Dispatch Grazdan mo Eraz with gold and ships. Buy her departure."
 GOT_Story_Country.232.b:0 "We are the Wise Masters of Yunkai. We will not bow to dragonspawn."

 GOT_Story_News.232.t:0 "Daenerys Rejects Yunkai's Terms"
 GOT_Story_News.232.d:0 "The conqueror Daenerys Targaryen has delivered an uncompromising ultimatum outside the yellow walls of Yunkai. Seeking to turn her army away, the city's envoy, Grazdan mo Eraz, arrived at her war tent offering immense wealth in gold, chest loads of silk, and a fleet of galleys to carry her forces across the Narrow Sea to Westeros. The Mother of Dragons rejected the bribe outright, declaring that the only treasure she sought was the immediate emancipation of every slave within Yunkai. When the envoy warned of Yunkai's fierce mercenaries and bedouin allies, Daenerys vowed to breach the city gates and put every master to the sword should they refuse her demands."
 GOT_Story_News.232.a:0 "The Breaker of Chains will settle for nothing less than total freedom."


# Robb Stark Learns of Talisa's Pregnancy
 GOT_Story_Country.233.t:0 "Robb Stark Learns of Talisa’s Pregnancy"
 GOT_Story_Country.233.d:0 "Torrential downpours turned the Riverlands into a sea of mud, forcing King Robb Stark's royal column to pitch camp under heavy canvas on their march toward the Twins. Inside the damp royal pavilion, as Robb studied battle maps for the upcoming assault on Casterly Rock, Talisa drew him away from the war tables to reveal joyous news: she was carrying his child. Overcome with emotion, the Young Wolf embraced his queen, envisioning a future beyond the bloodshed—a winter's child born to wear the ancient crown of the Kings of Winter. Amid the grim compromises of war and the looming journey to face Lord Walder Frey, the unborn heir brought a brilliant ray of hope to the Northern cause."
 GOT_Story_Country.233.a:0 "This child will be the future of House Stark—our legacy continues."

 GOT_Story_News.233.t:0 "An Heir for the Young Wolf"
 GOT_Story_News.233.d:0 "Tidings from the Northern war camp marching toward the Twins reveal that Queen Talisa Stark is expecting a child with King Robb Stark. The news comes at a critical juncture in the War of the Five Kings, as the Stark-Tully host prepares to mend its alliance with House Frey through the wedding of Lord Edmure Tully. The announcement of a royal heir has sent a surge of morale through the battle-weary Northern ranks, giving his lords and bannermen a powerful sign that the legacy of House Stark will endure through the winter."
 GOT_Story_News.233.a:0 "A new wolf will soon howl in the North."


# Arya is Captured by the Hound
 GOT_Story_Country.234.t:0 "Arya Captured by the Hound"
 GOT_Story_Country.234.d:0 "The selling of Gendry to the red priestess was the final betrayal. Disillusioned and furious at the Brotherhood Without Banners, Arya Stark fled into the rain-soaked woods of the Riverlands under cover of night, desperate to escape their hollow promises. But her flight was short-lived. Out of the shadowy twilight rode Sandor Clegane—the Hound—who dragged her kicking and screaming onto his heavy warhorse. Free of his trial by combat and eager to turn a royal hostage into cold silver, Clegane intends to deliver her directly to her family at the Twins. Trapped in the grip of a man whose name she whispers every night before sleeping, Arya realizes her fight for freedom has only grown more dangerous."
 GOT_Story_Country.234.a:0 "One day I will drive a needle through his throat."

 GOT_Story_News.234.t:0 "Arya Stark Captured by Sandor Clegane"
 GOT_Story_News.234.d:0 "In a startling turn of events in the war-torn Riverlands, Lady Arya Stark—long presumed dead or lost following the fall of King's Landing—has been captured by Sandor Clegane, the former Kingsguard knight known as the Hound. Having fled the outlaw Brotherhood Without Banners after they parted ways with her companion, the young Stark princess was intercepted by Clegane as he wandered the countryside. Reports suggest the Hound intends to sell his highborn captive back to King Robb Stark and House Tully at the Twins, dragging the fierce young wolf along on a dangerous trek across a countryside consumed by war."
 GOT_Story_News.234.a:0 "A valuable prize in the hands of a dangerous man."


# Theon's Torture Intensifies
 GOT_Story_Country.235.t:0 "Theon’s Torture Reaches New Heights"
 GOT_Story_Country.235.d:0 "The cold dungeon cell was briefly transformed into a cruel illusion of warmth when two young women entered, bathing and soothing my battered body. For a fleeting moment, I dared to believe that mercy had finally reached the Dreadfort. But it was merely another twisted stage of Ramsay Snow's sadistic games. Just as the torment seemed to abate, the Bastard of Bolton strode in with a bloodied flaying knife and a horrifying grin, turning the mockery into the ultimate nightmare. Robbed of my manhood, stripped of my identity, and shattered beyond repair, I am left gasping in the dark—no longer a prince of Pyke, but a broken skin waiting for its master's next strike."
 GOT_Story_Country.235.a:0 "Ramsay’s cruelty knows no bounds—each day, my body and mind are shattered further."

 GOT_Story_News.235.t:0 "Theon Greyjoy’s Torture Continues"
 GOT_Story_News.235.d:0 "Disturbing accounts from the deep dungeons of the Dreadfort reveal that the captivity of Theon Greyjoy has descended into unmatched brutality. Under the hands of Ramsay Snow, the bastard son of Lord Roose Bolton, the heir to Pyke has been subjected to relentless psychological games and severe mutilation, including castrating the ironborn turncloak. Having long since lost control of Winterfell, the former captive of House Stark now exists in a state of absolute agony and subjugation, his physical frame and mind completely broken by his captor's unyielding cruelty."
 GOT_Story_News.235.a:0 "Theon Greyjoy’s torment continues under Ramsay Snow’s sadistic grip."


 
# Tyrion and Sansa's Uncomfortable Wedding
 GOT_Story_Country.236.t:0 "Tyrion and Sansa’s Uncomfortable Wedding"
 GOT_Story_Country.236.d:0 "The Sept of Baelor offered no holy solace—only a gilded cage for two unwilling captives. Draped in heavy Lannister crimson, Tyrion Lannister stood beside Sansa Stark as the High Septon pronounced them man and wife. The ceremony reached a peak of calculated humiliation when King Joffrey laughingly removed the mounting stool, forcing Tyrion to awkwardly strain before the assembled nobility to drape the maiden's cloak over his tall Northern bride. Yet, when the raucous feast concluded and the heavy oak doors of their bedchamber closed, Tyrion chose honor over duty: facing the terrified young girl, he swore a solemn vow that he would never touch her or demand his marital rights until she truly wished it herself."
 GOT_Story_Country.236.a:0 "And so my watch begins... in a marriage built by my father's hands."

 GOT_Story_News.236.t:0 "Tyrion Lannister and Sansa Stark Wed in King's Landing"
 GOT_Story_News.236.d:0 "Under the grand domes of the Sept of Baelor, Lady Sansa Stark and Tyrion Lannister were joined in Holy Matrimony in a high-profile union that locks the succession of Winterfell into House Lannister's grasp. The solemn affair was marked by visible tension and open cruelty from King Joffrey Baratheon, who publicly mocked his uncle during the cloaking ritual. Despite the grandeur of the celebration, observers note that neither the bride nor the groom displayed joy, uniting two bitter enemies in a forced political marriage while the War of the Five Kings continues to rage across the Riverlands."
 GOT_Story_News.236.a:0 "A cold union in the Shadow of the Iron Throne."


# Melisandre's Ritual with Gendry
 GOT_Story_Country.237.t:0 "Melisandre’s Ritual with Gendry"
 GOT_Story_Country.237.d:0 "High upon the windswept battlements of Dragonstone, behind doors locked against the sea spray, Melisandre cast aside her robes and drew Gendry into a seductive embrace—not out of passion, but to claim the royal blood running through his veins. As the young blacksmith lay bound upon an altar of dark stone, the red priestess pressed three fat leeches against his skin until they swelled with his hot, royal blood. Handing them one by one to King Stannis Baratheon, Melisandre bade him cast them into the brazier. With every leech that writhed and blackened in the flames, Stannis called out the names of his crown-stealing usurpers: Joffrey Baratheon, Balon Greyjoy, and Robb Stark. The Lord of Light's judgment had been summoned, and doom was cast upon the kings of Westeros."
 GOT_Story_Country.237.a:0 "Burn, false kings. Let the Red God take them all."

 GOT_Story_News.237.t:0 "Melisandre Uses Gendry’s Blood in Ritual at Dragonstone"
 GOT_Story_News.237.d:0 "Sinister whispers echo through the smoky halls of Dragonstone regarding a dark blood ritual performed by the red priestess Melisandre. Having brought the young blacksmith Gendry—secretly the bastard son of King Robert Baratheon—to the island fortress, the shadowbinder extracted his royal blood using leeches. In the presence of King Stannis Baratheon, the leeches were fed to the sacred flames while Stannis invoked the wrath of the Lord of Light against his primary rivals in the war: Joffrey Baratheon, Balon Greyjoy, and Robb Stark. Followers of the old and new gods alike watch in dread, wondering what dark forces have been unleased upon the realm."
 GOT_Story_News.237.a:0 "A king's blood burns to seal the fate of false crowns."


# Daenerys Gains a New Ally in Daario Naharis
 GOT_Story_Country.238.t:0 "Daenerys Gains a New Ally in Daario Naharis"
 GOT_Story_Country.238.d:0 "Encrypted in the dust outside the yellow walls of Yunkai, Daenerys Targaryen sought to turn the Second Sons—a notorious five-hundred-strong sellsword company hired to defend the city. Their captain, Mero the Titan's Bastard, treated the Mother of Dragons with crude disdain and vulgar insults during negotiations, refusing to break his contract. Yet, under cover of night, a killer slipped past her Bloodguard into her pavilion. It was Daario Naharis, lieutenant of the company, who cast down the severed, blood-dripping heads of Mero and his fellow captain Prendahl na Ghezn at her feet. Captivated by her beauty and conviction, the Tyroshi mercenary knelt, swore his curved arakh to her service, and delivered the full strength of the Second Sons to her crusade."
 GOT_Story_Country.238.a:0 "A bloody entrance, but five hundred sellsword blades are now mine."

 GOT_Story_News.238.t:0 "Daenerys Gains the Loyalty of the Second Sons"
 GOT_Story_News.238.d:0 "In a violent coup that has shattered Yunkai's defensive posture, the mercenary company known as the Second Sons has switched sides and pledged its fealty to Daenerys Targaryen. Following a tense parley where the company's high command rejected the Dragon Queen's demands, lieutenant Daario Naharis assassinated his superior commanders, Mero and Prendahl na Ghezn, before delivering their heads to the Targaryen war camp. With Daario now in sole command of the sellswords, the five hundred seasoned cavalrymen have integrated into Daenerys' host, leaving the Slave City of Yunkai dangerously exposed ahead of an imminent siege."
 GOT_Story_News.238.a:0 "Treachery among sellswords hands the Dragon Queen another victory."


# Samwell Tarly Kills a White Walker
 GOT_Story_Country.239.t:0 "Samwell Tarly Kills a White Walker"
 GOT_Story_Country.239.d:0 "Fleeing the bloodbath of Craster's Keep through the freezing woods, Samwell Tarly and Gilly sought shelter in an abandoned, snowbound hut. Their rest was shattered when the temperature plummeted into bone-chilling frost and the ravens screamed in terror. A monster of myth stepped from the blizzard—a White Walker, its skin like pale ice and its eyes burning with a cruel, cold blue light. The creature brushed aside Sam's iron blade and reached for Gilly's newborn infant. Fueled by desperate courage, Sam lunged from behind and drove an ancient dagger of dragonglass deep into the creature's back. The demon shrieked as its crystalline flesh shattered into a thousands of freezing shards, revealing a secret forgotten for thousands of years: obsidian can slay the dead."
 GOT_Story_Country.239.a:0 "Dragonglass... obsidian kills them!"

 GOT_Story_News.239.t:0 "A White Walker Slain Beyond the Wall"
 GOT_Story_News.239.d:0 "Shattering centuries of belief that the Others were merely monsters of nursery tales, a brother of the Night's Watch has accomplished the unthinkable. Reports from survivors beyond the Wall reveal that Brother Samwell Tarly dispatched a White Walker using an obsidian dagger—commonly known as dragonglass—found among an ancient cache buried at the Fist of the First Men. The creature, which attacked Tarly and a wildling woman, shattered like glass upon contact with the volcanic stone. This pivotal discovery reveals the ancient weakness of the White Walkers as the long winter closes in."
 GOT_Story_News.239.a:0 "The ancient bane of the Others is discovered."


# Arya and the Hound's Journey Continues
 GOT_Story_Country.240.t:0 "Arya and the Hound’s Journey Continues"
 GOT_Story_Country.240.d:0 "Bound and thrown across the saddle of a heavy warhorse, Arya Stark found herself in the clutches of Sandor Clegane. The Hound made his intentions bluntly clear: he was riding hard for the Twins, determined to trade the King in the North's little sister for a heavy purse of Lannister-slaying silver. When Clegane slept by the campfire, Arya crept toward him, her hand trembling as she raised a heavy rock to crush his skull. But the Hound woke in an instant, effortlessly disarming her with a brutal warning that her hesitation would be her undoing. Trapped in an uneasy alliance with a killer whose name she mutters every night before bed, Arya knows that every mile toward her family is fraught with peril."
 GOT_Story_Country.240.a:0 "I may be his captive, but I will not be his victim."

 GOT_Story_News.240.t:0 "The Hound Journeys Across the Riverlands"
 GOT_Story_News.240.d:0 "Reports from travelers along the Trident confirm that Sandor Clegane, the former Kingsguard knight known as the Hound, is riding north toward the Twins with Lady Arya Stark as his hostage. Following her escape from the Brotherhood Without Banners, the young Stark princess was captured by Clegane, who aims to sell her back to her brother, King Robb Stark, during the upcoming Tully wedding festivities. Despite violent clashes between captor and prisoner, the unlikely duo continues their relentless push through a war-torn landscape infested with outlaws and Lannister raiders."
 GOT_Story_News.240.a:0 "A dangerous captive and a deadly captor ride for the Twins."


 
# The Red Wedding
 GOT_Story_Country.241.t:0 "The Red Wedding"
 GOT_Story_Country.241.d:0 "The ancient sacred laws of hospitality were shattered in a single night of blood and madness. As the feast for Edmure Tully and Roslin Frey wound down and the bedding custom began, the heavy oak doors of the Great Hall were chained shut from the outside. To the mournful, chilling strains of 'The Rains of Castamere,' Lord Walder Frey raised his cup, signaling a trap co-orchestrated with Roose Bolton and Tywin Lannister. Crossbow bolts rained down from the music galleries into the unsuspecting Northern lords. Queen Talisa was stabbed repeatedly, King Robb was riddled with iron, and Lord Roose Bolton himself delivered the final blow to the Young Wolf's heart with the bitter words: 'The Lannisters send their regards.' As Catelyn Stark watched her son fall, her throat was cut, leaving the North bleeding and leaderless."
 GOT_Story_Country.241.a:0 "The King in the North is fallen... guest right is dead."

 GOT_Story_News.241.t:0 "The Red Wedding Shatters House Stark"
 GOT_Story_News.241.d:0 "In the most horrific act of treachery in modern Westerosi history, King Robb Stark, Queen Talisa, Lady Catelyn Stark, and the vast majority of the Northern army's leadership have been butchered inside the Twins during the wedding feast of Lord Edmure Tully. Executed under the pretext of guest right by Lord Walder Frey and Lord Roose Bolton in secret alignment with Hand of the King Tywin Lannister, the massacre dissolved the Kingdom of the North in a single night. Outside the castle, the slaughter spread to the Northern camps, where thousands of sleeping soldiers were put to the sword or burned alive inside their tents. With the Young Wolf dead and Winterfell in ruins, Northern resistance to the Iron Throne has utterly collapsed."
 GOT_Story_News.241.a:0 "The Rains of Castamere wash over the North."


# Jon Snow's Loyalty Tested
 GOT_Story_Country.242.t:0 "Jon Snow’s Loyalty Tested"
 GOT_Story_Country.242.d:0 "At Queenscrown, surrounded by the howling storm, Tormund Giantsbane thrust an old horse breeder onto his knees and handed Jon Snow a rusty longsword. To prove his absolute turncoat loyalty to the free folk, Jon was ordered to cut the innocent man's throat in cold blood. As Ygritte watched in agonizing suspense, Jon lowered his blade, unable to butcher an unarmed civilian in cold blood. Brandishing his skinchanger powers, Orell denounced Jon as a crow turncloak and attacked, seizing the opportunity to slay his rival. In a desperate duel beneath the lightning-lit sky, Jon ran Orell through with Longclaw, commandeered a horse, and galloped south into the darkness—forced to abandon Ygritte and the wildlings as his cover unravelled."
 GOT_Story_Country.242.a:0 "I am a man of the Night's Watch. My oath remains."

 GOT_Story_News.242.t:0 "Jon Snow Escapes the Wildling Vanguard"
 GOT_Story_News.242.d:0 "Reports from the lands south of the Wall confirm that Jon Snow, the turncloak ranger who climbed the Wall with Tormund Giantsbane's raiding party, has broken ties with the free folk. When commanded to execute an innocent horse breeder near the abandoned tower of Queenscrown, Snow refused, sparking a violent brawl within the raiding party. During the chaotic skirmish, Snow slew the warg Orell before breaking free on horseback under a heavy storm. With his true allegiance to the Night's Watch revealed, Snow is now riding hard toward Castle Black to warn his brothers of the impending wildling assault."
 GOT_Story_News.242.a:0 "The crow turns his coat once more and flees for Castle Black."


# Bran’s Warging Ability Emerges
 GOT_Story_Country.243.t:0 "Bran’s Warging Ability Emerges"
 GOT_Story_Country.243.d:0 "Trapped inside the crumbling tower of Queenscrown while a violent thunderstorm raged, Bran Stark and his companions were nearly betrayed by Hodor's panicked screams. As wildlings gathered below, Bran reached out with his mind, slipping beyond his broken legs and plunging into the mind of his direwolf, Summer. Experiencing the night through grey eyes, razor fangs, and predatory instinct, Bran led Summer into a ferocious assault alongside Shaggydog, mauling the wildling raiders and allowing Jon Snow to escape. Returning to his own flesh, Bran realized the true depth of the greensight surging within him—a gift that could unravel his destiny beyond the Wall, but one that threatens to pull him further from his human self."
 GOT_Story_Country.243.a:0 "I am no longer just a cripple... I can fly."

 GOT_Story_News.243.t:0 "Mystical Powers Awakened in the Northern Wastes"
 GOT_Story_News.243.d:0 "Whispers from beyond the Gift speak of miraculous and terrifying ancient magic awakening in the shadow of the Wall. During a violent lightning storm near Queenscrown, a pack of savage direwolves attacked a wildling scouting party with unnatural, coordinated precision. Eyewitness accounts suggest the beasts were controlled from afar by a greensight skinchanger—a powerful warg capable of entering the minds of animals. As winter approaches, travelers and outlaws alike report that the ancient myths of the First Men are returning to life in the frozen North."
 GOT_Story_News.243.a:0 "The Old Gods still possess power in the North."


# Daenerys Plans the Invasion of Yunkai
 GOT_Story_Country.244.t:0 "Daenerys Plans the Invasion of Yunkai"
 GOT_Story_Country.244.d:0 "Gathered around the war map in her silk pavilion, Daenerys Targaryen reviewed the defenses of Yunkai alongside Ser Jorah Mormont, Grey Worm, and her newly acquired ally, Daario Naharis. Exploiting his intimacy with the city's defenses, Daario revealed a hidden, unguarded postern gate set within the rear plaster walls—a breach through which a small, lethal vanguard could infiltrate the slave city under cover of darkness. Rejecting a prolonged, bloody siege that would cost the lives of thousands, the Dragon Queen sanctioned the daring night assault. By striking from within and throwing open the main gates to her Unsullied host, Daenerys aims to shatter the Wise Masters, liberate tens of thousands of slaves, and strike another decisive blow against the ancient institution of human bondage."
 GOT_Story_Country.244.a:0 "Break their chains. Yunkai will fall before dawn."

 GOT_Story_News.244.t:0 "Daenerys Prepares Infiltration of Yunkai"
 GOT_Story_News.244.d:0 "Outside the yellow walls of Yunkai, the Targaryen war council has finalized plans for a swift and unexpected assault on the slave city. Leveraging critical reconnaissance provided by Daario Naharis—the turncoat captain of the Second Sons—the Mother of Dragons has chosen to forego a conventional siege in favor of a midnight infiltration through a secret postern gate. Supported by Grey Worm's elite Unsullied and Ser Jorah Mormont, the strike team intends to breach the city's interior defenses, rouse the enslaved populace, and seize Yunkai before the Wise Masters can organize a defense."
 GOT_Story_News.244.a:0 "The Dragon Queen prepares to shatter another city of slavers."


# Samwell Tarly and Gilly’s Journey
 GOT_Story_Country.245.t:0 "Samwell Tarly and Gilly’s Journey"
 GOT_Story_Country.245.d:0 "Exhausted and freezing, Samwell Tarly and Gilly pushed deeper into the haunted shadows of the Haunted Forest, carrying Craster's infant son through snowdrifts and ancient trees. Relying on fragments of dusty lore remembered from the Great Library at Castle Black, Sam guided them to the eerie ruins of the Nightfort—the oldest castle on the Wall. There, buried deep beneath the foundation stones, lies the Black Gate: a ancient, weeping face carved from weirwood that opens its wooden mouth only to sworn brothers who recite the sacred vows of the Night's Watch. Through this secret subterranean passage, Sam hopes to bring Gilly and her child safely past the Wall before the army of the dead sweeps through the woods."
 GOT_Story_Country.245.a:0 "Night gathers, but this passage will lead us to safety."

 GOT_Story_News.245.t:0 "A Secret Passage Through the Wall Discovered"
 GOT_Story_News.245.d:0 "Tidings from the far North reveal that Brother Samwell Tarly and the wildling woman Gilly have successfully navigated the frozen wastes beyond the Wall to reach the legendary Nightfort. Utilizing forgotten records of the Night's Watch, Tarly uncovered the Black Gate—a hidden, subterranean passage carved beneath the ancient ice fortification. The discovery provides a hidden route through the colossal structure, offering passage for the survivors of the Great Ranging as dark forces continue to gather in the Haunted Forest."
 GOT_Story_News.245.a:0 "An ancient secret of the Night's Watch comes to light."

 
# The Aftermath of the Red Wedding
 GOT_Story_Country.246.t:0 "The Aftermath of the Red Wedding"
 GOT_Story_Country.246.d:0 "The horrific carnage at the Twins has redrawn the map of Westeros in blood. By decree of the Iron Throne, the treacherous Lord Walder Frey has been rewarded with the seat of Riverrun, while Roose Bolton has been named Warden of the North, cementing their treacherous pact with House Lannister. Riding through the smoking ruins of the Riverlands, Sandor Clegane and Arya Stark stumbled upon a band of Frey soldiers roasting meat by a campfire—laughing boisterously as they bragged of desecrating King Robb's corpse. Overcome by cold, unyielding rage, Arya approached the men under a guise of innocence before driving a stolen dagger repeatedly into a soldier's neck. As the Hound ruthlessly butchered the remaining men, Arya reclaimed her Valyrian iron coin, her heart turning to stone as she swore to kill every name on her list."
 GOT_Story_Country.246.a:0 "Valar Morghulis... none of them will escape my vengeance."

 GOT_Story_News.246.t:0 "Frey and Bolton Domination After the Red Wedding"
 GOT_Story_News.246.d:0 "In the wake of the brutal massacre at the Twins, the political landscape of Westeros has been violently reshaped. King Joffrey and Lord Tywin Lannister have officially rewarded their co-conspirators: House Frey has been granted the lordship and lands of Riverrun, while Lord Roose Bolton has been elevated to Warden of the North. Meanwhile, reports from the Riverlands indicate growing lawlessness and blood feuds, as pockets of Stark loyalists and vengeful survivors clash with Frey outposts. Though the Northern rebellion has been crushed, the seeds of an even deadlier cycle of blood and vengeance have been sown."
 GOT_Story_News.246.a:0 "A dark shadow falls across the Riverlands and the North."


# Jon Snow's Return to the Wall
 GOT_Story_Country.247.t:0 "Jon Snow’s Return to the Wall"
 GOT_Story_Country.247.d:0 "Fleeing the slaughter at Queenscrown, Jon Snow paused near a babbling stream to tend to his exhausted horse, only to find Ygritte standing in the shadows with her bow drawn. Tears glistening in her eyes, the wildling spearwife demanded to know if his love was all a lie, her weapon trembling with a mixture of burning rage and shattered heartbreak. As Jon softly repeated that he loved her but must return to his duty, Ygritte loosed arrow after arrow, striking him in the leg, arm, and shoulder as he remounted and galloped away. Bleeding heavily and clinging to his horse's neck, Jon rode through the gloom toward Castle Black, leaving behind the woman he loved and the wild freedom of the far North."
 GOT_Story_Country.247.a:0 "You know nothing, Jon Snow... yet my oath calls me back."

 GOT_Story_News.247.t:0 "Jon Snow Escapes to Castle Black"
 GOT_Story_News.247.d:0 "Severe news from the Shadow Tower and Castle Black confirms that Jon Snow, the natural son of Eddard Stark, has limped back to the Night's Watch bearing grave wounds and vital intelligence. Having escaped the wildling raiding party south of the Wall, Snow was pursued by the spearwife Ygritte, who shot him multiple times before he managed to break away on horseback. Though weakened by severe arrow wounds, Snow brought word of Tormund Giantsbane's vanguard operating south of the Wall and Mance Rayder's vast host marching from the Frostfangs, throwing Castle Black into immediate preparations for defense."
 GOT_Story_News.247.a:0 "A wounded crow brings dire warnings to Castle Black."


# Daenerys’s Liberation of Yunkai
 GOT_Story_Country.248.t:0 "Daenerys’s Liberation of Yunkai"
 GOT_Story_Country.248.d:0 "The midnight attack was a resounding triumph. Led through the postern gate by Daario Naharis, Ser Jorah Mormont, and Grey Worm, Targaryen forces opened the city from within, overwhelming the city guards and forcing the Wise Masters of Yunkai to surrender without conditions. As the sun rose over the golden pyramids, tens of thousands of freed slaves poured out through the open gates to greet the Dragon Queen. Surrounding her in a vast ocean of uplifted arms and weeping faces, the crowd lifted Daenerys upon their shoulders, chanting 'Mhysa'—the Ghiscari word for mother. Standing amid her liberated children, Daenerys Stormborn solidified her legacy not merely as a conqueror, but as the Breaker of Chains."
 GOT_Story_Country.248.a:0 "They call me Mother... and I will shatter every chain in Slaver's Bay."

 GOT_Story_News.248.t:0 "Daenerys Liberates Yunkai, Hailed as Mhysa"
 GOT_Story_News.248.d:0 "Reports from Slaver's Bay confirm that the ancient slave city of Yunkai has capitulated to Daenerys Targaryen following a swift, decisive night attack by her Unsullied and Second Sons. Rejecting further bloodshed, the Wise Masters opened their gates and surrendered their slaves at the Dragon Queen's command. In an extraordinary spectacle outside the city walls, thousands of newly freed slaves swarmed around Targaryen, lifting her into the air and hailing her as 'Mhysa'—their mother. The bloodless triumph cements Daenerys' dominion over Essos and sends shockwaves across the Free Cities."
 GOT_Story_News.248.a:0 "The Breaker of Chains claims another victory in Essos."


# Stannis’s Decision to Aid the Wall
 GOT_Story_Country.249.t:0 "Stannis's Dilemma at the Wall"
 GOT_Story_Country.249.d:0 "A desperate missive from Maester Aemon of the Night's Watch arrived at Dragonstone, pleading for aid against a hundred thousand wildlings marching on Castle Black—and warning of an even darker ancient terror rising in the deep snows. Ser Davos Seaworth presented the letter to Stannis Baratheon, arguing that a true king must defend the realm if he wishes to rule it. Standing before the painted table, Stannis faces a agonizing choice: heed the red priestess Melisandre and sail his remaining fleet north to save the Wall, or reserve his depleted armies to press his claim for the Iron Throne in the south."
 GOT_Story_Country.249.a:0 "Lord Davos is right. We march north to save the realm."
 GOT_Story_Country.249.b:0 "The Wall must fend for itself—the Iron Throne is our true objective."

 GOT_Story_News.249.t:0 "Stannis Baratheon Sails for the Wall"
 GOT_Story_News.249.d:0 "In a startling strategic pivot that has caught the Iron Throne off guard, King Stannis Baratheon has boarded his remaining war fleet at Dragonstone and set sail for the North. Spurred by urgent pleas from Castle Black regarding Mance Rayder's massive wildling invasion and growing reports of unnatural threats beyond the ice, Stannis has committed his remaining strength to defending the Night's Watch. Observers note this bold gambit could either restore Stannis' reputation as a true protector of the realm or leave his campaign stranded in the frozen northern wilderness."
 GOT_Story_News.249.a:0 "The King Who Cared marches to defend the Wall."


# Bran’s Encounter with Samwell Tarly
 GOT_Story_Country.250.t:0 "Bran’s Encounter with Samwell Tarly"
 GOT_Story_Country.250.d:0 "Deep within the echoey, shadowed ruins of the Nightfort, Bran Stark, Hodor, Meera, and Jojen Reed encountered Samwell Tarly and Gilly emerging from the darkness of the Black Gate. Instantly recognizing the young stark by his direwolf, Summer, Sam realized this cripple boy was Jon Snow's brother. Though Sam pleaded with Bran to turn back and return to Castle Black, Jojen insisted their destiny lay far to the north with the Three-Eyed Raven. Understanding he could not dissuade them, Sam passed along his remaining cache of ancient dragonglass weapons and guided them down through the weeping stone face of the magical weirwood door, swearing a solemn vow never to reveal to Jon that his brother still lived."
 GOT_Story_Country.250.a:0 "With obsidian in hand, we pass beyond the Wall."

 GOT_Story_News.250.t:0 "Bran Stark Meets Samwell Tarly at the Nightfort"
 GOT_Story_News.250.d:0 "In a chance encounter beneath the ancient ruins of the Nightfort, Bran Stark and his companions crossed paths with Samwell Tarly of the Night's Watch. Recognizing the young Stark boy through his direwolf, Tarly provided the travelers with vital supplies and daggers of obsidian dragonglass—the ancient bane of the White Walkers. Tarly then ushered the party through the Black Gate, a secret magical portal carved beneath the Wall, allowing Lord Eddard's crippled son to vanish into the uncharted lands of Always Winter in search of his destiny."
 GOT_Story_News.250.a:0 "A Stark passes beyond the Wall into the realm of legend."


 GOT_Story_Country.251.t:0 "The Passing of Lord Hoster"
 GOT_Story_Country.251.d:0 "The long, lingering death of Lord Hoster Tully has finally come to an end in the grand chambers of Riverrun. Lord Paramount of the Trident, Hoster spent his final days lost in fever dreams of forgotten sins, muttering of Tansy while the war he sought to prevent consumed his beloved river country. With his passing, the heavy mantle of leadership falls squarely upon his well-meaning but impetuous son, Edmure Tully. Joined by Ser Brynden 'The Blackfish' Tully and a mourning Lady Catelyn, the court prepares to send the old lord on his final journey down the Red Fork in a burning funeral boat—as a new, far darker era dawns over the Riverlands."
 GOT_Story_Country.251.a:0 "Family, Duty, Honor. May the river carry him home."

 GOT_Story_News.251.t:0 "Lord Hoster Tully Dies at Riverrun"
 GOT_Story_News.251.d:0 "Lord Hoster Tully, Lord Paramount of the Trident and venerable head of House Tully, has succumbed to a long and painful illness at Riverrun. A veteran commander of the War of the Ninepenny Kings and a master strategist during Robert's Rebellion, Hoster was widely respected for keeping the Riverlands united through decades of strife. His son and heir, Ser Edmure Tully, now assumes the lordship amidst a devastating war that has laid waste to the Riverlands. The traditional Tully river funeral will take place on the Red Fork, attended by his family and remaining loyal bannermen."
 GOT_Story_News.251.a:0 "A titan of the Riverlands passes into history."

 # # # # # # # # # # # #
 # #SEASON 4 # #
 # # # # # # # # # # # #

 # Tywin Lannister Melts Down Ned Stark’s Sword
 GOT_Story_Country.301.t: "Two Swords Forged from One"
 GOT_Story_Country.301.d: "In a display of Lannister supremacy, Tywin Lannister has overseen the melting of Ned Stark’s Valyrian steel greatsword, Ice, forging two new swords from its remnants. One is given to Jaime, who refuses to abandon the Kingsguard, and the other to King Joffrey. The act serves as both a practical reforging and a symbolic obliteration of House Stark’s legacy."
 GOT_Story_Country.301.a: "The Starks fall, the Lannisters rise."

 GOT_Story_News.301.t: "House Stark’s Legacy Reforged into Lannister Steel"
 GOT_Story_News.301.d: "In King’s Landing, Tywin Lannister has melted the great Valyrian steel sword of Ned Stark, creating two new blades. One is offered to Jaime Lannister, who refuses to return to Casterly Rock, while the other is gifted to King Joffrey. The gesture not only arms the Lannisters, but also desecrates the memory of House Stark’s honor."
 GOT_Story_News.301.a: "The old world burns in Lannister forges."

 # Jaime Lannister's Strained Relationship with His Family
 GOT_Story_Country.302.t: "Jaime Returns to a Changed Family"
 GOT_Story_Country.302.d: "After escaping captivity, Jaime Lannister returns to King’s Landing, only to be met with cold disdain. His father is disappointed by his refusal to abandon the Kingsguard, Joffrey ridicules his diminished status, and Cersei is repulsed by both his maimed body and his clinging to their secret bond. Jaime's homecoming is anything but warm."
 GOT_Story_Country.302.a: "The Kingslayer finds no refuge in his own house."

 GOT_Story_News.302.t: "Jaime Lannister’s Return Fractures House Unity"
 GOT_Story_News.302.d: "Despite surviving imprisonment and maiming, Jaime Lannister’s return to the capital has only deepened the rifts within House Lannister. Tywin sees him as disobedient, Joffrey mocks him publicly, and Cersei keeps him at emotional arm’s length. Once a proud lion, Jaime now limps through a pride that barely recognizes him."
 GOT_Story_News.302.a: "Even lions devour their wounded."

 # Daenerys Targaryen Approaches Meereen
 GOT_Story_Country.303.t: "Meereen Awaits Daenerys"
 GOT_Story_Country.303.d: "Daenerys marches toward Meereen, the last and greatest of the slaver cities. Along the road, she finds the bodies of crucified slave children — a grim warning from the city’s masters. Unshaken, she presses onward, vowing to free the oppressed and punish the cruel. The dragon queen's conquest continues, one chain at a time."
 GOT_Story_Country.303.a: "Their cruelty will be their downfall."

 GOT_Story_News.303.t: "Daenerys Nears Meereen, Slaver City Trembles"
 GOT_Story_News.303.d: "With her Unsullied, freedmen, and dragons, Daenerys Targaryen nears Meereen. Her march is lined with crucified slave children, meant to break her spirit — but the queen shows no fear. Her path is justice and fire, and Meereen’s walls may not stand long against either."
 GOT_Story_News.303.a: "The last of the slaver cities may soon fall."

 # Tyrion Lannister Welcomes Prince Oberyn Martell
 GOT_Story_Country.304.t: "The Viper Arrives in King's Landing"
 GOT_Story_Country.304.d: "Tyrion Lannister meets Prince Oberyn Martell, a sharp-tongued and dangerous arrival from Dorne. Though invited for Joffrey’s wedding, Oberyn’s true purpose is vengeance — for the brutal murder of his sister Elia and her children, allegedly by Lannister hands. A new player enters the game, with venom in his veins."
 GOT_Story_Country.304.a: "The Red Viper hisses in the capital."

 GOT_Story_News.304.t: "Oberyn Martell Arrives in King’s Landing"
 GOT_Story_News.304.d: "Prince Oberyn of Dorne has come to King’s Landing under the guise of a wedding guest, but few believe he is here merely to celebrate. His rage toward the Lannisters simmers just beneath the surface, and his arrival threatens to disrupt the fragile balance of power in the capital."
 GOT_Story_News.304.a: "A viper walks the halls of the Red Keep."

 # Arya Stark and Sandor Clegane's Journey
 GOT_Story_Country.305.t: "Arya Reclaims Her Sword and Her Vengeance"
 GOT_Story_Country.305.d: "While traveling with Sandor Clegane, Arya Stark spots Polliver at an inn — the man who killed her friend Lommy and stole her sword, Needle. After a violent skirmish, Arya kills Polliver with the same words he once used, reclaiming her blade and taking another step down the path of vengeance."
 GOT_Story_Country.305.a: "A name crossed off the list."

 GOT_Story_News.305.t: "Arya Stark Strikes Down Polliver"
 GOT_Story_News.305.d: "In the Riverlands, Arya Stark has reunited with her stolen sword by killing Polliver, the Lannister man-at-arms who once murdered her friend. Her journey with Sandor Clegane continues, but this latest act of revenge signals how far the young Stark girl has drifted from innocence."
 GOT_Story_News.305.a: "A girl has a name — and a purpose."

 # Joffrey Baratheon Dies at His Wedding Feast
 GOT_Story_Country.306.t: "The Lion Falls at the Wedding Feast"
 GOT_Story_Country.306.d: "King Joffrey Baratheon has died during his wedding celebration. After cruelly mocking his uncle Tyrion and flaunting his power, Joffrey drank from a poisoned cup of wine and collapsed, choking and bleeding as chaos erupted. In her grief and fury, Queen Cersei accused Tyrion of murder, and the king’s death leaves the Iron Throne shrouded in uncertainty."
 GOT_Story_Country.306.a: "The lion’s roar is silenced."

 GOT_Story_News.306.t: "King Joffrey Dead – The Purple Wedding Ends in Chaos"
 GOT_Story_News.306.d: "The young and ruthless King Joffrey Baratheon has died at his own wedding feast in a shocking and brutal fashion. Poisoned before the eyes of Westeros' most powerful lords and ladies, his sudden demise has thrown the realm into fresh chaos. Cersei has accused Tyrion Lannister of the crime, and King’s Landing braces for the fallout."
 GOT_Story_News.306.a: "A royal toast turns fatal."

 # Tyrion Lannister's Arrest
 GOT_Story_Country.307.t: "Tyrion in Chains"
 GOT_Story_Country.307.d: "Though he pleads innocence, Tyrion Lannister has been arrested and charged with regicide for the poisoning of King Joffrey. With no trial date yet set and little hope for a fair hearing, Tyrion faces a grim future, surrounded by enemies and betrayed by fate."
 GOT_Story_Country.307.a: "Innocence means nothing in King's Landing."

 GOT_Story_News.307.t: "Tyrion Lannister Accused of King’s Murder"
 GOT_Story_News.307.d: "In the wake of King Joffrey’s shocking death, Tyrion Lannister has been taken into custody, accused of orchestrating the poisoning. Known for his wit and political cunning, Tyrion has long made enemies at court — and now finds himself the perfect scapegoat for a grief-stricken crown."
 GOT_Story_News.307.a: "The Imp stands alone."

 # Sansa Stark's Escape
 GOT_Story_Country.308.t: "Sansa Slips the Lion’s Cage"
 GOT_Story_Country.308.d: "With King Joffrey dead and the city in disarray, Sansa Stark has fled King’s Landing. Guided by Ser Dontos Hollard, she escaped through the castle grounds and boarded a ship bound for freedom. Her sudden disappearance only adds to the confusion, and her fate now lies in the hands of those who pulled the strings behind the curtain."
 GOT_Story_Country.308.a: "Freedom tastes of salt air."

 GOT_Story_News.308.t: "Sansa Stark Disappears After King’s Death"
 GOT_Story_News.308.d: "In the wake of King Joffrey’s death, Sansa Stark has vanished from King’s Landing. Rumors swirl of a hidden plot behind her escape, possibly orchestrated by those with deeper ambitions. Once a prisoner of courtly games, the daughter of House Stark may now be a player in her own right."
 GOT_Story_News.308.a: "The wolf slips through the cracks."

 # Ramsay Snow Hunts a Woman
 GOT_Story_Country.309.t: "A Hunt Without Honor"
 GOT_Story_Country.309.d: "Ramsay Snow has led another sadistic hunt, chasing a woman named Tansy through the woods with his dogs and companion Miranda. The thrill of the pursuit ends with her bloody death, reinforcing Ramsay’s ruthless nature and his perverse sense of power. Even Roose Bolton begins to question his bastard son’s brutal methods."
 GOT_Story_Country.309.a: "Monsters are born of men like these."

 GOT_Story_News.309.t: "Ramsay Snow’s Cruelty on Full Display"
 GOT_Story_News.309.d: "In the North, Ramsay Snow continues to demonstrate the depths of his depravity. Reports tell of a hunt where a terrified woman was released into the woods only to be hunted down and killed. Such behavior has sparked concern even within House Bolton, though Ramsay remains unchecked for now."
 GOT_Story_News.309.a: "Some men should not bear names."

 # Bran Stark's Vision
 GOT_Story_Country.310.t: "Visions at the Weirwood"
 GOT_Story_Country.310.d: "At the foot of a weirwood tree, Bran Stark has experienced a powerful and mysterious vision. He glimpsed shadows of the past, symbols of power, and cryptic images of what may lie ahead. Though cryptic and jarring, the vision confirms that his journey toward becoming the Three-Eyed Raven has truly begun."
 GOT_Story_Country.310.a: "The tree whispers truth."

 GOT_Story_News.310.t: "Bran Stark’s Sight Beyond Sight"
 GOT_Story_News.310.d: "Far beyond the Wall, Bran Stark has tapped into strange and ancient magic. His recent vision at a weirwood tree has deepened his connection to the old powers of the North. Though few understand his path, those who know of it fear the changes it may bring."
 GOT_Story_News.310.a: "The old gods stir."

 # Tyrion Lannister Faces Imminent Trial
 GOT_Story_Country.311.t: "Tyrion Demands Trial by Combat"
 GOT_Story_Country.311.d: "Still imprisoned following the death of King Joffrey, Tyrion Lannister receives a visit from his brother Jaime. Though urged to flee the city, Tyrion chooses instead to remain and face trial. Convinced he will not receive justice through the court, he demands a trial by combat, gambling his life on the sword once again."
 GOT_Story_Country.311.a: "Let steel speak for justice."

 GOT_Story_News.311.t: "Tyrion Lannister Demands Trial by Combat"
 GOT_Story_News.311.d: "Imprisoned and charged with regicide, Tyrion Lannister has rejected a standard trial, instead invoking his right to trial by combat. This unexpected move has shocked the court of King’s Landing and set the stage for another brutal spectacle in the capital."
 GOT_Story_News.311.a: "Blood will decide guilt."

 # Sansa Stark Escapes King's Landing
 GOT_Story_Country.312.t: "Littlefinger Reveals His Hand"
 GOT_Story_Country.312.d: "Sansa Stark has fled King’s Landing aboard a ship arranged by Ser Dontos Hollard. However, her savior proves to be a pawn of Petyr Baelish, who kills Dontos to tie up loose ends. With Sansa now in his custody, Littlefinger’s long-laid plans begin to take shape — though his true intentions remain cloaked in shadows."
 GOT_Story_Country.312.a: "From one game to another."

 GOT_Story_News.312.t: "Sansa Stark Escapes; Dontos Dead"
 GOT_Story_News.312.d: "The whereabouts of Sansa Stark are once again unknown following her escape from King’s Landing. Witnesses say she was seen with Ser Dontos Hollard, who has since turned up dead. Rumors point to the involvement of Petyr Baelish, but few know where the young wolf has gone."
 GOT_Story_News.312.a: "Littlefinger always plays the long game."

 # Jaime Lannister's Controversial Actions
 GOT_Story_Country.313.t: "Jaime Crosses a Line"
 GOT_Story_Country.313.d: "In a moment fraught with grief and confusion, Jaime Lannister forces himself on Cersei beside their son’s corpse. The act, brutal and unsettling, speaks to the tangled emotions and decaying morals in King’s Landing. It casts a dark cloud over Jaime’s redemption arc and further strains his bond with his sister."
 GOT_Story_Country.313.a: "Honor, shattered in the Sept."

 GOT_Story_News.313.t: "Controversy at the Sept of Baelor"
 GOT_Story_News.313.d: "Disturbing accounts have emerged from the Great Sept of Baelor, where Jaime Lannister reportedly forced himself upon Queen Cersei beside the body of their dead son. Though the truth remains hidden to the public, the rumors point to a rot deep within the royal household."
 GOT_Story_News.313.a: "Power makes monsters."

 # Daenerys Targaryen's Siege of Meereen
 GOT_Story_Country.314.t: "Breaker of Chains"
 GOT_Story_Country.314.d: "Daenerys Targaryen has begun her assault on Meereen, the last great slaver city in the bay. Refusing to shed blood at the gates, she instead catapults broken slave collars into the city, a clear message to the oppressed within: freedom is coming. Her title, 'Breaker of Chains,' is no longer a mere name — it is a mission."
 GOT_Story_Country.314.a: "Fire will set them free."

 GOT_Story_News.314.t: "Daenerys Begins Siege of Meereen"
 GOT_Story_News.314.d: "Outside the walls of Meereen, Daenerys Targaryen has launched her campaign to liberate the city’s slaves. By hurling thousands of broken collars into the city, she calls the slaves to rise and claim their freedom. Her crusade against slavery continues to shake Slaver’s Bay."
 GOT_Story_News.314.a: "The breaker of chains marches on."

 # Wildling Raid and the Boy's Warning
 GOT_Story_Country.315.t: "A Village Burned, a Warning Sent"
 GOT_Story_Country.315.d: "South of the Wall, wildlings led by Tormund and the cannibal Thenns have raided and slaughtered a village. In a chilling gesture, they spared a single boy, sending him to Castle Black with news of the massacre. The Night’s Watch now knows the wildling threat draws ever closer — and bloodier."
 GOT_Story_Country.315.a: "The storm approaches."

 GOT_Story_News.315.t: "Wildlings Massacre Village, Send Message"
 GOT_Story_News.315.d: "A devastating wildling raid has left a village in the North in ashes. Survivors are nonexistent, save for one boy sent to Castle Black with grim tidings. Led by Tormund Giantsbane and Thenn cannibals, the wildlings make clear their campaign will be one of terror and blood."
 GOT_Story_News.315.a: "The Wall will soon be tested."

 
 # Jaime Entrusts Brienne with a Mission
 GOT_Story_Country.316.t: "Oathkeeper"
 GOT_Story_Country.316.d: "Jaime Lannister, torn between loyalty to his family and a growing sense of honor, gives Brienne of Tarth a Valyrian steel sword—his father's gift—and names it Oathkeeper. He tasks her with finding Sansa Stark and protecting her from harm, providing her with a letter to Lady Stark as proof of her mission’s sincerity."
 GOT_Story_Country.316.a: "A knight true in all but name."

 GOT_Story_News.316.t: "Jaime Sends Brienne to Protect Sansa Stark"
 GOT_Story_News.316.d: "In a quiet but meaningful act, Jaime Lannister has armed Brienne of Tarth with a Valyrian steel sword and sent her to find and protect Sansa Stark. As King’s Landing drowns in politics and suspicion, this mission represents a rare act of loyalty and honor."
 GOT_Story_News.316.a: "A vow still means something to some."

 # Daenerys Conquers Meereen
 GOT_Story_Country.317.t: "Justice for the Slaves"
 GOT_Story_Country.317.d: "Daenerys Targaryen has captured Meereen, completing her conquest of Slaver’s Bay. In retribution for the atrocities committed by the city’s masters, she orders 163 of them crucified—mirroring the fate they inflicted upon slave children. Her rule begins not with mercy, but with fire and blood."
 GOT_Story_Country.317.a: "Justice, not mercy."

 GOT_Story_News.317.t: "Daenerys Captures Meereen, Crucifies Masters"
 GOT_Story_News.317.d: "With Meereen fallen, Daenerys Targaryen now holds all of Slaver’s Bay. Her decision to crucify 163 former masters in revenge for their cruelty has sent a chilling message across Essos: the breaker of chains is also the bringer of reckoning."
 GOT_Story_News.317.a: "The dragon queen delivers judgment."

 # Jon Snow Leads Expedition to Craster’s Keep
 GOT_Story_Country.318.t: "The Bastards at Craster's Keep"
 GOT_Story_Country.318.d: "Jon Snow has been granted permission to lead a band of loyal brothers to Craster's Keep, where mutineers have turned the outpost into a den of lawlessness. Determined to restore the honor of the Night's Watch and prevent further disgrace, Jon prepares for the dangerous mission."
 GOT_Story_Country.318.a: "We are the sword in the darkness."

 GOT_Story_News.318.t: "Jon Snow Leads Night’s Watch Expedition"
 GOT_Story_News.318.d: "In the wake of growing tensions beyond the Wall, Jon Snow has taken a small group of men north to deal with the mutineers at Craster’s Keep. The journey is perilous, but Snow’s resolve remains firm as he seeks to uphold the Night’s Watch’s fading honor."
 GOT_Story_News.318.a: "The North remembers its oath."

 # Brienne and Podrick Begin Their Journey
 GOT_Story_Country.319.t: "A Knight and Her Squire"
 GOT_Story_Country.319.d: "Brienne of Tarth, now armed with Oathkeeper, sets out on her quest to find Sansa Stark. By her side is the unlikely squire Podrick Payne. Though inexperienced, Podrick’s loyalty is unquestionable. Together, they begin a journey that will test their resolve, their beliefs, and their bond."
 GOT_Story_Country.319.a: "Honor rides with us."

 GOT_Story_News.319.t: "Brienne and Podrick Begin Their Quest"
 GOT_Story_News.319.d: "Brienne of Tarth and her squire, Podrick Payne, have departed King’s Landing in search of Sansa Stark. As chaos and suspicion swirl through the realm, the quiet determination of this unlikely duo may yet serve a noble purpose."
 GOT_Story_News.319.a: "A vow keeps them moving."

 # Tyrion’s Trial Looms
 GOT_Story_Country.320.t: "The Trial Approaches"
 GOT_Story_Country.320.d: "Still confined in the Red Keep, Tyrion Lannister awaits his trial for the murder of King Joffrey. Accusations mount and allies dwindle, but Tyrion remains defiant. He knows the trial is a farce—but if justice cannot be found in truth, perhaps it will be found in combat."
 GOT_Story_Country.320.a: "They want a monster? I'll show them one."

 GOT_Story_News.320.t: "Tyrion Lannister Awaits Trial"
 GOT_Story_News.320.d: "Tyrion Lannister remains in chains, facing charges of regicide. As witnesses are gathered and political alliances shift, the trial looms large over King’s Landing. The Imp, ever defiant, may yet find a way to turn the game in his favor."
 GOT_Story_News.320.a: "A Lannister’s fate hangs in the balance."
 
 # Tommen Is Crowned King
 GOT_Story_Country.321.t: "First of His Name"
 GOT_Story_Country.321.d: "With King Joffrey dead, Tommen Baratheon is crowned King of the Seven Kingdoms. Younger, gentler, and more pliable than his predecessor, Tommen becomes the focus of Cersei’s renewed political maneuvering. She begins laying plans for his future, including a marriage to Margaery Tyrell."
 GOT_Story_Country.321.a: "A boy wears the crown, but who rules?"

 GOT_Story_News.321.t: "Tommen Baratheon Crowned King"
 GOT_Story_News.321.d: "Tommen Baratheon has officially been crowned King of the Seven Kingdoms. With the realm still reeling from Joffrey’s assassination, many hope Tommen’s reign will be a gentler one. Yet behind the throne, Cersei Lannister already begins shaping his rule."
 GOT_Story_News.321.a: "Long live the king… for now."

 # Sansa and Littlefinger Arrive at the Eyrie
 GOT_Story_Country.322.t: "The Ascent to the Eyrie"
 GOT_Story_Country.322.d: "Sansa Stark, now under the protection of Petyr Baelish, arrives at the Eyrie. They are greeted by Lysa Arryn, whose behavior quickly turns unstable. In a chilling confession, Lysa reveals she murdered her husband Jon Arryn at Petyr’s urging, and now accuses Sansa of seducing him. Sansa denies it, but the seeds of paranoia are planted."
 GOT_Story_Country.322.a: "The Eyrie is no safe haven."

 GOT_Story_News.322.t: "Sansa Reaches the Eyrie with Littlefinger"
 GOT_Story_News.322.d: "Far from the eyes of Westeros, Sansa Stark has arrived at the Eyrie with Petyr Baelish. Lady Lysa Arryn, now revealed as Jon Arryn’s true killer, welcomes them with a volatile blend of affection and suspicion. The Vale, it seems, has its own shadows."
 GOT_Story_News.322.a: "Secrets and lies roost in the Eyrie."

 # Jon Snow Attacks Craster's Keep
 GOT_Story_Country.323.t: "The Mutiny Ends"
 GOT_Story_Country.323.d: "Jon Snow leads a successful assault on Craster’s Keep, putting an end to the mutineers who betrayed the Night’s Watch. The mission, though grim, restores a measure of honor to the order. Ghost is recovered, and the bodies of fallen brothers are avenged."
 GOT_Story_Country.323.a: "For the Watch."

 GOT_Story_News.323.t: "Jon Snow Crushes Mutineers at Craster’s Keep"
 GOT_Story_News.323.d: "Jon Snow and his loyal companions have destroyed the mutineers at Craster’s Keep. The Night’s Watch regains a sliver of dignity with the victory, though the cost of betrayal still lingers. Among the ruins, a direwolf howls once more."
 GOT_Story_News.323.a: "Justice in the cold."

 # Daenerys Decides to Stay in Meereen
 GOT_Story_Country.324.t: "Queen of Meereen"
 GOT_Story_Country.324.d: "Daenerys Targaryen, now ruling Meereen, chooses to stay and govern rather than sail for Westeros. She learns that both Astapor and Yunkai have descended into chaos after her departure. Realizing that she must first learn to rule, she resolves to remain and bring lasting justice to Slaver’s Bay."
 GOT_Story_Country.324.a: "Before conquering Westeros, I must master Meereen."

 GOT_Story_News.324.t: "Daenerys Stays in Meereen"
 GOT_Story_News.324.d: "Rather than pursuing the Iron Throne, Daenerys Targaryen has decided to remain in Meereen and establish order. Her crusade against slavery continues, but ruling proves more complex than conquest. Across the sea, her decision echoes with both relief and concern."
 GOT_Story_News.324.a: "The mother of dragons chooses stability."

 # Revelation of Jon Arryn’s Murder
 GOT_Story_Country.325.t: "The Seed of the War"
 GOT_Story_Country.325.d: "A stunning revelation: Jon Arryn’s death—long believed to be the work of the Lannisters—was actually orchestrated by Lysa Arryn at the urging of Petyr Baelish. His murder set off the chain of events that led to the War of the Five Kings. The entire realm, it seems, has been dancing to Littlefinger’s tune."
 GOT_Story_Country.325.a: "Chaos isn't a pit. Chaos is a ladder."

 GOT_Story_News.325.t: "The Truth About Jon Arryn’s Death"
 GOT_Story_News.325.d: "The murder of Jon Arryn, which triggered the fall of House Stark and the War of the Five Kings, has been revealed as the work of Lysa Arryn and Petyr Baelish. This hidden truth alters the very foundations of recent history. One man’s whisper started it all."
 GOT_Story_News.325.a: "Littlefinger’s game runs deep."
 
 # Tyrion's Trial for Joffrey’s Murder
 GOT_Story_Country.326.t: "The Trial of Tyrion Lannister"
 GOT_Story_Country.326.d: "Tyrion Lannister faces trial for the murder of King Joffrey Baratheon. The proceedings are heavily biased, with false testimonies from Ser Meryn Trant and Grand Maester Pycelle. In the end, Tyrion demands a trial by combat, a shocking move that leaves the court in stunned silence."
 GOT_Story_Country.326.a: "The game is rigged, but Tyrion plays on."

 GOT_Story_News.326.t: "Tyrion Lannister’s Trial Begins"
 GOT_Story_News.326.d: "Tyrion Lannister stands trial for the murder of King Joffrey. As the court hears testimonies from false witnesses, Tyrion’s fate seems sealed. But with a bold move, he demands a trial by combat, turning the court’s proceedings into chaos."
 GOT_Story_News.326.a: "The lion’s last stand?"

 # Shae’s Devastating Testimony
 GOT_Story_Country.327.t: "Betrayal in the Courtroom"
 GOT_Story_Country.327.d: "Shae, Tyrion’s former lover, testifies against him, falsely claiming that he conspired with Sansa to murder Joffrey. Her betrayal strikes Tyrion deeply, as he had once tried to protect her. The court believes her lies, pushing Tyrion to the brink of despair."
 GOT_Story_Country.327.a: "The one who loved him betrays him."

 GOT_Story_News.327.t: "Shae’s Betrayal"
 GOT_Story_News.327.d: "Shae’s damning testimony against Tyrion Lannister has left the court in disbelief. Her lies about Tyrion’s involvement in Joffrey’s murder have pushed him closer to a fate he cannot avoid. Her betrayal is a devastating blow to a man already on the edge."
 GOT_Story_News.327.a: "Love turned to poison."

 # Stannis Baratheon’s Negotiation with the Iron Bank
 GOT_Story_Country.328.t:0 "The Iron Bank of Braavos"
 GOT_Story_Country.328.d:0 "With resources dwindling and the war dragging on, the question arises—should we appeal to the Iron Bank of Braavos for a loan? Davos argues that their gold could make the difference in our struggle, but others warn of the consequences of indebting ourselves to Braavos. The decision now rests with Stannis."
 GOT_Story_Country.328.a:0 "Send Davos—we need the gold to win this war."
 GOT_Story_Country.328.b:0 "We fight with what we have. We don’t need Braavosi gold."


 GOT_Story_News.328.t: "Iron Bank Lends Gold to Stannis"
 GOT_Story_News.328.d: "The Iron Bank of Braavos has agreed to fund Stannis Baratheon’s campaign against the Lannisters, signaling a shift in the balance of power. With the Lannisters in debt and Stannis now backed by gold, the war is far from over."
 GOT_Story_News.328.a: "Gold and power, but at what cost?"

 # Yara Greyjoy’s Attempted Rescue of Theon
 GOT_Story_Country.329.t: "The Broken Bond"
 GOT_Story_Country.329.d: "Yara Greyjoy leads a daring rescue mission to free her brother, Theon, from the Dreadfort. Despite infiltrating the castle and finding him, Theon is so broken by Ramsay’s torture that he refuses to leave. Yara is forced to retreat, leaving Theon behind, a shadow of his former self."
 GOT_Story_Country.329.a: "A rescue denied."

 GOT_Story_News.329.t: "Yara Greyjoy Fails to Free Theon"
 GOT_Story_News.329.d: "Yara Greyjoy’s attempt to rescue her brother, Theon, from Ramsay Bolton’s clutches has failed. Theon, broken by torture, refuses to escape, leaving Yara no choice but to retreat. The Greyjoys’ hopes for a reunion have crumbled."
 GOT_Story_News.329.a: "A family torn apart."

 # Daenerys Targaryen’s Struggles in Meereen
 GOT_Story_Country.330.t: "Challenges in Meereen"
 GOT_Story_Country.330.d: "In Meereen, Daenerys Targaryen faces growing challenges in her rule. A dragon kills a goat herder’s animals, leading to tensions with the locals. Daenerys agrees to bury the father of Hizdahr zo Loraq, a critic of her actions, symbolizing her struggle to balance justice with mercy."
 GOT_Story_Country.330.a: "The weight of a queen’s choices."

 GOT_Story_News.330.t: "Daenerys Faces Challenges in Meereen"
 GOT_Story_News.330.d: "As Daenerys Targaryen’s rule over Meereen faces rising difficulties, she must decide how to balance justice and mercy. After one of her dragons kills a goat herder’s animals, Daenerys agrees to bury the father of a critic, Hizdahr zo Loraq, showing her willingness to negotiate."
 GOT_Story_News.330.a: "Ruling a city is more complicated than conquering one."
 
 # Littlefinger Kills Lysa Arryn
 GOT_Story_Country.331.t: "Littlefinger’s Betrayal"
 GOT_Story_Country.331.d: "In a shocking twist, Petyr Baelish (Littlefinger) pushes Lysa Arryn through the Moon Door, causing her death. This action solidifies his control over the Vale and reveals his long-standing manipulation of events, including orchestrating Jon Arryn’s death that set the series’ events in motion."
 GOT_Story_Country.331.a: "A door closed for Lysa, an empire built for Littlefinger."

 GOT_Story_News.331.t: "Lysa Arryn’s Death"
 GOT_Story_News.331.d: "Petyr Baelish has killed Lysa Arryn by pushing her through the Moon Door, a ruthless move to secure his power over the Vale. This shocking act comes after years of manipulation and marks another chapter in Baelish’s dangerous game of power."
 GOT_Story_News.331.a: "The Moon Door claims another victim."

 # Tyrion Finds an Unexpected Champion
 GOT_Story_Country.332.t:0 "Oberyn’s Choice"
 GOT_Story_Country.332.d:0 "Word has reached us from King’s Landing—Tyrion Lannister, accused of regicide, demands trial by combat. Prince Oberyn sees a chance to face Ser Gregor Clegane, the man who murdered his sister Elia during the Sack of King's Landing. Some urge caution, others call for vengeance. The decision is now ours—do we let Oberyn fight?"
 GOT_Story_Country.332.a:0 "Let him volunteer. Justice demands blood."
 GOT_Story_Country.332.b:0 "Hold him back. Vengeance must wait."

 GOT_Story_News.332.t: "Oberyn Martell Takes Tyrion’s Cause"
 GOT_Story_News.332.d: "In a surprising move, Prince Oberyn Martell volunteers to be Tyrion Lannister’s champion for the trial by combat. Oberyn’s decision is driven by his thirst for revenge against the Mountain, whom he holds responsible for his sister’s death."
 GOT_Story_News.332.a: "The fight for justice begins."

 # Arya Stark and the Hound Encounter Rorge
 GOT_Story_Country.333.t: "Arya Strikes Again"
 GOT_Story_Country.333.d: "While traveling with the Hound, Arya Stark encounters a dying man named Rorge, who is on her kill list. Without hesitation, Arya kills him with her sword, Needle, marking another step in her evolution into a skilled assassin."
 GOT_Story_Country.333.a: "A list marked, another name crossed off."

 GOT_Story_News.333.t: "Arya Kills Rorge"
 GOT_Story_News.333.d: "Arya Stark has struck again. This time, she kills Rorge, a man on her kill list, with a swift blow from her sword, Needle. This act further transforms Arya into the ruthless assassin she is becoming."
 GOT_Story_News.333.a: "The list grows shorter, the assassin grows stronger."

 # Sansa Stark Confronts Littlefinger
 GOT_Story_Country.334.t: "Sansa Confronts Littlefinger"
 GOT_Story_Country.334.d: "Sansa Stark confronts Littlefinger at the Eyrie about his role in the destruction of her family. He reveals his twisted affection for her mother, Catelyn Stark, and admits his involvement in Jon Arryn’s death, deepening Sansa’s understanding of the treacherous politics she’s caught in."
 GOT_Story_Country.334.a: "The game of power becomes clearer for Sansa."

 GOT_Story_News.334.t: "Littlefinger’s Confession"
 GOT_Story_News.334.d: "In a tense confrontation at the Eyrie, Littlefinger reveals to Sansa Stark his manipulation behind the downfall of her family and his hand in Jon Arryn’s death. This revelation marks a turning point for Sansa as she learns the harsh realities of power and betrayal."
 GOT_Story_News.334.a: "Sansa learns the cost of power."

 # Brienne and Podrick Learn Arya's Whereabouts
 GOT_Story_Country.335.t: "Brienne’s New Quest"
 GOT_Story_Country.335.d: "Brienne of Tarth and her squire, Podrick Payne, stop at an inn, where they meet Hot Pie, who informs them that Arya Stark is traveling with the Hound. This revelation sets Brienne on a new mission to find Arya, leading her towards the Vale."
 GOT_Story_Country.335.a: "The hunt for Arya begins anew."

 GOT_Story_News.335.t: "Brienne Learns of Arya’s Location"
 GOT_Story_News.335.d: "Brienne of Tarth has learned that Arya Stark is traveling with the Hound. With this new information, Brienne sets her sights on the Vale, determined to find Arya and bring her to safety."
 GOT_Story_News.335.a: "A new quest begins for Brienne."
 
 # Oberyn Martell's Trial by Combat
 GOT_Story_Country.336.t: "Oberyn Martell’s Trial by Combat"
 GOT_Story_Country.336.d: "Prince Oberyn Martell volunteers to be Tyrion Lannister’s champion in the trial by combat against Gregor 'The Mountain' Clegane. Seeking vengeance for the deaths of his sister and her children, Oberyn gains the upper hand but is brutally killed, leading to Tyrion’s death sentence."
 GOT_Story_Country.336.a: "Revenge costs Oberyn his life."

 GOT_Story_News.336.t: "Oberyn Martell’s Brutal Death"
 GOT_Story_News.336.d: "Prince Oberyn Martell has been killed in his duel with the Mountain, ending his quest for vengeance for the death of his sister and her children. His death results in Tyrion Lannister being sentenced to death for regicide."
 GOT_Story_News.336.a: "Vengeance ends in blood."

 # Tyrion's Death Sentence
 GOT_Story_Country.337.t: "Tyrion’s Fate Sealed"
 GOT_Story_Country.337.d: "After Oberyn’s death, Tyrion Lannister is found guilty of poisoning King Joffrey and sentenced to death. Despite his earlier demand for a trial by combat, the court’s decision is swift, leaving Tyrion’s future uncertain."
 GOT_Story_Country.337.a: "Tyrion’s life hangs by a thread."

 GOT_Story_News.337.t: "Tyrion Found Guilty"
 GOT_Story_News.337.d: "Tyrion Lannister has been sentenced to death for the murder of King Joffrey, following his failed trial by combat. With Oberyn Martell dead, Tyrion’s fate now lies in the hands of his enemies."
 GOT_Story_News.337.a: "A death sentence proclaimed."

 # Sansa Stark's Transformation
 GOT_Story_Country.338.t: "Sansa Stark Embraces Her Identity"
 GOT_Story_Country.338.d: "Sansa Stark reveals her true identity to the lords of the Vale, confirming she is not Alayne Stone but Sansa Stark. This marks a turning point in her character, showing her decision to take control of her destiny amidst Petyr Baelish’s manipulations."
 GOT_Story_Country.338.a: "Sansa steps into her true self."

 GOT_Story_News.338.t: "Sansa Stark’s Revelation"
 GOT_Story_News.338.d: "Sansa Stark has revealed her true identity as she declares herself the trueborn daughter of House Stark to the lords of the Vale. This marks the beginning of her transformation as she embraces her role in the political landscape of Westeros."
 GOT_Story_News.338.a: "A Stark revelation in the Vale."

 # Daenerys Targaryen's Decision
 GOT_Story_Country.339.t: "Daenerys Exiles Ser Jorah"
 GOT_Story_Country.339.d: "Daenerys Targaryen, upon learning of Ser Jorah Mormont’s betrayal as a spy for King Robert Baratheon, exiles him from Meereen. This decision reflects her commitment to justice and maintaining control over her empire, despite the personal cost."
 GOT_Story_Country.339.a: "Justice demands a heavy price."

 GOT_Story_News.339.t: "Daenerys Exiles Jorah"
 GOT_Story_News.339.d: "Daenerys Targaryen has exiled Ser Jorah Mormont after learning of his betrayal as a spy. This decision underscores her resolve to uphold justice, even as she faces difficult choices in her rule over Meereen."
 GOT_Story_News.339.a: "A betrayal leads to exile."

 # Wildlings Attack Mole's Town
 GOT_Story_Country.340.t: "Wildlings Attack Mole's Town"
 GOT_Story_Country.340.d: "The Wildlings, led by Styr and Tormund, launch a brutal attack on Mole’s Town. The town is pillaged and its inhabitants slaughtered, signaling the growing threat from the north and foreshadowing the impending conflict at the Wall."
 GOT_Story_Country.340.a: "The north grows darker."

 GOT_Story_News.340.t: "Wildlings Raid Mole’s Town"
 GOT_Story_News.340.d: "Mole’s Town has been attacked by the Wildlings, led by Styr and Tormund. The raid results in widespread death and destruction, highlighting the increasing danger the Night’s Watch faces from the north."
 GOT_Story_News.340.a: "The Wildlings make their move."
 
 # Wildlings Launch a Coordinated Assault on Castle Black
 GOT_Story_Country.341.t: "Wildlings Attack Castle Black"
 GOT_Story_Country.341.d: "Mance Rayder’s united wildling army launches a coordinated assault on Castle Black. Giants and mammoths storm the outer gate while Thenns led by Styr breach the inner defenses. Overwhelmed, the Night’s Watch faces disaster, and Jon Snow steps up to lead after Janos Slynt’s cowardice."
 GOT_Story_Country.341.a: "Castle Black faces its greatest threat."

 GOT_Story_News.341.t: "Wildlings Assault Castle Black"
 GOT_Story_News.341.d: "Mance Rayder’s wildling army has attacked Castle Black in a brutal, two-pronged assault. With giants, mammoths, and Thenns at the gates, the Night’s Watch is pushed to the brink, and Jon Snow assumes command."
 GOT_Story_News.341.a: "The Wall is under siege."

 # Pyp and Grenn's Heroic Last Stand
 GOT_Story_Country.342.t: "Pyp and Grenn’s Sacrifice"
 GOT_Story_Country.342.d: "Pyp is killed by Ygritte while manning a crossbow, and Grenn dies heroically while holding the inner gate against a giant. His final moments are marked by the recitation of the Night’s Watch vow, a testament to duty and sacrifice."
 GOT_Story_Country.342.a: "Duty until death."

 GOT_Story_News.342.t: "The Heroic Deaths of Pyp and Grenn"
 GOT_Story_News.342.d: "The Night’s Watch has lost two brave men: Pyp, killed by Ygritte, and Grenn, who perished heroically while holding the inner gate against a giant. Their sacrifices will not be forgotten."
 GOT_Story_News.342.a: "Fallen heroes of the Wall."

 # Jon Snow Faces Ygritte in a Tragic Reunion
 GOT_Story_Country.343.t: "Jon Snow’s Tragic Reunion with Ygritte"
 GOT_Story_Country.343.d: "After defeating Styr in single combat, Jon Snow faces Ygritte. She hesitates to kill him, but Olly shoots her from behind. Jon cradles her as she dies, torn between love and duty."
 GOT_Story_Country.343.a: "Love lost on the Wall."

 GOT_Story_News.343.t: "Jon Snow and Ygritte's Tragic Reunion"
 GOT_Story_News.343.d: "Jon Snow and Ygritte have their tragic reunion as she hesitates to kill him. In a cruel twist of fate, Olly’s arrow strikes her, and Jon is left to mourn her loss, symbolizing the harsh realities of duty over love."
 GOT_Story_News.343.a: "A love ended by duty."

 # Tormund Captured and Taken Prisoner
 GOT_Story_Country.344.t: "Tormund Captured"
 GOT_Story_Country.344.d: "Despite his injuries, Tormund is captured by Jon Snow’s orders. His capture marks a key shift in the power dynamics at the Wall, giving the Night’s Watch a strategic advantage."
 GOT_Story_Country.344.a: "The Wildling leader falls."

 GOT_Story_News.344.t: "Tormund Taken Prisoner"
 GOT_Story_News.344.d: "Tormund, a key leader of the Wildlings, has been captured by Jon Snow’s orders. This shift in power at the Wall signals a new phase in the conflict between the Night’s Watch and the Wildlings."
 GOT_Story_News.344.a: "A Wildling leader bound."

 # Jon Plans to Confront Mance Rayder
 GOT_Story_Country.345.t: "Jon Plans to Confront Mance Rayder"
 GOT_Story_Country.345.d: "With the immediate threat at Castle Black repelled, Jon Snow resolves to confront Mance Rayder beyond the Wall. Before departing, he entrusts his sword, Longclaw, to Samwell Tarly, passing on the weight of responsibility."
 GOT_Story_Country.345.a: "Jon moves beyond the Wall."

 GOT_Story_News.345.t: "Jon Snow Prepares to Confront Mance Rayder"
 GOT_Story_News.345.d: "Jon Snow has made plans to confront Mance Rayder beyond the Wall, aiming to prevent further attacks. Before leaving, he passes Longclaw to Samwell Tarly, symbolizing the trust and responsibility placed upon him."
 GOT_Story_News.345.a: "A new mission for Jon Snow."
 
 # Tyrion Kills Tywin and Shae
 GOT_Story_Country.346.t: "Tyrion Kills Tywin and Shae"
 GOT_Story_Country.346.d: "In a dramatic and ironic twist, Tyrion Lannister escapes his death sentence with the help of Jaime, who frees him from his cell. Tyrion confronts his father, Tywin, in the privy and kills him with a crossbow. He also kills Shae, his former lover, who betrayed him during his trial. Tyrion's revenge is complete."
 GOT_Story_Country.346.a: "A son’s revenge."

 GOT_Story_News.346.t: "Tyrion’s Revenge"
 GOT_Story_News.346.d: "Tyrion Lannister has exacted his revenge, killing his father Tywin with a crossbow and his former lover Shae for her betrayal. This shocking act of retribution follows his escape from his death sentence."
 GOT_Story_News.346.a: "The lion’s revenge."

 # Daenerys Chains Her Dragons
 GOT_Story_Country.347.t: "Daenerys Chains Her Dragons"
 GOT_Story_Country.347.d: "After one of her dragons kills a child in Meereen, Daenerys Targaryen is forced to chain her dragons in the catacombs beneath the city. This marks a turning point in Daenerys’s struggle to control her power and the weight of leadership."
 GOT_Story_Country.347.a: "The cost of power."

 GOT_Story_News.347.t: "Daenerys Binds Her Dragons"
 GOT_Story_News.347.d: "Daenerys Targaryen has chained her dragons beneath Meereen after one of them killed a child. This difficult decision highlights the growing responsibility of her rule and the dangers of her unchecked power."
 GOT_Story_News.347.a: "The dragons are bound."

 # Bran Meets the Children of the Forest
 GOT_Story_Country.348.t: "Bran Meets the Children of the Forest"
 GOT_Story_Country.348.d: "Bran Stark and his companions reach the ancient weirwood tree from his visions, where they meet the Children of the Forest. These mysterious beings reveal their role in creating the White Walkers, marking a crucial moment in Bran’s journey toward understanding his destiny."
 GOT_Story_Country.348.a: "The Children of the Forest."

 GOT_Story_News.348.t: "Bran Encounters the Children of the Forest"
 GOT_Story_News.348.d: "Bran Stark has encountered the Children of the Forest at the ancient weirwood tree, where the origins of the White Walkers are revealed. Bran's path to understanding his mystical destiny has just begun."
 GOT_Story_News.348.a: "The ancient beings revealed."

 # Arya Leaves the Hound to Die
 GOT_Story_Country.349.t: "Arya Leaves the Hound to Die"
 GOT_Story_Country.349.d: "In a cold and decisive moment, Arya Stark abandons Sandor ‘The Hound’ Clegane, leaving him to die from his injuries. This act marks Arya’s transformation into a more ruthless character. She then sails for Braavos, setting the stage for a new chapter in her journey."
 GOT_Story_Country.349.a: "The wolf leaves the hound."

 GOT_Story_News.349.t: "Arya Leaves the Hound"
 GOT_Story_News.349.d: "Arya Stark has left Sandor ‘The Hound’ Clegane to die from his wounds. This marks a significant shift in Arya’s character as she embraces a harsher path, now bound for Braavos."
 GOT_Story_News.349.a: "A cold farewell."

 # Jon Snow Faces Stannis Baratheon
 GOT_Story_Country.350.t:0 "Arrival at the Wall"
 GOT_Story_Country.350.d:0 "At the edge of the known world, the fires of the Lord of Light illuminate a new battlefield. Stannis Baratheon has marched north from Dragonstone and reached the Wall, where the Night's Watch stands battered and the Free Folk mass in chaos. Victory at the Wall may be the first step in claiming the Iron Throne—or in holding back a darkness far worse than rebels or pretenders."
 GOT_Story_Country.350.a:0 "The true war begins in the North."


 GOT_Story_News.350.t: "Stannis Baratheon Defeats the Wildlings"
 GOT_Story_News.350.d: "Stannis Baratheon has defeated the wildlings at the Wall, putting an end to their threat. Jon Snow is left to reconcile the challenges of leadership and the changing landscape of the conflict."
 GOT_Story_News.350.a: "The Wall stands firm."

 #Tywin Assassinated
 GOT_Story_Country.351.t: "The Lion Falls"
 GOT_Story_Country.351.d: "Lord Tywin Lannister is dead. Shot with a crossbow by his own son, Tyrion, the news has shattered the foundations of our power. The man who held the realm together through sheer will and ruthless cunning now lies cold in the Sept. His death leaves a dangerous vacuum—one that many will seek to fill. The Red Keep has never felt so uncertain."
 GOT_Story_Country.351.a: "The kingdom trembles."

 #Tywin Assassinated 
 GOT_Story_News.351.t: "Tywin Lannister Assassinated"
 GOT_Story_News.351.d: "A shocking turn of events has shaken Westeros to its core: Tywin Lannister, Lord of Casterly Rock and Hand of the King, has been assassinated. Sources within King’s Landing claim the killer was none other than his own son, Tyrion, who escaped imprisonment and vanished shortly after. The death of the realm’s most powerful man leaves Westeros without its master strategist, and the consequences are already rippling through the noble houses."
 GOT_Story_News.351.a: "A lion slain in his den."

 # # # # # # # # # # # #
 # #SEASON 5 # #
 # # # # # # # # # # # #


 # 401 — Cersei’s Childhood Prophecy
 GOT_Story_Country.401.t: "A Whisper in the Glass Candles"
 GOT_Story_Country.401.d: "All my life I have ruled men’s hearts through fear and desire, yet the memory of that day by the witch’s hut still gnaws at me. Maggy the Frog foretold that I would be Queen, but that a younger, fairer rival would cast me down, and that my three golden children would wear golden shrouds. Some call it childish nonsense; I feel her words tightening about my throat like a noose."
 GOT_Story_Country.401.a: "Prophecies are chains—I shall break them"
 GOT_Story_Country.401.b: "Prophecies are guides—I shall heed them"

 GOT_Story_News.401.t: "Queen Mother Haunted by Old Prophecy"
 GOT_Story_News.401.d: "Whispers from the Red Keep suggest that Queen Mother Cersei Lannister broods upon a witch’s prophecy, fearing a younger queen and the doom of her children. Courtiers wonder whether paranoia will harden her already‑steel resolve or drive her to reckless cruelty."
 GOT_Story_News.401.a: "What menace might a frightened lioness unleash?"

 # 402 — Tyrion & Varys in Pentos
 GOT_Story_Country.402.t: "Ashes, Wine, and Schemes in Pentos"
 GOT_Story_Country.402.d: "I, Tyrion Lannister—kinslayer, fugitive, dwarf—breathe the free air of Essos at last. Varys, ever the spider, proposes we back Daenerys Targaryen, the last dragon. Can a broken man and a spymaster midwife a queen fit for the Iron Throne?"
 GOT_Story_Country.402.a: "A dragon queen is Westeros’s best hope—sail for Meereen!"
 GOT_Story_Country.402.b: "Power first, dragons later—we will court other allies"

 GOT_Story_News.402.t: "Lannister Kinslayer Resurfaces in Essos"
 GOT_Story_News.402.d: "Reliable Pentoshi merchants report that Tyrion Lannister, thought lost after his dramatic escape, is drinking Varys’s wine and plotting fresh intrigues. Rumour links them to Daenerys Targaryen—an alliance that could upend Westeros."
 GOT_Story_News.402.a: "Another player joins the great game."

 # 403 — Daenerys Faces Unrest in Meereen
 GOT_Story_Country.403.t: "Blood on Meereen’s Streets"
 GOT_Story_Country.403.d: "An Unsullied lies dead, the mark of the Harpy carved above him. My freedmen whisper that the masters’ masks walk again, while my dragons rage against their chains. I am Daenerys Stormborn—mother of dragons and of law—but can I rule both the freed and the fearful?"
 GOT_Story_Country.403.a: "Justice must be public and swift"
 GOT_Story_Country.403.b: "Appease the old powers—temporarily"

 GOT_Story_News.403.t: "Violence Erupts in Daenerys’s Meereen"
 GOT_Story_News.403.d: "The insurgent Sons of the Harpy have struck an Unsullied patrol. Queen Daenerys now balances harsh justice with her proclaimed mercy, even as chained dragons roar beneath her pyramid."
 GOT_Story_News.403.a: "Can the breaker of chains master her own city?"

 # 404 — Jon Snow’s Mercy Killing of Mance Rayder
 GOT_Story_Country.404.t: "A King Among Cinders"
 GOT_Story_Country.404.d: "Stannis’s pyre crackled; Mance Rayder refused the kneel. I loosed an arrow and spared him the flames. Brothers at Castle Black whisper I betrayed the Watch to mercy, yet the Free Folk saw honour in my shaft. Which law do I serve—oaths or my own sense of right?"
 GOT_Story_Country.404.a: "Stand by the deed—seek Free Folk trust"
 GOT_Story_Country.404.b: "Publicly atone—appease Black Brothers"

 GOT_Story_News.404.t: "Lord Snow Looses a Controversial Arrow"
 GOT_Story_News.404.d: "Witnesses on the Wall report that Jon Snow ended wildling King Mance Rayder’s fiery execution with a quick arrow. Opinions divide the Night’s Watch: some hail mercy, others mutter treason, while Stannis glowers in silence."
 GOT_Story_News.404.a: "Winter judges all."

 # 405 — Littlefinger & Sansa’s Deceptive Journey
 GOT_Story_Country.405.t: "A Falcon’s Shadow over the Trident"
 GOT_Story_Country.405.d: "I, Petyr Baelish, leave young Lord Robin in honorable keeping and guide Sansa Stark westward under false banners. Few guess the paths I weave: promises to lords of the Riverlands, whispers of a Northern marriage, perhaps even a crown. Every lie is a stepping‑stone."
 GOT_Story_Country.405.a: "Press onward in secrecy"
 GOT_Story_Country.405.b: "Send feelers to rivermen first"

 GOT_Story_News.405.t: "Littlefinger’s Caravan Disappears from the Fingers Road"
 GOT_Story_News.405.d: "Riders in the Vale note that Lord Protector Petyr Baelish and the infamous Sansa Stark have vanished westward, destination unknown. Speculation swirls—from marriage pacts to riverlord conspiracies—while young Lord Robin remains in Royce custody."
 GOT_Story_News.405.a: "Only chaos is a ladder."
 
 # 406 — Arya Arrives at the House of Black and White
 GOT_Story_Country.406.t: "A Girl Stands at the Door"
 GOT_Story_Country.406.d: "Across the Narrow Sea I, Arya Stark of Winterfell—yet clinging to no name—knock upon the black‑and‑white doors of the Faceless Men. The Kindly Man denies me, but when coin and keepsakes sink beneath the harbor, the doors open. To become ‘no one’ I must strip away every shard of Arya."
 GOT_Story_Country.406.a: "Cast off the past—enter the House of Black and White"
 GOT_Story_Country.406.b: "Hold fast to Needle—delay the surrender of self"

 GOT_Story_News.406.t: "Stark Girl Seeks the Many‑Faced God"
 GOT_Story_News.406.d: "Braavosi whispers tell of Arya Stark arriving at the austere House of Black and White. Though first refused, she has reportedly vanished behind its doors after discarding all worldly ties."
 GOT_Story_News.406.a: "A wolf may wear many faces."

 # 407 — Jon Snow Elected 998th Lord Commander
 GOT_Story_Country.407.t: "Choosing the 998th Lord Commander"

 GOT_Story_Country.407.d: "The ravens have flown, the brothers have gathered, and three names echo through the frosty air of the Shieldhall.\n\n- Ser Alliser Thorne — hard as the Wall itself, promising iron discipline and swift punishment.\n\n- Lord Denys Mallister — seasoned commander of the Shadow Tower, offering calm judgment and long‑won experience.\n\n- Jon Snow — the Bastard of Winterfell, whose courage at the Fist and vision beyond the Wall inspire both old hands and green boys alike.  \n\nOne man must bear the burden of the black and guide the Night’s Watch through the darkness ahead. The voting begins…"

 GOT_Story_Country.407.a: "Elect Ser Alliser Thorne"
 GOT_Story_Country.407.b: "Elect Lord Denys Mallister"
 GOT_Story_Country.407.c: "Elect Jon Snow"

 GOT_Story_News.407.t: "Castle Black Names a New Lord Commander"
 GOT_Story_News.407.d: "In a close ballot broken by venerable Maester Aemon, Bastard‑born Jon Snow was chosen 998th Lord Commander of the Night’s Watch, quashing Stannis Baratheon’s offer of Stark legitimacy."
 GOT_Story_News.407.a: "The Wall has its new shield."

 # 408 — Daenerys Executes Mossador
 GOT_Story_Country.408.t: "Law Before Mercy"
 GOT_Story_Country.408.d: "Mossador, once a chained slave, slew a Harpy captive without my leave. To prove that law binds all, I order his public execution. The freedmen howl betrayal, stones fly, blood runs. Rule of law or love of the people—can I keep both?"
 GOT_Story_Country.408.a: "Stand firm—justice is blind"
 GOT_Story_Country.408.b: "Temper justice—pardon the zealous"

 GOT_Story_News.408.t: "Riots Erupt after Daenerys Executes Freedman"
 GOT_Story_News.408.d: "In Meereen, Queen Daenerys publicly beheaded Mossador—a freed slave turned vigilante—sparking riots that pitted freedmen against Unsullied. Observers question whether law or loyalty will hold the Dragon Queen’s fragile realm."
 GOT_Story_News.408.a: "Fire cannot kill a dragon—but mobs might."

 # 409 — Brienne Encounters Sansa Stark
 GOT_Story_Country.409.t: "Oaths Unanswered on the Trident Road"
 GOT_Story_Country.409.d: "I, Brienne of Tarth, kneel before Sansa Stark, pledging the sword once sworn to her mother. Petyr Baelish’s silver tongue turns her away. Steel flashes, pursuit erupts; Podrick and I escape, vowing to guard the girl from shadows."
 GOT_Story_Country.409.a: "Shadow her steps—protection at a distance"
 GOT_Story_Country.409.b: "Abide her refusal—seek other Stark kin"

 GOT_Story_News.409.t: "The Maid of Tarth Crosses Blades with Baelish’s Men"
 GOT_Story_News.409.d: "Travelers speak of Brienne of Tarth confronting Lord Baelish’s escort and Sansa Stark at an inn. After a brief clash Brienne fled, but reports suggest she now trails the Stark heiress unseen."
 GOT_Story_News.409.a: "Knighthood never rests."

 # 410 — Jaime Prepares to Retrieve Myrcella
 GOT_Story_Country.410.t: "A Viper’s Warning"
 GOT_Story_Country.410.d: "A viper’s jaws delivered Myrcella’s necklace to the Red Keep. Cersei rages; I vow to sail south, stealth and speed, to bring our daughter home. For this I enlist Ser Bronn—a sellsword’s blade for a father’s quest."
 GOT_Story_Country.410.a: "Set sail for Dorne with Bronn"
 GOT_Story_Country.410.b: "Demand a royal envoy—pressure Doran Martell diplomatically"

 GOT_Story_News.410.t: "Kingslayer Plots Quiet Voyage South"
 GOT_Story_News.410.d: "Court murmurs hint that Ser Jaime Lannister will depart King’s Landing to safeguard Princess Myrcella in Dorne, accompanied by the infamous sellsword Bronn. The Dornish sands may soon taste Lannister steel."
 GOT_Story_News.410.a: "The lion goes to the snake’s den."
 
 # 411 — Sansa Stark Betrothed to Ramsay Bolton
 GOT_Story_Country.411.t: "A Wedding Cloaked in Snow and Blood"
 GOT_Story_Country.411.d: "Petyr Baelish guides me through Winterfell’s gates, promising vengeance for my family. Yet he offers my hand to Ramsay Bolton, flaying‑blade heir and Warden of the North in all but name. To reclaim my home I must bind myself to the very house that betrayed it."
 GOT_Story_Country.411.a: "Accept the betrothal—endure for the North"
 GOT_Story_Country.411.b: "Refuse—seek another path to vengeance"

 GOT_Story_News.411.t: "Stark–Bolton Alliance Sealed by Betrothal"
 GOT_Story_News.411.d: "Ravens confirm that Sansa Stark is pledged to Ramsay Bolton. The match, brokered by Lord Baelish, unites Winterfell’s conquerors with its rightful heirs—though northern lords whisper of knives behind smiles."
 GOT_Story_News.411.a: "The North remembers—yet submits."

 # 412 — Jon Snow Executes Janos Slynt
 GOT_Story_Country.412.t: "The Honor of the Sword"
 GOT_Story_Country.412.d: "Ser Janos Slynt defied my command and spat upon my rule. Before the Wall’s brothers I drew Longclaw and struck off his craven head. Leadership demands steel, not words; justice must be seen."
 GOT_Story_Country.412.a: "Authority affirmed"
 GOT_Story_Country.412.b: "Temper justice"

 GOT_Story_News.412.t: "Lord Commander Snow Shows No Mercy"
 GOT_Story_News.412.d: "Castle Black rang with the stroke of Longclaw as Jon Snow executed Janos Slynt for insubordination. Some brothers hail newfound order; others mutter that the boy with the wolf’s blood grows perilously stern."
 GOT_Story_News.412.a: "The Wall stands under hard rule."

 # 413 — Tommen Marries Margaery Tyrell
 GOT_Story_Country.413.t: "A Rose Crowns the Lion"
 GOT_Story_Country.413.d: "In the sept’s sweet incense I wed Queen Margaery. Her smiles soothe my doubts, her words guide my throne. Mother watches, tight‑lipped—a rose now twines about the crown."
 GOT_Story_Country.413.a: "Embrace Margaery’s counsel—lean on the Tyrells"
 GOT_Story_Country.413.b: "Seek Mother’s guidance—curb the Tyrell influence"

 GOT_Story_News.413.t: "Royal Wedding Unites Crown and Reach"
 GOT_Story_News.413.d: "King Tommen Baratheon and Lady Margaery Tyrell exchanged vows amid splendor. The Tyrell alliance blooms anew, yet observers note Queen Mother Cersei’s strained smile as the young queen gains the king’s ear."
 GOT_Story_News.413.a: "Spring comes to King’s Landing."

 # 414 — Cersei Aligns with the High Sparrow
 GOT_Story_Country.414.t:0 "The Most Devout's Successor"
 GOT_Story_Country.414.d:0 "The death of the previous High Septon has left a vacuum in the Great Sept of Baelor, and the smallfolk have chosen their champion. A barefoot holy man known simply as the 'High Sparrow' has marched into the capital, backed by thousands of religious zealots. The Most Devout are terrified of him, but the people worship him. I see an opportunity here. If I use the Crown's authority to name him the new High Septon, I can channel the fanaticism of the lower classes to bypass the Tyrells and legitimize my regency. If I deny him, I preserve the traditional hierarchy, but I risk turning the entire city into a powder keg."
 GOT_Story_Country.414.a:0 "Elevate the High Sparrow."
 GOT_Story_Country.414.b:0 "Reject the beggar priest."

 GOT_Story_News.414.t: "Queen Regent Courts the High Sparrow"
 GOT_Story_News.414.d: "Crown agents have granted the devout High Sparrow unprecedented audience and rumored arms. Many wonder whether Cersei means to pit piety against flowers in the game for King Tommen’s soul."
 GOT_Story_News.414.a: "When lions pray, sparrows gather."

 # 415 — Arya Begins Training with the Faceless Men
 GOT_Story_Country.415.t: "A Girl Sweeps the Halls of Death"
 GOT_Story_Country.415.d: "Needle lies hidden in stonework; Arya’s name tastes of salt upon my tongue. The Kindly Man sets me to scrub corpses and recite the creed of the Many‑Faced God. Each lash of water on marble scours the wolf away."
 GOT_Story_Country.415.a: "Abandon identity—embrace the Faceless path"
 GOT_Story_Country.415.b: "Cling secretly to Arya—keep Needle close"

 GOT_Story_News.415.t: "Braavos Welcomes a Novice of No Name"
 GOT_Story_News.415.d: "Quiet eyes in Braavos note a Stark girl sweeping the silent halls of the House of Black and White. Some say the path to many faces begins with losing one’s own."
 GOT_Story_News.415.a: "Valar Morghulis."
 
 # 416 — Sons of the Harpy Ambush in Meereen
 GOT_Story_Country.416.t: "Blood in the Alley of Bones"
 GOT_Story_Country.416.d: "Masked Harpies struck from shadow, cutting down my Unsullied. Ser Barristan Selmy—true knight of Westeros—fell beneath myriad blades, and Grey Worm clings to life. The city howls for vengeance; my heart burns with grief and rage."
 GOT_Story_Country.416.a: "Answer with fire—crush the Sons of the Harpy"
 GOT_Story_Country.416.b: "Restrain wrath—mourn and seek allies among the freed"

 GOT_Story_News.416.t: "Legendary Knight Falls in Meereen Ambush"
 GOT_Story_News.416.d: "Ser Barristan the Bold perished defending Unsullied against the insurgent Sons of the Harpy. Queen Daenerys’s rule faces its severest test as Meereen’s streets run red."
 GOT_Story_News.416.a: "The Harpy’s claws draw blood."

 # 417 — Cersei Empowers the Faith Militant
 GOT_Story_Country.417.t:0 "Rearming the Faith"
 GOT_Story_Country.417.d:0 "The High Sparrow is demanding a dangerous concession: the formal reinstatement of the Faith Militant. They want holy laws enforced by holy blades. My council warns me that giving weapons to religious fanatics threatens the Crown's absolute monopoly on force. However, the Tyrell influence in the capital is growing suffocating. If I sign this decree, the newly christened 'Poor Fellows' and 'Warrior's Sons' will act as my personal cudgel to purge the court and drag Ser Loras Tyrell into a dungeon for his sins. I must choose whether to unleash this holy fire to protect my regency, or deny them and keep the swords out of their hands."
 GOT_Story_Country.417.a:0 "Sign the decree."
 GOT_Story_Country.417.b:0 "Deny the request."

 GOT_Story_News.417.t: "Faith Militant Marches Again"
 GOT_Story_News.417.d: "King’s Landing gasps as armed zealots parade through the streets, arresting Ser Loras Tyrell under Queen Regent Cersei’s sanction. Alliance between lion and rose wilts under seven‑pointed stars."
 GOT_Story_News.417.a: "When faith is armed, crowns tremble."

 # 418 — Jaime and Bronn’s Mission to Dorne
 GOT_Story_Country.418.t: "Under Dornish Sky and Silence"
 GOT_Story_Country.418.d: "By night we land upon Dornish sand—Bronn at my side—intent on rescuing Myrcella. Spears of the Sand Snakes hunt us; every palm frond may hide a blade."
 GOT_Story_Country.418.a: "Advance stealthily toward Sunspear"
 GOT_Story_Country.418.b: "Seek a parley with Prince Doran—risk delay"

 GOT_Story_News.418.t: "Lannister Steel Glints in Dorne"
 GOT_Story_News.418.d: "Rumours from the Boneway speak of golden lions prowling Dorne. Some say the Kingslayer himself leads a covert band to spirit Princess Myrcella away, stoking Martell ire."
 GOT_Story_News.418.a: "The viper’s sands grow restless."

 # 419 — Jorah Mormont Captures Tyrion Lannister
 GOT_Story_Country.419.t: "A Gift for the Dragon Queen"
 GOT_Story_Country.419.d: "Chains bite my wrists—the disgraced knight Jorah Mormont hauls me toward Meereen, hoping my clever tongue will buy back his queen’s favor. I, Tyrion Lannister, am once more a prize."
 GOT_Story_Country.419.a: "Plot escape—sow doubt in Jorah’s mind"
 GOT_Story_Country.419.b: "Bide time—learn all you can about Daenerys"

 GOT_Story_News.419.t: "Lannister Captive Bound for Meereen"
 GOT_Story_News.419.d: "Merchants along the Rhoyne whisper that Tyrion Lannister travels in shackles, seized by exiled knight Jorah Mormont. Their course bends toward the Dragon Queen’s city."
 GOT_Story_News.419.a: "Even lions can be caged."

 # 420 — Sansa Visits the Crypts of Winterfell
 GOT_Story_Country.420.t: "Echoes beneath the Stone Kings"
 GOT_Story_Country.420.d: "I light candles before my father’s effigy; cold stone listens to my vow. Lord Baelish departs for King’s Landing, leaving me in the Bolton den. Alone among ghosts and flayed banners, I must survive…and strike."
 GOT_Story_Country.420.a: "Endure and observe—wait for a chance to act"
 GOT_Story_Country.420.b: "Seek northern allies in secret—risk Bolton wrath"

 GOT_Story_News.420.t: "Lady Stark Walks Winterfell’s Crypts"
 GOT_Story_News.420.d: "Smallfolk report seeing Sansa Stark praying by her ancestors’ tombs while Lord Baelish rides south. With Ramsay Bolton now her betrothed, the North braces for storms above and below ground."
 GOT_Story_News.420.a: "The past watches the living."
 
 # 421 — Jon Snow Seeks Alliance with the Wildlings
 GOT_Story_Country.421.t:0 "The Lord Commander's Difficult Decision"

 GOT_Story_Country.421.d:0 "[NWA.GetLeader], Lord Commander of the Night’s Watch, must decide whether to open the gates to the Free Folk and forge an alliance against the growing threat beyond the Wall, or to keep the Watch united by barring the gates and maintaining the old order. Both choices carry grave risks and heavy consequences."

 GOT_Story_Country.421.a:0 "Forge the alliance—open the gates to the Wildlings"

 GOT_Story_Country.421.b:0 "Abandon the plan—keep the Watch united"


 GOT_Story_News.421.t: "Lord Commander Courts the Free Folk"
 GOT_Story_News.421.d: "Reports from Castle Black claim [NWA.GetLeader] seeks peace with the Wildlings, promising them lands below the Wall in return for swords against the icy dead. Many black cloaks mutter revolt at such audacity."
 GOT_Story_News.421.a: "Winter forges strange pacts."

 # 422 — Daenerys Executes a Noble and Announces Marriage
 GOT_Story_Country.422.t: "Fire, Blood, and Betrothal"
 GOT_Story_Country.422.d: "To answer Barristan’s murder I had a noble devoured by my dragons; the rest rot in cells. Yet to bind Meereen I reopen the fighting pits and pledge myself to Hizdahr zo Loraq. Fear and union—two reins on one city."
 GOT_Story_Country.422.a: "Rule by terror and tradition—proceed with execution and marriage"
 GOT_Story_Country.422.b: "Stay the dragons—seek softer reconciliation"

 GOT_Story_News.422.t: "Dragon Queen Feeds Lord to Flame, Plans Royal Wedding"
 GOT_Story_News.422.d: "Meereen reels as Daenerys burned a noble alive, then stunned all by announcing her engagement to Hizdahr zo Loraq and the reopening of the famed fighting pits. Some call her mad, others masterful."
 GOT_Story_News.422.a: "Where dragons dance, cities tremble."

 # 423 — Jorah Contracts Greyscale in Valyria
 GOT_Story_Country.423.t: "Stone Men of Valyria"
 GOT_Story_Country.423.d: "Grey ruins rose; Stone Men swarmed. I dragged the dwarf to safety—but felt a burning scrape. Greyscale creeps beneath my sleeve; time and flesh now betray me as surely as exile."
 GOT_Story_Country.423.a: "Hide the infection—press on to Meereen"
 GOT_Story_Country.423.b: "Confess to Tyrion—seek a cure or mercy"

 GOT_Story_News.423.t: "Exile Knight Rumoured Touched by Greyscale"
 GOT_Story_News.423.d: "Sailors whisper that Ser Jorah Mormont escaped Stone Men in Valyria but not their curse. If true, a man of stone approaches the Dragon Queen."
 GOT_Story_News.423.a: "Stone spreads silently."

 # 424 — Stannis Marches Toward Winterfell
 GOT_Story_Country.424.t: "South by Snow and Flame"
 GOT_Story_Country.424.d: "With iron discipline I march from the Wall to seize Winterfell before the true winter comes. Shireen rides with us; Melisandre’s fires burn bright. Samwell Tarly gifts knowledge: dragonglass slays White Walkers—another weapon for a king."
 GOT_Story_Country.424.a: "Advance despite storms—time is victory"
 GOT_Story_Country.424.b: "Delay for supplies—risk Bolton entrenchment"

 GOT_Story_News.424.t: "King Stannis Advances on the North"
 GOT_Story_News.424.d: "Columns of Baratheon banners move across the snow, bound for Winterfell. The one‑true‑king wagers his fate against Boltons and blizzards alike."
 GOT_Story_News.424.a: "The king who cares marches on."

 # 425 — Sansa Learns of Northern Allies
 GOT_Story_Country.425.t: "A Light in the Broken Tower"
 GOT_Story_Country.425.d: "A hush‑voiced maid presses my hand: if I need aid, light a candle in the Broken Tower’s highest window. Hope flickers—proof the North remembers."
 GOT_Story_Country.425.a: "Keep the secret—wait for the moment"
 GOT_Story_Country.425.b: "Act quickly—signal the loyalists tonight"

 GOT_Story_News.425.t: "Whispers of Resistance Stir in Winterfell"
 GOT_Story_News.425.d: "Rumour spreads that loyal Northerners still scheme within Bolton‑held Winterfell, drawn to Sansa Stark’s presence. One candle may ignite rebellion."
 GOT_Story_News.425.a: "Old wolves yet howl."

 # 426 — Arya Advances in Her Training
 GOT_Story_Country.426.t: "A Girl Plays the Game of Faces"
 GOT_Story_Country.426.d: "Lies taste true upon my tongue; the sick girl drinks the gift of mercy and smiles into death. The Kindly Man nods—one step closer to no one, yet Needle sleeps beneath the stone."
 GOT_Story_Country.426.a: "Embrace the Faceless creed—surrender Arya"
 GOT_Story_Country.426.b: "Cling to the wolf—hide your name within"

 GOT_Story_News.426.t: "Whispers of a Stark Disappearing in Braavos"
 GOT_Story_News.426.d: "Dockside tongues say the wolf‑girl now speaks with many faces inside the House of Black and White. Some vanish to the Many‑Faced God, others emerge reborn."
 GOT_Story_News.426.a: "Valar Dohaeris."

 # 427 — Tyrion and Jorah Captured by Slavers
 GOT_Story_Country.427.t: "Chains on Sand and Sea"
 GOT_Story_Country.427.d: "Iron bites wrists again—slavers weigh my worth. Jorah boasts of swordcraft for Meereen’s pits; I, Tyrion, sell my silver tongue and dwarf’s novelty. For now, we live."
 GOT_Story_Country.427.a: "Plot a clever escape en route"
 GOT_Story_Country.427.b: "Endure captivity—reach the fighting pits"

 GOT_Story_News.427.t: "Lannister and Exile Knight Fall to Slavers"
 GOT_Story_News.427.d: "Caravan gossip claims Ser Jorah Mormont and Tyrion Lannister march in chains toward Meereen, prized for sword and spectacle alike."
 GOT_Story_News.427.a: "All men must serve—some in irons."

 # 428 — Jaime and Bronn Captured in Dorne
 GOT_Story_Country.428.t: "Sands Clash in the Water Gardens"
 GOT_Story_Country.428.d: "We slipped into the Water Gardens for Myrcella, but Sand Snakes struck. Steel rang until Dornish guards bound us all. Now cells and dungeons decide the game."
 GOT_Story_Country.428.a: "Negotiate with Prince Doran—appeal to honor"
 GOT_Story_Country.428.b: "Plot jailbreak with Bronn—risk Martell wrath"

 GOT_Story_News.428.t: "Sand Snakes and Lions Both Imprisoned"
 GOT_Story_News.428.d: "Sunspear’s dungeons now host Jaime Lannister, Bronn, and the Sand Snakes after a brawl in the Water Gardens. Dorne smolders beneath its calm prince."
 GOT_Story_News.428.a: "Unbowed, unbent, unbroken."

 # 429 — Cersei Strikes at the Tyrells
 GOT_Story_Country.429.t: "The Faith's Fist Closes"
 GOT_Story_Country.429.d: "Queen Margaery and Ser Loras Tyrell have been seized by the Faith Militant. Accused of perjury and depravity, the siblings now await the judgment of the High Sparrow. The Iron Throne can only watch as the Faith tightens its grip upon King's Landing."
 GOT_Story_Country.429.a: "The matter now rests with the Faith."

 GOT_Story_News.429.t: "Tyrell Heirs Imprisoned by Faith Militant"
 GOT_Story_News.429.d: "King’s Landing gasps as both Ser Loras and Queen Margaery are locked in sept cells. Power tilts toward the lion, yet sparrows hold the keys."
 GOT_Story_News.429.a: "Piety proves sharp."

 # 430 — Sansa’s Wedding Night
 GOT_Story_Country.430.t: "The Wolf and the Flayed Man"
 GOT_Story_Country.430.d: "Winterfell’s godswood bore witness: vows to Ramsay Bolton. Night brings screams behind locked doors; Theon’s eyes mirror my own terror. I am Sansa Stark, yet pain brands me Bolton bride."
 GOT_Story_Country.430.a: "Endure in silence—gather strength for revenge"
 GOT_Story_Country.430.b: "Seek immediate aid—light the candle"

 GOT_Story_News.430.t: "Sansa Stark Weds Ramsay Bolton"
 GOT_Story_News.430.d: "The North watches uneasily as Sansa Stark is wed to Ramsay Bolton at Winterfell. The marriage binds the Boltons to the Stark name, but few believe it will bring peace to a land already scarred by war."
 GOT_Story_News.430.a: "The North remembers."
 
 # 431 — Maester Aemon Passes Away
 GOT_Story_Country.431.t: "The Last Targaryen at the Wall"
 GOT_Story_Country.431.d: "Maester Aemon—blind, gentle, and wise—slipped quietly into the night. His counsel steadied the Watch for decades; now only echoes remain in the rookery."
 GOT_Story_Country.431.a: "Hold a solemn funeral—honor his legacy"

 GOT_Story_News.431.t: "Maester Aemon, Brother of the Watch, Dies"
 GOT_Story_News.431.d: "Castle Black tolls its bells for Aemon Targaryen, great‑uncle to kings long dead. With his passing, one of the Wall’s brightest lights is extinguished."
 GOT_Story_News.431.a: "The realm grows colder."

 # 432 — Sam Defends Gilly
 GOT_Story_Country.432.t: "Ghost’s Fangs in the Dark"
 GOT_Story_Country.432.d: "Two brothers sought to harm Gilly. I raised steel but fell; Ghost’s white fury scattered them. Later, by candle’s warmth, Gilly’s hand found mine—courage born of love."
 GOT_Story_Country.432.a: "Report the attackers—demand justice"
 GOT_Story_Country.432.b: "Stay silent—avoid further strife"

 GOT_Story_News.432.t: "Direwolf Defends Crannog Girl at the Wall"
 GOT_Story_News.432.d: "Whispers from Castle Black speak of the Lord Commander’s direwolf guarding Samwell Tarly and Gilly against unruly brothers—tension simmers within the Watch."
 GOT_Story_News.432.a: "Even monsters fear the direwolf."

 # 433 — Stannis Rejects Melisandre’s Proposal
 GOT_Story_Country.433.t: "A Father’s Line in the Snow"
 GOT_Story_Country.433.d: "Melisandre’s ruby gleamed as she urged Shireen’s sacrifice for victory’s fire. My blood froze; I forbade the horror. Yet storms howl, supplies dwindle—doubt creeps like frost."
 GOT_Story_Country.433.a: "Stand firm—protect Shireen at all costs"
 GOT_Story_Country.433.b: "Reconsider if despair deepens—keep the option"

 GOT_Story_News.433.t: "Rumour: King Stannis Spurns Red Sacrifice"
 GOT_Story_News.433.d: "Camps across the snow swear the Red Woman pressed for royal blood, and the iron king refused. Morale wavers as blizzards trap the host."
 GOT_Story_News.433.a: "The Lord of Light’s price remains unpaid."

 # 434 — Cersei Is Arrested
 GOT_Story_Country.434.t: "The Queen Regent in Chains"
 GOT_Story_Country.434.d: "My own Faith Militant drags me to the black cells—Lancel’s tongue a dagger at my back. The Sparrows peck at lion flesh; I must endure and wait for weakness to show."
 GOT_Story_Country.434.a: "Scheme within the cell—bribe or coerce sparrows"
 GOT_Story_Country.434.b: "Confess and seek absolution—plot a subtler return"

 GOT_Story_News.434.t: "Cersei Lannister Imprisoned by the Faith"
 GOT_Story_News.434.d: "Gasps echo through King’s Landing as the once‑regent Queen is seized on charges of adultery and incest. Power tilts; the Iron Throne stands exposed."
 GOT_Story_News.434.a: "When the mighty fall, vultures circle."

 # 435 — Tyrion Meets Daenerys
 GOT_Story_Country.435.t: "A Lion Before the Dragon"
 GOT_Story_Country.435.d: "Bronze bells ring over the pit; Jorah’s helm drops, and he presents me—Tyrion Lannister—to Queen Daenerys. I bow, a gift wrapped in chains, mouth ready with counsel sharper than any sword."
 GOT_Story_Country.435.a: "Offer my counsel—seek a place at her side"
 GOT_Story_Country.435.b: "Test her temper—wager for freedom first"

 GOT_Story_News.435.t: "Dragon Queen Receives the Imp"
 GOT_Story_News.435.d: "Spectators in Meereen gasped as exiled Ser Jorah unveiled Tyrion Lannister to Daenerys. A union of dragon and dwarf could shake the very foundations of Westeros."
 GOT_Story_News.435.a: "New players sit at the queen’s table."
 
 # 436 — The Battle of Hardhome
 GOT_Story_Country.436.t: "The Dead Knock at Hardhome"
 GOT_Story_Country.436.d: "While parleying with the Free Folk, ice and shadow swept the camp. I felled a White Walker with Longclaw’s Valyrian steel, yet the Night King raised every corpse in mockery of life. We escaped on frigid waves, horror staring from the shore."
 GOT_Story_Country.436.a: "Spread word—Valyrian steel and dragonglass are our salvation"
 GOT_Story_Country.436.b: "Bury the truth—avoid panic among the realms of men"

 GOT_Story_News.436.t: "Night King Unleashes Death at Hardhome"
 GOT_Story_News.436.d: "Few survivors whisper of thousands of risen Wildlings and a lone sword of dark fire that shattered a Walker. Winter’s true enemy has shown his face."
 GOT_Story_News.436.a: "The long night draws nearer."

 # 437 — Tyrion Accepted as Daenerys’s Advisor
 GOT_Story_Country.437.t: "A Council of Fire and Wit"
 GOT_Story_Country.437.d: "My tongue wins where others’ blades fail. I counsel Daenerys to banish Jorah once more and plot the politics of Meereen and beyond. The Dragon Queen names me adviser—lion and dragon now share strategy."
 GOT_Story_Country.437.a: "Serve loyally—shape her conquest of Westeros"
 GOT_Story_Country.437.b: "Maintain cautious distance—secure personal leverage first"

 GOT_Story_News.437.t: "Imp Rises to Dragon Queen’s Right Hand"
 GOT_Story_News.437.d: "Observers in Meereen report Tyrion Lannister seated beside Daenerys in council, Jorah Mormont exiled anew. A powerful alliance for the wars to come."
 GOT_Story_News.437.a: "Fire meets guile."

 # 438 — Cersei’s Imprisonment Continues
 GOT_Story_Country.438.t: "Dry Bread and Dark Schemes"
 GOT_Story_Country.438.d: "Filth and thirst gnaw at me. Qyburn brings tidings: Tommen wastes away, Kevan rules the council, and ‘the work continues.’ I cling to that promise of monstrous salvation."
 GOT_Story_Country.438.a: "Endure and await Qyburn’s secret weapon"
 GOT_Story_Country.438.b: "Confess to the High Sparrow—seek release through penance"

 GOT_Story_News.438.t: "Queen Mother Languishes in Sept Cell"
 GOT_Story_News.438.d: "Cersei Lannister’s captivity drags on; rumors swirl of alchemical experiments in the Red Keep and a king paralyzed by grief."
 GOT_Story_News.438.a: "A lion alone in a cage is still dangerous."

 # 439 — Arya’s First Assassination Mission
 GOT_Story_Country.439.t: "A Girl Carries Poison"
 GOT_Story_Country.439.d: "As Lana the oyster girl I must slip the gift into a liar’s cup—my first kill for the Many‑Faced God. A new face awaits if I succeed."
 GOT_Story_Country.439.a: "Complete the mission—prove no one walks Braavos"
 GOT_Story_Country.439.b: "Spare the mark—cling to personal justice over faceless duty"

 GOT_Story_News.439.t: "Faceless Rumours Stir on the Docks of Braavos"
 GOT_Story_News.439.d: "Ship‑captains mutter of an insurance‑cheat fearing unseen assassins. The House of Black and White sells mercy to all—at a price."
 GOT_Story_News.439.a: "Coin buys many faces."

 # 440 — Sansa Confronts Theon
 GOT_Story_Country.440.t: "Truth Among the Ashes"
 GOT_Story_Country.440.d: "Theon’s trembling words reveal my brothers live—the burned bodies were nameless farm boys. Hope flickers like a candle in Winterfell’s chill; Ramsay’s grip feels less absolute."
 GOT_Story_Country.440.a: "Nurture hope—plot escape and northern uprising"
 GOT_Story_Country.440.b: "Despair of allies—focus solely on personal survival"

 GOT_Story_News.440.t: "Old Secrets Surface in Winterfell"
 GOT_Story_News.440.d: "Quiet rumours say the true fates of Bran and Rickon Stark were never sealed by flame. If wolves yet breathe, the North may rise once more."
 GOT_Story_News.440.a: "The North remembers."
 
 # 441 — Stannis Sacrifices Shireen
 GOT_Story_Country.441.t: "The Fires of Desperation"
 GOT_Story_Country.441.d: "Snow buries my camp, men desert, horses die. Melisandre whispers of king’s blood and victory. I order the pyre; Shireen’s screams echo through the pines as the Lord of Light drinks her life. Ash settles on a broken army and a broken father."
 GOT_Story_Country.441.a: "Steel the host with fanatic resolve—press on to Winterfell"
 GOT_Story_Country.441.b: "Mourning overwhelms—discipline and morale plummet"

 GOT_Story_News.441.t: "King Stannis Burns His Heir"
 GOT_Story_News.441.d: "Fleeing soldiers speak of princess‑bones cracking in flame at the Baratheon camp. Some call it divine sacrifice, others damnable madness—the snow‑king marches on regardless."
 GOT_Story_News.441.a: "Fire wins battles—or loses souls."

 # 442 — Daenerys Escapes on Drogon
 GOT_Story_Country.442.t: "Sky of Ash and Flame"
 GOT_Story_Country.442.d: "The Sons of the Harpy slaughter in the fighting pit; my blood spills with theirs until Drogon descends in fire. I climb his scorched scales and soar above Meereen—queen at last upon a dragon’s back."
 GOT_Story_Country.442.a: "Fly to distant sands—regroup far from Meereen"
 GOT_Story_Country.442.b: "Circle back—return with dragonfire to pacify the city"

 GOT_Story_News.442.t: "Dragon Queen Takes Flight"
 GOT_Story_News.442.d: "Witnesses gape as Daenerys rode Drogon into the red sky, leaving Meereen in chaos. A living dragon carries Westeros’s most dangerous claimant."
 GOT_Story_News.442.a: "The world remembers dragons."

 # 443 — Arya Spots Meryn Trant
 GOT_Story_Country.443.t: "A Name from the List"
 GOT_Story_Country.443.d: "While stalking the Thin Man, I see Ser Meryn Trant—killer of Syrio—step ashore. The Many‑Faced God demands the insurance thief, yet my heart demands Trant’s blood."
 GOT_Story_Country.443.a: "Abandon the contract—pursue personal vengeance"
 GOT_Story_Country.443.b: "Stay the course—complete the Faceless assignment first"

 GOT_Story_News.443.t: "Kingsguard Knight Sighted in Braavos"
 GOT_Story_News.443.d: "Ser Meryn Trant, sworn shield of King’s Landing, has been seen frequenting Braavosi brothels. Unseen eyes reportedly follow his every step."
 GOT_Story_News.443.a: "Some debts are paid in silence."

 # 444 — Jon Returns with the Free Folk
 GOT_Story_Country.444.t: "The Gate Opens to Wildlings"
 GOT_Story_Country.444.d: "Ragged survivors of Hardhome file through Castle Black as brothers glare. I remind them that dead men march behind the snow. Unity or extinction—those are the Watch’s choices."
 GOT_Story_Country.444.a: "Integrate the Free Folk—prepare joint defenses"
 GOT_Story_Country.444.b: "Separate camps—placate wary brothers, slow cooperation"

 GOT_Story_News.444.t: "Wildlings Enter the Wall’s Shadow"
 GOT_Story_News.444.d: "Columns of Free Folk now shelter south of the Wall under Lord Commander Snow’s orders. Some black cloaks whisper ‘traitor’; others see survival in numbers."
 GOT_Story_News.444.a: "The real enemy waits in the cold."

 # 445 — Jaime’s Accord with Dorne
 GOT_Story_Country.445.t: "Peace in Sunspear’s Hall"
 GOT_Story_Country.445.d: "Prince Doran agrees: Myrcella returns to King’s Landing with her betrothed Trystane, who gains a seat on the Small Council. Bronn walks free, bruised but breathing. A fragile peace, but peace nonetheless."
 GOT_Story_Country.445.a: "Honor the pact—sail at once for home"
 GOT_Story_Country.445.b: "Plot contingencies—prepare for Sand Snake treachery"

 GOT_Story_News.445.t: "Lions and Suns Strike a Deal"
 GOT_Story_News.445.d: "Dorne and the Iron Throne reach accord: Princess Myrcella departs with Ser Jaime and Prince Trystane. Yet Dornish eyes watch every sail on the horizon."
 GOT_Story_News.445.a: "The water gardens fall still—for now."
 
 GOT_Story_Country.446.t:0 "Betrayed Within the Walls"
 GOT_Story_Country.446.d:0 "Brother after brother turned on their own—whispers of treason echo through Castle Black as steel finds flesh. The fate of the Wall now hangs on divided loyalty, where traitors and defenders clash amid the snow and shadows."
 GOT_Story_Country.446.a:0 "Support the loyal Lord Commander"
 GOT_Story_Country.446.b:0 "Support the rebellious faction"


 GOT_Story_News.446.t: "Lord Commander Snow Falls to Treachery"
 GOT_Story_News.446.d: "Ravens speak of mutiny at Castle Black. Jon Snow, friend of Free Folk, now lies in growing crimson. Whether the Wall stands united is uncertain."
 GOT_Story_News.446.a: "Winter shows no mercy."

 # 447 — Cersei’s Walk of Atonement
 GOT_Story_Country.447.t: "Shame, Shame, Shame"
 GOT_Story_Country.447.d: "Stripped of silk and pride, I walked the cobblestones while filth and curses rained down. I reach the Red Keep broken, but Ser Robert Strong’s silent shadow waits—vengeance will follow."
 GOT_Story_Country.447.a: "Plot retribution—rebuild power through fear"
 GOT_Story_Country.447.b: "Seek alliances—mend fences to regain control"

 GOT_Story_News.447.t: "Queen Mother Paraded Nude Through King’s Landing"
 GOT_Story_News.447.d: "The realm gasped as Cersei Lannister trudged barefoot from the Great Sept to the Red Keep amid jeers. Some see justice served; others see a lion wounded and dangerous."
 GOT_Story_News.447.a: "The bells still echo."

 # 448 — Stannis Defeated and Slain
 # Death of Stannis
 GOT_Story_Country.448.t: "The Burning Sun Sets"
 GOT_Story_Country.448.d: "Dark wings bring ruinous news from the frozen North. The king is dead outside Winterfell, his army broken by Bolton steel. Lady Selyse has hanged herself, young Shireen was given to the flames, and the Red Woman has fled. The royal line of House Baratheon of Dragonstone is extinguished in the ice. With Stannis fallen, the salt and stone of our island stand isolated against a hostile realm."
 GOT_Story_Country.448.a: "We bend the knee."
 GOT_Story_Country.448.b: "The fight continues!"

 GOT_Story_News.448.t: "Baratheon Claim Extinguished Outside Winterfell"
 GOT_Story_News.448.d: "Ravens fly across Westeros bearing grim tidings from the frozen North. The self-proclaimed King Stannis Baratheon, who marched through blinding blizzards to claim Winterfell, has met his end beneath its walls. His host was shattered by the armored heavy horse of House Bolton, his foreign priestess has fled, and the last true son of Lord Steffon lies dead in the snow. With his fall, the fiery heart of Dragonstone flickers out, leaving the realm to reckon with the iron grip of the Dreadfort."
 GOT_Story_News.448.a: "Ours is the Fury—no more."

 # 449 — Sansa and Theon Escape
 GOT_Story_Country.449.t: "Leap Into the Unknown"
 GOT_Story_Country.449.d: "Hand in hand, Theon and I hurled ourselves from Winterfell’s walls into the white void below. Freedom or death waits beyond the drifts—but hope is sweeter than any chain."
 GOT_Story_Country.449.a: "Head for the Wolfswood—seek northern allies"
 GOT_Story_Country.449.b: "Press south—aim for the King’s Road and the Riverlands"

 GOT_Story_News.449.t: "Bolton Bride Vanishes from Winterfell"
 GOT_Story_News.449.d: "Snow hides tracks of Sansa Stark and Theon Greyjoy, missing after a daring escape. Bolton search parties scour the North, but winter night keeps its secrets."
 GOT_Story_News.449.a: "The North remembers—and now it searches."

 # 450 — Arya’s Revenge and Blindness
 GOT_Story_Country.450.t: "Eyes Darkened by Vengeance"
 GOT_Story_Country.450.d: "Ser Meryn Trant gurgled his last beneath my blade; yet the Many‑Faced God demands balance. Sight drains from my eyes—blackness for a girl who wore the wrong face."
 GOT_Story_Country.450.a: "Accept blindness—continue the Faceless path"
 GOT_Story_Country.450.b: "Reject the Faceless Men—seek aid elsewhere"

 GOT_Story_News.450.t: "Braavos Whispers of a Kingsguard’s Grisly End"
 GOT_Story_News.450.d: "Ser Meryn Trant found slain, eyes gouged, in a brothel. No killer seen—only coins left on eyelids. Rumours say the House of Black and White exacts its own justice."
 GOT_Story_News.450.a: "All men must die; some die screaming."


 # # # # # # # # # # # #
 # #SEASON 6 # #
 # # # # # # # # # # # #

  
 # 501 — Jon Snow’s Body and the Night’s Watch Mutiny
 GOT_Story_Country.501.t: "Blood on the Snow"
 GOT_Story_Country.501.d: "We found Jon dead beneath the Lord Commander’s tower—murdered by brothers who hissed ‘traitor’. Ser Davos now guards the body with a handful of loyal men while Thorne rallies the mutineers at the armory doors."
 GOT_Story_Country.501.a: "Barricade in the storeroom—wait for help"
 GOT_Story_Country.501.b: "Parley with Thorne—risk surrender for peace"

 GOT_Story_News.501.t: "Castle Black Divided After Lord Commander’s Murder"
 GOT_Story_News.501.d: "Ravens whisper of knives in the dark and a dead Snow lying in state while the Night’s Watch teeters on civil war."
 GOT_Story_News.501.a: "The Wall’s shadow grows longer."

 # 502 — Brienne Rescues Sansa and Theon
 GOT_Story_Country.502.t: "Oath Fulfilled in the Wolfswood"
 GOT_Story_Country.502.d: "Bolton riders closed in when a sword of shining steel cut through the snow. Brienne pledges herself to me, Sansa Stark, at last. Theon follows in guilt and frost‑bitten loyalty."
 GOT_Story_Country.502.a: "Accept Brienne’s service—press north toward the Wall"
 GOT_Story_Country.502.b: "Head south—seek safety in the Riverlands"

 GOT_Story_News.502.t: "Lady Stark Saved by Maiden Knight"
 GOT_Story_News.502.d: "Travellers report Brienne of Tarth clashing with Bolton men, spiriting Sansa Stark and Theon Greyjoy into the biting woods."
 GOT_Story_News.502.a: "Hope stirs beneath winter leaves."

 # 503 — The Fate of Dorne
 GOT_Story_Country.503.t: "A Spear Divided Against Itself"
 GOT_Story_Country.503.d: "The sands of Dorne have been stained with blood. In the halls of Sunspear, old loyalties have been shattered as Ellaria Sand and the Sand Snakes move against the ruling house. With Prince Doran and his vision for a patient Dorne challenged, the realm stands at a crossroads. Will Dorne embrace vengeance and a new order, or preserve the legacy of House Martell?"
 GOT_Story_Country.503.a: "Dorne must answer blood with blood."
 GOT_Story_Country.503.b: "Dorne must endure, not burn."

 # 503 — Coup in Dorne
 GOT_Story_News.503.t: "Bloodshed in Sunspear"
 GOT_Story_News.503.d: "Rumors spread across the Seven Kingdoms of violence within the walls of Sunspear. Reports speak of a deadly confrontation between supporters of House Martell and those seeking vengeance for Oberyn Martell's death. The fate of Dorne now hangs in the balance as rival factions struggle for control of the principality."
 GOT_Story_News.503.a: "Dorne’s future remains uncertain."

 # 504 — Cersei Grieves Myrcella
 GOT_Story_Country.504.t:0 "Myrcella Assassinated"
 GOT_Story_Country.504.d:0 "Tragedy has struck the Royal House. Princess Myrcella Baratheon has been assassinated, felled by Dornish poison aboard the ship returning her from Sunspear. Her body now lies cold beneath a shroud, turning the Crown's hope for reconciliation into unbearable sorrow. Grief in the Red Keep has swiftly curdled into absolute wrath, and calls for retribution echo through the halls of King’s Landing."
 GOT_Story_Country.504.a:0 "Dorne must pay for this treachery."

 GOT_Story_News.504.t:0 "A Princess Murdered in Dorne"
 GOT_Story_News.504.d:0 "Whispers from the Red Keep carry dark tidings across the Seven Kingdoms. Princess Myrcella Baratheon has been assassinated, poisoned while returning from Sunspear under what was believed to be a banner of peace. As King’s Landing drapes itself in mourning for the young princess, grief within the capital has turned to fury. Lords and smallfolk alike brace for impact, as the Crown's gaze settles firmly on the Martells and the sands of the south."
 GOT_Story_News.504.a:0 "When lions roar, cities burn."

 # 505 — Daenerys Captured by Dothraki
 GOT_Story_Country.505.t: "Khaleesi in Fetters"
 GOT_Story_Country.505.d: "I walk barefoot among horse‑lords once more—no longer khaleesi, merely widow of Khal Drogo. Khal Moro says widows belong in Vaes Dothrak; my dragons and city lie far across the sea."
 GOT_Story_Country.505.a: "Submit for now—plan ascendancy within Vaes Dothrak"
 GOT_Story_Country.505.b: "Attempt escape—seek Drogon in the grass sea"

 GOT_Story_News.505.t: "Breaker of Chains Now a Captive"
 GOT_Story_News.505.d: "Scouts claim Daenerys Stormborn rides bound toward Vaes Dothrak. Whether dragonfire will free her—or Dothraki tradition bind her—remains to be seen."
 GOT_Story_News.505.a: "A dragon without chains still has wings."
 
 # 506 — Jon Snow’s Resurrection
 GOT_Story_Country.506.t: "The Lord Commander Lives"
 GOT_Story_Country.506.d: "Against all reason, Lord Commander Jon Snow has returned from the dead. Through a ritual performed by the Red Woman, Melisandre, life was restored to the man murdered by his own brothers of the Night's Watch. Having carried out justice against the mutineers, Jon now faces a choice that will shape the future of the Wall. He may continue to serve as Lord Commander, believing his duty to the Watch remains unfinished, or declare that his death fulfilled the oath he swore. Should he lay down his office, command of the Night's Watch will pass to First Steward Eddison Tollett, while Jon Snow will be free to gather the northern houses and reclaim the North from the usurper Ramsay Bolton."
 GOT_Story_Country.506.a: "Remain Lord Commander."
 GOT_Story_Country.506.b: "Abdicate and march south."

 GOT_Story_News.506.t: "Ravens Speak of a Dead Man Breathing"
 GOT_Story_News.506.d: "Tales from Castle Black claim the murdered Lord Commander now walks again, pale yet living. Superstition or sorcery—the North shivers anew."
 GOT_Story_News.506.a: "What is dead may rise again."

 # 507 — Ramsay's Coup
 GOT_Story_Country.507.t: "A Coup at Winterfell"
 GOT_Story_Country.507.d: "The peace of Winterfell has been shattered by shocking reports from within House Bolton. Ramsay Bolton has risen against his own father, Lord Roose Bolton, in a bloody bid to seize the Dreadfort and the Wardenship of the North. As fighting erupts between rival Bolton loyalists, the great houses of the North must decide where their allegiance lies. Some believe Ramsay's ruthless strength is needed to hold the North together, while others remain loyal to the calculating lord who restored Bolton rule."
 GOT_Story_Country.507.a: "Support Ramsay Bolton's coup."
 GOT_Story_Country.507.b: "Stand with Lord Roose Bolton."

 GOT_Story_News.507.t: "Rumours of a Coup at Winterfell"
 GOT_Story_News.507.d: "Conflicting reports have reached the courts of Westeros from the distant North. It is said that violence has erupted within House Bolton itself, with Ramsay Bolton moving against his father, Lord Roose, in an apparent struggle for power. Messengers speak of bloodshed within Winterfell's walls, but with the North isolated and information scarce, none can say with certainty who now commands the Warden of the North's seat."
 GOT_Story_News.507.a: "Only time will reveal Winterfell's master."

 # 508 — The Seastone Chair Stands Empty
 GOT_Story_Country.508.t: "A New Ruler for the Iron Islands"
 GOT_Story_Country.508.d: "King Balon Greyjoy is dead, his body dashed upon the rocks beneath the bridge to Pyke. Though many whisper that his brother Euron had a hand in the king's death, no proof has been found. With the Seastone Chair vacant, the captains and lords of the Iron Islands must decide who shall lead the Ironborn into the years ahead."
 GOT_Story_Country.508.a: "Honor Balon's line"
 GOT_Story_Country.508.b: "Crown Euron."

 GOT_Story_News.508.t: "King of Salt and Rock Dies"
 GOT_Story_News.508.d: "Iron Islands mourn—or cheer—as Balon Greyjoy’s body washes ashore. A new king must rise amidst salt, stone, and blood."
 GOT_Story_News.508.a: "What is dead may never die."

 # 509 — Bran’s Vision of Winterfell’s Past
 GOT_Story_Country.509.t: "Roots of Memory"
 GOT_Story_Country.509.d: "With the Three‑Eyed Raven I walk through time: young Ned sparring against Benjen, Lyanna laughing among blossom snow. The past breathes truths the living forget."
 GOT_Story_Country.509.a: "Probe deeper—seek secrets of the Tower of Joy"
 GOT_Story_Country.509.b: "Return to the present—focus on looming war"

 GOT_Story_News.509.t: "Greenseer’s Apprentice Peers into Old Winterfell"
 GOT_Story_News.509.d: "Stories spread of a crippled Stark viewing days long gone beneath the weirwood’s roots—magic older than men stirs."
 GOT_Story_News.509.a: "The past is never dead."

 # 510 — Tyrion Frees the Dragons
 GOT_Story_Country.510.t: "Unchained Fire"
 GOT_Story_Country.510.d: "Torchlight flickered off green eyes as I unlatched their collars; Viserion and Rhaegal watched, then slunk into darkness. Dragons released may love me—or roast me—but chains never win wars."
 GOT_Story_Country.510.a: "Leverage goodwill—use dragons to cow Meereen’s foes"
 GOT_Story_Country.510.b: "Maintain caution—keep dragons beneath the pyramid for now"

 GOT_Story_News.510.t: "Dragons No Longer Bound in Meereen"
 GOT_Story_News.510.d: "Citizens swear the queen’s advisor walked into the pit and left alive—with broken chains behind him. The balance of power shifts on leathery wings."
 GOT_Story_News.510.a: "Fire cannot be caged."
 
 # 511 — My Watch Has Ended
 GOT_Story_Country.511.t: "Justice at Castle Black"
 GOT_Story_Country.511.d: "The men who plunged their blades into me have been found guilty of mutiny. Justice must be done, but once the sentence is carried out, I must decide whether my death has released me from the vows of the Night's Watch, or whether duty still binds me to the Wall."
 GOT_Story_Country.511.a: "My watch has ended."

 GOT_Story_News.511.t: "Mutineers Executed at Castle Black"
 GOT_Story_News.511.d: "Word from the Wall claims Lord Commander Jon Snow hanged the brothers who betrayed and murdered him, restoring order within the Night's Watch. Rumours now spread that, having fulfilled justice and died while keeping his vows, Snow may abandon the black. Whether the Lord Commander truly means to leave the Wall remains uncertain."
 GOT_Story_News.511.a: "The realm watches the Wall with uneasy eyes."

 # 512 — Bran at the Tower of Joy
 GOT_Story_Country.512.t: "Truth Behind the Legend"
 GOT_Story_Country.512.d: "I witness young Ned duel Ser Arthur Dayne—no honor in victory, only Howland Reed’s dagger in a king‑guard’s back. The past whispers secrets the realm forgot."
 GOT_Story_Country.512.a: "Press on—follow Ned into the tower’s screams"
 GOT_Story_Country.512.b: "Withdraw—halt the vision before knowledge overwhelms"

 GOT_Story_News.512.t: "Green‑Seer Gazes Upon the Tower of Joy"
 GOT_Story_News.512.d: "Rumoured visions reveal the heroic tale of Ned Stark may be half‑truth. If so, the North’s myths could crumble."
 GOT_Story_News.512.a: "Some legends bleed."

 # 513 — Arya Regains Her Sight
 GOT_Story_Country.513.t: "The Gift of No One"
 GOT_Story_Country.513.d: "The waif’s staff no longer finds me blind; devotions in darkness complete, my eyes open anew. I am no one—and yet I see everything."
 GOT_Story_Country.513.a: "Accept next contract—serve the Many‑Faced God"
 GOT_Story_Country.513.b: "Secretly reclaim Arya’s name—prepare covert return to Westeros"

 GOT_Story_News.513.t: "Braavosi Beggar Girl Sees Again"
 GOT_Story_News.513.d: "Dockside talk says the blind girl now walks sure‑footed, eyes clear as seawater. The House of Black and White keeps its promises—and its prices."
 GOT_Story_News.513.a: "Faces change; purpose remains."

 # 514 — Rickon Stark Handed to Ramsay
 GOT_Story_Country.514.t: "A Stark in Chains, a Wolf’s Head on the Pike"
 GOT_Story_Country.514.d: "Smalljon Umber tosses Shaggydog’s head at my feet and shoves Rickon forward. The North bends or breaks beneath Ramsay Bolton, and dread spreads like flayed skin."
 GOT_Story_Country.514.a: "Publicly parade Rickon—pressure Northern houses"
 GOT_Story_Country.514.b: "Keep the boy hidden—use him as secret hostage"

 GOT_Story_News.514.t: "Young Wolf Captive in Winterfell"
 GOT_Story_News.514.d: "Ravens claim the last male Stark heir now languishes in Bolton dungeons. Northern loyalties twist under Ramsay’s knife."
 GOT_Story_News.514.a: "The North remembers—but can it act?"

 # 515 — Daenerys Among the Dosh Khaleen
 GOT_Story_Country.515.t: "Khaleesi or Widow?"
 GOT_Story_Country.515.d: "Within Vaes Dothrak’s sacred city, crones of the dosh khaleen weigh my fate: live quietly among widows or face judgment for breaking tradition. Fire still burns in my veins."
 GOT_Story_Country.515.a: "Submit—win influence within the dosh khaleen"
 GOT_Story_Country.515.b: "Plot revolt—rally khals to a new khalasar"

 GOT_Story_News.515.t: "Breaker of Chains Now Dothraki Widow"
 GOT_Story_News.515.d: "Sources say Daenerys Targaryen resides in Vaes Dothrak under watchful eyes of the dosh khaleen. Whether she bends or burns remains unknown."
 GOT_Story_News.515.a: "Dragons may bow—or they may bite."
 
 # 516 — Jon and Sansa Reunite
 GOT_Story_Country.516.t: "Wolves Meet Again at the Wall"
 GOT_Story_Country.516.d: "As I, Jon, packed to leave the Watch forever, Sansa rode through Castle Black’s gates with Brienne. Tears froze on cheeks and hope thawed in hearts. She begs we march on Winterfell to save Rickon and end Ramsay’s reign."
 GOT_Story_Country.516.a: "Rally wildlings and loyal Northmen—prepare to retake Winterfell"
 GOT_Story_Country.516.b: "Seek more allies first—send ravens across the North"

 GOT_Story_News.516.t: "Stark Siblings Reunited"
 GOT_Story_News.516.d: "For the first time since Ned’s fall, two Stark heirs stand together. Rumours say they plot to dethrone the Bastard of Bolton."
 GOT_Story_News.516.a: "The North remembers."

 # 517 — Fire and Blood
 GOT_Story_Country.517.t: "The Choice at Vaes Dothrak"
 GOT_Story_Country.517.d: "Imprisoned within the Temple of the Dosh Khaleen, the assembled khals expect me to submit and live out my days among the widows. Yet I have another path. With the braziers overturned, the temple could become their pyre—but if the plan fails, I will surely die. I could instead flee while I still have the chance, abandoning the gamble for another day."
 GOT_Story_Country.517.a: "Dracarys... let the temple burn."
 GOT_Story_Country.517.b: "Escape into the grass sea and live to fight another day."

 GOT_Story_News.517.t: "Mother of Dragons Commands Every Khalasar"
 GOT_Story_News.517.d: "Witnesses swear Daenerys strode naked from a burning temple, the khals’ ashes at her feet. Hundreds of thousands now follow her banner."
 GOT_Story_News.517.a: "A storm of sand and fire gathers."

 # 518 — Tyrion’s Compromise with the Masters
 GOT_Story_Country.518.t: "Seven Years for Freedom"
 GOT_Story_Country.518.d: "I offered the masters time to end slavery and pleasures to grease their pride. Grey Worm’s silence cut deeper than any spear, yet peace may buy us days to breathe."
 GOT_Story_Country.518.a: "Stand by the deal—stabilize Meereen economically"
 GOT_Story_Country.518.b: "Prepare contingencies—arm for inevitable betrayal"

 GOT_Story_News.518.t: "Meereen Makes Peace with Slaver Cities—For Now"
 GOT_Story_News.518.d: "Envoys departed with contracts and courtesans. Freedmen mutter that freedom delayed is freedom denied."
 GOT_Story_News.518.a: "Chains rattle even when open."

 # 519 — Lannister–Tyrell Plot Against the Sparrow
 GOT_Story_Country.519.t: "The Crown Considers Its Move"
 GOT_Story_Country.519.d: "With Queen Margaery and Ser Loras still imprisoned, the Crown weighs a desperate course. Lord Jaime Lannister and Lord Mace Tyrell stand ready to march on the Great Sept of Baelor and break the Faith Militant by force. Yet such an assault could plunge King's Landing into bloody chaos."
 GOT_Story_Country.519.a: "Proceed with the assault."
 GOT_Story_Country.519.b: "Stand down."

 GOT_Story_News.519.t: "The Crown Stands Down"
 GOT_Story_News.519.d: "After surrounding the Great Sept of Baelor, the combined forces of Houses Lannister and Tyrell have unexpectedly withdrawn without bloodshed. The Faith Militant remains in control of the sept, and while open conflict has been averted for now, tensions in King's Landing are as high as ever."
 GOT_Story_News.519.a: "The realm wonders what comes next."

 # 520 — Ramsay Kills Osha
 GOT_Story_Country.520.t: "Knife over Wine and Flayed Skin"
 GOT_Story_Country.520.d: "Osha lunged; I slit her throat with my blade. The wildling lies cold, Rickon still shackled. Fear tightens its grip on Winterfell."
 GOT_Story_Country.520.a: "Display the body—intimidate Northern dissent"
 GOT_Story_Country.520.b: "Dispose quietly—maintain façade of control"

 GOT_Story_News.520.t: "Wildling Protector Slain in Winterfell"
 GOT_Story_News.520.d: "Bolton riders nail a flayed woman’s body for all to see. The Bastard’s cruelty knows no bounds."
 GOT_Story_News.520.a: "Dark wings, darker deeds."

 # 521 — Hodor’s Sacrifice and Origin
 GOT_Story_Country.521.t: "Hold the Door"
 GOT_Story_Country.521.d: "Wights clawed at the tunnel while Bran’s spirit straddled time. Meera screamed for Hodor to hold the door—and he did, dying as monsters tore him apart. In the vision, young Wylis collapsed, mind shattered by echoes of his future death, his only word forever ‘Hodor’."
 GOT_Story_Country.521.a: "Mourn the loss—gain temporary morale penalty but increased loyalty"
 GOT_Story_Country.521.b: "Steel the heart—convert grief into combat bonus against the undead"

 GOT_Story_News.521.t: "Gentle Giant Falls Saving the Last Greenseer"
 GOT_Story_News.521.d: "Northern legends already whisper of a stable boy who held back death itself so a Stark could flee. His name, now and always, is Hodor."
 GOT_Story_News.521.a: "Some doors never close."

 # 522 — Birth of the White Walkers Revealed
 GOT_Story_Country.522.t: "Dragonglass and Betrayal"
 GOT_Story_Country.522.d: "In a vision beneath the weirwood, Bran watches the Children of the Forest drive dragonglass into a man’s heart, eyes bluing into eternity. They forged the Night King as a weapon against mankind—only to unleash doom on all."
 GOT_Story_Country.522.a: "Study the ritual—research anti‑White Walker tactics"
 GOT_Story_Country.522.b: "Share the secret—boost realm awareness of the threat"

 GOT_Story_News.522.t: "Ancient Truth: Children Created the Walkers"
 GOT_Story_News.522.d: "Scholars debate a new, chilling account claiming magic birthed the White Walkers in forgotten wars, proving even good intentions can freeze the world."
 GOT_Story_News.522.a: "History bleeds ice."

 # 523 — Euron Crowned at the Kingsmoot
 GOT_Story_Country.523.t: "The Crow’s Eye Takes the Salt Throne"
 GOT_Story_Country.523.d: "On Nagga’s ribs I boasted of slain Balon and promised a dragon queen bride; the captains roared my name. Yara and Theon fled with the best ships, but I command the isles—time to build a fleet the world will fear."
 GOT_Story_Country.523.a: "Begin massive shipbuilding—focus on longships"
 GOT_Story_Country.523.b: "Pursue Yara at once—launch a rapid chase squadron"

 GOT_Story_News.523.t: "New Kraken King Vows Alliance with Dragons"
 GOT_Story_News.523.d: "Euron Greyjoy rules the Ironborn, eyes set on Daenerys. Hammers ring on Pyke’s shores while rival heirs sail for parts unknown."
 GOT_Story_News.523.a: "Salt, sea, and storm gather."

 # 524 — Arya’s Next Target: Lady Crane
 GOT_Story_Country.524.t: "A Play of Faces"
 GOT_Story_Country.524.d: "Assigned to poison actress Lady Crane, I watch actors mock my father’s death. Crane seems kind; doubt gnaws. The waif watches me watch the stage."
 GOT_Story_Country.524.a: "Proceed with the hit—poison the rum"
 GOT_Story_Country.524.b: "Spare Crane—risk wrath of the Faceless Men"

 GOT_Story_News.524.t: "Silent Assassin Stalks Braavosi Stage"
 GOT_Story_News.524.d: "Rumours swirl of an unseen killer targeting a famed actress. Masks within masks in the Free City."
 GOT_Story_News.524.a: "All the world’s a stage—some exits are final."

 # 525 — Sansa Confronts Littlefinger
 GOT_Story_Country.525.t: "A Knife’s Edge Alliance"
 GOT_Story_Country.525.d: "I faced Petyr in Mole’s Town, hatred burning. He offered the Vale’s knights; I spurned him but learned the Blackfish holds Riverrun—an army that could break Bolton lines."
 GOT_Story_Country.525.a: "Send Brienne to Riverrun—seek Tully aid"
 GOT_Story_Country.525.b: "Accept Vale support—summon the Knights of the Vale quietly"

 GOT_Story_News.525.t: "Lady Stark Spurns the Mockingbird"
 GOT_Story_News.525.d: "Witnesses recount sharp words between Sansa Stark and Lord Baelish. Yet armies still move at his whisper; the game grows deadlier."
 GOT_Story_News.525.a: "Trust is the rarest coin in Westeros."
 
 # 526 — Benjen Stark Returns
 GOT_Story_Country.526.t: "Cold Hands, Warm Blood"
 GOT_Story_Country.526.d: "Lost Uncle Benjen emerges from the snows atop a fiery flail, rescuing Bran and Meera. Wounded by the Walkers, saved by dragonglass, he now serves the living—and names Bran the new Three‑Eyed Raven."
 GOT_Story_Country.526.a: "Accept Benjen’s guidance—accelerate greenseer training"
 GOT_Story_Country.526.b: "Press onward alone—send Benjen to rally northern allies"

 GOT_Story_News.526.t: "Missing Ranger Rides Again"
 GOT_Story_News.526.d: "Stories from beyond the Wall claim Benjen Stark, long thought dead, fights with strange fire against the undead."
 GOT_Story_News.526.a: "Legends return when needed most."

 # 527 — Tommen Unites Crown and Faith
 GOT_Story_Country.527.t: "The Crown and the Faith United"
 GOT_Story_Country.527.d: "As Lannister and Tyrell forces gathered before the Great Sept of Baelor, preparing to storm its holy walls, [CRO.GetLeader] shocked the realm with an unexpected declaration. The monarch emerged before the assembled armies and announced an alliance between the Iron Throne and the Faith Militant. The order to attack was withdrawn, the Tyrell host was dismissed, and the balance of power in King's Landing shifted overnight."
 GOT_Story_Country.527.a: "The Seven Kingdoms enter a new age."

 GOT_Story_News.527.t: "Monarch Binds Throne to Faith"
 GOT_Story_News.527.d: "King’s Landing reels as the High Sparrow steps beside the Iron Throne, turning plots to dust and lions to prayer."
 GOT_Story_News.527.a: "When crown bends, who truly rules?"

 # 528 — Arya Rejects the Faceless Men
 GOT_Story_Country.528.t: "Needle Finds Its Way Home"
 GOT_Story_Country.528.d: "I warned Lady Crane and spilled the poisoned rum. By night, I reclaimed Needle from the rocks—Arya Stark lives; no one is dead."
 GOT_Story_Country.528.a: "Prepare to flee Braavos—face the Waif’s pursuit"
 GOT_Story_Country.528.b: "Lay a trap—eliminate the Waif and escape"

 GOT_Story_News.528.t: "Faceless Apprentice Breaks Her Vows"
 GOT_Story_News.528.d: "Braavos whispers of a girl with many faces who chose one name: Stark. Blood debt now follows."
 GOT_Story_News.528.a: "A girl has a list."

 # 529 — Sam Steals Heartsbane
 GOT_Story_Country.529.t: "Valyrian Resolve"
 GOT_Story_Country.529.d: "Father’s scorn burned hotter than any dragonglass. I spirited Gilly away and clasped Heartsbane—the Tarly sword—vowing to wield it against the darkness."
 GOT_Story_Country.529.a: "Head for Oldtown—pursue maester training with sword in tow"
 GOT_Story_Country.529.b: "Travel to the Wall—deliver Heartsbane to Jon"

 GOT_Story_News.529.t: "Hefty Heir Absconds with Ancestral Blade"
 GOT_Story_News.529.d: "Horn Hill’s lords wake to an empty rack where Heartsbane hung. Samwell Tarly defies blood and duty."
 GOT_Story_News.529.a: "Steel sings truer than insults."

 # 530 — Daenerys Rallies the Dothraki
 GOT_Story_Country.530.t: "Blood of My Blood"
 GOT_Story_Country.530.d: "From Drogon’s back I promised wooden horses over the poison water, iron suits to shatter Westeros. The khalasar’s roar answered the dragon’s."
 GOT_Story_Country.530.a: "March to Meereen—unite forces before sailing west"
 GOT_Story_Country.530.b: "Ride straight to the coast—begin immediate invasion preparations"

 GOT_Story_News.530.t: "Dragon Queen Commands the Endless Sea of Riders"
 GOT_Story_News.530.d: "Witnesses saw Daenerys aloft on black wings, calling every khal to conquer the sunset lands. The ground shook with hooves and omen."
 GOT_Story_News.530.a: "The world will hear drumming hooves and beating wings."
 
 # 531 — The Hound’s Return
 GOT_Story_Country.531.t: "No Sermons, Only Steel"
 GOT_Story_Country.531.d: "Sandor Clegane swung axe not for war but for wood—until raiders slaughtered Brother Ray and his peaceful flock. The Hound lifts his blade once more, eyes set on bloody reckoning."
 GOT_Story_Country.531.a: "Hunt the killers—join the Brotherhood Without Banners"
 GOT_Story_Country.531.b: "Wander alone—seek personal vengeance"

 GOT_Story_News.531.t: "Clegane Lives; Villagers Dead"
 GOT_Story_News.531.d: "Travellers whisper that the Hound survived his wounds, only to see pacifists butchered. An old dog returns to old ways."
 GOT_Story_News.531.a: "Blood begets blood."

 # 532 — Siege of Riverrun
 GOT_Story_Country.532.t: "Lannister Host Before the Red Fork"
 GOT_Story_Country.532.d: "I, Jaime, parleyed beneath Riverrun’s walls; the Blackfish scoffed at surrender. Frey banners flap uselessly—this siege may grind on for moons."
 GOT_Story_Country.532.a: "Build siege works—starve the Tullys out"
 GOT_Story_Country.532.b: "Attempt covert infiltration—find a weak gate"

 GOT_Story_News.532.t: "Golden Lion Faces Stubborn Trout"
 GOT_Story_News.532.d: "Riverrun stands defiant against Frey and Lannister alike, stores full and rivers guarded."
 GOT_Story_News.532.a: "Old loyalties run deep as the Red Fork."

 # 533 — Margaery’s Hidden Rose
 GOT_Story_Country.533.t: "Faith or Facade?"
 GOT_Story_Country.533.d: "Before devout eyes, Queen Margaery slipped grandmother Olenna a folded parchment—inside, the Tyrell rose. Piety masks plots; petals hide thorns."
 GOT_Story_Country.533.a: "Shield Olenna—smuggle her from the city"
 GOT_Story_Country.533.b: "Play along—use faith guise to undermine Sparrow"

 GOT_Story_News.533.t: "Whispers of a Queen’s Secret"
 GOT_Story_News.533.d: "Rumour hints the Tyrell flower still blooms beneath septon robes, planning its own spring."
 GOT_Story_News.533.a: "Masks crack under pressure."

 # 534 — Arya Ambushed in Braavos
 GOT_Story_Country.534.t: "Blades in the Fog"
 GOT_Story_Country.534.d: "The Waif’s dagger opened my belly, but not my resolve. Bleeding, I flee alley to alley; Braavos watches a Stark fight death again."
 GOT_Story_Country.534.a: "Seek shelter with Lady Crane—recover and plan"
 GOT_Story_Country.534.b: "Confront the Waif—end the chase tonight"

 GOT_Story_News.534.t: "Girl on the Run, Blood on the Stones"
 GOT_Story_News.534.d: "Canals run red as an unknown girl staggers wounded; some say a Faceless vendetta unfolds."
 GOT_Story_News.534.a: "Many faces, one fate."

 # 535 — House Mormont Recruited
 GOT_Story_Country.535.t: "The Bear Island Oath"
 GOT_Story_Country.535.d: "Lyanna Mormont, ten years fierce, offers sixty‑two swords with hearts of granite. ‘The North remembers,’ she vows, and so do we."
 GOT_Story_Country.535.a: "Accept and march—every sword counts"
 GOT_Story_Country.535.b: "Request additional Mormont scouts—bolster recon"

 GOT_Story_News.535.t: "Tiny Lady, Mighty Words"
 GOT_Story_News.535.d: "Despite meagre numbers, House Mormont’s pledge to the Stark cause sparks new hope across the North."
 GOT_Story_News.535.a: "Even cubs bear claws."
 
 # 536 — Arya Reclaims Her Name
 GOT_Story_Country.536.t: "Needle in the Dark"
 GOT_Story_Country.536.d: "The Waif’s eyes adjusted too late—my blade found her heart. Facing Jaqen, I spoke my truth: ‘A girl is Arya Stark of Winterfell.’ I sail for home, list in hand."
 GOT_Story_Country.536.a: "Book passage to Westeros—return as assassin"
 GOT_Story_Country.536.b: "Linger in Braavos—gather coin and secrets first"

 GOT_Story_News.536.t: "Faceless Girl Chooses a Face"
 GOT_Story_News.536.d: "Dock gossip says the Braavosi killer claimed her true name and vanished westward. Old grudges in Westeros should tremble."
 GOT_Story_News.536.a: "North winds carry sharp whispers."

 # 537 — Riverrun Falls
 GOT_Story_Country.537.t: "The Blackfish’s Last Stand"
 GOT_Story_Country.537.d: "Edmure opened the gates on Jaime’s order; the Tully banner lowered. Brienne escaped by river, the Blackfish died sword in hand. Riverrun is ours—but honor bled into the Red Fork."
 GOT_Story_Country.537.a: "Garrison the castle—secure the Riverlands"
 GOT_Story_Country.537.b: "March south—reinforce King’s Landing before trial day"

 GOT_Story_News.537.t: "Riverrun Surrenders; Tully Hero Slain"
 GOT_Story_News.537.d: "Lannister gold wins what Frey threats could not. Brynden Tully fell within the halls he swore never to yield."
 GOT_Story_News.537.a: "Trout nets cannot hold lions forever."

 # 538 — Trial by Combat Abolished
 GOT_Story_Country.538.t: "A Queen Cornered"
 GOT_Story_Country.538.d: "Tommen’s decree bans trial by combat, stripping me of Ser Gregor’s shield. Yet Qyburn’s spies confirm our hidden wildfire stores—‘the rumor’ burns bright beneath the city."
 GOT_Story_Country.538.a: "Prepare wildfire contingency—seize victory through flame"
 GOT_Story_Country.538.b: "Seek political escape—broker deal with the Faith"

 GOT_Story_News.538.t: "Crown Outlaws Godly Duels"
 GOT_Story_News.538.d: "Seven-pointed stars cheer; lions snarl. Meanwhile whispers of green fire stir unease in King’s Landing’s cellars."
 GOT_Story_News.538.a: "Old powers choose new weapons."

 # 539 — The Hound Joins the Brotherhood
 GOT_Story_Country.539.t: "A Bigger Fight"
 GOT_Story_Country.539.d: "Beric offered purpose beyond revenge. I gripped my axe and accepted: I’ll head north to hack wights instead of widows."
 GOT_Story_Country.539.a: "Ride for the North—aid the living against the dead"
 GOT_Story_Country.539.b: "Remain south for now—recruit more outlaws"

 GOT_Story_News.539.t: "Clegane Swings for the Lord of Light"
 GOT_Story_News.539.d: "Witnesses saw the Hound beside Beric Dondarrion, bound for snowy wars. Even broken men can serve a greater cause."
 GOT_Story_News.539.a: "Axes and flames travel north."

 # 540 — Daenerys Returns During the Siege
 GOT_Story_Country.540.t: "Fire Reigns Over Meereen"
 GOT_Story_Country.540.d: "Masters’ ships bombarded the city until Drogon’s shadow fell. I landed in the pyramid, fury aflame. The battle turns—dragons answer to me alone."
 GOT_Story_Country.540.a: "Unleash full dragon assault—burn the fleet"
 GOT_Story_Country.540.b: "Offer surrender—demand unconditional capitulation of the Masters"

 GOT_Story_News.540.t: "Dragon Queen Breaks the Siege"
 GOT_Story_News.540.d: "Just as Meereen’s walls cracked, a black-winged savior returned. Flames lit the bay; the Masters’ courage sank with their ships."
 GOT_Story_News.540.a: "The breaker of chains wields chains of fire."
 
 # 541 — The Battle for Winterfell
 GOT_Story_Country.541.t: "Snow vs. Bastard of Bolton"
 GOT_Story_Country.541.d: "Our shield‑wall buckled under Bolton arrows until the Knights of the Vale thundered in. With Sansa’s timely arrival, the Boltons broke and Winterfell’s gates fell to the North once more."
 GOT_Story_Country.541.a: "Secure the castle—begin rebuilding defenses"
 GOT_Story_Country.541.b: "Press advantage—pursue remaining Bolton forces"

 GOT_Story_News.541.t: "Stark Banner Rises Over Winterfell"
 GOT_Story_News.541.d: "Fields of corpses steam beneath new‑fallen snow as the direwolf flag replaces the flayed man."
 GOT_Story_News.541.a: "The North is free."

 # 542 — Ramsay Bolton’s Fate
 GOT_Story_Country.542.t:0 "Justice at Winterfell: The Bastard's End"
 GOT_Story_Country.542.d:0 "The flayed banners of House Bolton have been torn from the courtyard walls, replaced once more by the Direwolf of Stark. Below the castle, bound in iron in his own cold kennels, Ramsay Bolton faces the very cruelty he inflicted upon the North. Lady Sansa stands alongside the Northern lords, her face as unrelenting as the coming winter, as his own ravenous hounds are loosed upon their master. His screams echo through the stone halls—a gruesome end to a tyrant, and a clear signal that the North remembers."
 GOT_Story_Country.542.a:0 "Proclaim his execution across the North!"

 GOT_Story_News.542.t:0 "A Tyrant Devoured: The Bastard of Bolton Falls"
 GOT_Story_News.542.d:0 "Riders and raven-scrolls arriving from the North bring grim tidings of the fall of Winterfell. Ramsay Bolton, the sadistic warden who held the North through fear and blood, is dead. Reports from the castle speak of poetic justice: defeated on the battlefield by Jon Snow and Sansa Stark, the Lord of the Dreadfort was cast into his own kennels and devoured alive by the wild hounds he starved for his enemies. Across Westeros, the gruesome end of House Bolton signals a seismic shift—the Direwolf once more rules the North, and the age of quiet terror is at an end."
 GOT_Story_News.542.a:0 "The North remembers—and the realm takes notice."

 # 543 — Death of Rickon Stark
 GOT_Story_Country.543.t: "An Arrow Too Swift"
 GOT_Story_Country.543.d: "Ramsay loosed Rickon across the field only to fell him with a final arrow before my eyes. The youngest wolf lies silent, another Stark lost to war."
 GOT_Story_Country.543.a: "Mourn the prince—gain resolve against enemies"
 GOT_Story_Country.543.b: "Channel grief—improve combat effectiveness temporarily"

 GOT_Story_News.543.t: "Last Son of Winter Fell on the Field"
 GOT_Story_News.543.d: "Rickon’s death darkens the Stark victory, reminding all that war spares few."
 GOT_Story_News.543.a: "Blood prices are never fair."

 # 544 — Dragons Break the Slaver Fleet
 GOT_Story_Country.544.t: "Fire and Chains"
 GOT_Story_Country.544.d: "Mounted on Drogon, I scorched the Masters’ ships; Rhaegal and Viserion joined, turning wood to cinders. The Masters bent knee beneath black smoke."
 GOT_Story_Country.544.a: "Accept their surrender—demand reparations and ships"
 GOT_Story_Country.544.b: "Show no mercy—exterminate remaining Masters"

 GOT_Story_News.544.t: "Sky of Flame Above Meereen"
 GOT_Story_News.544.d: "Witnesses describe dragons reducing a fleet to driftwood; the slavers’ war is ash."
 GOT_Story_News.544.a: "The breaker of chains now breaks fleets."

 # 545 — Pact with the Greyjoys
 GOT_Story_Country.545.t: "Ironborn Offer Their Sails"
 GOT_Story_Country.545.d: "Yara and Theon knelt, pledging a thousand ships for my conquest if I help them unseat Euron and end reaving. I accepted on condition that the Iron Islands embrace a new order."
 GOT_Story_Country.545.a: "Seal the alliance—gain Greyjoy fleet support"
 GOT_Story_Country.545.b: "Demand stricter terms—negotiate further for hostages or tribute"

 GOT_Story_News.545.t: "Dragons and Krakens Unite"
 GOT_Story_News.545.d: "Observers in Meereen report a pact between Daenerys Targaryen and the exiled Greyjoy heirs—wind and fire ready to sweep Westeros."
 GOT_Story_News.545.a: "The seas stir with change."
 
 # 546 — Wildfire at the Sept
 GOT_Story_Country.546.t: "The Wildfire Conspiracy"
 GOT_Story_Country.546.d: "With the Faith Militant entrenched within the Great Sept of Baelor and the realm slipping further from the Crown's grasp, a desperate proposal has emerged. Hidden caches of wildfire still lie beneath the city, remnants of King Aerys II's final madness. A single spark could annihilate the High Sparrow, the Faith Militant, and every rival gathered within the Sept—but at the cost of countless innocent lives and the sanctity of Westeros' holiest place."
 GOT_Story_Country.546.a: "Ignite the wildfire."
 GOT_Story_Country.546.b: "There must be another way."

 GOT_Story_News.546.t: "Great Sept Reduced to Embers"
 GOT_Story_News.546.d: "King’s Landing mourns and trembles as emerald fire consumes faith and royalty. A lioness now sits where sparrows once preached."
 GOT_Story_News.546.a: "When justice fails, terror reigns."

 # 547 — Jon’s Parentage Unveiled
 GOT_Story_Country.547.t: "The Song of Ice and Fire"
 GOT_Story_Country.547.d: "Bran’s vision revealed my birth: Lyanna Stark pressed me into Ned’s arms, whispering Rhaegar’s name. I am no bastard of Winterfell but the blood of dragon and wolf."
 GOT_Story_Country.547.a: "Guard the secret—avoid Southern turmoil for now"
 GOT_Story_Country.547.b: "Reveal the truth—press Targaryen claim"

 GOT_Story_News.547.t: "Whispers of a Hidden Heir"
 GOT_Story_News.547.d: "Ravens hint the new King in the North may carry dragon blood, a truth that could upend every oath."
 GOT_Story_News.547.a: "Heritage reshapes crowns."

 # 548 — Red Wedding Vengeance
 #Important
 GOT_Story_Country.548.t: "A Pie of Freys"
 GOT_Story_Country.548.d: "I baked Walder’s sons into his feast, then opened his throat where mother and brother fell. The North remembers, and so do I."
 GOT_Story_Country.548.a: "Move on to next names—continue vengeance chain"
 GOT_Story_Country.548.b: "Return to Winterfell—offer skills to family"

 GOT_Story_News.548.t: "Lord of the Crossing Found Slain"
 GOT_Story_News.548.d: "Frey blood stains the hall where guests once bled. A lone girl was seen smiling as she left."
 GOT_Story_News.548.a: "Old debts paid in kind."

 # 549 — King in the North
 GOT_Story_Country.549.t:0 "The White Wolf Crowned"
 GOT_Story_Country.549.d:0 "The blood-soaked fields outside Winterfell have settled, and the flayed man banners have been torn down and burned. For the first time in years, the grey direwolf of House Stark flies proudly once more above the ancient granite walls. In the Great Hall, as Northern lords, Knights of the Vale, and Free Folk leaders bickered over past betrayals and broken oaths, ten-year-old Lyanna Mormont silenced the room, declaring Jon Snow the King in the North—the White Wolf who bears the blood of Ned Stark. One by one, drawn steel rang against timber and shield as the hall erupted in thunderous unison. The North is unified at last, but the true war still looms beyond the Wall."
 GOT_Story_Country.549.a:0 "The King in the North!"

 GOT_Story_News.549.t:0 "Northern Lords Hail a New King"
 GOT_Story_News.549.d:0 "Riders pounding down the Kingsroad bring astonishing dispatches from Winterfell: House Bolton has been broken, and the ancient seat of the North has returned to the blood of Stark. Amidst a fractured coalition of northern houses, knights of the Vale, and wildling chieftains, a new monarch has been raised upon the shield. Rallying the realm against the bitter frosts and the mounting terror of the Long Night, Jon Snow has been crowned King in the North. From Bear Island to the Neck, the direwolf banner flies high once more, signaling that the North is united—and bracing for the war to end all wars."
 GOT_Story_News.549.a:0 "A crown of snow and resolve."

 # 550 — Daenerys Sails West
 GOT_Story_Country.550.t: "Winds Fill Dragon Sails"
 GOT_Story_Country.550.d: "With Unsullied, Dothraki, Greyjoy masts, and banners of Tyrell and Martell, I leave Meereen. Tyrion wears my Hand’s pin; Drogon soars ahead. Westeros lies on the horizon."
 GOT_Story_Country.550.a: "Plot invasion strategy—land at Dragonstone"
 GOT_Story_Country.550.b: "Sail for Dorne first—rally southern allies on shore"

 GOT_Story_News.550.t: "Great Armada Crosses the Narrow Sea"
 GOT_Story_News.550.d: "Dragons circle above sails of krakens, roses, and sunspear. Targaryen fire approaches the Seven Kingdoms."
 GOT_Story_News.550.a: "A storm of fire and blood is coming."
 

 # # # # # # # # # # # #
 # #SEASON 7 # #
 # # # # # # # # # # # #

 # 601 — Arya Eliminates House Frey
 GOT_Story_Country.601.t: "A Toast to Vengeance"
 GOT_Story_Country.601.d: "Wearing Walder’s face, I bid Frey men drink. As poison tightened throats, I named myself Arya Stark and watched the Red Wedding repaid."
 GOT_Story_Country.601.a: "Ride north—return to Winterfell"
 GOT_Story_Country.601.b: "Head south—pursue remaining names"

 GOT_Story_News.601.t: "Frey Hall Runs Red Again"
 GOT_Story_News.601.d: "Every lord of House Frey lies dead by cup, their women spared. A lone wolf delivered the reckoning."
 GOT_Story_News.601.a: "The North remembers."

 # 602 — Jon and Sansa Dispute Punishment
 GOT_Story_Country.602.t: "Mercy or Fear?"
 GOT_Story_Country.602.d: "I pardoned the Karstark and Umber heirs, restoring their seats. Sansa challenged me before the hall, warning mercy can invite betrayal."
 GOT_Story_Country.602.a: "Stand firm—unity requires forgiveness"
 GOT_Story_Country.602.b: "Reconsider—impose penalties to deter treason"

 GOT_Story_News.602.t: "Northern Court Divided"
 GOT_Story_News.602.d: "Voices in Winterfell weigh mercy against retribution as the King in the North and Lady Stark clash."
 GOT_Story_News.602.a: "Winter needs one voice."

 # 603 — Cersei Courts the Iron Fleet
 GOT_Story_Country.603.t: "An Empty Crown Seeks Oars"
 GOT_Story_Country.603.d: "Euron Greyjoy docked in King’s Landing, offering one thousand ships for my hand. I refused, demanding proof of loyalty; he vowed to fetch a priceless gift."
 GOT_Story_Country.603.a: "Monitor Euron—prepare for his return"
 GOT_Story_Country.603.b: "Secretly court other houses—offset Greyjoy leverage"

 GOT_Story_News.603.t: "Queen without Friends"
 GOT_Story_News.603.d: "With Tyrell and Martell banners lost, Cersei seeks krakens to prop lion rule."
 GOT_Story_News.603.a: "Alliances shift like tides."

 # 604 — Dragonglass Cache Found
 GOT_Story_Country.604.t: "Knowledge in the Stacks"
 GOT_Story_Country.604.d: "Buried in dusty tomes, I discovered a map: vast dragonglass lodes lie beneath Dragonstone—key to defeating White Walkers."
 GOT_Story_Country.604.a: "Send raven to Jon—inform the North"
 GOT_Story_Country.604.b: "Appeal to Archmaesters—seek formal support and resources"

 GOT_Story_News.604.t: "Citadel Scholar Uncovers Secret Ore"
 GOT_Story_News.604.d: "Rumour from Oldtown speaks of a weapon hidden under Targaryen stone."
 GOT_Story_News.604.a: "Fire forges hope."

 # 605 — Bran Reaches the Wall
 GOT_Story_Country.605.t: "Three‑Eyed Raven Arrives"
 GOT_Story_Country.605.d: "Meera dragged me through snows to Castle Black. Acting‑Commander Edd admitted us after my visions proved true: the Night King marches."
 GOT_Story_Country.605.a: "Send warning ravens south—prepare all realms"
 GOT_Story_Country.605.b: "Focus on visions—seek more intel on enemy plans"

 GOT_Story_News.605.t: "Young Stark at the Gate"
 GOT_Story_News.605.d: "The last male Stark crosses into the Watch’s care, speaking of dead men on the move."
 GOT_Story_News.605.a: "Winter’s whispers grow louder."

 # 606 — The Hound’s Fiery Vision
 GOT_Story_Country.606.t: "Flames Reveal Fate"
 GOT_Story_Country.606.d: "I saw ice‑blue shadows marching past Eastwatch in fire’s glow. Beric insists we go north to fight the true war."
 GOT_Story_Country.606.a: "Head to the Wall—join the fight"
 GOT_Story_Country.606.b: "Recruit more followers first—strength in numbers"

 GOT_Story_News.606.t: "Clegane Stares into the Fire"
 GOT_Story_News.606.d: "A man once afraid of flame now reads prophecy within it, guiding the Brotherhood northward."
 GOT_Story_News.606.a: "Even broken men can burn bright."

 # 607 — Daenerys Lands at Dragonstone
 GOT_Story_Country.607.t: "Home at Last"
 GOT_Story_Country.607.d: "Waves kissed Dragonstone’s shore as I stepped onto ancestral rock. In the map room I laid my hand, whispering, 'Shall we begin?'"
 GOT_Story_Country.607.a: "Fortify Dragonstone—prepare invasion plans"
 GOT_Story_Country.607.b: "Summon allies—invite Stark and Baratheon loyalists to parley"

 GOT_Story_News.607.t: "Dragon Queen Touches Westerosi Soil"
 GOT_Story_News.607.d: "After years abroad, Daenerys Targaryen plants her banner on Dragonstone, dragons circling overhead."
 GOT_Story_News.607.a: "The game enters its final act."

 # 608 — Daenerys Confronts Varys
 GOT_Story_Country.608.t: "Where Do Your Loyalties Lie?"
 GOT_Story_Country.608.d: "On Dragonstone’s dark shore, I questioned Varys about his many kings. He swore his loyalty to the people; I swore dragonfire should he betray me."
 GOT_Story_Country.608.a: "Accept his oath—gain intrigue bonus"
 GOT_Story_Country.608.b: "Keep him under watch—small stability hit, espionage defense rise"

 GOT_Story_News.608.t: "Spider Spins a New Web"
 GOT_Story_News.608.d: "Whispers say the Targaryen queen challenged her master of whispers, binding him with threat of flame."
 GOT_Story_News.608.a: "Trust is a fragile currency."

 # 609 — Melisandre’s Counsel
 GOT_Story_Country.609.t: "Red Priestess Returns"
 GOT_Story_Country.609.d: "Melisandre urged me to summon Jon Snow, hinting at prophecy. She spoke of ice and fire united against darkness."
 GOT_Story_Country.609.a: "Heed her words—send raven for Jon"
 GOT_Story_Country.609.b: "Dismiss her—focus on Westerosi conquest"

 GOT_Story_News.609.t: "Red Woman at Dragonstone Again"
 GOT_Story_News.609.d: "A priestess of R’hllor seeks to bind fire and snow in common cause."
 GOT_Story_News.609.a: "Old gods and new make strange allies."

 # 610 — Jon Journeys South
 GOT_Story_Country.610.t: "The Fate of the North"
 GOT_Story_Country.610.d: "The war against House Bolton has ended, but the North now faces a new challenge. With threats beyond the Wall growing and the realm once again divided, Jon Snow must decide the future of his kingdom. Some urge him to seek alliance with House Targaryen and pledge the North's support to the Dragon Queen. Others believe stability lies in reconciliation with the Iron Throne and recognition of the ruling House Lannister. Yet many northern lords insist that the North paid dearly for its freedom and should bow to no monarch. The choice of whether to kneel, negotiate, or stand alone now rests with the King in the North."
 GOT_Story_Country.610.a: "Pledge the North to House Targaryen."
 GOT_Story_Country.610.b: "Pledge the North to the Iron Throne."
 GOT_Story_Country.610.c: "The North shall remain independent."

 GOT_Story_News.610.t: "The King in the North Rides South"
 GOT_Story_News.610.d: "Jon Snow, King in the North, has departed Winterfell and begun his journey south. With the fate of the North resting upon his shoulders, he seeks answers and alliances as the realm once again descends toward war. Whether he will seek friendship with the Dragon Queen, reconcile with the Iron Throne, or continue to stand as an independent king remains unknown."
 GOT_Story_News.610.a: "The North awaits its king's decision."

 # 611 — Cersei Courts the Reach
 GOT_Story_Country.611.t: "Ravens to the Tarlys"
 GOT_Story_Country.611.d: "I gathered my lords, promising honors for those who stand against dragons. Qyburn unveiled a great scorpion bolt fit to pierce scales."
 GOT_Story_Country.611.a: "Offer Lord Tarly the South—gain Reach manpower"
 GOT_Story_Country.611.b: "Threaten dissenters—raise tyranny, decrease autonomy"

 GOT_Story_News.611.t: "Lannister Queen Seeks New Spears"
 GOT_Story_News.611.d: "With few banners left, Cersei dangles titles to lure the Reach while plotting ways to slay dragons."
 GOT_Story_News.611.a: "Promises and projectiles."

 # 612 — Arya and Nymeria
 GOT_Story_Country.612.t: "Not You"
 GOT_Story_Country.612.d: "In twilight woods, my direwolf Nymeria emerged grown and wild. She sensed me, then turned away. She is free—as am I."
 GOT_Story_Country.612.a: "Continue north—focus on homecoming"
 GOT_Story_Country.612.b: "Track the pack—gain scouting intel along the Trident"

 GOT_Story_News.612.t: "Wolf and Girl Cross Paths"
 GOT_Story_News.612.d: "Travelers whisper of a great direwolf leading a pack near the Trident, guided briefly by a lone girl."
 GOT_Story_News.612.a: "Some bonds transcend years."

 # 613 — Euron’s Midnight Raid
 GOT_Story_Country.613.t: "Kraken Strikes in the Narrow Sea"
 GOT_Story_Country.613.d: "Euron’s black ships fell upon us. He killed Obara and Nymeria Sand, seized Yara and Ellaria. Fear overcame me—I leapt, leaving Yara captive."
 GOT_Story_Country.613.a: "Rally survivors—seek refuge at Dragonstone"
 GOT_Story_Country.613.b: "Slink to shore—regain nerve, plot rescue later"

 GOT_Story_News.613.t: "Ironborn Civil War Turns Tides"
 GOT_Story_News.613.d: "Smoking hulls drift toward Sunspear while Euron parades captives bound for King’s Landing."
 GOT_Story_News.613.a: "A priceless gift indeed."

 # 614 — Sam Heals the Stone Man
 GOT_Story_Country.614.t: "Forbidden Cure"
 GOT_Story_Country.614.d: "I flayed greyscale from Ser Jorah through night and pain, risking expulsion. He lives, skin raw but future his again."
 GOT_Story_Country.614.a: "Report success—earn limited Citadel support"
 GOT_Story_Country.614.b: "Hide the deed—avoid punishment, keep low profile"

 GOT_Story_News.614.t: "Greyscale Miracle in Oldtown"
 GOT_Story_News.614.d: "Rumours claim a disgraced student saved a doomed knight, challenging Citadel doctrine."
 GOT_Story_News.614.a: "Knowledge is the cure."
 
 # 615 — Jon Meets Daenerys
 GOT_Story_Country.615.t: "Ice Greets Fire"
 GOT_Story_Country.615.d: "I knelt to no queen, yet begged aid against death itself. Daenerys demanded proof before pledging dragons or spears."
 GOT_Story_Country.615.a: "Mine the dragonglass—earn trust through action"
 GOT_Story_Country.615.b: "Swear fealty—secure immediate support"

 GOT_Story_News.615.t: "Stark and Targaryen Parley"
 GOT_Story_News.615.d: "Dragonstone hosts a historic summit as the King in the North seeks alliance with the Dragon Queen."
 GOT_Story_News.615.a: "Old rivalries thaw—perhaps."

 # 616 — Cersei’s Poisoned Justice
 GOT_Story_Country.616.t: "A Daughter for a Daughter"
 GOT_Story_Country.616.d: "I chained Ellaria and Tyene Sand beneath the Red Keep. One poisoned kiss echoed Myrcella’s fate; a mother will watch her child rot."
 GOT_Story_Country.616.a: "Display strength—gain fear‑driven stability"
 GOT_Story_Country.616.b: "Keep it secret—avoid foreign outrage"

 GOT_Story_News.616.t: "Viper Venom Returned"
 GOT_Story_News.616.d: "The Lannister queen repays Dornish murder with cruel symmetry, sealing Sand captives below the capital."
 GOT_Story_News.616.a: "The Lion’s wrath is slow—but sure."

 # 617 — Fall of Highgarden
 GOT_Story_Country.617.t:0 "The Fall of Highgarden"
 GOT_Story_Country.617.d:0 "The white walls of Highgarden have failed us. Abandoned by our bannermen and betrayed from within by Lord Tarly, our forces were overwhelmed by the combined host of Casterly Rock. As Lannister soldiers pillage our ancient vaults and strip our fields bare, Jaime Lannister marched into the castle keep to confront Lady Olenna. Denied a violent execution, the Queen of Thorns drank the poisoned wine offered to her—but not before striking one final, venomous blow, confessing to Joffrey’s murder and ensuring her killer knew it was her. The golden rose of Tyrell has been severed, and the wealth of the Reach now marches east in iron chests to pay the crown's debts."
 GOT_Story_Country.617.a:0 "Highgarden has fallen... but our poison lingers."
 
 GOT_Story_News.617.t:0 "The Golden Rose Severed: Highgarden Sacked"
 GOT_Story_News.617.d:0 "Shocking news sweeps across the Seven Kingdoms: Highgarden, the ancient seat of House Tyrell and the granary of Westeros, has fallen. Marching alongside Randyll Tarly and turncoat Reach lords, Jaime Lannister led a surprise offensive that breached the castle walls and crushed the Tyrell defenders. Highgarden's legendary vaults have been stripped bare to settle the crown's staggering debts to the Iron Bank, while Lady Olenna Tyrell was forced to drink poison in her own chambers. With the Queen of Thorns dead and the golden rose severed, the vast wealth and fertile lands of the Reach have been ripped away from Daenerys Targaryen's coalition in a single swift stroke."
 GOT_Story_News.617.a:0 "The Rose has withered, and Casterly Rock claims the bounty."

 # 618 — Bran Comes Home
 GOT_Story_Country.618.t: "Three‑Eyed Raven in Winterfell"
 GOT_Story_Country.618.d: "I returned, no longer the boy who left. Visions of past and future weigh heavy; Sansa struggles to grasp what I have become."
 GOT_Story_Country.618.a: "Share visions—boost intelligence network"
 GOT_Story_Country.618.b: "Remain distant—maintain mystical aura, small stability cost"

 GOT_Story_News.618.t: "Stark Heir Reappears"
 GOT_Story_News.618.d: "Bran Stark crosses Winterfell’s gates, speaking in riddles of memories not his own."
 GOT_Story_News.618.a: "Old gods walk again."

 # 619 — Jorah Healed
 GOT_Story_Country.619.t: "Stone No More"
 GOT_Story_Country.619.d: "Sam scraped greyscale from my flesh, breaking Citadel rules. I am free of the disease—and free to serve my queen once more."
 GOT_Story_Country.619.a: "Depart for Dragonstone—rejoin Daenerys"
 GOT_Story_Country.619.b: "Linger—aid Sam, grant Citadel insight"

 GOT_Story_News.619.t: "Greyscale Cure Confirmed"
 GOT_Story_News.619.d: "Whispers from Oldtown tell of an exiled knight restored, greyscale defeated by forbidden hands."
 GOT_Story_News.619.a: "Knowledge triumphs over fear."

 # 620 — Euron’s Triumph
 GOT_Story_Country.620.t: "A Gift Fit for a Queen"
 GOT_Story_Country.620.d: "I sailed into King’s Landing to roaring crowds, presenting Sand captives to Cersei. She promised marriage once the war is won."
 GOT_Story_Country.620.a: "Celebrate—gain prestige, navy morale"
 GOT_Story_Country.620.b: "Press for vows now—risk tension with Cersei"

 GOT_Story_News.620.t: "Kraken Wins the Queen’s Favor"
 GOT_Story_News.620.d: "Euron Greyjoy parades spoils and prisoners through the streets, cementing alliance with the Iron Throne."
 GOT_Story_News.620.a: "Salt and iron bind the realm."

 # 621 — Davos Introduces the King in the North
 GOT_Story_Country.621.t: "The Onion Knight Speaks"
 GOT_Story_Country.621.d: "Ser Davos vouched for me before the Dragon Queen, citing my resurrection and the Long Night. His plain words tempered her doubts."
 GOT_Story_Country.621.a: "Let Davos negotiate terms—diplomacy bonus"
 GOT_Story_Country.621.b: "Speak for myself—gain respect, risk misstep"

 GOT_Story_News.621.t: "Old Smuggler Brokers New Alliance"
 GOT_Story_News.621.d: "Davos Seaworth, once a knight of onions, now paves the path between ice and fire."
 GOT_Story_News.621.a: "Small men move great wars."
 
 # 622 — Dragonfire on the Gold Road
 GOT_Story_Country.622.t: "Field of Fire II"
 GOT_Story_Country.622.d: "I unleashed Drogon and the Dothraki upon the Lannister wagon‑train, turning wagons of Reach gold to molten slag."
 GOT_Story_Country.622.a: "Crush the convoy—enemy loses resources, Dothraki gain attack"
 GOT_Story_Country.622.b: "Hold dragons in reserve—less devastation, conserve political capital"

 GOT_Story_News.622.t: "Dragons Descend on the Reach"
 GOT_Story_News.622.d: "A storm of flame scorched Lannister columns, the realm’s gold lost to ash."
 GOT_Story_News.622.a: "War’s cost paid in coin and blood."

 # 623 — Drogon Wounded
 GOT_Story_Country.623.t: "Scorpion’s Sting"
 GOT_Story_Country.623.d: "A massive scorpion bolt tore into Drogon’s shoulder. I landed amid battle to calm him while bolts whistled overhead."
 GOT_Story_Country.623.a: "Withdraw to treat Drogon—reduce dragon attack for 30 days"
 GOT_Story_Country.623.b: "Fight through pain—maintain power, raise dragon attrition risk"

 GOT_Story_News.623.t: "Dragon Bleeds!"
 GOT_Story_News.623.d: "Witnesses claim Qyburn’s war engine pierced a dragon’s hide—proof that even fire‑made flesh can fall."
 GOT_Story_News.623.a: "Hope for some, dread for others."

 # 624 — Jaime’s Reckless Charge
 GOT_Story_Country.624.t: "A Spear at the Dragon Queen"
 GOT_Story_Country.624.d: "Seeing Daenerys exposed, I spurred toward her. Dragonfire roared—Bronn’s tackle saved me, plunging us into the Blackwater Rush."
 GOT_Story_Country.624.a: "Resurface—Jaime survives but suffers injury (combat penalty)"
 GOT_Story_Country.624.b: "Presumed dead—enemy morale drop, Lannister stability hit"

 GOT_Story_News.624.t: "Kingslayer’s Gamble"
 GOT_Story_News.624.d: "Jaime Lannister vanished beneath river waters after charging the Dragon Queen; his fate uncertain."
 GOT_Story_News.624.a: "Bravery or folly?"

 # 625 — Arya at Winterfell
 GOT_Story_Country.625.t: "A Wolf Comes Home"
 GOT_Story_Country.625.d: "I passed Winterfell’s gates, greeted by wary guards, then fierce embraces from Sansa and a distant nod from Bran."
 GOT_Story_Country.625.a: "Train with Brienne—gain combat skill"
 GOT_Story_Country.625.b: "Scout the castle—unlock intrigue options"

 GOT_Story_News.625.t: "Stark Siblings Reunited"
 GOT_Story_News.625.d: "Winterfell’s halls fill with the howls of returning wolves as Arya Stark joins her kin."
 GOT_Story_News.625.a: "The North remembers."

 # 626 — Valyrian Gift
 GOT_Story_Country.626.t: "Steel for Shadows"
 GOT_Story_Country.626.d: "Bran placed the Valyrian dagger in my hand, saying I’d need it. Its edge felt meant for more than one destiny."
 GOT_Story_Country.626.a: "Keep the dagger—boost assassination missions"
 GOT_Story_Country.626.b: "Store it safely—minor defense bonus for Winterfell"

 GOT_Story_News.626.t: "Ancient Blade Changes Hands"
 GOT_Story_News.626.d: "The knife once aimed at Bran Stark now rests with his sister, Arya—the past arming the future."
 GOT_Story_News.626.a: "Valyrian steel is ever in short supply."

 # 627 — Truth in the Stone
 GOT_Story_Country.627.t: "Paintings of an Older War"
 GOT_Story_Country.627.d: "Deep in Dragonstone’s caves, we saw Children and First Men fighting the dead together. Proof etched in stone swayed Daenerys toward our cause."
 GOT_Story_Country.627.a: "Forge alliance—Daenerys grants dragonglass stockpile"
 GOT_Story_Country.627.b: "Press further—seek joint expedition beyond the Wall, delay resources"

 GOT_Story_News.627.t: "Ancient Art Speaks"
 GOT_Story_News.627.d: "Cave markings beneath Dragonstone hint at a forgotten alliance against darkness, now re‑discovered."
 GOT_Story_News.627.a: "History repeats itself."

 # 628 — Cersei and the Iron Bank
 GOT_Story_Country.628.t: "Debts Paid in Gold"
 GOT_Story_Country.628.d: "I assured Tycho Nestoris that Highgarden’s gold will settle the Crown’s debts, securing fresh loans for mercenaries."
 GOT_Story_Country.628.a: "Hire the Golden Company—gain elite units after delay"
 GOT_Story_Country.628.b: "Strengthen treasury—reduce war exhaustion, improve economy"

 GOT_Story_News.628.t: "Iron Bank Bets on the Lion"
 GOT_Story_News.628.d: "With Reach gold en route, Braavos’s Iron Bank renews faith—and coin—in Queen Cersei’s rule."
 GOT_Story_News.628.a: "The Iron Bank always gets its due."
 
 # 629 — A Dragon’s Acceptance
 GOT_Story_Country.629.t: "Hand upon the Dragon"
 GOT_Story_Country.629.d: "Drogon bared his fangs, yet allowed Jon Snow’s hand to rest upon his snout. The great beast’s calm spoke louder than bloodlines."
 GOT_Story_Country.629.a: "Recognize the omen—improve Jon‑Daenerys relations, unlock dragon‑rider decisions"
 GOT_Story_Country.629.b: "Dismiss as chance—no change, but reduce court intrigue"

 GOT_Story_News.629.t: "King in the North Meets Fire Made Flesh"
 GOT_Story_News.629.d: "Witnesses claim the Dragon Queen’s fiercest mount bowed to Jon Snow’s touch—whispers of dragonblood stir."
 GOT_Story_News.629.a: "Rumors take wing."

 # 630 — Trial by Fire for House Tarly
 GOT_Story_Country.630.t: "Ashes of Rebellion"
 GOT_Story_Country.630.d: "Randyll and Dickon Tarly refused to bend the knee. Drogon’s flames rendered their defiance to ash before assembled captives."
 GOT_Story_Country.630.a: "Make example—gain fear‑based compliance, raise foreign outrage"
 GOT_Story_Country.630.b: "Offer mercy (if mod option chosen)—Tarlys join Night’s Watch, small stability loss"

 GOT_Story_News.630.t: "Dragonfire Justice"
 GOT_Story_News.630.d: "Two Lords consumed by flame for spurning Daenerys—supporters debate whether it heralds a tyrant or a just queen."
 GOT_Story_News.630.a: "The realm takes note."

 # 631 — The Smith of King’s Landing
 GOT_Story_Country.631.t: "Gendry, Bastard of Baratheon"
 GOT_Story_Country.631.d: "The lone surviving Baratheon bastard hefts a war‑hammer and pledges service to the fight against the dead."
 GOT_Story_Country.631.a: "Recruit Gendry—unlock Valyrian‑steel forging focus"
 GOT_Story_Country.631.b: "Send him south as envoy—gain Baratheon sympathy"

 GOT_Story_News.631.t: "Stormlands Blood Reforged"
 GOT_Story_News.631.d: "Robert’s shadow returns in his hammer‑wielding son, marching north beside King Snow."
 GOT_Story_News.631.a: "Old sigils stir."

 # 632 — Mission Beyond the Wall
 GOT_Story_Country.632.t: "The Frozen Hunt"
 GOT_Story_Country.632.d: "A rag‑tag band—lords, wildlings, a Hound and a priest—set forth to capture a wight, proof for southern doubters."
 GOT_Story_Country.632.a: "Launch the ranging—spawns special commando unit, high risk/high reward"
 GOT_Story_Country.632.b: "Postpone—delay proof, improve manpower conservation"

 GOT_Story_News.632.t: "Suicide Squad of the North"
 GOT_Story_News.632.d: "Seven champions stride into blinding frost, hoping one corpse may save the living."
 GOT_Story_News.632.a: "The realm holds its breath."

 # 633 — Shadows Between Sisters
 GOT_Story_Country.633.t: "Littlefinger’s Seed of Doubt"
 GOT_Story_Country.633.d: "I found Sansa’s old plea to Joffrey—ink of coercion now weaponized to pit wolf against wolf."
 GOT_Story_Country.633.a: "Confront Sansa—risk loyalty drop, expose Littlefinger"
 GOT_Story_Country.633.b: "Secretly investigate—gather intrigue points"

 GOT_Story_News.633.t: "Cracks in Winterfell"
 GOT_Story_News.633.d: "Rumors seep that Stark unity frays under old Lannister letters and newer schemes."
 GOT_Story_News.633.a: "Divide and conquer?"

 # 634 — Queen’s New Heir?
 GOT_Story_Country.634.t:0 "Cersei's Unborn Promise"
 GOT_Story_Country.634.d:0 "Behind the thick stone walls of the Red Keep, Queen Cersei has revealed a staggering truth to Jaime: she is with child. defying the blood-soaked prophecy of the woodswitch who foresaw the death of all her children, Cersei intends to claim this unborn heir as Jaime's trueborn child, using the pregnancy to bind his wavering allegiance and cement Lannister dominance over the Iron Throne. Yet, word of a new royal child is a double-edged sword: while it grants a surge of legitimacy to a desperate dynasty, it risks fanning the flames of religious zealotry and highborn suspicion across King's Landing."
 GOT_Story_Country.634.a:0 "Proclaim the pregnancy!"

 GOT_Story_News.634.t:0 "A Lion Cub on the Horizon: Cersei's Pregnancy"
 GOT_Story_News.634.d:0 "Whispers from the court in King's Landing have erupted into open scandal across Westeros: Queen Cersei Lannister is bearing a child. Following the tragic deaths of Joffrey, Myrcella, and Tommen, the promise of a new Lannister heir sent shockwaves through every noble house. While loyalists celebrate the continuation of the royal line, political rivals and religious fundamentalists openly question the child's true parentage. In taverns and council chambers from Oldtown to White Harbor, the court buzzes with dark speculation over whether this child will secure the Iron Throne or drag it deeper into ruin."
 GOT_Story_News.634.a:0 "The court buzzes with treacherous speculation."

 # 635 — Departure from the Citadel
 GOT_Story_Country.635.t: "Enough of Dust and Doubt"
 GOT_Story_Country.635.d: "The maesters ignore the coming night. I gathered scrolls, Heartsbane, and Gilly—for the fight where knowledge matters."
 GOT_Story_Country.635.a: "Ride north—unlock Samwell research speed bonus"
 GOT_Story_Country.635.b: "Seek White Harbor first—spread warnings, gain minor northern opinion"

 GOT_Story_News.635.t: "A Scholar Marches to War"
 GOT_Story_News.635.d: "Samwell Tarly departs Oldtown with stolen tomes and valyrian steel, trading candles for cold steel."
 GOT_Story_News.635.a: "The night grows darker."
 
 # 636 — Proof at a Terrible Price
 GOT_Story_Country.636.t: "We Have Our Wight"
 GOT_Story_Country.636.d: "The raiding party bound a snarling corpse in chains—but the dead came in legions to reclaim it."
 GOT_Story_Country.636.a: "Hold the ice‑lake island—begin timed survival battle"
 GOT_Story_Country.636.b: "Abandon the trophy—retreat, lose wight sample"

 GOT_Story_News.636.t: "Northern Raiders Cornered by the Dead"
 GOT_Story_News.636.d: "A desperate quest north of the Wall ends with the living encircled on thin ice, clutching a single captive corpse."
 GOT_Story_News.636.a: "All eyes on the frozen lake."

 # 637 — A Red Priest Falls
 GOT_Story_Country.637.t: "Death of Thoros of Myr"
 GOT_Story_Country.637.d: "The bear‑wound festered. At dawn’s grey light, Thoros’s prayers ceased, and the fire within him went out."
 GOT_Story_Country.637.a: "Mourn and press on—lose healing buff, gain mild morale hit"
 GOT_Story_Country.637.b: "Burn the body—reduce White Walker power nearby"

 GOT_Story_News.637.t: "Flaming Sword Forever Sheathed"
 GOT_Story_News.637.d: "Thoros, famed drinker and resuscitator of heroes, perished in the snow—no resurrection followed."
 GOT_Story_News.637.a: "The North grows colder."

 # 638 — Hammer in Hand, Feet of Wind
 GOT_Story_Country.638.t: "Gendry’s Sprint"
 GOT_Story_Country.638.d: "The blacksmith ran through blizzard and night, reaching Eastwatch with frozen limbs to beg Daenerys’s aid."
 GOT_Story_Country.638.a: "Dispatch raven—triggers dragon rescue event"
 GOT_Story_Country.638.b: "Fortify Eastwatch instead—gain garrison strength"

 GOT_Story_News.638.t: "A Raven Flies South"
 GOT_Story_News.638.d: "One man’s dash across the ice carried hope—and a plea—for dragonfire salvation."
 GOT_Story_News.638.a: "Will help arrive in time?"

 # 639 — Fire Rolls Across the Sky
 GOT_Story_Country.639.t: "Daenerys to the Rescue"
 GOT_Story_Country.639.d: "Dragons shrieked above the lake, scorching wights and shattering ice, lifting survivors to safety."
 GOT_Story_Country.639.a: "Mount the dragons—extract party, lower White Walker numbers"
 GOT_Story_Country.639.b: "Stay and fight—inflict heavy undead losses, high dragon risk"

 GOT_Story_News.639.t: "Dragons Seen Beyond the Wall"
 GOT_Story_News.639.d: "Witnesses report three great beasts of fire battling the Night King’s hordes amid blinding snow."
 GOT_Story_News.639.a: "Old tales come alive."

 # 640 — The Fall of Viserion
 GOT_Story_Country.640.t: "Ice Spear, Shattered Flame"
 GOT_Story_Country.640.d: "With unerring aim, the Night King’s lance felled Viserion—his lifeless body plunged beneath the frozen lake."
 GOT_Story_Country.640.a: "Grieve and retreat—lose one dragon unit, unlock Ice‑Dragon threat"
 GOT_Story_Country.640.b: "Counter‑attack (high risk)—chance to wound Night King, higher casualties"

 GOT_Story_News.640.t: "Dragon Slain, Risen in Blue Flame"
 GOT_Story_News.640.d: "Scouts swear the dead dragon stirred, eyes burning ice‑blue, now yoked to the Night King’s will."
 GOT_Story_News.640.a: "The Wall trembles."

 # 641 — Last Ride of Benjen Stark
 GOT_Story_Country.641.t: "Coldhands’ Farewell"
 GOT_Story_Country.641.d: "Benjen Stark thrust Jon onto his horse, whirled his flaming chain—and vanished beneath waves of wights."
 GOT_Story_Country.641.a: "Salute the fallen—gain Night’s Watch spirit, slight morale boost"
 GOT_Story_Country.641.b: "Search for remnants—small chance to recover dragonglass cache"

 GOT_Story_News.641.t: "Masked Rider Halts the Dead"
 GOT_Story_News.641.d: "A lone figure, half‑dead half‑alive, bought the King in the North’s escape with fire and fury."
 GOT_Story_News.641.a: "Songs will tell his name."

 # 642 — A Queen Acknowledged
 GOT_Story_Country.642.t: "The Kneeling of the Wolf"
 GOT_Story_Country.642.d: "In the cabin of a storm‑tossed ship, Jon Snow took Daenerys’s hand: “I will swear you my sword, my Queen.”"
 GOT_Story_Country.642.a: "Formalize alliance—merge Northern and Targaryen diplomacy trees"
 GOT_Story_Country.642.b: "Keep it private—smaller alliance boost, avoid Northern dissent"

 GOT_Story_News.642.t: "North and Dragonforge Alliance Sealed"
 GOT_Story_News.642.d: "Reports claim the King in the North now bends the knee to Daenerys Stormborn, forging unity against the coming night."
 GOT_Story_News.642.a: "The realm reshapes."

 # 643 — Summit in the Dragonpit (Country Event for House Targaryen)
 GOT_Story_Country.643.t: "Parley in the Dragonpit"
 GOT_Story_Country.643.d: "Among the cavernous ruins where our ancestors kept their dragons, enemies sit side by side in tense silence. A captured wight thrushes against its iron chains before Cersei Lannister, proving the terrifying truth of Jon Snow's warnings. The summit hangs in a delicate balance—the Iron Throne is meaningless if there is no realm left to rule, yet years of blood and betrayal lie between our houses. As the debate rages in the pit, we must choose how to steer these precarious negotiations."
 GOT_Story_Country.643.a: "Propose a total armistice."
 GOT_Story_Country.643.b: "Demand unyielding submission."

 # News Event (World / Realm Perspective)
 GOT_Story_News.643.t: "Tense Negotiations in King’s Landing"
 GOT_Story_News.643.d: "In an astounding turn of events, rival monarchs and warring armies have gathered under a flag of truce within the ancient Dragonpit of King’s Landing. Rumors from the capital speak of a horrifying monstrosity brought from beyond the Wall to force a parley between House Targaryen and the Crown. As lords and generals debate behind guarded gates, the entire realm holds its breath, wondering if hatred will yield to survival or if civil war will consume us before the cold does."
 GOT_Story_News.643.a: "The fate of the realm hangs in the balance."

 # 644 — The Queen’s Betrayal
 GOT_Story_Country.644.t: "Cersei’s Hidden Gambit"
 GOT_Story_Country.644.d: "In private, the Lioness renounces the pact. Gold Company contracts are signed; southern armies will march when the North bleeds."
 GOT_Story_Country.644.a: "Secretly mobilize—spawn sellsword divisions in Crownlands"
 GOT_Story_Country.644.b: "Reconsider (player choice)—honor the truce, gain short peace modifier"

 GOT_Story_News.644.t: "Rumors of Royal Treachery"
 GOT_Story_News.644.d: "Whispers claim the Iron Throne will not ride north. Some speak of sellsails from Essos already on the sea."
 GOT_Story_News.644.a: "Trust is a luxury of fools."

 # 645 — Birth of Aegon Targaryen
 GOT_Story_Country.645.t: "True Heir Revealed"
 GOT_Story_Country.645.d: "Bran’s sight and Sam’s records prove Jon Snow is Aegon Targaryen, the lawful son of Rhaegar and Lyanna—king by blood and fire."
 GOT_Story_Country.645.a: "Proclaim his birthright—unify Stark‑Targaryen claims, legitimacy boost"
 GOT_Story_Country.645.b: "Keep the secret—for now, avoid political shock"

 GOT_Story_News.645.t: "Northern King, Southern Blood"
 GOT_Story_News.645.d: "Shattering revelation spreads through halls and taverns alike: the King in the North bears a dragon’s name."
 GOT_Story_News.645.a: "Crowns tremble."

 # 646 — The End of Littlefinger
 GOT_Story_Country.646.t:0 "The Mockingbird's Last Scheme"
 GOT_Story_Country.646.d:0 "For months, Lord Petyr Baelish has moved through the shadows of Winterfell, whispering poison to turn sister against sister and fracture the Northern coalition. But today, before the assembled lords of the North and the Vale, Lady Sansa called the court to order. What Baelish believed to be Arya's execution quickly inverted into his own trial: Sansa laid bare a lifetime of his treasons, while Lord Bran recounted the exact words Baelish uttered when betraying Ned Stark in King's Landing. Dropping to his knees on the cold stone, the master manipulator now weeps and begs for mercy, offering every secret and whisper in his possession in exchange for his life. With Arya standing behind him, blade drawn, all eyes turn to Sansa for the verdict."
 GOT_Story_Country.646.a:0 "Execute the traitor!"
 GOT_Story_Country.646.b:0 "Spare him for his secrets..."

 GOT_Story_News.646.t:0 "Lord Baelish Slain"
 GOT_Story_News.646.d:0 "Word from the far North reports the sudden and shock execution of Lord Petyr Baelish. For years, the master manipulator navigated the halls of King’s Landing, traded titles across the Seven Kingdoms, and secured the Lord Protectorship of the Vale through blood and cunning. Yet, his scheming reached an abrupt end in the Great Hall of Winterfell. Brought before Lady Sansa Stark and accused of multiple counts of treason and murder, the realm's most dangerous spider was cut down on the spot by Northern steel. With his death, the intricate web of debt, alliances, and political extortion he wove across Westeros has unraveled overnight, leaving a massive power vacuum in his wake."
 GOT_Story_News.646.a:0 "Chaos was his ladder..."

 # 647 — A Kingslayer’s Departure
 GOT_Story_Country.647.t: "Jaime Breaks with Cersei"
 GOT_Story_Country.647.d: "Snowflakes fall on Lannister armor as Jaime turns his horse northward, leaving betrayal—and love—behind."
 GOT_Story_Country.647.a: "Ride for Winterfell—Jaime becomes Northern general, lowers Lannister morale"
 GOT_Story_Country.647.b: "Hesitate (alt)—stay but suffer loyalty penalty"

 GOT_Story_News.647.t: "Golden Lion Heads North"
 GOT_Story_News.647.d: "Witnesses saw the Queen’s brother leave the capital alone, cloak dusted with frost, destiny uncertain."
 GOT_Story_News.647.a: "Snow on red and gold."

 # 649 — The Wall Shattered
 GOT_Story_Country.649.t: "Viserion’s Blue Flame"
 GOT_Story_Country.649.d: "An undead dragon screams icy fire; Eastwatch’s ancient stones crumble. The Dead march through the gap."
 GOT_Story_Country.649.a: "Raise the Last Hearth alarm—spawn White Walker invasion, apply Realm Panic"
 GOT_Story_Country.649.b: "Counter‑offensive (heroic option)—launch risky mission to delay undead"

 GOT_Story_News.649.t: "The Wall Falls"
 GOT_Story_News.649.d: "For eight thousand years the Wall stood. Tonight it is smoke, rubble, and chilling silence as darkness pours south."
 GOT_Story_News.649.a: "The Long Night begins."

 # # # # # # # # # # # #
 # #SEASON 8 # #
 # # # # # # # # # # # #

 # 701 — Arrival at Winterfell
 GOT_Story_Country.701.t: "Dragons over the North"
 GOT_Story_Country.701.d: "Jon Snow and Daenerys Targaryen arrive at Winterfell with armies and dragons, heralding the final stand against the coming darkness."
 GOT_Story_Country.701.a: "Forge the Northern Alliance—boost army morale and unity"
 GOT_Story_Country.701.b: "Daenerys as outsider, tensions rise."

 GOT_Story_News.701.t: "Dragons Descend Upon Winterfell"
 GOT_Story_News.701.d: "The long-awaited guests arrive, flanked by fiery beasts and fierce warriors, stirring hope and unease alike."
 GOT_Story_News.701.a: "The North prepares for war."

 # 702 — Stark Siblings Reunited
 GOT_Story_Country.702.t: "Blood Bonds Rekindled"
 GOT_Story_Country.702.d: "Jon embraces his Stark siblings after years apart; the old bonds kindle new strength amid shadowed days."
 GOT_Story_Country.702.a: "Bolster Stark unity—fortify Winterfell."
 GOT_Story_Country.702.b: "Old wounds spark northern unrest."

 GOT_Story_News.702.t: "Family Gathered at Last"
 GOT_Story_News.702.d: "Winterfell echoes with joy and tension as the Stark heirs reunite, their faces marked by the scars of war and time."
 GOT_Story_News.702.a: "The North stands as one—if only for now."

 # 703 — Sam’s Warning
 GOT_Story_Country.703.t: "Truths That Divide"
 GOT_Story_Country.703.d: "Samwell reveals to Jon that Daenerys executed his kin, planting seeds of doubt and loyalty torn."
 GOT_Story_Country.703.a: "Challenge Daenerys—risk the alliance."
 GOT_Story_Country.703.b: "Keep faith—maintain fragile unity."

 GOT_Story_News.703.t: "Tensions Rise in the Camp"
 GOT_Story_News.703.d: "Whispers of betrayal spread as Jon grapples with painful truths about his queen."
 GOT_Story_News.703.a: "Loyalty tested on the eve of war."

 # 704 — Theon’s Redemption
 GOT_Story_Country.704.t: "A Greyjoy’s Valor"
 GOT_Story_Country.704.d: "Theon redeems himself by rescuing Yara from captivity, reclaiming honor amid chaos."
 GOT_Story_Country.704.a: "Lift Ironborn spirits—reinforce Greyjoy fleet."
 GOT_Story_Country.704.b: "Failure—lose manpower and prestige."

 GOT_Story_News.704.t: "Ironborn Siblings United"
 GOT_Story_News.704.d: "Theon’s daring raid frees Yara, rekindling hope among the Iron Islands."
 GOT_Story_News.704.a: "Storms gather on the horizon."

 # 705 — Tyrion and Sansa’s Meeting
 GOT_Story_Country.705.t: "Old Allies, New Fates"
 GOT_Story_Country.705.d: "Tyrion and Sansa share a tense reunion, recalling past betrayals while seeking common ground."
 GOT_Story_Country.705.a: "Mend ties—strengthen Stark-Lannister bond."
 GOT_Story_Country.705.b: "Grudges cause diplomatic issues."

 GOT_Story_News.705.t: "Tense Reunion in Winterfell"
 GOT_Story_News.705.d: "Two old friends meet again, their smiles shadowed by the weight of history."
 GOT_Story_News.705.a: "A fragile peace prevails."

 # 706 — Stark and Lannister Face Off
 GOT_Story_Country.706.t: "A Cold Gaze"
 GOT_Story_Country.706.d: "Jaime and Bran exchange a chilling stare, history and fate entwined in a single glance."
 GOT_Story_Country.706.a: "Fuel distrust—increase internal tension."
 GOT_Story_Country.706.b: "De-escalate, maintain stability."

 GOT_Story_News.706.t: "A Stark’s Silent Judgment"
 GOT_Story_News.706.d: "The once enemy now returns to Winterfell, but past sins linger in icy silence."
 GOT_Story_News.706.a: "Old wounds threaten unity."

 # 707 — Jon Rides Rhaegal
 GOT_Story_Country.707.t: "Dragonrider Ascendant"
 GOT_Story_Country.707.d: "Jon’s first flight atop Rhaegal marks his embrace of his Targaryen blood and destiny."
 GOT_Story_Country.707.a: "Boost Jon’s prestige and military prowess."
 GOT_Story_Country.707.b: "Jealousy sparks doubts."

 GOT_Story_News.707.t: "The Dragon and the Wolf Take Flight"
 GOT_Story_News.707.d: "A new rider soars above Winterfell, heralding change and uneasy alliances."
 GOT_Story_News.707.a: "Fire and ice mingle in the skies."
 
 # 708 — Jaime Faces Judgment
 GOT_Story_Country.708.t: "Trial by Fire"
 GOT_Story_Country.708.d: "Jaime Lannister stands before Jon, Daenerys, and Sansa, judged for past sins. Brienne’s faith grants him a chance to fight for redemption."
 GOT_Story_Country.708.a: "Accept Jaime—gain veteran fighter."
 GOT_Story_Country.708.b: "Reject Jaime — lose ally, morale risk."

 GOT_Story_News.708.t: "The Lion Returns"
 GOT_Story_News.708.d: "Jaime Lannister’s fate hangs in the balance as old wounds and new hopes collide."
 GOT_Story_News.708.a: "Winterfell braces for war."

 # 709 — Brienne Knighted
 GOT_Story_Country.709.t: "A Knight’s Honor"
 GOT_Story_Country.709.d: "Jaime knights Brienne of Tarth, crowning her years of loyalty and valor with honor."
 GOT_Story_Country.709.a: "Boost morale among Stark allies."
 GOT_Story_Country.709.b: "Jealousy simmers in the ranks."

 GOT_Story_News.709.t: "Brienne’s Ascension"
 GOT_Story_News.709.d: "The forge of honor sparks anew as Brienne takes her rightful place among knights."
 GOT_Story_News.709.a: "Hope shines in darkest hours."

 # 710 — Jon’s True Parentage
 GOT_Story_Country.710.t: "Blood of the Dragon"
 GOT_Story_Country.710.d: "Sam reveals Jon’s true lineage as Targaryen and rightful heir to the throne, shaking the foundations of loyalty."
 GOT_Story_Country.710.a: "Claim the throne—risk alienating allies."
 GOT_Story_Country.710.b: "Hide truth — keep alliances."

 GOT_Story_News.710.t: "The Prince Revealed"
 GOT_Story_News.710.d: "Whispers of a secret heir spread, casting shadows over the war to come."
 GOT_Story_News.710.a: "Destiny’s hand moves."

 # 711 — Arya and Gendry’s Moment
 GOT_Story_Country.711.t: "Forged in Fire"
 GOT_Story_Country.711.d: "Arya and Gendry share a rare moment of tenderness, a brief respite from the coming storm."
 GOT_Story_Country.711.a: "Strengthen personal bonds—raise morale."
 GOT_Story_Country.711.b: "Distraction risks—small tension."

 GOT_Story_News.711.t: "Love Amidst Shadows"
 GOT_Story_News.711.d: "A quiet bond forms in the forge’s glow, reminding all what they fight for."
 GOT_Story_News.711.a: "Hearts prepare for battle."

 # 712 — Bran’s Warning
 GOT_Story_Country.712.t: "The Raven’s Gaze"
 GOT_Story_Country.712.d: "Bran confronts Jaime with a silent, unsettling warning—past deeds are never forgotten."
 GOT_Story_Country.712.a: "Jaime shaken—increase internal conflict."
 GOT_Story_Country.712.b: "Jaime changes—loyalty up."

 GOT_Story_News.712.t: "Eyes That See All"
 GOT_Story_News.712.d: "A cold stare unsettles the lion, hinting at the cost of betrayal."
 GOT_Story_News.712.a: "Trust is fragile."

 # 713 — Theon’s Return
 GOT_Story_Country.713.t: "Homeward Bound"
 GOT_Story_Country.713.d: "Theon returns to Winterfell, welcomed by Sansa and ready to fight for the North’s survival."
 GOT_Story_Country.713.a: "Boost Stark forces with Ironborn support."
 GOT_Story_Country.713.b: "Suspicion remains—minor unrest."

