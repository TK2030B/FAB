l_english:

GOT_Game_Decisions:0 "Game of Thrones Decisions"
GOT_Game_Decisions_desc:0 "This category contains decisions that significantly impact gameplay, shaping the fate of your kingdom and the world around you. Whether it’s aligning with powerful factions, making key strategic choices, or determining the course of crucial events, these decisions will directly influence your path to victory in the Game of Thrones. Choose wisely, for the decisions you make today will echo throughout the Seven Kingdoms."

TAR_Stormlands_Controlled_By_Us_tt:0 "Stormlands Controlled by Us"
TAR_Westerlands_Controlled_By_Us_tt:0 "Westerlands Controlled by Us"

GOT_Give_GOT_Mode_To_New_Countries:0 "Enable Game of Thrones Mode for New Countries"
GOT_Give_GOT_Mode_To_New_Countries_desc:0 "As you embark on your journey in Game of Thrones Mode, new countries may rise across the map. This decision allows you to grant them the immersive mechanics of GOT Mode, ensuring they face the same challenges and advantages that you do. Shape the future of Westeros and beyond with this powerful choice."

CRO_Crownlands_Invasion_of_RIV: "Intervene in the Riverlands"
CRO_Crownlands_Invasion_of_RIV_desc: "The Riverlands are at war with our allies in the Westerlands, yet we remain on the sidelines while the conflict threatens the authority of the Iron Throne. We cannot allow House Lannister to stand alone against its enemies. By intervening directly, we shall uphold our alliance and bring the full strength of the Crown to bear against the Riverlands."

RIV_join_northern_faction: "Join the Northern Alliance"
RIV_join_northern_faction_desc: "The Riverlands once bled beside the North beneath the banners of House Stark and House Tully. With the Westerlands once again threatening our lands, we cannot hope to stand alone. By joining the Northern Alliance, we shall unite our strength against our common enemy and renew the bonds forged in war."

DRA_battle_of_blackwater_bay: "Launch the Invasion of Blackwater Bay"
DRA_battle_of_blackwater_bay_desc: "The Iron Throne is ours by right. With the Stormlands behind us and our fleet ready to sail, the time has come to strike at King’s Landing. Victory will place the Baratheon banner where it belongs—above the Red Keep."

DRA_recruit_jon_snow: "Offer Jon Snow the North"
DRA_recruit_jon_snow_desc: "The North will never truly accept Bolton rule while a Stark yet lives. Though Jon Snow has sworn himself to the Night's Watch, I possess the authority to legitimize him as Jon Stark and name him Lord of Winterfell. Should he accept, he will abandon his vows, rally the northern houses to our banner, and lead the war to reclaim his ancestral home from House Bolton."

IRO_invasion_of_the_north:0 "Launch the Invasion of the North"
IRO_invasion_of_the_north_desc:0 "The mainland is weak and fractured. The Starks march south, their lands exposed. Now is the time to strike. We shall send our raiders to seize the northern coast, burn their villages, and remind the world that the Ironborn still rule the sea."

IRO_invasion_of_winterfell:0 "Seize Winterfell"
IRO_invasion_of_winterfell_desc:0 "Winterfell stands vulnerable, its lord off at war. With swift and decisive action, Theon Greyjoy can take the ancient stronghold of House Stark and prove his worth to his father—and to himself. Let the kraken fly over the heart of the North."

STO_Stormlands_Invasion_of_CRO:0 "March on King's Landing!"
STO_Stormlands_Invasion_of_CRO_desc:0 "The tournament is over, the banners have been called, and our hosts stand ready. The time for spectacle has passed—the time for war has come. The Stormlands will no longer stand idle as the Iron Throne rots in the hands of pretenders. We ride for the Crownlands, and for victory!"

IRO_Invasion_of_RIV:0 "Reclaim the Riverlands"
IRO_Invasion_of_RIV_desc:0 "The Riverlands once bent the knee to the Seastone Chair, and now they shall again. With axe and flame, we will seize what is ours by right. The mainlanders have grown complacent in our absence—let them learn that the Old Way still reigns from the Iron Islands to the banks of the Trident."

PEN_End_Targaryen_Asylum:0 "Reclaim Illyrio's Mansion"
PEN_End_Targaryen_Asylum_desc:0 "With the Targaryens now established elsewhere in the world, their need for sanctuary in Pentos has come to an end. Illyrio's mansion, long offered as a place of refuge, shall be reclaimed and restored to local use. The gesture of asylum has served its purpose; now, we look to our own needs."

TAR_Targaryen_Invasion_of_DRA:0 "Set Sail for Dragonstone!"
TAR_Targaryen_Invasion_of_DRA_desc:0 "Exile is at an end. The Narrow Sea lies behind us, and before us stands the ancient seat of House Targaryen. Dragonstone, forged in Valyrian fire and stolen from our bloodline, must be reclaimed before the Seven Kingdoms can be won. Let our banners fly once more above the island fortress—for this is where the dragon's conquest begins."

TAR_land_at_dragonstone:0 "Land at Dragonstone"
TAR_land_at_dragonstone_desc:0 "At last, our ships have reached the shores of our ancestral home. After years of exile across the Narrow Sea, we return not as beggars, but as conquerors. Dragonstone shall once again answer to House Targaryen, and from this ancient fortress we will gather our strength before bringing fire and blood to those who sit the Iron Throne."

TAR_Burn_The_Khals:0 "Burn the Khals"
TAR_Burn_The_Khals_desc:0 "The assembled khals have imprisoned Daenerys within the Temple of the Dosh Khaleen, expecting her to submit to their authority. Instead, she can turn their own sacred hall into a blazing tomb. If the flames consume the khals, the Dothraki may unite beneath the Dragon Queen. If the attempt fails, her dream of commanding the Great Grass Sea could perish with her."

FAI_Seize_Crownlands_CRO:0 "Liberate the Crownlands"
FAI_Seize_Crownlands_CRO_desc:0 "The Iron Throne still clings to power beyond the walls of King's Landing. If the Faith is to secure its victory, the remaining Crownlands must be brought under the authority of the Seven. Every castle that resists will be shown the righteousness of our cause."

CRO_Seize_Crownlands_FAI:0 "Retake King's Landing"
CRO_Seize_Crownlands_FAI_desc:0 "The Faith Militant has seized our capital and defied the authority of the Iron Throne. We cannot allow fanatics to rule from the Red Keep. The Crownlands must be reclaimed, the rebels crushed, and royal authority restored to King's Landing."

TAR_Invasion_of_CRO: "The Claim to the Iron Throne"
TAR_Invasion_of_CRO_desc: "With Dragonstone secured once more, House Targaryen stands ready to reclaim what was lost. The Crownlands and the Red Keep were once the heart of our dynasty, built by our ancestors and ruled by our bloodline for nearly three centuries. The time has come to call the banners, cross the Narrow Sea, and take back the Iron Throne."

 TAR_Invasion_of_CRO2:0 "Reignite The Conflict"
 TAR_Invasion_of_CRO2_desc:0 "The Great War is over. The Night King lies shattered in the snows, and the realm of the living has been saved from eternal cold. Yet the throne of our ancestors still remains in the hands of usurpers. We set aside our rightful war to save humanity from extinction—now, House Targaryen shall complete its destiny. It is time to march south, smash the forces of the Crownlands, and reclaim the Iron Throne with fire and blood."
 
 CRO_purge_targaryens:0 "Purge the Targaryen Invaders"
 CRO_purge_targaryens_desc:0 "The northern savages and their dragon queen have bled themselves against the cold. With the so-called Great War concluded, the foreign threat beyond the Wall is no more. Now, the true threat to the realm remains encamped on our shores—a foreign usurper, her savage hordes, and her monsters. We shall wait no longer for her to march south. The Crownlands shall mobilize its armies, deploy the Golden Company, and purge the Dragon Queen from Westeros once and for all."

 LFC_Create_League:0 "Form the League of Free Cities"
 LFC_Create_League_desc:0 "Dispatch diplomatic envoys to all sovereign Free Cities across Essos proposing the immediate ratification of the League Charter. By binding our defense policies into a single grand coalition, we will present a united front against Westerosi hegemony and foreign imperialism."
 
 # Main Targeted Decision
 ICE_conquer_countries:0 "Destroy [FROM.GetName]"
 ICE_conquer_countries_desc:0 "The mortal kingdom of [FROM.GetName] stands in the path of the Long Night. We will overwhelm their garrisons, slaughter their armies, and convert every fallen soul into an instrument of our eternal reign."
 
TAR_conquer_Essos_countries:0 "Burn the Seat of [FROM.GetName]"
TAR_conquer_Essos_countries_desc:0 "For centuries, the pretenders of [FROM.GetName] have squandered the remnants of the Freehold in petty squabbles. We will march across their lands, put their palaces to the torch, and forge a reborn empire from the ashes of their pride."

TAR_conquer_Westeros_countries:0 "Bring [FROM.GetName] to Heel"
TAR_conquer_Westeros_countries_desc:0 "With the Iron Throne reclaimed and King's Landing under our control, those who still cling to rebellion must choose: bend the knee or burn. We will march into the lands of [FROM.GetName] and show them the true cost of defiance against the Dragon."

TAR_Mine_For_Dragonglass:0 "Mine Dragonstone for Dragonglass"
TAR_Mine_For_Dragonglass_desc:0 "Beneath the cliffs of Dragonstone lies a vast mountain of obsidian—dragonglass. If we divert our smiths and quarrymen to mine this ancient stone, we can forge deadly weapons capable of shattering the army of the dead before they march past the Wall."
TAR_Mine_For_Dragonglass_tt:0 "Our civilian economy will allocate 5 factories for 90 days to mine, knap, and distribute obsidian weaponry across the armed forces."

 TAR_Legitimize_Gendry_Baratheon:0 "Legitimize Gendry Baratheon"
 TAR_Legitimize_Gendry_Baratheon_desc:0 "Though raised in the blacksmith shops of Flea Bottom, the blood of King Robert Baratheon runs true in Gendry's veins. By royal decree, we can remove the taint of bastardy, grant him the storied Baratheon name, and install a loyal lord paramount over Storm's End to secure the allegiance of the Stormlands."
 
 TAR_Legitimize_Tyrion_Lannister:0 "Appoint Tyrion Lannister Lord of Casterly Rock"
 TAR_Legitimize_Tyrion_Lannister_desc:0 "Denied his birthright by his father and forced into exile across the Narrow Sea, Tyrion Lannister has proven his loyalty as Hand of the Queen. By royal decree, we formally reinstate Lord Tyrion as the rightful heir to Casterly Rock and Warden of the West, securing the wealth and allegiance of the Westerlands beneath the dragon banner."
 
 NOR_Northern_Steamroller:0 "The Northern Steamroller"
 NOR_Northern_Steamroller_desc:0 "The moment has come. The armies of the North surge forward in one great, relentless assault. Whatever discipline was lost in the chaos of battle is replaced by sheer momentum. The enemy line must break beneath the weight of the North."
 
TAR_Targaryen_Invasion_of_AST:0 "Deal with Astapor"
TAR_Targaryen_Invasion_of_AST_desc:0 "Astapor possesses the finest slave-soldiers in Slaver's Bay: the Unsullied. We may negotiate with the Good Masters for their purchase, though should the opportunity arise, there may be another way to acquire their services..."

TAR_Targaryen_Invasion_of_YUN:0 "Prepare the Invasion of Yunkai"
TAR_Targaryen_Invasion_of_YUN_desc:0 "Yunkai, the Yellow City, stands as one of the great powers of Slaver's Bay. We must prepare our armies for the coming campaign and determine how best to break the city's defenses."

TAR_Targaryen_Invasion_of_MER:0 "Prepare the Invasion of Meereen"
TAR_Targaryen_Invasion_of_MER_desc:0 "Meereen is the greatest and most formidable of the cities of Slaver's Bay. Its conquest will require careful preparation, but if we are to bring the region under our rule, Meereen must eventually fall."

BOL_claim_North:0 "Claim the North"
BOL_claim_North_desc:0 "The North belongs to those strong enough to hold it. As our armies march against the rebels, we shall establish our authority over every lord, castle and village in the North. No Stark loyalist will be permitted to challenge the rule of House Bolton."

BOL_Create_Flayed_Men:0 "Form the Flayed Men"
BOL_Create_Flayed_Men_desc:0 "With the North firmly under Bolton rule, we must call upon those houses who have sworn their swords to us. The Umbers, Karstarks and other loyal bannermen shall stand together beneath the flayed banner, forming a new alliance to defend the North and crush any who would seek to restore the Starks."