 RON_Formable_News.x.d:0 ""
 RON_Formable_News.x.a:1 "OK"

RON_Formable_Country.1.t:0 "Baratheon Empire"
RON_Formable_Country.1.d:0 "The banners of House Baratheon now fly over the Crownlands, Dragonstone, and the Stormlands. Through strength, determination, and the will of [FROM.GetLeader], these once-divided domains have been united under a single banner. The Baratheon Empire rises—not merely as a kingdom of war, but as a realm of order, justice, and power. Let the realm know: the storm has come, and it shall not be weathered."
RON_Formable_Country.1.a:0 "Ours is the Fury—Empire Eternal!"
RON_Formable_News.1.t:0 "Baratheon Empire Declared"
RON_Formable_News.1.d:0 "In a sweeping declaration of dominion, [FROM.GetLeader] has proclaimed the birth of the Baratheon Empire. The unified lands of the Crownlands, Dragonstone, and the Stormlands now form a single imperial realm under the stag banner. Whispers echo from the halls of lords and the streets of common folk alike: the age of Baratheon might has dawned, and the storms of change have begun to thunder across Westeros."
RON_Formable_News.1.a:0 "A new power rises"

RON_Formable_Country.2.t:0 "Kingdom of the Isles and Rivers"
RON_Formable_Country.2.d:0 "By blood, by steel, and by seaborne wrath, we have restored the ancient Kingdom of the Isles and Rivers. The Ironborn now rule not only the waves, but the greenlands of the Trident as well. Under the command of [FROM.GetLeader], we shall carve our legacy anew—not as raiders alone, but as kings of river and sea. Let the world remember the strength of the [FROM.GetRulingParty] line, reborn in fire and salt."
RON_Formable_Country.2.a:0 "What Is Dead May Never Die!"
RON_Formable_News.2.t:0 "Kingdom of the Isles and Rivers Reforged"
RON_Formable_News.2.d:0 "A great upheaval has struck Westeros as [FROM.GetLeader] proclaims the rebirth of the Kingdom of the Isles and Rivers. Once the seat of House Hoare’s dominion, this realm now rises anew, uniting the Iron Islands and the Riverlands under one crown. The silence of the seas has broken, and the rivers run with new purpose. The age of salt and stone has returned."
RON_Formable_News.2.a:0 "The old kingdom lives again"

RON_Formable_Country.3.t:0 "Lannister-Baratheon Empire"
RON_Formable_Country.3.d:0 "Under the rightful rule of [FROM.GetLeader], the great houses of Lannister and Baratheon stand united in a single, imperious realm. From the gold-rich hills of the Westerlands to the storm-wracked shores of the Narrow Sea, the banners of the lion and the stag fly side by side. The Lannister-Baratheon Empire is not a compromise, but a destiny fulfilled—a realm of splendor, strength, and sovereign blood. Let all who doubted their birthright tremble, for the Iron Throne now has an empire behind it."
RON_Formable_Country.3.a:0 "The Crown Is Ours by Right!"
RON_Formable_News.3.t:0 "Lannister-Baratheon Empire Formed"
RON_Formable_News.3.d:0 "In a stunning proclamation, [FROM.GetLeader] has declared the formation of the Lannister-Baratheon Empire, merging the domains of the Westerlands, Crownlands, Stormlands, and Dragonstone. This act binds the power of the lion and the fury of the stag in a single imperial reign. Supporters claim it is the realization of true royal bloodline; detractors whisper of ambition and shadowed thrones. Either way, Westeros stands before a new force—gilded in gold and cloaked in crimson and black."
RON_Formable_News.3.a:0 "The Iron Throne grows stronger"

RON_Formable_Country.4.t:0 "Lannister Empire"
RON_Formable_Country.4.d:0 "With the Iron Throne secured and the riches of the west at our command, House Lannister now reigns supreme. The Crownlands bend the knee to Casterly Rock, and [FROM.GetLeader] rules not as a mere lord, but as Emperor of a golden realm. No longer content to pull the strings from behind the throne, we now sit atop it, our dominion vast and our coffers deeper than any in Westeros. Let the world behold the rise of the Lannister Empire—where debts are always paid, and loyalty is bought in gold and fear."
RON_Formable_Country.4.a:0 "Hear Me Roar!"
RON_Formable_News.4.t:0 "Lannister Empire Declared"
RON_Formable_News.4.d:0 "[FROM.GetLeader] has proclaimed the foundation of the Lannister Empire, uniting the Westerlands and Crownlands under a single imperial banner. Long known for their wealth and political reach, House Lannister now steps into the light as open rulers of a gilded realm. Their enemies whisper of arrogance and overreach, but few can deny the power that now flows from both the Rock and the Throne. Westeros has gained a new lion to fear."
RON_Formable_News.4.a:0 "The lion wears the crown"

RON_Formable_Country.5.t:0 "Kingdom of the North and the Trident"
RON_Formable_Country.5.d:0 "At long last, the wolves of the North and the riverlords of the Trident stand together once more as kin and comrades. Bound by shared struggle and old oaths, we cast off the chains of southern kings and false thrones. Under the rule of [FROM.GetLeader], the ancient kingdom has been reborn, fierce and free. From Winterfell to Riverrun, our banners fly proud: a realm of cold honor and steel resolve, united in purpose, and unbent by the South."
RON_Formable_Country.5.a:0 "The North Remembers"
RON_Formable_News.5.t:0 "Northern-Riverlands Kingdom Restored"
RON_Formable_News.5.d:0 "A new power has risen in Westeros: the Kingdom of the North and the Trident. Led by [FROM.GetLeader], this alliance between the North and Riverlands revives an ancient union born of blood and war. Their break from southern rule signals a shift in the balance of the realm. While some hail it as a return to rightful sovereignty, others see a brewing storm beyond the Neck. One thing is certain—the wolves and riverlords march together once more."
RON_Formable_News.5.a:0 "An old kingdom reborn"

RON_Formable_Country.6.t:0 "Targaryen Empire"
RON_Formable_Country.6.d:0 "Fire and blood have paved the way for a new empire. The dragonlords of old have returned—not as scattered exiles, but as conquerors. Under [FROM.GetLeader], the ancient Valyrian bloodline has united Dragonstone, the Crownlands, and the great cities of Slaver’s Bay into a realm forged in flame. No longer shall the world ignore the legacy of House Targaryen. From the Iron Throne to Meereen’s pyramids, the dragon reigns supreme once more."
RON_Formable_Country.6.a:0 "Fire and Blood!"
RON_Formable_News.6.t:0 "Targaryen Empire Reborn"
RON_Formable_News.6.d:0 "[FROM.GetLeader] has declared the rise of the Targaryen Empire, uniting Westerosi and Essosi lands under the banner of the dragon. With dominion stretching from the Crownlands to Slaver’s Bay, the ancient dream of Valyrian resurgence breathes once more. The world watches with awe and fear as dragonfire reshapes the political order, and the heirs of old Valyria claim what was once theirs."
RON_Formable_News.6.a:0 "The dragon rises again"

RON_Formable_Country.7.t:0 "The True North"
RON_Formable_Country.7.d:0 "We are not southrons. We are not beholden to thrones of gold or cities of stone. From the frozen forests of the North to the windswept tundra beyond the Wall, we have bled together, fought together, and now—we stand together. Under the leadership of [FROM.GetLeader], the Stark blood, the black brothers of the Wall, and the free folk of the true North have united. No longer divided by oaths, blood feuds, or ancient fears, we are one people. The True North rises—not for conquest, but for survival, for freedom, and for honor."
RON_Formable_Country.7.a:0 "We Remember, We Endure"
RON_Formable_News.7.t:0 "The True North Rises"
RON_Formable_News.7.d:0 "A union unseen in all the long history of Westeros has been forged. The North, the Night’s Watch, and the free folk of beyond the Wall now march beneath a single banner. [FROM.GetLeader] has declared the formation of 'The True North', a kingdom not of castles or crowns, but of shared struggle and unyielding spirit. As the cold winds blow, Westeros turns its gaze northward—to a people united by frost, fire, and freedom."
RON_Formable_News.7.a:0 "A realm born of ice and brotherhood"

RON_Formable_Country.8.t:0 "The Six Kingdoms"
RON_Formable_Country.8.d:0 "The North may have gone its own way, but the realm endures. Under the guidance of [FROM.GetLeader], the Iron Throne still holds sway over the remaining kingdoms of Westeros. Though the dream of a united Seven Kingdoms has faded, the Six remain bound together—by law, by legacy, and by the crown. From the Reach to Dorne, from the Westerlands to the Stormlands, a fragile unity persists, reforged in the fires of conflict and necessity."
RON_Formable_Country.8.a:0 "The Realm Must Endure"
RON_Formable_News.8.t:0 "The Six Kingdoms Stand United"
RON_Formable_News.8.d:0 "[FROM.GetLeader] has proclaimed the reorganization of the realm into the Six Kingdoms. With the North choosing independence, the Iron Throne has adapted, asserting control over the rest of Westeros. Though diminished in territory, the crown retains its strength, ruling over a realm still rich in power and tradition. The break with the North marks a turning point, but the royal banner still flies across six kingdoms."
RON_Formable_News.8.a:0 "The crown adjusts, but holds"

RON_Formable_Country.9.t:0 "The Seven Kingdoms"
RON_Formable_Country.9.d:0 "The dream of Aegon the Conqueror has been realized once more. Under the rule of [FROM.GetLeader], the Seven Kingdoms are united under a single throne, from the icy North to the burning sands of Dorne. The fractured realm has been brought together in blood and fire, forging a kingdom of unprecedented strength and unity. Though old rivalries linger, they are bound by the power of the Iron Throne, which now stands as the unifying symbol of the realm’s strength and its uncertain future."
RON_Formable_Country.9.a:0 "Aegon’s Legacy Endures"
RON_Formable_News.9.t:0 "The Seven Kingdoms United Once Again"
RON_Formable_News.9.d:0 "The banners of the Seven Kingdoms have been raised high once more. Under the leadership of [FROM.GetLeader], the realm has been unified, returning to the dream of the Conqueror. From Winterfell in the North to Sunspear in the South, the kingdoms of Westeros are once again united under the Iron Throne. The challenges of maintaining this unity will be many, but the Iron Throne stands proud, as the Seven Kingdoms are forged anew."
RON_Formable_News.9.a:0 "The realm has been reforged"

RON_Formable_Country.10.t:0 "Westeros"
RON_Formable_Country.10.d:0 "The entire continent of Westeros, from the frozen North to the distant shores of Dorne, now stands united under the rule of [FROM.GetLeader]. For the first time in history, the realms of men, the Night's Watch, and even the Free Folk beyond the Wall are joined together as one. The unity of the Seven Kingdoms, the Wall, and the wild lands beyond the Wall represents a powerful new beginning. It is a realm forged in blood, ice, fire, and the struggle for survival, united now as one force under the sun."
RON_Formable_Country.10.a:0 "The North, The Watch, The Realm"
RON_Formable_News.10.t:0 "Westeros United Under One Banner"
RON_Formable_News.10.d:0 "[FROM.GetLeader] has declared the full unification of Westeros, incorporating not only the Seven Kingdoms but also the Night’s Watch and the Free Folk beyond the Wall. The once divided lands of the continent now stand under a single banner, creating a realm stronger and more unified than ever before. From the icy expanse of the far North to the rolling hills of Dorne, the people of Westeros now share one kingdom, one throne, and one destiny."
RON_Formable_News.10.a:0 "The Realm is Whole"

RON_Formable_Country.11.t:0 "Valyrian Freehold"
RON_Formable_Country.11.d:0 "The ancient Valyrian Freehold has been resurrected under the rule of [FROM.GetLeader]. With fire and blood, the Freehold rises once more, aiming to reclaim its former dominance over Essos, Westeros, and beyond. The dragons are once again masters of the skies, and the Valyrian cities of old will once more shape the fate of the world. This new age of dragons is one of unparalleled ambition, where only the strongest will survive under the watchful eyes of the Targaryen dynasty."
RON_Formable_Country.11.a:0 "Fire and Blood"
RON_Formable_News.11.t:0 "The Return of the Valyrian Freehold"
RON_Formable_News.11.d:0 "In a bold move that has shocked the world, [FROM.GetLeader] has declared the rebirth of the Valyrian Freehold, the greatest empire the world has ever known. With dragons soaring through the skies once again, the Freehold promises to bring fire and blood to all those who dare stand in its way. From the ruins of Valyria to the shores of Essos, the world watches in awe as the Targaryens rise to reclaim their ancient legacy and rule over all."
RON_Formable_News.11.a:0 "The Dragon's Return"


 
