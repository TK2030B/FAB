l_english:
Zombies:0 "Wights"
Zombies_desc:0 "The dead raised by the power of the White Walkers. Mindless and tireless, wights overwhelm their enemies through sheer numbers, feeling neither fear nor pain."
Zombies2:0 "Giant Wights"
Zombies2_desc:0 "The corpses of giants reanimated by the White Walkers. Their enormous strength and towering size make them devastating weapons of war, capable of smashing through even the strongest formations."
Zombies3:0 "White Walkers"
Zombies3_desc:0 "Ancient beings of ice and death who command the armies of the dead. Few can stand against them in combat, and wherever the White Walkers march, the dead rise to join their ranks."

