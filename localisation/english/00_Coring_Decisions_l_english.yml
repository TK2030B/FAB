FORM_Baratheon_Empire_Decisions:0 "Baratheon Empire"
FORM_Baratheon_Empire_Decisions_desc:0 "Forming the Baratheon Empire represents the consolidation of the Crownlands, Dragonstone, and Stormlands under a single, unyielding banner. The power of House Baratheon has already been proven through its dominance of the Stormlands, but by uniting these territories, we can create a kingdom of unrivaled strength and influence. With the Iron Throne as our seat of power, we will restore the might of the Storm Kings, forging a legacy of unity, authority, and martial prowess. The realm will benefit from strengthened political ties, economic prosperity, and a sense of shared purpose, as the Baratheons stand at the helm of a united and powerful realm. This is our chance to reclaim the might of our ancient house and bring stability to the realm in the name of House Baratheon."


FORM_IRO_RIV_Decisions:0 "Kingdom of the Isles and Rivers"
FORM_IRO_RIV_Decisions_desc:0 "Forming the Kingdom of the Isles and Rivers is the opportunity to unite the Iron Islands and the Riverlands under one crown, combining the might of the seafaring Ironborn with the fertile lands and strategic waterways of the Riverlands. This union would provide us with a powerful position both on land and at sea, controlling the crossroads of Westeros and the trade routes that run through them. The fierce warriors of the Iron Islands will bolster the Riverlands’ defenses, while the Riverlands will provide vital resources and a strong foothold in the heart of the continent. A kingdom forged by the combined strength of two distinct regions, this formation will make us a force to be reckoned with in Westeros, heralding a new era of political and military power."


FORM_Lannister_Baratheon_Empire_Decisions:0 "Lannister-Baratheon Empire"
FORM_Lannister_Baratheon_Empire_Decisions_desc:0 "Forming the Lannister-Baratheon Empire is a monumental step towards consolidating the power of House Baratheon with that of House Lannister. With the Stormlands, Crownlands, and Westerlands united under a single banner, we create a realm of unrivaled wealth, military strength, and political influence. The Lannisters bring their vast coffers and strategic alliances, while the Baratheons add their martial prowess and a history of loyal leadership. Together, we will rule the heart of Westeros, forging an empire that commands the respect of all the Seven Kingdoms. This union promises a reign of prosperity, strength, and stability, ensuring that the Lannister-Baratheon Empire will endure for generations to come."


FORM_Lannister_Empire_Decisions:0 "Lannister Empire"
FORM_Lannister_Empire_Decisions_desc:0 "Forming the Lannister Empire marks the consolidation of the Crownlands and Westerlands under the rule of House Lannister. With vast wealth drawn from the golden mines of Casterly Rock and the strategic significance of the Crownlands, we can forge a powerful realm that dominates both the political and economic landscape of Westeros. This empire will cement House Lannister’s position as the foremost power in the Seven Kingdoms, ensuring unrivaled military, economic, and cultural dominance. By uniting these two territories, we lay the foundation for a new era of prosperity and rule under the banner of House Lannister, forever ensuring that our name will be synonymous with power and authority in Westeros."


FORM_NOR_RIV_Decisions:0 "Kingdom of the North and the Trident"
FORM_NOR_RIV_Decisions_desc:0 "Forming the Kingdom of the North and the Trident represents the unification of the ancient and powerful North with the strategic and fertile Riverlands. With the mighty rivers of the Trident and the vast, rugged lands of the North, this kingdom will be a bastion of strength, resilience, and enduring power. The North's harsh winters and proud people will be complemented by the fertile fields and strategic location of the Riverlands, ensuring a kingdom that is both rich in resources and nearly unassailable. Together, the North and the Trident will form a powerful and unified realm, standing as a true force in the face of any threat."


FORM_True_North_Decisions:0 "True North"
FORM_True_North_Decisions_desc:0 "Forming the True North is the unification of the North, the Night’s Watch, and the Free Folk under a single crown. The fierce warriors of the North, the disciplined defenders of the Wall, and the Free Folk who roam beyond the Wall now stand together, bound by a shared purpose. This kingdom will stand as a bulwark against any who would threaten the North, bringing strength through unity in the face of harsh winters and constant dangers. Together, we will forge a realm that honors the traditions of the Old Gods and unites the people of the far north, ensuring that no enemy will ever breach our borders again."


FORM_Westeros_Decisions:0 "Westeros"
FORM_Westeros_Decisions_desc:0 "Forming the Kingdom of Westeros is the unification of the Seven Kingdoms, the Night’s Watch, and the Free Folk under one crown. This decision brings together the diverse regions of the continent, from the icy expanse of the North to the sun-soaked reaches of Dorne, into a single, united realm. The Night’s Watch and the Free Folk, once separated by their roles and histories, now stand as part of a grand vision for a unified Westeros. Together, we will forge a realm that commands respect, with the power and resources of the Seven Kingdoms united under one rule, ensuring that no outside force can ever challenge our dominion over the continent."


FORM_Targaryen_Empire_Decisions:0 "Targaryen Empire"
FORM_Targaryen_Empire_Decisions_desc:0 "Forming the Targaryen Empire marks the unification of Slaver's Bay, the Crownlands, and Dragonstone under the iron rule of House Targaryen. With the ancient strength of the Targaryen bloodline, the power of dragonfire, and the strategic importance of these territories, we have the opportunity to reignite the fires of conquest and forge a new empire in the name of House Targaryen. From the conquered lands of Slaver's Bay to the storied halls of Dragonstone and the power at King's Landing, this empire will be a testament to our house’s indomitable will and the legacy of the dragons. We will restore the Targaryen name to its former glory and reestablish our rule over the Seven Kingdoms once more."


FORM_Valyrian_Freehold_Decisions:0 "Valyrian Freehold"
FORM_Valyrian_Freehold_Decisions_desc:0 "Forming the Valyrian Freehold represents the rebirth of the ancient empire that once ruled much of Essos and beyond. With the power of dragonlords, sorcery, and the might of a unified Valyrian people, we seek to restore our empire to its former glory. This decision will bring together all those who were once subjects of the Valyrian Freehold, from the cities of Slaver's Bay to the farthest reaches of Essos, under one banner. With the power of the dragons once more at our disposal, we will forge an empire that spans across continents, uniting the Freehold’s ancient holdings and reclaiming our position as the supreme power of the known world."
