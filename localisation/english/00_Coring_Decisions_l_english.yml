#Empire Manager
GEN_Empire_Manager:0 "Administer Your Realm"
GEN_Empire_Manager_desc:0 "A realm of great extent often binds many lands and peoples under one crown. Such dominions are forged in fire and held through the loyalty of vassals and the might of the sword. The heartland of the realm exerts dominion over its outer marches, where lords and stewards may rule in the sovereign's name — though seldom with equal justice or rights for all.\n§YCosts for coring decisions are increased by 50% during wartime.§!"
